<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Le français avec Keb & Bek — Accueil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Patrick+Hand&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="barre-progression.css">
<link rel="stylesheet" href="sequence-televersement.css">
<style>
  :root {
    --creme: #FFF5E8;
    --pêche: #F5C4A3;
    --brun: #6b4a35;
    /* alias pour barre-progression.css / sequence-televersement.css,
       qui utilisent ces noms de variables (mêmes couleurs que ci-dessus,
       simplement sans l'accent, + deux tons dérivés) */
    --peche: var(--pêche);
    --peche-fonce: #E0A87F;
    --brun-fonce: var(--brun);
    --beige: var(--creme);
    --ombre: rgba(102, 80, 69, 0.16);
  }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--creme);
    overflow: hidden;
    font-family: 'Nunito', sans-serif;
  }
  .scene {
    position: relative;
    width: 100%;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .enveloppe-conteneur {
    position: relative;
    width: 360px;
    height: 360px;
    cursor: pointer;
  }
  .enveloppe-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    user-select: none;
    -webkit-user-drag: none;
  }
  .fermee {
    opacity: 1;
    /* état initial : hors écran en haut */
    transform: translateY(-520px);
  }
  .ouverte {
    opacity: 0;
    pointer-events: none;
  }

  /* --- chute --- */
  @keyframes tvbk-chute {
    0%   { transform: translateY(-520px); }
    62%  { transform: translateY(0px); }         /* impact */
    72%  { transform: translateY(-38px); }        /* premier rebond */
    82%  { transform: translateY(0px); }
    89%  { transform: translateY(-14px); }        /* deuxième rebond, plus petit */
    95%  { transform: translateY(0px); }
    100% { transform: translateY(0px); }
  }
  .enveloppe-conteneur.tombe .fermee {
    animation: tvbk-chute 1.15s cubic-bezier(.36,.07,.19,.97) forwards;
  }

  /* léger flottement une fois stabilisée */
  @keyframes tvbk-flotte {
    0%, 100% { transform: translateY(0px) rotate(0deg); }
    50%      { transform: translateY(-6px) rotate(-0.6deg); }
  }
  .enveloppe-conteneur.flotte .fermee {
    animation: tvbk-flotte 3.2s ease-in-out infinite;
  }

  /* petite invite visuelle : pulsation douce pour signaler qu'on peut cliquer */
  @keyframes tvbk-invite-pulse {
    0%, 100% { filter: drop-shadow(0 0 0px rgba(245,196,163,0)); }
    50%      { filter: drop-shadow(0 0 14px rgba(245,196,163,0.55)); }
  }
  .enveloppe-conteneur.flotte .fermee {
    animation:
      tvbk-flotte 3.2s ease-in-out infinite,
      tvbk-invite-pulse 2.4s ease-in-out infinite;
  }

  /* --- éclat du cachet au clic --- */
  .tvbk-eclat-halo,
  .tvbk-eclat-rayons,
  .tvbk-eclat-onde {
    position: absolute;
    left: 50%;
    top: 54%; /* position approximative du cachet sur l'image fermée */
    width: 140px;
    height: 140px;
    transform: translate(-50%, -50%);
    pointer-events: none;
    opacity: 0;
  }
  .tvbk-eclat-halo {
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,230,200,0.95) 0%, rgba(245,196,163,0.7) 35%, rgba(245,196,163,0) 72%);
  }
  .tvbk-eclat-rayons {
    background: repeating-conic-gradient(
      rgba(255,224,180,0.9) 0deg 4deg,
      rgba(255,224,180,0) 4deg 18deg
    );
    border-radius: 50%;
    mix-blend-mode: screen;
  }
  .tvbk-eclat-onde {
    border-radius: 50%;
    border: 2px solid rgba(255,224,180,0.85);
    background: transparent;
  }

  @keyframes tvbk-halo-anim {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.2); }
    30%  { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(1.6); }
  }
  @keyframes tvbk-rayons-anim {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.3) rotate(0deg); }
    35%  { opacity: 0.9; transform: translate(-50%, -50%) scale(1.15) rotate(25deg); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(1.5) rotate(55deg); }
  }
  @keyframes tvbk-onde-anim {
    0%   { opacity: 0.9; transform: translate(-50%, -50%) scale(0.15); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(3.2); }
  }
  .eclater .tvbk-eclat-halo   { animation: tvbk-halo-anim   0.85s ease-out forwards; }
  .eclater .tvbk-eclat-rayons { animation: tvbk-rayons-anim 0.85s ease-out forwards; }
  .eclater .tvbk-eclat-onde   { animation: tvbk-onde-anim   0.85s ease-out forwards; }

  /* --- fondu vers l'image ouverte --- */
  .enveloppe-conteneur.eclater .fermee {
    animation: none;
    transition: opacity 0.6s ease-in 0.35s;
    opacity: 0;
  }
  .enveloppe-conteneur.eclater .ouverte {
    transition: opacity 0.7s ease-in 0.45s;
    opacity: 1;
  }

  /* --- badge de notification (2e courriel), posé sur le coin de l'enveloppe --- */
  .badge-notif {
    position: absolute;
    top: 18px;
    right: 34px;
    width: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: var(--pêche);
    color: #fff;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 0.9rem;
    box-shadow: 0 4px 10px rgba(102, 80, 69, 0.28);
    /* pointer-events: none en tout temps — le badge n'est qu'un indicateur
       visuel posé sur l'enveloppe ; le clic doit toujours traverser jusqu'à
       l'enveloppe elle-même (le courriel), jamais s'arrêter sur le « 1» */
    cursor: default;
    z-index: 15;
    opacity: 0;
    transform: scale(0.4);
    pointer-events: none;
    transition: opacity 0.35s ease, transform 0.35s cubic-bezier(.2,.8,.25,1.3);
  }
  .badge-notif.cl-visible {
    opacity: 1;
    transform: scale(1);
    animation: badge-pulse 1.8s ease-in-out 0.35s infinite;
  }
  @keyframes badge-pulse {
    0%, 100% { box-shadow: 0 4px 10px rgba(102, 80, 69, 0.28), 0 0 0 0 rgba(245, 196, 163, 0.55); }
    50%      { box-shadow: 0 4px 10px rgba(102, 80, 69, 0.28), 0 0 0 8px rgba(245, 196, 163, 0); }
  }

  /* --- lueur intérieure, une fois l'enveloppe ouverte --- */
  /* deux couches : un halo large et doux, un cœur plus chaud et plus concentré,
     positionnés sur le coin du papier qui dépasse — là où le fond crème uni
     rend la lumière visible, plutôt qu'en plein sur le dessin de l'enveloppe */
  .tvbk-lueur-halo,
  .tvbk-lueur-coeur {
    position: absolute;
    left: 50%;
    pointer-events: none;
    opacity: 0;
    border-radius: 50%;
  }
  .tvbk-lueur-halo {
    top: 24%;
    width: 260px;
    height: 190px;
    transform: translate(-50%, -50%);
    background: radial-gradient(
      ellipse at center,
      rgba(255, 226, 178, 0.85) 0%,
      rgba(255, 210, 150, 0.5) 32%,
      rgba(250, 195, 150, 0.22) 58%,
      rgba(250, 195, 150, 0) 80%
    );
    filter: blur(7px);
  }
  .tvbk-lueur-coeur {
    top: 27%;
    width: 90px;
    height: 60px;
    transform: translate(-50%, -50%);
    background: radial-gradient(
      ellipse at center,
      rgba(255, 250, 235, 0.95) 0%,
      rgba(255, 228, 185, 0.7) 45%,
      rgba(255, 228, 185, 0) 85%
    );
    filter: blur(2px);
  }
  @keyframes tvbk-lueur-respire {
    0%, 100% { opacity: 0.75; transform: translate(-50%, -50%) scale(1); }
    50%      { opacity: 1;    transform: translate(-50%, -50%) scale(1.08); }
  }
  @keyframes tvbk-coeur-respire {
    0%, 100% { opacity: 0.85; transform: translate(-50%, -50%) scale(1); }
    50%      { opacity: 1;    transform: translate(-50%, -50%) scale(1.12); }
  }
  .enveloppe-conteneur.eclater .tvbk-lueur-halo {
    transition: opacity 0.9s ease-in 0.75s;
    opacity: 0.75;
    animation: tvbk-lueur-respire 3.6s ease-in-out 1.65s infinite;
  }
  .enveloppe-conteneur.eclater .tvbk-lueur-coeur {
    transition: opacity 0.9s ease-in 0.8s;
    opacity: 0.85;
    animation: tvbk-coeur-respire 3.6s ease-in-out 1.7s infinite;
  }

  /* --- étoiles qui jaillissent au moment de l'ouverture --- */
  .tvbk-etoiles-zone {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .tvbk-etoile {
    position: absolute;
    left: 50%;
    top: 54%;
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.2) rotate(0deg);
    animation-name: tvbk-etoile-jaillit;
    animation-timing-function: cubic-bezier(.2,.7,.3,1);
    animation-fill-mode: forwards;
  }
  @keyframes tvbk-etoile-jaillit {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.15) rotate(0deg); }
    18%  { opacity: 1; }
    100% {
      opacity: 0;
      transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(var(--fin-echelle)) rotate(var(--rot));
    }
  }

  .rejouer {
    position: absolute;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%);
    padding: 8px 18px;
    border-radius: 999px;
    border: 1.5px solid var(--brun);
    background: var(--creme);
    color: var(--brun);
    font-family: 'Nunito', sans-serif;
    font-size: 14px;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.4s ease 0.3s;
  }
  .rejouer.visible {
    opacity: 1;
  }
  .rejouer:hover {
    background: var(--pêche);
  }
  /* ==================================================================
     Encadré de texte de la lettre + sélecteur de langue + boutons
     ================================================================== */
  .cl-cadre {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -46%) scale(0.96);
    width: min(88vw, 380px);
    max-height: 72dvh;
    display: flex;
    flex-direction: column;
    padding: 20px 20px 22px;
    border-radius: 22px;
    background: #FFFDF8;
    box-shadow: 0 14px 34px rgba(102, 80, 69, 0.22);
    z-index: 20;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.55s ease, transform 0.55s cubic-bezier(.2,.8,.25,1.15);
  }
  .cl-cadre.cl-visible {
    opacity: 1;
    pointer-events: auto;
    transform: translate(-50%, -50%) scale(1);
  }

  /* ---------- sélecteur de langue, au sommet ---------- */
  .cl-selecteur-zone {
    position: relative;
    display: flex;
    justify-content: center;
    margin-bottom: 14px;
  }
  .cl-selecteur-langue {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 14px 7px 8px;
    border: none;
    border-radius: 999px;
    background: rgba(240, 169, 139, 0.16);
    color: var(--brun);
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 0.82rem;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .cl-selecteur-langue:hover { background: rgba(240, 169, 139, 0.28); }
  .cl-selecteur-badge {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--pêche);
    color: #fff;
    font-size: 0.62rem;
    font-weight: 800;
  }
  .cl-selecteur-chevron {
    display: inline-block;
    transition: transform 0.25s ease;
    font-size: 0.7rem;
  }
  .cl-selecteur-langue.cl-ouvert .cl-selecteur-chevron {
    transform: rotate(180deg);
  }

  .cl-menu-langues {
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    transform: translateY(-6px);
    width: min(60vw, 200px);
    max-height: 220px;
    overflow-y: auto;
    background: #FFFFFF;
    border-radius: 16px;
    box-shadow: 0 10px 26px rgba(102, 80, 69, 0.24);
    padding: 6px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    z-index: 30;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .cl-menu-langues.cl-menu-visible {
    opacity: 1;
    pointer-events: auto;
    transform: translateY(0);
  }
  .cl-option-langue {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border: none;
    border-radius: 11px;
    background: transparent;
    font-family: 'Nunito', sans-serif;
    font-size: 0.84rem;
    font-weight: 600;
    color: var(--brun);
    text-align: left;
    cursor: pointer;
    transition: background 0.12s ease;
  }
  .cl-option-langue:hover { background: rgba(240, 169, 139, 0.14); }
  .cl-option-langue.cl-option-selectionnee {
    background: rgba(240, 169, 139, 0.26);
    font-weight: 800;
  }
  .cl-option-badge {
    flex: 0 0 auto;
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: rgba(240, 169, 139, 0.22);
    color: var(--brun);
    font-size: 0.6rem;
    font-weight: 800;
  }

  /* ---------- en-tête du courriel (De / À / Objet + langue) ---------- */
  .cl-entete {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    padding-bottom: 10px;
    margin-bottom: 14px;
    border-bottom: 1px solid rgba(107, 74, 53, 0.14);
  }
  .cl-entete-lignes {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }
  .cl-entete-ligne {
    margin: 0;
    font-family: 'Nunito', sans-serif;
    font-size: 0.74rem;
    line-height: 1.4;
    color: var(--brun);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .cl-entete-label {
    font-weight: 800;
    opacity: 0.6;
    margin-right: 3px;
  }
  .cl-lang-zone {
    position: relative;
    flex: 0 0 auto;
  }
  .cl-lang-discret {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 5px 10px 5px 6px;
    border: none;
    border-radius: 999px;
    background: rgba(240, 169, 139, 0.16);
    color: var(--brun);
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 0.72rem;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .cl-lang-discret:hover { background: rgba(240, 169, 139, 0.28); }
  .cl-lang-discret.cl-ouvert .cl-selecteur-chevron { transform: rotate(180deg); }

  /* ---------- texte de la lettre ---------- */
  .cl-texte {
    text-align: center;
    padding: 6px 4px 18px;
  }
  .cl-salutation {
    font-family: 'Patrick Hand', cursive;
    font-size: 1.5rem;
    color: var(--brun);
    margin: 0 0 8px;
  }
  .cl-corps {
    font-family: 'Patrick Hand', cursive;
    font-size: 1.15rem;
    line-height: 1.42;
    color: var(--brun);
    margin: 0;
  }

  /* ---------- boutons accepter / refuser ---------- */
  .cl-boutons {
    display: flex;
    gap: 12px;
    justify-content: center;
  }
  .cl-btn {
    flex: 1 1 auto;
    max-width: 150px;
    padding: 11px 0;
    border-radius: 999px;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 0.95rem;
    cursor: pointer;
    transition: transform 0.16s cubic-bezier(.34,1.6,.4,1), box-shadow 0.15s ease, background 0.15s ease;
  }
  .cl-btn-accepter {
    border: none;
    color: #fff;
    background: var(--pêche);
    box-shadow: 0 4px 0 0 #c98f6f, 2px 4px 10px rgba(102, 80, 69, 0.18);
  }
  .cl-btn-accepter:hover { background: #efb28e; transform: translateY(-2px); }
  .cl-btn-accepter:active { transform: translateY(2px); box-shadow: 0 1px 0 0 #c98f6f; }
  .cl-btn-refuser {
    border: 1.5px solid var(--brun);
    color: var(--brun);
    background: transparent;
  }
  .cl-btn-refuser:hover { background: rgba(107, 74, 53, 0.06); transform: translateY(-2px); }
  .cl-btn-refuser:active { transform: translateY(2px); }

  /* ---------- système de vues togglées dans l'encadré ---------- */
  .cl-vue[hidden] { display: none !important; }

  /* ---------- écran "dommage" / "accepté" (remplace le contenu de l'encadré) ---------- */
  .cl-dommage {
    text-align: center;
    padding: 10px 4px;
  }
  .cl-dommage-texte {
    font-family: 'Patrick Hand', cursive;
    font-size: 1.3rem;
    color: var(--brun);
    margin: 0 0 6px;
  }
  .cl-dommage-regrets {
    font-family: 'Nunito', sans-serif;
    font-size: 0.85rem;
    color: var(--brun);
    opacity: 0;
    margin: 10px 0 14px;
    transition: opacity 0.5s ease;
  }
  .cl-dommage-regrets.cl-visible { opacity: 0.85; }
  .cl-btn-recommencer {
    border: 1.5px solid var(--brun);
    background: var(--creme);
    color: var(--brun);
    border-radius: 999px;
    padding: 9px 22px;
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 0.85rem;
    cursor: pointer;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.4s ease, transform 0.4s ease, background 0.15s ease;
  }
  .cl-btn-recommencer.cl-visible { opacity: 1; transform: translateY(0); }
  .cl-btn-recommencer:hover { background: var(--pêche); }

  /* ---------- 2e courriel : bouton "Installer Bek" ---------- */
  .cl-lien-televersement {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-top: 14px;
    padding: 11px 26px;
    border: none;
    border-radius: 999px;
    background: var(--pêche);
    color: #fff;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 0.95rem;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .cl-lien-televersement:hover { background: #eeae86; transform: translateY(-1px); }
</style>
</head>
<body>

<div class="scene">
  <div class="enveloppe-conteneur" id="enveloppe">
    <img class="enveloppe-img fermee" id="img-fermee" src="images/accueil/sequence_01/lettre-initiale_fermée_01.webp" alt="Enveloppe fermée">
    <img class="enveloppe-img ouverte" id="img-ouverte" src="images/accueil/sequence_01/lettre-initiale_ouverte_01.webp" alt="Enveloppe ouverte">
    <div class="tvbk-lueur-halo"></div>
    <div class="tvbk-lueur-coeur"></div>
    <div class="tvbk-etoiles-zone" id="zone-etoiles"></div>
    <div class="tvbk-eclat-halo"></div>
    <div class="tvbk-eclat-rayons"></div>
    <div class="tvbk-eclat-onde"></div>
    <div class="badge-notif" id="badgeNotif">1</div>
  </div>

  <div class="cl-cadre" id="clCadre">
    <div class="cl-entete">
      <div class="cl-entete-lignes">
        <p class="cl-entete-ligne"><span class="cl-entete-label" id="clLabelDe">De :</span> Kaleb B</p>
        <p class="cl-entete-ligne"><span class="cl-entete-label" id="clLabelA">À :</span> toncourriel@coucourriel.ca</p>
        <p class="cl-entete-ligne"><span class="cl-entete-label" id="clLabelObjet">Objet :</span> <span id="clObjet">Les Bonomes déménagent</span></p>
      </div>
      <div class="cl-lang-zone">
        <button type="button" class="cl-lang-discret" id="clSelecteur">
          <span id="clSelecteurBadge">FR</span><span class="cl-selecteur-chevron">▾</span>
        </button>
        <div class="cl-menu-langues" id="clMenu"></div>
      </div>
    </div>

    <div class="cl-vue" id="clVueLettre">
      <div class="cl-texte">
        <p class="cl-salutation" id="clSalutation">Bonjour !</p>
        <p class="cl-corps" id="clCorps"></p>
      </div>
      <div class="cl-boutons">
        <button type="button" class="cl-btn cl-btn-refuser" id="clBtnRefuser">Non</button>
        <button type="button" class="cl-btn cl-btn-accepter" id="clBtnAccepter">Oui</button>
      </div>
    </div>

    <div class="cl-vue" id="clVueRemerciement" hidden>
      <div class="cl-texte">
        <p class="cl-corps" id="clRemerciementTexte"></p>
      </div>
      <div class="cl-boutons">
        <button type="button" class="cl-btn cl-btn-refuser" id="clBtnFermer"></button>
      </div>
    </div>

    <div class="cl-vue cl-dommage" id="clVueDommage" hidden>
      <p class="cl-dommage-texte" id="clDommageTexte"></p>
      <p class="cl-dommage-regrets" id="clRegrets"></p>
      <button type="button" class="cl-btn-recommencer" id="clBtnRecommencer"></button>
    </div>

    <div class="cl-vue" id="clVueMessage2" hidden>
      <div class="cl-texte">
        <p class="cl-corps" id="clMessage2Intro"></p>

<script>
(function() {
  const conteneur = document.getElementById('enveloppe');
  const rejouerBtn = document.getElementById('rejouer');
  const zoneEtoiles = document.getElementById('zone-etoiles');
  let peutCliquer = false;

  // forme d'étoile scintillante (sparkle à 4 branches), dans le même
  // langage doux/kawaii que le reste — chemin classique en losange étiré
  const CHEMIN_ETOILE = 'M12 0 C12.6 6.4 14.2 9.8 24 12 C14.2 14.2 12.6 17.6 12 24 C11.4 17.6 9.8 14.2 0 12 C9.8 9.8 11.4 6.4 12 0 Z';
  const COULEURS_ETOILES = ['#FFE6BE', '#FFD8A0', '#FFF3DC'];

  function jaillirEtoiles() {
    zoneEtoiles.innerHTML = '';
    const nb = 10;
    for (let i = 0; i < nb; i++) {
      // réparties tout autour du cachet, avec un peu d'aléatoire dans l'angle et la distance
      const angle = (360 / nb) * i + (Math.random() * 22 - 11);
      const distance = 70 + Math.random() * 90;
      const rad = (angle * Math.PI) / 180;
      const tx = Math.cos(rad) * distance;
      const ty = Math.sin(rad) * distance * 0.85 - 18; // légèrement aplati + biais vers le haut

      const taille = 9 + Math.random() * 9;
      const duree = 0.65 + Math.random() * 0.35;
      const delai = Math.random() * 0.15;
      const rotation = Math.random() * 140 - 70;
      const couleur = COULEURS_ETOILES[i % COULEURS_ETOILES.length];

      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('viewBox', '0 0 24 24');
      svg.classList.add('tvbk-etoile');
      svg.style.width = taille + 'px';
      svg.style.height = taille + 'px';
      svg.style.setProperty('--tx', tx.toFixed(1) + 'px');
      svg.style.setProperty('--ty', ty.toFixed(1) + 'px');
      svg.style.setProperty('--fin-echelle', (0.5 + Math.random() * 0.4).toFixed(2));
      svg.style.setProperty('--rot', rotation.toFixed(0) + 'deg');
      svg.style.animationDuration = duree.toFixed(2) + 's';
      svg.style.animationDelay = delai.toFixed(2) + 's';

      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', CHEMIN_ETOILE);
      path.setAttribute('fill', couleur);
      svg.appendChild(path);
      zoneEtoiles.appendChild(svg);
    }
  }

  function demarrerChute() {
    conteneur.classList.remove('flotte', 'eclater');
    zoneEtoiles.innerHTML = ''; // nettoie les étoiles d'un éventuel essai précédent
    void conteneur.offsetWidth; // force reflow pour permettre de rejouer l'animation
    conteneur.classList.add('tombe');
    peutCliquer = false;
    rejouerBtn.classList.remove('visible');
    if (window.KebBekLettreInitiale) window.KebBekLettreInitiale.reinitialiser();

    // durée de la chute (correspond à l'animation CSS)
    setTimeout(() => {
      conteneur.classList.remove('tombe');
      conteneur.classList.add('flotte');
      peutCliquer = true;
    }, 1150);
  }

  // ouvre l'enveloppe (éclat du cachet + fondu vers l'image ouverte), puis
  // appelle callback() une fois la lettre visible — réutilisé pour le premier
  // clic sur l'enveloppe et pour la réouverture au clic sur le badge « 1 »
  function ouvrir(callback) {
    peutCliquer = false;
    conteneur.classList.remove('flotte');
    conteneur.classList.add('eclater');
    jaillirEtoiles();
    setTimeout(() => {
      if (callback) callback();
    }, 1300);
  }

  // referme l'enveloppe (redevient l'image fermée, flottante) sans rejouer
  // toute la chute — utilisé une fois la lettre initiale lue et fermée
  function refermer() {
    conteneur.classList.remove('eclater');
    zoneEtoiles.innerHTML = '';
    void conteneur.offsetWidth;
    conteneur.classList.add('flotte');
    peutCliquer = false;
  }

  // callback à usage unique pour le PROCHAIN clic sur l'enveloppe — posé par
  // activerClicPour(), utilisé pour la réouverture du 2e courriel : c'est bien
  // l'enveloppe (le courriel) qu'on clique, jamais le badge lui-même (voir
  // .badge-notif { pointer-events: none } plus haut : le badge n'est qu'un
  // indicateur visuel posé par-dessus, le clic le traverse toujours)
  let callbackClicSuivant = null;

  conteneur.addEventListener('click', () => {
    if (!peutCliquer) return;
    if (callbackClicSuivant) {
      const cb = callbackClicSuivant;
      callbackClicSuivant = null;
      ouvrir(cb);
      return;
    }
    ouvrir(() => {
      rejouerBtn.classList.add('visible');
      if (window.KebBekLettreInitiale) window.KebBekLettreInitiale.afficher();
    });
  });

  rejouerBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (window.KebBekLettreInitiale) window.KebBekLettreInitiale.arreterSequenceTeleversement();
    demarrerChute();
  });

  window.KebBekEnveloppe = {
    demarrerChute: demarrerChute,
    ouvrir: ouvrir,
    refermer: refermer,
    // rend l'enveloppe de nouveau cliquable et programme ce qui doit se
    // passer au prochain clic (utilisé pour le badge de notification)
    activerClicPour: function (callback) {
      callbackClicSuivant = callback;
      peutCliquer = true;
    }
  };

  demarrerChute();
})();
</script>

    return (t && t[cle] !== undefined) ? t[cle] : DICO_LETTRE.fr[cle];
  }

  // ---------- construction du menu déroulant ----------
  LANGUES.forEach(function (l) {
    const opt = document.createElement('button');
    opt.type = 'button';
    opt.className = 'cl-option-langue';
    opt.dataset.code = l.code;
    opt.innerHTML = '<span class="cl-option-badge">' + l.code.toUpperCase() + '</span><span>' + l.natif + '</span>';
    opt.addEventListener('click', function (e) {
      e.stopPropagation();
      changerLangue(l.code);
      fermerMenu();
    });
    menu.appendChild(opt);
  });

  function ouvrirMenu() {
    menu.classList.add('cl-menu-visible');
    selecteur.classList.add('cl-ouvert');
  }
  function fermerMenu() {
    menu.classList.remove('cl-menu-visible');
    selecteur.classList.remove('cl-ouvert');
  }
  selecteur.addEventListener('click', function (e) {
    e.stopPropagation();
    if (menu.classList.contains('cl-menu-visible')) fermerMenu(); else ouvrirMenu();
  });
  document.addEventListener('click', function (e) {
    if (!menu.contains(e.target) && e.target !== selecteur) fermerMenu();
  });

  function changerLangue(code) {
    langueActuelle = DICO_LETTRE[code] ? code : 'fr';
    const langueInfo = LANGUES.find(function (l) { return l.code === langueActuelle; });
    selecteurBadge.textContent = langueActuelle.toUpperCase();
    selecteur.title = langueInfo.natif;
    menu.querySelectorAll('.cl-option-langue').forEach(function (opt) {
      opt.classList.toggle('cl-option-selectionnee', opt.dataset.code === langueActuelle);
    });
    const t = DICO_LETTRE[langueActuelle];
    salutationEl.textContent = t.salutation;
    corpsEl.textContent = t.corps;
    btnAccepter.textContent = t.oui;
    btnRefuser.textContent = t.non;
    // ne retraduit le sujet du 1er courriel que si le 2e n'est pas déjà affiché
    // (sinon changer de langue depuis le menu, sur le 2e courriel, écraserait
    // son propre sujet "objet2" avec celui du premier)
    if (objetEl && vueMessage2.hidden) {
      objetEl.textContent = t.objet1;
    } else if (objetEl && !vueMessage2.hidden) {
      objetEl.textContent = t.objet2;
    }
  }

  // ---------- Refuser : « Dommage » puis, après 5 s, « Des regrets ? » ----------
  function afficherDommage() {
    const t = DICO_LETTRE[langueActuelle];
    dommageTexteEl.textContent = t.dommage;
    regretsEl.textContent = t.regrets;
    btnRecommencer.textContent = t.recommencer;
    regretsEl.classList.remove('cl-visible');
    btnRecommencer.classList.remove('cl-visible');

    vueLettre.hidden = true;
    vueDommage.hidden = false;

    if (minuteurRegrets) clearTimeout(minuteurRegrets);
    minuteurRegrets = setTimeout(function () {
      regretsEl.classList.add('cl-visible');
      btnRecommencer.classList.add('cl-visible');
    }, 5000);
  }

  btnRefuser.addEventListener('click', afficherDommage);

  btnRecommencer.addEventListener('click', function () {
    if (window.KebBekEnveloppe) window.KebBekEnveloppe.demarrerChute();
  });

  function masquerToutesLesVues() {
    vueLettre.hidden = true;
    vueDommage.hidden = true;
    vueRemerciement.hidden = true;
    vueMessage2.hidden = true;
  }

  // ---------- "Oui" → remerciement → (Fermer) → badge sur l'enveloppe → 2e courriel → stub ----------
  btnAccepter.addEventListener('click', function () {
    remerciementTexteEl.textContent = texte('remerciement');
    btnFermer.textContent = texte('fermer');
    masquerToutesLesVues();
    vueRemerciement.hidden = false;
  });

  // affiche le 2e courriel — déclenché par le clic sur l'ENVELOPPE (jamais
  // sur le badge « 1 » lui-même, qui n'est qu'un indicateur visuel)
  function ouvrirEtAfficherMessage2() {
    badgeNotif.classList.remove('cl-visible');
    if (objetEl) objetEl.textContent = texte('objet2');
    message2IntroEl.textContent = texte('message2Intro');
    lienTeleversementEl.textContent = texte('installerBek');
    masquerToutesLesVues();
    vueMessage2.hidden = false;
    cadre.classList.add('cl-visible');
  }

  btnFermer.addEventListener('click', function () {
    cadre.classList.remove('cl-visible');
    // l'enveloppe redevient fermée, comme si on attendait un nouveau message
    if (window.KebBekEnveloppe) window.KebBekEnveloppe.refermer();
    if (minuteurBadge) clearTimeout(minuteurBadge);
    minuteurBadge = setTimeout(function () {
      badgeNotif.classList.add('cl-visible');
      // rend l'enveloppe cliquable de nouveau : c'est le clic sur le
      // courriel (l'enveloppe), pas sur le badge, qui rouvre le 2e message
      if (window.KebBekEnveloppe) window.KebBekEnveloppe.activerClicPour(ouvrirEtAfficherMessage2);
    }, 3000);
  });

  // séquence de téléversement (image de Bek qui se précise, éclair, noir,
  // ouverture, atterrissage) — voir sequence-televersement.js. Le cadre du
  // courriel disparaît : la scène est en plein écran, par-dessus tout.
  let sequenceTeleversementActive = null;

  lienTeleversementEl.addEventListener('click', function () {
    masquerToutesLesVues();
    cadre.classList.remove('cl-visible');
    if (window.KebBekTeleversement) {
      sequenceTeleversementActive = window.KebBekTeleversement.demarrerSequenceTeleversement(
        'tvbkConteneur',
        {
          // 🚧 proposition : dossier "sequence_02", à côté de "sequence_01"
          // (l'enveloppe/lettre) qui existe déjà dans images/accueil/ — à
          // confirmer/ajuster, puis les 6 images (televersement_bek_01.png
          // … 06.webp) à y déposer avant mise en ligne
          dossierImages: 'images/accueil/sequence_02/'
        },
        {
          onFin: function () { sequenceTeleversementActive = null; }
        }
      );
    } else {
      console.warn('sequence-televersement.js non chargé.');
    }
  });

  changerLangue(langueActuelle);

  window.KebBekLettreInitiale = {
    afficher: function () {
      cadre.classList.add('cl-visible');
    },
    reinitialiser: function () {
      this.arreterSequenceTeleversement();
      cadre.classList.remove('cl-visible');
      fermerMenu();
      if (minuteurRegrets) { clearTimeout(minuteurRegrets); minuteurRegrets = null; }
      if (minuteurBadge) { clearTimeout(minuteurBadge); minuteurBadge = null; }
      badgeNotif.classList.remove('cl-visible');
      masquerToutesLesVues();
      vueLettre.hidden = false;
      regretsEl.classList.remove('cl-visible');
      btnRecommencer.classList.remove('cl-visible');
      changerLangue(langueActuelle); // conserve la langue choisie d'un essai à l'autre
    },
    // coupe net la séquence de téléversement en plein écran si elle tourne
    // encore (ex. clic sur "rejouer" avant qu'elle soit terminée)
    arreterSequenceTeleversement: function () {
      if (sequenceTeleversementActive) {
        sequenceTeleversementActive.arreter();
        sequenceTeleversementActive = null;
      }
      document.getElementById('tvbkConteneur').innerHTML = '';
    }
  };
})();
</script>

</body>
</html>
