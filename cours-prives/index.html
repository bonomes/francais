  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --fond:        #F2EDE3;
    --fond-carte:  #FFFCF5;
    --brun:        #665045;
    --brun-fonce:  #4A3B33;
    --blonde:      #F1DC99;
    --peche:       #F0A98B;
    --peche-pale:  #FBEAE2;
    --peche-fonce: #E08867;
    --peche-ombre: #B5623F;
    --or:          #C89B2C;
    --or-clair:    #FFF8E8;
    --or-ombre:    #8F7018;
    --gris-verrou: #C9C0B4;
    --ombre-douce: rgba(102,80,69,0.16);
  }

  html, body { min-height: 100vh; }

  body {
    font-family: "Inter", sans-serif;
    color: var(--brun-fonce);
    background:
      radial-gradient(ellipse 90% 60% at 8% -8%,  rgba(240,169,60,0.10) 0%, transparent 55%),
      radial-gradient(ellipse 80% 55% at 96% 108%, rgba(224,136,103,0.14) 0%, transparent 55%),
      var(--fond);
    overflow-x: hidden;
  }

  .page {
    position: relative; z-index: 1;
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: clamp(36px, 6vw, 72px) 24px 64px;
  }

  .retour {
    align-self: flex-start;
    font-family: "Baloo 2", sans-serif; font-weight: 700; font-size: 0.95rem;
    color: var(--brun); text-decoration: none;
    display: inline-flex; align-items: center; gap: 6px;
    margin-bottom: clamp(24px, 4vw, 40px);
    opacity: 0; animation: monter 0.5s ease 0.05s forwards;
    transition: color 0.2s ease, transform 0.2s ease;
  }
  .retour:hover { color: var(--peche-fonce); transform: translateX(-2px); }

  /* ── EMBLÈME — véritable illustration officielle Keb & Bek, pas une
     silhouette inventée. Ratio natif 1408/950 (voir index principal). ── */
  .emblem {
    width: clamp(160px, 26vw, 230px);
    height: auto;
    aspect-ratio: 1408 / 950;
    object-fit: contain;
    margin-bottom: 8px;
    opacity: 0; animation: monter 0.55s ease 0.15s forwards;
  }

  .entete {
    text-align: center;
    max-width: 560px;
    display: flex; flex-direction: column; align-items: center;
    margin-bottom: clamp(40px, 6vw, 64px);
  }
  .entete-surtitre {
    font-family: "Baloo 2", sans-serif; font-weight: 700; font-size: 0.85rem;
    letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--peche-fonce); margin-bottom: 0.7rem;
    opacity: 0; animation: monter 0.5s ease 0.25s forwards;
  }
  .entete-titre {
    font-family: "Baloo 2", sans-serif; font-weight: 700;
    font-size: clamp(2.2rem, 5.5vw, 3.4rem); line-height: 1.12;
    color: var(--brun-fonce);
    opacity: 0; animation: monter 0.55s ease 0.35s forwards;
  }
  .entete-titre em { font-style: normal; color: var(--peche-fonce); }
  .entete-sous {
    margin-top: 0.9rem; font-size: 1rem; font-weight: 400;
    color: var(--brun); max-width: 440px; line-height: 1.7;
    opacity: 0; animation: monter 0.55s ease 0.45s forwards;
  }

  /* ── JETONS — deux destinations seulement : Contact vit maintenant
     ailleurs, comme destination de premier niveau du menu principal,
     donc il ne figure plus dans ce sous-menu. ── */
  .jetons {
    display: flex; flex-wrap: wrap; justify-content: center; align-items: stretch;
    gap: clamp(18px, 3vw, 30px);
    width: 100%; max-width: 620px;
    opacity: 0; animation: monter 0.6s ease 0.58s forwards;
  }

  .jeton {
    position: relative;
    display: flex; flex-direction: column; align-items: center; text-align: center;
    text-decoration: none; color: inherit;
    width: clamp(220px, 32vw, 280px);
    padding: clamp(28px, 3.4vw, 36px) clamp(22px, 2.8vw, 28px);
    background: var(--fond-carte);
    border: 3px solid var(--gris-verrou);
    border-radius: 26px;
    box-shadow: 0 5px 0 var(--ombre-douce);
    transition: transform 0.18s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.18s ease, border-color 0.2s ease;
  }
  .jeton:hover {
    transform: translateY(-5px);
    box-shadow: 0 9px 0 var(--ombre-douce);
    border-color: var(--brun);
  }
  .jeton:active { transform: translateY(-1px); box-shadow: 0 3px 0 var(--ombre-douce); }

  .jeton.vedette {
    border-color: var(--or);
    background: var(--or-clair);
    box-shadow: 0 6px 0 var(--or-ombre);
    transform: translateY(-4px) scale(1.03);
    z-index: 2;
  }
  .jeton.vedette:hover { transform: translateY(-9px) scale(1.03); box-shadow: 0 10px 0 var(--or-ombre); border-color: var(--or); }
  .jeton.vedette:active { transform: translateY(-2px) scale(1.03); box-shadow: 0 4px 0 var(--or-ombre); }

  .jeton-icone {
    width: 60px; height: 60px; border-radius: 18px;
    background: var(--peche-pale); color: var(--peche-fonce);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 14px;
  }
  .jeton.vedette .jeton-icone { background: rgba(200,155,44,0.16); color: var(--or-ombre); }
  .jeton-icone svg { width: 30px; height: 30px; }

  .jeton-label {
    font-family: "Baloo 2", sans-serif; font-weight: 700; font-size: 1.32rem;
  }

  .jeton-detail {
    margin-top: 6px; font-size: 0.82rem; font-weight: 500; color: var(--brun);
    line-height: 1.5;
  }
  .jeton.vedette .jeton-detail { color: var(--or-ombre); }

  .jeton-fleche {
    margin-top: 14px; font-weight: 700; font-size: 1.1rem;
    color: var(--peche-fonce); transition: transform 0.2s ease;
  }
  .jeton.vedette .jeton-fleche { color: var(--or); }
  .jeton:hover .jeton-fleche { transform: translateX(5px); }

  .pied {
    margin-top: clamp(44px, 6vw, 66px);
    font-size: 0.82rem; font-weight: 500; color: var(--brun);
    opacity: 0; animation: monter 0.5s ease 0.85s forwards;
  }

  @keyframes monter {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 680px) {
    .jetons { flex-direction: column; align-items: center; }
    .jeton, .jeton.vedette { width: min(340px, 92%); transform: none !important; }
    .jeton:hover, .jeton.vedette:hover { transform: translateY(-4px) !important; }
  }
