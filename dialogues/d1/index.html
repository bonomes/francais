<!-- Page à part entière, même situation que parcours.html/intro-bonomes.html
     (voir COMPTES_ELEVES_v10/v11) : aucun état JS partagé avec index.html,

<style>
  /* ==================================================================
     dialogue-d1.html — PREMIÈRE vraie leçon de dialogue du site (id
     'd1' dans NIVEAUX, parcours.html). Contenu confirmé par Raphaël
     (session du 08-08-2026) :
       Keb « J'ai faim. »        Bek « Mange ! »
       Keb « Mange quoi ? »      Bek « Mange... mon sandwich ? »
       Keb « Oh, merci ! »

     MÉCANIQUE (demande explicite de Raphaël, à distinguer clairement de
     intro-bonomes.html même si l'ossature en est reprise) — DEUX choses
     bien séparées, chacune avec sa propre logique d'accumulation/retrait :

       1. La bulle du haut (#bulleDialogue) : UNE SEULE réplique visible à
          la fois, au-dessus des personnages, remplacée à chaque étape —
          jamais empilée. Défilement par flèches clavier, clic/tap sur les
          boutons Précédent/Suivant, OU tap direct sur la scène (avance
          seulement — reculer reste un geste délibéré via le bouton, pour
          éviter un retour accidentel qui ferait disparaître des lignes
          déjà accumulées).

       2. DEUX piles indépendantes en dessous, qui s'accumulent en avançant
          ET SE VIDENT PARTIELLEMENT en reculant (reconstruites depuis le
          début à chaque navigation — même stratégie que precedent() dans
          intro-bonomes.html, plus simple et plus sûre qu'un simple
          "retirer le dernier élément" quand deux piles doivent rester
          synchronisées avec la même étape courante) :
            a) #pileDialogue  : chaque réplique déjà dite, dans l'ordre.
            b) #pileGrammaire : les notes grammaticales, dans la langue de
               l'apprenant (voir GRAMMAIRE plus bas) — n'apparaît QUE pour
               les étapes qui en ont une (ici : étapes 1 et 2 seulement,
               voir ETAPES). Visuellement distincte de la pile de dialogue
               (fond pêche-pâle, même langage que .sac-intro/.iden-indice-mot
               ailleurs sur le site — un contenu "aide/explication", pas
               une réplique du dialogue lui-même).

     PAS DE GENRE (masculin/féminin) à ce stade — demande explicite de
     Raphaël : rien dans ce dialogue n'introduit cette distinction, donc
     rien dans la mise en scène n'en dépend non plus.

     IMAGES : aucune illustration propre à cette leçon n'existe encore.
     Chemins RÉSERVÉS ci-dessous (images/dialogue-d1/...), avec le même
     repli "Image not ready yet" que intro-bonomes.html (creerImage) —
     la mécanique fonctionne dès maintenant, les vraies images pourront
     être déposées aux chemins prévus sans toucher au code.

     RÉCOMPENSES : confirmé par Raphaël (session du 09-08-2026) — la
     première complétion de d1 donne 5 P$, pas de PB (réservés aux objets
     spéciaux/coûteux, attribués avec bien plus de parcimonie — voir même
     échange). Câblé ci-dessous via KebBekProgression.attribuerRecompense-
     PremiereFois('d1', 5, 0), séparée de marquerChapitreComplete() pour ne
     courir aucun risque sur cette dernière (déjà fonctionnelle). Fonction
     SQL attribuer_recompense_premiere_fois DÉPLOYÉE sur Supabase (projet
     Bravo, session du 09-08-2026, via le connecteur Supabase — schéma
     réellement introspecté avant écriture, pas deviné : eleves.id/uuid,
     eleves.compte_id confirmés, même garde de propriété v_compte_id =
     auth.uid() que marquer_chapitre_complete). Reste à valider en
     conditions réelles (compléter la leçon avec un compte connecté et
     vérifier le solde P$ dans le sac).
     ================================================================== */

  :root {
    --fond: #F2EDE3;
    --brun: #665045;
    --brun-fonce: #4A3B33;
    --peche: #F0A98B;
    --peche-fonce: #E08867;
    --peche-pale: #FBEAE2;
    --bek-couleur: #C97B3D;
    --keb-couleur: #5B7FA6;
    --ombre: rgba(102, 80, 69, 0.16);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: var(--fond);
  }

  body {
    font-family: 'Baloo 2', 'Noto Sans', sans-serif;
    color: var(--brun-fonce);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 60px;
  }

  /* ---------- Retour vers le parcours ---------- */
  .retour {
    position: fixed;
    top: 20px;
    left: 20px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #FFFFFF;
    color: var(--brun);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
    text-decoration: none;
    box-shadow: 0 2px 8px var(--ombre);
    opacity: 0.85;
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index: 20;
  }
  .retour:hover { opacity: 1; transform: scale(1.08); }

  .compteur {
    font-weight: 700;
    font-size: 0.9rem;
    color: var(--brun);
    opacity: 0.75;
    margin-bottom: 14px;
    letter-spacing: 0.02em;
  }

  /* ---------- Légende unique, au-dessus des personnages ---------- */
  /* 🆕 (session du 08-08-2026, 2e échange) : Raphaël ne veut PAS l'habillage
     "bulle de BD" (encadré + pointe triangulaire vers le personnage) —
     juste du texte présenté comme dans intro-bonomes.html (.legende-intro :
     encadré doux coloré selon le personnage, SANS pointe). Donc même boîte
     que .legende-intro, mais SANS le ::after qui existait ici avant. Le
     positionnement au-dessus des personnages, lui, reste : la légende vit
     simplement AVANT l'image dans le flux normal du document (pas de
     superposition en absolute), donc "au-dessus" sans jamais rien
     recouvrir — c'est cette partie-là qui n'a pas changé. */
  /* 🆕 (session du 08-08-2026, 3e échange) : les répliques flottaient trop
     loin au-dessus des têtes — les images sources ont une bonne marge vide
     en haut/en bas du cadre, donc même juste avant la scène dans le flux,
     l'écart visuel restait grand. Deux correctifs : la légende est décalée
     vers l'intérieur (padding sur .zone-bulle) plutôt que collée à
     l'extrême bord, ET l'image est légèrement zoomée/recadrée (voir
     .scene-dialogue overflow:hidden + transform sur .image-scene plus bas)
     pour réduire cette marge vide et rapprocher visuellement les têtes du
     haut du cadre. */
  .zone-bulle {
    display: flex;
    width: min(92vw, 560px);
    min-height: 60px;
    align-items: flex-end;
    padding: 0 5%;
  }

  .bulle-dialogue {
    position: relative;
    max-width: 82%;
    font-weight: 700;
    font-size: clamp(1.05rem, 3vw, 1.35rem);
    line-height: 1.35;
    padding: 12px 20px;
    background: #FFFFFF;
    border-radius: 18px;
    box-shadow: 0 4px 14px var(--ombre);
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.3s ease, transform 0.3s ease;
  }
  .bulle-dialogue.in { opacity: 1; transform: translateY(0); }

  .bulle-dialogue.cote-keb { margin-right: auto; text-align: left; border: 2.5px solid var(--keb-couleur); color: var(--keb-couleur); }
  .bulle-dialogue.cote-bek { margin-left: auto; text-align: right; border: 2.5px solid var(--bek-couleur); color: var(--bek-couleur); }
  /* Pas de pointe triangulaire (::after) ici — c'était le seul élément qui
     faisait "bulle de BD" plutôt que simple texte encadré ; retiré à la
     demande de Raphaël. cote-keb reste aligné à gauche, décalé du bord par
     le padding de .zone-bulle plutôt que flush à 0. */

  /* ---------- Scène (personnages) ---------- */
  .scene-dialogue {
    position: relative;
    width: min(92vw, 560px);
    aspect-ratio: 1408 / 768;
    overflow: hidden; /* 🆕 nécessaire pour que le zoom ci-dessous recadre au lieu de déborder */
    margin-top: 4px;
  }

  .scene-dialogue img.image-scene {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    transform: none; /* 🆕 (6e échange) : le zoom coupait la queue de cheval de Bek — annulé, priorité à ne jamais rogner les personnages */
    -webkit-mask-image: radial-gradient(ellipse 94% 90% at center, #000 74%, transparent 100%);
    mask-image: radial-gradient(ellipse 94% 90% at center, #000 74%, transparent 100%);
  }

  /* ---------- Sandwich greffé (étape "Ton sandwich ?", dernier temps de
     la séquence auto) — flotte doucement avec une lueur chaude pulsante
     autour, à l'emplacement de l'étoile déjà présente dans l'image de
     base. Voir creerImageComposite(). ---------- */
  .sandwich-greffe {
    position: absolute;
    left: 52.7%;
    top: 37%;
    width: 19%;
    transform: translate(-50%, -50%);
    animation: sandwichFlotte 2.6s ease-in-out infinite;
  }
  .sandwich-greffe-lueur {
    position: absolute;
    inset: -35%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 209, 128, 0.65) 0%, rgba(255, 209, 128, 0) 72%);
    animation: sandwichLueur 2.6s ease-in-out infinite;
    z-index: 0;
  }
  .sandwich-greffe-img {
    position: relative;
    z-index: 1;
    width: 100%;
    display: block;
    filter: drop-shadow(0 6px 12px rgba(120, 80, 40, 0.35));
  }
  @keyframes sandwichFlotte {
    0%, 100% { transform: translate(-50%, -50%); }
    50% { transform: translate(-50%, calc(-50% - 9px)); }
  }
  @keyframes sandwichLueur {
    0%, 100% { opacity: 0.75; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.1); }
  }

  .repli-image-manquante {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
    font-weight: 700;
    font-size: 0.95rem;
    color: var(--peche-fonce);
    opacity: 0.75;
  }

  /* ---------- Navigation ---------- */
  .nav-dialogue {
    display: flex;
    gap: 12px;
    margin-top: 18px;
  }

  .bouton-nav {
    font-family: inherit;
    font-weight: 700;
    font-size: 0.95rem;
    border-radius: 999px;
    padding: 10px 26px;
    cursor: pointer;
    transition: transform 0.12s ease, box-shadow 0.12s ease, opacity 0.15s ease;
  }
  .bouton-nav:disabled { opacity: 0.4; cursor: not-allowed; }

  .bouton-nav.suivant { border: none; background: var(--peche-fonce); color: #FFFFFF; box-shadow: 0 4px 0 #B5623F; }
  .bouton-nav.suivant:hover:not(:disabled) { transform: translateY(2px); box-shadow: 0 2px 0 #B5623F; }
  .bouton-nav.suivant:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 #B5623F; }

  .bouton-nav.precedent { background: #FFFFFF; color: var(--brun); border: 1.5px solid var(--brun); }
  .bouton-nav.precedent:hover:not(:disabled) { background: var(--fond); }

  /* ---------- Piles (dialogue + grammaire) ---------- */
  .piles-conteneur {
    width: min(92vw, 560px);
    margin-top: 26px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .pile-section-titre {
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--brun-clair, #8A7364);
    margin: 0 0 6px 4px;
  }

  .pile-dialogue { display: flex; flex-direction: column; gap: 2px; }

  .pile-item {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    max-height: 0;
    opacity: 0;
    overflow: hidden;
    transition: max-height 0.3s ease, opacity 0.3s ease, margin 0.3s ease;
  }
  .pile-item.in { opacity: 1; max-height: 120px; margin: 7px 0; overflow: visible; }

  .pile-avatar {
    flex-shrink: 0;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.72rem;
    font-weight: 700;
    color: #FFFFFF;
    background: var(--c, var(--brun));
  }
  .pile-item.keb { --c: var(--keb-couleur); }
  .pile-item.bek { --c: var(--bek-couleur); }

  .pile-corps { flex: 1; min-width: 0; }
  .pile-qui { display: block; font-size: 0.68rem; font-weight: 700; color: var(--c, var(--brun)); margin-bottom: 1px; }
  .pile-texte { font-size: 0.92rem; line-height: 1.35; }

  /* Notes grammaticales — même langage visuel qu'un contenu d'aide
     ponctuel ailleurs sur le site (.sac-intro dans sac-a-dos.css,
     .iden-indice-mot dans identite-eleve.css) : fond pêche-pâle, pour
     que ce ne soit jamais confondu avec une réplique du dialogue. */
  .pile-grammaire { display: flex; flex-direction: column; gap: 8px; }

  .grammaire-item {
    max-height: 0;
    opacity: 0;
    overflow: hidden;
    padding: 0 14px;
    background: var(--peche-pale);
    border-radius: 12px;
    font-size: 0.84rem;
    line-height: 1.45;
    color: var(--brun-fonce);
    transition: max-height 0.3s ease, opacity 0.3s ease, padding 0.3s ease;
  }
  .grammaire-item.in { opacity: 1; max-height: 160px; padding: 10px 14px; overflow: visible; }

  @media (max-width: 460px) {
    .bulle-dialogue { font-size: 1rem; padding: 10px 16px; }
    .bouton-nav { padding: 9px 20px; font-size: 0.88rem; }
  }

  /* ---------- Mots cliquables dans la bulle active ----------
     Repris À L'IDENTIQUE (mêmes noms de classes) du mécanisme déjà
     enseigné ailleurs sur le site (identite-eleve.css/.js) — demande
     explicite de Raphaël : "le mécanisme du sac demeure partout". Un
     clic/tap affiche la traduction (bulle .iden-tooltip-mot) ; un
     double-clic/double-tap range le mot dans le sac (vol animé vers
     #sacBouton, voir animerMotVersSac dans le script plus bas). Seule
     la pile #pileDialogue (réplique déjà passée) reste du texte inerte
     — seule la bulle ACTIVE est interactive, comme dans l'introduction. */
  .iden-mot {
    cursor: pointer;
    position: relative;
    display: inline-block;
    transition: color 0.15s ease, text-shadow 0.25s ease;
    animation: iden-lueur-mot 2.6s ease-in-out infinite;
    touch-action: manipulation; /* évite le zoom natif au double-tap, voir identite-eleve.css */
  }
  @keyframes iden-lueur-mot {
    0%, 100% { text-shadow: 0 0 0 rgba(224, 136, 103, 0); }
    50%      { text-shadow: 0 0 14px rgba(224, 136, 103, 0.5); }
  }
  .iden-mot:hover { color: var(--peche-fonce); animation: none; text-shadow: 0 0 16px rgba(224, 136, 103, 0.6); }

  @keyframes iden-flash-ajout {
    0%   { text-shadow: 0 0 0 rgba(111, 174, 94, 0); }
    30%  { color: #4C8A3E; text-shadow: 0 0 18px rgba(111, 174, 94, 0.85); }
    100% { text-shadow: 0 0 0 rgba(111, 174, 94, 0); }
  }
  .iden-mot.flash-ajout { animation: iden-flash-ajout 0.7s ease; }

  .iden-mot-vole {
    position: fixed;
    z-index: 250;
    font-weight: 700;
    font-size: 1rem;
    color: var(--peche-fonce);
    pointer-events: none;
    white-space: nowrap;
    transition: transform 0.55s cubic-bezier(.4, 0, .3, 1), opacity 0.55s ease;
    transform: translate(0, 0) scale(1);
    opacity: 1;
  }
  .iden-mot-vole.en-vol { transform: translate(var(--vol-dx), var(--vol-dy)) scale(0.3); opacity: 0; }

  .iden-tooltip-mot {
    position: absolute;
    left: 50%;
    top: calc(100% + 10px);
    transform: translateX(-50%);
    font-family: 'Baloo 2', sans-serif;
    font-size: 0.7rem;
    font-weight: 700;
    color: var(--brun-fonce);
    background: #FFFFFF;
    border: 1.5px solid var(--peche);
    border-radius: 8px;
    padding: 3px 8px;
    white-space: nowrap;
    z-index: 3;
    pointer-events: none;
  }
  .iden-tooltip-mot::after, .iden-tooltip-mot::before {
    content: '';
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    border-left: 6px solid transparent;
    border-right: 6px solid transparent;
  }
  .iden-tooltip-mot::after { bottom: 100%; border-bottom: 7px solid var(--peche); }
  .iden-tooltip-mot::before { bottom: calc(100% - 1.5px); border-bottom: 6px solid #FFFFFF; z-index: 1; }
</style>
</head>

<script>
  // ================================================================
  // Contenu du dialogue — confirmé par Raphaël (session du 08-08-2026).
  // 'grammaire' est une clé optionnelle vers GRAMMAIRE ci-dessous ; toutes
  // les étapes n'en ont pas (ici : seulement 1 et 2).
  // ================================================================
  const ETAPES = [
    { speaker: 'keb', texte: 'J\u2019ai faim.', img: '../../images/dialogues/d1/d1_01_bonomes_keb_bek_jai-faim_.png', grammaire: 'gJai' },
    { speaker: 'bek', texte: 'Mange\u00A0!', img: '../../images/dialogues/d1/d1_02_bonomes_keb_bek_mange_.png', grammaire: 'gImperatif' },
    { speaker: 'keb', texte: 'Mange quoi\u00A0?', img: '../../images/dialogues/d1/d1_03_bonomes_keb_bek_mange_quoi.png', grammaire: 'gQuoi' },
    { speaker: 'bek', texte: 'Mange... mon sandwich\u00A0?', img: '../../images/dialogues/d1/d1_04_bonomes_keb_bek_mange-mon-mange_.png' },
    // 🆕 (session du 08-08-2026, 4e échange) : étape 5a — Keb réalise que
    // Bek n'a pas de sandwich sur elle. 'sequenceAuto' : liste d'images qui
    // s'enchaînent SEULES (pas de clic entre elles) dès que l'élève clique
    // Continuer depuis CETTE étape — voir jouerSequenceAuto() plus bas.
    // Confirmé par Raphaël : ce défilement automatique est une exception
    // ponctuelle (pour montrer d'où viennent le calepin et le crayon), pas
    // un patron réutilisé pour les prochaines apparitions d'objets.
    // Noms de fichiers ci-dessous DEVINÉS en attendant les vraies images
    // (même repli "Image not ready yet" que partout ailleurs) — à corriger
    // dès que Raphaël fournit les vrais noms, comme pour 01-04.
    {
      speaker: 'keb',
      texte: 'Ton sandwich\u00A0?',
      img: '../../images/dialogues/d1/d1_05a_bonomes_keb_bek_ton-sandwich_.png',
      sequenceAuto: [
        '../../images/dialogues/d1/d1_05b_bonomes_keb_bek_ton-sandwich_.png',
        '../../images/dialogues/d1/d1_05c_bonomes_keb_bek_ton-sandwich_.png',
        // 🆕 dernier temps : image de base (la lueur/étoile y est déjà) +
        // le sandwich greffé par-dessus en superposition flottante — voir
        // creerImageComposite() plus bas. Position en % estimée par
        // analyse de pixels de l'image fournie (centre de la lueur ≈ 52,7%
        // largeur / 37% hauteur) — à ajuster si ça ne tombe pas pile une
        // fois vu en vrai dans le navigateur.
        {
          img: '../../images/dialogues/d1/d1_05d_bonomes_keb_bek_ton-sandwich_.png',
          superposition: '../../images/dialogues/d1/d1_05d_sandwich_.png'
        }
      ]
    },
    { speaker: 'keb', texte: 'Oh, merci\u00A0!', img: '../../images/dialogues/d1/d1_06_bonomes_keb_bek_ton-sandwich_.png' }
  ];

  // Notes grammaticales dans la langue de l'apprenant. Seules fr/en sont
  // complètes pour l'instant (même choix minimal que menu-principal.js à
  // sa création) — repli automatique sur l'anglais pour toute autre langue
  // (voir texteGrammaire ci-dessous), plutôt que de traduire à l'avance un
  // texte que Raphaël pourrait encore vouloir ajuster.
  const GRAMMAIRE = {
    gJai: {
      fr: '« J\u2019ai » vient du verbe avoir. Avec « faim », ça donne littéralement « I have hunger » — mais en anglais, on dit plutôt « I\u2019m hungry ».',
      en: '"J\u2019ai" comes from the verb avoir ("to have"). With "faim," it literally reads "I have hunger" — but in natural English, you\u2019d just say "I\u2019m hungry."'
    },
    gImperatif: {
      fr: '« Mange\u00A0! » est l\u2019impératif informel (tutoiement) du verbe « manger » : un ordre ou une suggestion directe. On y reviendra plus en détail bientôt.',
      en: '"Mange!" is the informal (tu-form) imperative of manger ("to eat") — a direct order or suggestion. We\u2019ll dig deeper into this soon.'
    },
    gQuoi: {
      fr: '« Quoi\u00A0? » placé juste après le verbe, comme dans « Mange quoi\u00A0? », est la façon la plus spontanée et la plus courante de demander une précision à l\u2019oral, en contexte informel.',
      en: 'Placing "quoi" ("what") right after the verb — as in "Mange quoi?" — is the most spontaneous and common way to ask for clarification out loud, in an informal setting.'
    }
  };

  const NOMS = { keb: 'Keb', bek: 'Bek' };
  const INITIALES = { keb: 'K', bek: 'B' };

  // ---------- Mots cliquables : traduction + ajout au sac ----------
  // Même mécanisme que partout ailleurs sur le site (identite-eleve.js) —
  // demande explicite de Raphaël, "le mécanisme du sac demeure partout" :
  // un clic/tap affiche la traduction, un double-clic/double-tap range le
  // mot dans le sac (pas d'ajout automatique au simple clic ici).
  //
  // TRADUCTIONS : seule fr→en est complète pour l\u2019instant (même repli
  // minimal que GRAMMAIRE ci-dessus et que menu-principal.js à sa
  // création) — à étoffer langue par langue plutôt que deviné à l\u2019avance.
  const TRADUCTIONS = {
    en: {
      'j\u2019ai': 'I have',
      'faim': 'hunger (= hungry)',
      'mange': 'eat!',
      'quoi': 'what',
      'mon': 'my',
      'sandwich': 'sandwich',
      'oh': 'oh',
      'merci': 'thank you'
    }
  };

  // 'mange' est un tutoiement (impératif informel) — seul mot informel de
  // ce dialogue à ce jour, voir gImperatif ci-dessus.
  const MOTS_INFORMELS = new Set(['mange']);
  const ETIQUETTE_INFORMEL = { fr: '(tutoiement)', en: '(informal)' };

  // 🆕 (6e échange) : textes d'interface (boutons, titres de pile) dans la
  // langue de l'apprenant — même repli minimal fr/en que GRAMMAIRE et
  // TRADUCTIONS ci-dessus (anglais par défaut pour toute autre langue).
  const INTERFACE = {
    fr: { precedent: 'Précédent', continuer: 'Continuer', terminer: 'Terminer', ceQuiAEteDit: 'Ce qui a été dit', aRetenir: 'À retenir' },
    en: { precedent: 'Back', continuer: 'Continue', terminer: 'Finish', ceQuiAEteDit: 'What was said', aRetenir: 'Good to know' }
  };

  function texteInterface(cle) {
    const dict = INTERFACE[langueActuelle()] || INTERFACE.en;
    return dict[cle] || INTERFACE.en[cle];
  }

  function traductionDeMot(mot) {
    const dico = TRADUCTIONS[langueActuelle()] || TRADUCTIONS.en;
    return dico[mot.toLowerCase()];
  }

  function motEstInformel(mot) {
    return MOTS_INFORMELS.has(mot.toLowerCase());
  }

  // Même clé que sac-a-dos.js/menu-principal.js — un seul réglage de
  // langue pour tout le site.
  function langueActuelle() {
    try { return localStorage.getItem('kebbek_langue') || 'en'; } catch (e) { return 'en'; }
  }

  function texteGrammaire(cle) {
    const dict = GRAMMAIRE[cle];
    if (!dict) return '';
    return dict[langueActuelle()] || dict.en;
  }

  // ---------- Image avec repli "pas encore prête" (même patron que
  // creerImage() dans intro-bonomes.html) ----------
  function creerImage(cheminImage) {
    const wrapper = document.createElement('div');
    wrapper.style.position = 'absolute';
    wrapper.style.inset = '0';
    const img = document.createElement('img');
    img.className = 'image-scene';
    img.src = cheminImage;
    img.alt = 'Keb et Bek';
    img.onerror = function () {
      const repli = document.createElement('div');
      repli.className = 'repli-image-manquante';
      repli.textContent = 'Image not ready yet';
      img.replaceWith(repli);
    };
    wrapper.appendChild(img);
    return wrapper;
  }

  // ---------- Image de base + sandwich greffé par-dessus, flottant avec
  // lueur (voir CSS .sandwich-greffe*). Même repli "pas encore prête" que
  // creerImage() pour les deux images. ----------
  function creerImageComposite(cheminBase, cheminSuperposition) {
    const wrapper = creerImage(cheminBase);
    const greffe = document.createElement('div');
    greffe.className = 'sandwich-greffe';
    const lueur = document.createElement('div');
    lueur.className = 'sandwich-greffe-lueur';
    const imgSandwich = document.createElement('img');
    imgSandwich.className = 'sandwich-greffe-img';
    imgSandwich.src = cheminSuperposition;
    imgSandwich.alt = 'Le sandwich';
    imgSandwich.onerror = function () { greffe.style.display = 'none'; };
    greffe.appendChild(lueur);
    greffe.appendChild(imgSandwich);
    wrapper.appendChild(greffe);
    return wrapper;
  }

  function afficherTraductionMot(span, mot) {
    document.querySelectorAll('.iden-tooltip-mot').forEach(function (t) { t.remove(); });
    const trad = traductionDeMot(mot);
    if (!trad) return; // pas de bulle vide si le mot n'est pas encore au dictionnaire
    const tip = document.createElement('span');
    tip.className = 'iden-tooltip-mot';
    let contenu = trad;
    if (motEstInformel(mot)) {
      const langue = langueActuelle();
      contenu += ' ' + (ETIQUETTE_INFORMEL[langue] || ETIQUETTE_INFORMEL.en);
    }
    tip.textContent = contenu;
    span.appendChild(tip);
  }

  // Anime un CLONE du mot qui s'envole depuis sa position réelle jusqu'à
  // #sacBouton, puis disparaît — repli silencieux si le sac est absent ou
  // masqué (même prudence que animerMotVersSac dans identite-eleve.js).
  function animerMotVersSac(span) {
    const bouton = document.getElementById('sacBouton');
    if (!bouton || getComputedStyle(bouton).display === 'none') return;
    const depart = span.getBoundingClientRect();
    const arrivee = bouton.getBoundingClientRect();
    const clone = document.createElement('span');
    clone.className = 'iden-mot-vole';
    clone.textContent = span.textContent;
    clone.style.left = depart.left + 'px';
    clone.style.top = depart.top + 'px';
    document.body.appendChild(clone);
    const dx = (arrivee.left + arrivee.width / 2) - (depart.left + depart.width / 2);
    const dy = (arrivee.top + arrivee.height / 2) - (depart.top + depart.height / 2);
    void clone.offsetWidth;
    clone.style.setProperty('--vol-dx', dx + 'px');
    clone.style.setProperty('--vol-dy', dy + 'px');
    clone.classList.add('en-vol');
    clone.addEventListener('transitionend', function () { clone.remove(); }, { once: true });
    bouton.classList.add('sac-recoit');
    setTimeout(function () { bouton.classList.remove('sac-recoit'); }, DUREE_VOL_MOT + DELAI_FERMETURE_SAC_APRES_RECEPTION);
  }

  const DUREE_VOL_MOT = 550;
  const DELAI_FERMETURE_SAC_APRES_RECEPTION = 350;
  const motsDejaAjoutes = new Set(); // un seul flash par mot par visite de la leçon

  function ajouterMotAuSac(span, mot) {
    if (typeof window.ajouterAuSac !== 'function') return; // sac-a-dos.js absent : repli silencieux
    const cle = mot.toLowerCase();
    window.ajouterAuSac('mots', { mot: cle, trad: traductionDeMot(mot) || '', informel: motEstInformel(mot) });
    animerMotVersSac(span);
    if (motsDejaAjoutes.has(cle)) return;
    motsDejaAjoutes.add(cle);
    span.classList.remove('flash-ajout');
    void span.offsetWidth;
    span.classList.add('flash-ajout');
  }

  // Découpe le texte de la bulle active en <span class="iden-mot">
  // cliquables — même logique de fusion de la ponctuation isolée
  // ("Mange\u00A0!" → un seul mot cliquable, pas un "!" à part) que
  // afficherBulle() dans identite-eleve.js.
  const PONCTUATION_SEULE = /^[.,!?;:'"«»\u2026]+$/;
  function construireBulleMots(texteBrut) {
    elBulle.innerHTML = '';
    const brutSepares = String(texteBrut).split(/\s+/).filter(Boolean);
    const mots = [];
    brutSepares.forEach(function (tok) {
      if (PONCTUATION_SEULE.test(tok) && mots.length > 0) {
        mots[mots.length - 1] += '\u00A0' + tok;
      } else {
        mots.push(tok);
      }
    });
    mots.forEach(function (motBrut, idx) {
      const span = document.createElement('span');
      span.className = 'iden-mot';
      span.textContent = motBrut + (idx < mots.length - 1 ? '\u00A0' : '');
      const motNettoye = motBrut.replace(/^[\s.,!?;:'"«»\u2026]+|[\s.,!?;:'"«»\u2026]+$/g, '');
      span.tabIndex = 0;
      span.addEventListener('click', function (e) {
        e.stopPropagation();
        afficherTraductionMot(span, motNettoye);
      });
      span.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault(); e.stopPropagation();
          afficherTraductionMot(span, motNettoye);
        }
      });
      span.addEventListener('dblclick', function (e) {
        e.stopPropagation();
        ajouterMotAuSac(span, motNettoye);
      });
      elBulle.appendChild(span);
    });
  }

  const elCompteur = document.getElementById('compteur');
  const elBulle = document.getElementById('bulleDialogue');
  const elScene = document.getElementById('sceneDialogue');
  const btnPrecedent = document.getElementById('btnPrecedent');
  const btnSuivant = document.getElementById('btnSuivant');
  const elPileDialogue = document.getElementById('pileDialogue');
  const elPileGrammaire = document.getElementById('pileGrammaire');
  const blocGrammaire = document.getElementById('blocGrammaire');

  let etape = 0;
  let reconstructionEnCours = false;
  const sequencesJouees = new Set(); // 🆕 (5e échange) : étapes dont la séquence auto a déjà joué

  function ajouterLigneDialogue(def) {
    const div = document.createElement('div');
    div.className = 'pile-item ' + def.speaker;
    div.innerHTML = '<div class="pile-avatar">' + INITIALES[def.speaker] + '</div>' +
      '<div class="pile-corps"><span class="pile-qui">' + NOMS[def.speaker] + '</span>' +
      '<div class="pile-texte">' + def.texte + '</div></div>';
    elPileDialogue.appendChild(div);
    requestAnimationFrame(() => requestAnimationFrame(() => div.classList.add('in')));
  }

  function ajouterNoteGrammaire(def) {
    if (!def.grammaire) return;
    blocGrammaire.style.display = 'block';
    const div = document.createElement('div');
    div.className = 'grammaire-item';
    div.textContent = texteGrammaire(def.grammaire);
    elPileGrammaire.appendChild(div);
    requestAnimationFrame(() => requestAnimationFrame(() => div.classList.add('in')));
  }

  function rendreEtape() {
    const def = ETAPES[etape];
    elCompteur.textContent = (etape + 1) + ' / ' + ETAPES.length;

    // Bulle unique — remplacée, jamais empilée. Mots cliquables (voir
    // construireBulleMots) : clic/tap = traduction, double-clic/double-tap
    // = ajout au sac — même mécanisme que partout ailleurs sur le site.
    elBulle.classList.remove('in');
    elBulle.className = 'bulle-dialogue cote-' + def.speaker;
    construireBulleMots(def.texte);
    requestAnimationFrame(() => requestAnimationFrame(() => elBulle.classList.add('in')));

    // Scène — une image par étape (repli gracieux tant que l'art n'existe
    // pas encore, voir creerImage()).
    elScene.innerHTML = '';
    elScene.appendChild(creerImage(def.img));

    if (!reconstructionEnCours) {
      ajouterLigneDialogue(def);
      ajouterNoteGrammaire(def);
    }

    btnPrecedent.disabled = (etape === 0);
    btnSuivant.textContent = (etape === ETAPES.length - 1)
      ? texteInterface('terminer') + ' \u203a'
      : texteInterface('continuer') + ' \u203a';
  }

  // ---------- Séquence automatique (b→c→d) — exception ponctuelle pour
  // l'étape "Ton sandwich ?" (voir commentaire sur ETAPES), pas un patron
  // réutilisé ailleurs. Enchaîne les images avec un léger fondu, SANS
  // attendre de clic, pendant que la navigation est désactivée pour éviter
  // qu'un clic mal placé saute une étape ou casse l'état. ----------
  function jouerSequenceAuto(chemins, auTermine) {
    let i = 0;
    function etapeSuivante() {
      if (i >= chemins.length) {
        auTermine();
        return;
      }
      const item = chemins[i];
      const nouveau = (typeof item === 'string')
        ? creerImage(item)
        : creerImageComposite(item.img, item.superposition);
      nouveau.style.opacity = '0';
      nouveau.style.transition = 'opacity 0.55s ease'; /* 🆕 (5e échange) : plus lent qu'avant */
      elScene.innerHTML = '';
      elScene.appendChild(nouveau);
      requestAnimationFrame(() => requestAnimationFrame(() => { nouveau.style.opacity = '1'; }));
      i++;
      setTimeout(etapeSuivante, 1700); /* 🆕 (5e échange) : 1000 → 1700 ms */
    }
    etapeSuivante();
  }

  function suivant() {
    if (etape < ETAPES.length - 1) {
      const def = ETAPES[etape];
      // 🆕 (5e échange) : la séquence s'arrête maintenant à 5d — elle ne
      // fait PLUS avancer automatiquement jusqu'à l'étape 6. Une fois
      // jouée, sequencesJouees empêche de la rejouer : le clic Continuer
      // suivant se comporte alors comme une avance normale vers l'étape 6.
      if (def.sequenceAuto && !sequencesJouees.has(etape)) {
        btnPrecedent.disabled = true;
        btnSuivant.disabled = true;
        elScene.removeEventListener('click', suivant);
        jouerSequenceAuto(def.sequenceAuto, function () {
          sequencesJouees.add(etape);
          btnPrecedent.disabled = (etape === 0);
          btnSuivant.disabled = false;
          elScene.addEventListener('click', suivant);
        });
        return;
      }
      etape++;
      rendreEtape();
    } else {
      terminerLecon();
    }
  }

  function precedent() {
    if (etape === 0) return;
    etape--;
    if (ETAPES[etape].sequenceAuto) sequencesJouees.delete(etape); // 🆕 rejoue si on repasse par ici
    // Reconstruit les deux piles depuis le début plutôt que de retirer
    // juste le dernier élément — même stratégie que precedent() dans
    // intro-bonomes.html : plus simple et sans risque de désynchronisation
    // entre la pile de dialogue et la pile de grammaire.
    elPileDialogue.innerHTML = '';
    elPileGrammaire.innerHTML = '';
    blocGrammaire.style.display = 'none';
    reconstructionEnCours = true;
    for (let i = 0; i <= etape; i++) {
      ajouterLigneDialogue(ETAPES[i]);
      ajouterNoteGrammaire(ETAPES[i]);
    }
    elPileDialogue.querySelectorAll('.pile-item').forEach(el => el.classList.add('in'));
    elPileGrammaire.querySelectorAll('.grammaire-item').forEach(el => el.classList.add('in'));
    rendreEtape(); // 🆕 (6e échange) : appelé AVANT de repasser reconstructionEnCours à false
    reconstructionEnCours = false; // sinon rendreEtape() ci-dessus rajoute une 2e fois la ligne courante
  }

  // Fin de la leçon — enregistre la progression réelle (voir
  // marquer_chapitre_complete côté Supabase) puis retour au parcours.
  // ⚠️ N'attribue PAS encore de P$/PB (voir note en tête de fichier) —
  // en attente d'un montant/une logique confirmés par Raphaël.
  let leconTerminee = false;
  async function terminerLecon() {
    if (leconTerminee) return;
    leconTerminee = true;
    btnSuivant.disabled = true;
    btnSuivant.textContent = 'Enregistrement…';
    try {
      await KebBekProgression.marquerChapitreComplete('d1');
    } catch (e) {
      console.warn('dialogue-d1.html : impossible d\u2019enregistrer la fin du dialogue.', e);
    }
    // Récompense (5 P$, une seule fois) — appel séparé et best-effort,
    // voir note en tête de fichier : n'affecte jamais l'enregistrement de
    // la progression elle-même si la RPC n'existe pas encore côté Supabase.
    try {
      await KebBekProgression.attribuerRecompensePremiereFois('d1', 5, 0);
    } catch (e) {
      console.warn('dialogue-d1.html : impossible d\u2019attribuer la récompense (RPC pas encore créée ?).', e);
    }
    window.location.href = 'parcours.html';
  }

  btnSuivant.addEventListener('click', suivant);
  btnPrecedent.addEventListener('click', precedent);

  // Tap direct sur la scène = avancer seulement (reculer reste un geste
  // délibéré via le bouton, voir note en tête de fichier).
  elScene.addEventListener('click', suivant);

  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); suivant(); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); precedent(); }
  });

  // Textes d'interface dans la langue de l'apprenant — voir INTERFACE plus
  // haut. rendreEtape() gère déjà btnSuivant (Continuer/Terminer varie par
  // étape) ; ceux-ci sont fixes, donc réglés une seule fois ici.
  btnPrecedent.textContent = '\u2039 ' + texteInterface('precedent');
  document.getElementById('titrePileDialogue').textContent = texteInterface('ceQuiAEteDit');
  document.getElementById('titrePileGrammaire').textContent = texteInterface('aRetenir');

  rendreEtape();
</script>

</body>
