    if (niveau === 'difficile') {
      exercicesResolusDifficile.add(ex.id);
      if (sansErreur) exercicesResolusSansErreurDifficile.add(ex.id);
      // 🆕 Condition « quatre exercices en mode difficile » — demandé
      // par Raphaël (session du 13-08-2026) comme deuxième condition
      // de déblocage de « Le sandwich de Ginette » (voir
      // bravo-mecanique-synthese_v7.md, section 17). Contrairement à
      // avant, le facile seul ne suffit plus : il faut le difficile
      // sur les quatre exercices.
      if (exercicesResolusDifficile.size === EXERCICES.length) {
        afficherRemarqueDifficile();
        // 🐛 CORRIGÉ : attend restaurationSessionPromesse avant d'écrire —
        // même raison que toucherSandwich(). IIFE async car ce bloc n'est
        // pas lui-même dans une fonction async (marquerCarteResolue).
        (async function () {
          await restaurationSessionPromesse;
          if (window.KebBekProgression && window.KebBekProgression.marquerConditionComplete) {
            window.KebBekProgression.marquerConditionComplete('d1_exercices_completes')
              .catch(function (err) { console.warn('dialogue-d1.html : marquerConditionComplete (exercices difficiles) a échoué.', err); });
          }
        })();
      }
    }
    verifierRecompensesExercices();
  }

  // 🆕 Récompenses P$/PB pour la section exercices (confirmé par
  // Raphaël, session du 13-08-2026) — TROIS paliers indépendants,
  // chacun attribué au plus une fois par élève (idempotence côté
  // serveur via attribuer_recompense_premiere_fois, une clé distincte
  // par palier) :
  //   1. d1_exercices_base            : les 4 exercices résolus, peu
  //      importe le niveau ou le nombre d'essais → 5 P$
  //   2. d1_exercices_parfait         : les 4 résolus SANS AUCUNE
  //      erreur (premier essai correct), peu importe le niveau → +5 P$
  //   3. d1_exercices_parfait_difficile : les 4 résolus sans erreur ET
  //      spécifiquement en mode difficile → +1 PB
  // Total maximal : 10 P$ + 1 PB. Remplace l'ancien câblage qui donnait
  // 5 P$ (clé 'd1') au simple clic sur « Terminer », sans vérifier que
  // les exercices avaient été faits — voir terminerLecon(), qui ne gère
  // plus que marquerChapitreComplete (déblocage du parcours), une
  // notion distincte de la monnaie.
  // ✅ Vérifié sur Supabase (projet Bravo, 13-08-2026) : p_chapitre_id
  // est un TEXT libre, clé de recompenses_chapitre_attribuees (PK
  // composite eleve_id+chapitre_id) — n'importe quelle chaîne convient
  // comme clé d'idempotence, une par palier.
  // 🐛 CORRIGÉ (13-08-2026) : même angle mort que le bug #1 (animation de
  // fin de chapitre) — cette fonction animait sur la seule foi de l'état
  // LOCAL (exercicesResolus etc., un Set qui repart à zéro à chaque
  // chargement), sans jamais regarder si le serveur avait réellement
  // accordé un gain neuf. Résultat : un "Revoir" où l'élève referait les
  // exercices parfaitement rejouerait l'animation "+10 P$ · +1 PB" (et
  // gonflerait le solde affiché par la mise à jour optimiste plus bas),
  // alors que attribuer_recompense_premiere_fois refuse silencieusement
  // (on conflict do nothing) puisque ces paliers étaient déjà donnés.
  // Le drapeau local recompensesExercicesDonnees reste utile pour éviter
  // de rappeler la RPC en boucle une fois un palier atteint DANS ce même
  // passage, mais l'animation, elle, attend maintenant la confirmation
  // serveur (true = gain neuf) avant de se déclencher.
  async function verifierRecompensesExercices() {
    const attributions = [];
    if (!recompensesExercicesDonnees.base && exercicesResolus.size === EXERCICES.length) {
      recompensesExercicesDonnees.base = true;
      attributions.push(attribuerRecompenseExercice('d1_exercices_base', 5, 0).then(function (accorde) {
        return accorde ? { piasses: 5, pointsBonis: 0 } : null;
      }));
    }
    if (!recompensesExercicesDonnees.parfait && exercicesResolusSansErreur.size === EXERCICES.length) {
      recompensesExercicesDonnees.parfait = true;
      attributions.push(attribuerRecompenseExercice('d1_exercices_parfait', 5, 0).then(function (accorde) {
        return accorde ? { piasses: 5, pointsBonis: 0 } : null;
      }));
    }
    if (!recompensesExercicesDonnees.parfaitDifficile && exercicesResolusSansErreurDifficile.size === EXERCICES.length) {
      recompensesExercicesDonnees.parfaitDifficile = true;
      attributions.push(attribuerRecompenseExercice('d1_exercices_parfait_difficile', 0, 1).then(function (accorde) {
        return accorde ? { piasses: 0, pointsBonis: 1 } : null;
      }));
    }
    if (attributions.length === 0) return;

    const resultats = await Promise.all(attributions);
    let piassesGagnees = 0;
    let pointsBonisGagnes = 0;
    resultats.forEach(function (r) {
      if (!r) return; // palier déjà donné avant (confirmé par le serveur) : pas de gain réel, pas d'animation
      piassesGagnees += r.piasses;
      pointsBonisGagnes += r.pointsBonis;
    });
    if (piassesGagnees > 0 || pointsBonisGagnes > 0) {
      afficherRecompenseEtEnvoyerAuSac(piassesGagnees, pointsBonisGagnes);
    }
  }

  // 🆕 Badge "+X P$ · +X PB" qui apparaît près du bouton Terminer puis
  // s'envole vers #sacBouton — demande de Raphaël (session du
  // 13-08-2026) : que l'apprenant voie clairement combien il vient de
  // gagner et que ces points rejoignent visuellement le sac. Repli
  // silencieux si le sac est absent/masqué, même prudence
  // qu'animerMotVersSac (identité du mécanisme sur tout le site).
  function afficherRecompenseEtEnvoyerAuSac(piasses, pointsBonis) {
    const bouton = document.getElementById('sacBouton');
    if (!bouton || getComputedStyle(bouton).display === 'none') return;

    const morceaux = [];
    if (piasses > 0) morceaux.push('+' + piasses + ' P$');
    if (pointsBonis > 0) morceaux.push('+' + pointsBonis + ' PB');
    if (morceaux.length === 0) return;

    // Ancré juste au-dessus du bouton Terminer (visible dès qu'un palier
    // se débloque, puisque ça n'arrive qu'une fois les 4 exercices
    // traités, moment où ce bouton est déjà à l'écran).
    const ancre = btnTerminerExercices.getBoundingClientRect();
    const toast = document.createElement('div');
    toast.className = 'recompense-toast';
    toast.textContent = morceaux.join(' \u00b7 ');
    toast.style.top = (ancre.top - 54) + 'px';
    document.body.appendChild(toast);
    requestAnimationFrame(function () { toast.classList.add('montre'); });

    setTimeout(function () {
      const depart = toast.getBoundingClientRect();
      const arrivee = bouton.getBoundingClientRect();
      const dx = (arrivee.left + arrivee.width / 2) - (depart.left + depart.width / 2);
      const dy = (arrivee.top + arrivee.height / 2) - (depart.top + depart.height / 2);
      toast.style.setProperty('--vol-dx', dx + 'px');
      toast.style.setProperty('--vol-dy', dy + 'px');
      toast.classList.add('en-vol');
      toast.addEventListener('transitionend', function () { toast.remove(); }, { once: true });
      bouton.classList.add('sac-recoit');
      setTimeout(function () {
        bouton.classList.remove('sac-recoit');
        // Mise à jour optimiste de l'affichage du solde déjà présent
        // dans le panneau du sac (#sacSoldePiasses/#sacSoldePointsBonis)
        // — le gain est de toute façon déjà écrit sur Supabase via
        // attribuerRecompenseExercice/attribuerRecompensePremiereFois ;
        // ceci évite juste d'attendre une réouverture du panneau pour
        // voir le nouveau total. Repli silencieux si ces champs
        // n'existent pas encore ou ne contiennent pas encore un nombre
        // (sac-a-dos.js pas encore initialisé).
        const elPiasses = document.getElementById('sacSoldePiasses');
        const elPointsBonis = document.getElementById('sacSoldePointsBonis');
        if (elPiasses && piasses > 0) {
          const actuel = parseInt(elPiasses.textContent, 10);
          if (!isNaN(actuel)) elPiasses.textContent = String(actuel + piasses);
        }
        if (elPointsBonis && pointsBonis > 0) {
          const actuel = parseInt(elPointsBonis.textContent, 10);
          if (!isNaN(actuel)) elPointsBonis.textContent = String(actuel + pointsBonis);
        }
      }, DELAI_FERMETURE_SAC_APRES_RECEPTION);
    }, DUREE_AFFICHAGE_RECOMPENSE);
  }

  const DUREE_AFFICHAGE_RECOMPENSE = 900; // le badge reste lisible avant de s'envoler

  // 🐛 CORRIGÉ : attend restaurationSessionPromesse (voir tout en haut
  // du fichier) avant d'écrire — même raison que toucherSandwich().
  // 🐛 CORRIGÉ (13-08-2026) : renvoie maintenant le booléen du serveur
  // (true = gain neuf réellement accordé, false = palier déjà donné
  // avant) au lieu de l'avaler — verifierRecompensesExercices() en a
  // besoin pour ne pas animer un gain qui n'a pas eu lieu. En cas
  // d'erreur réseau/RPC, on renvoie false par prudence : mieux vaut ne
  // pas animer un gain qu'on n'est pas sûr d'avoir écrit.
  async function attribuerRecompenseExercice(cle, piasses, pointsBonis) {
    if (!window.KebBekProgression || !window.KebBekProgression.attribuerRecompensePremiereFois) return false;
    await restaurationSessionPromesse;
    try {
      return await window.KebBekProgression.attribuerRecompensePremiereFois(cle, piasses, pointsBonis);
    } catch (err) {
      console.warn('dialogue-d1.html : attribuerRecompensePremiereFois(' + cle + ') a échoué.', err);
      return false;
    }
  }

  function afficherRemarqueDifficile() {
    if (elRemarqueDifficile.dataset.affichee === '1') return; // une seule fois
    elRemarqueDifficile.dataset.affichee = '1';
    elRemarqueDifficile.textContent = texteInterface('remarqueQuatreDifficile');
    elRemarqueDifficile.style.display = 'block';
    elRemarqueDifficile.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  // ---------- Mode difficile : réponse libre, correction progressive ----------
  function creerZoneDifficile(ex, carte) {
    const wrapper = document.createElement('div');
    wrapper.style.display = 'flex';
    wrapper.style.flexDirection = 'column';
    wrapper.style.gap = '10px';

    const chips = document.createElement('div');
    chips.className = 'exercice-chips';
    chips.style.display = 'none';
    wrapper.appendChild(chips);

    const champ = document.createElement('input');
    champ.type = 'text';
    champ.className = 'exercice-champ';
    champ.placeholder = texteInterface('placeholderReponse');
    champ.autocomplete = 'off';
    champ.autocapitalize = 'off';
    champ.spellcheck = false;

    // 🆕 (14-08-2026, quatrième vague) : voir annoncerReponseEnCours plus
    // bas — permet au prof d'accompagner l'élève en direct sur cet
    // exercice précis (mode difficile = production écrite libre).
    champ.addEventListener('input', function () { annoncerReponseEnCours(ex.id, champ.value); });

    const ligneAction = document.createElement('div');
    ligneAction.className = 'exercice-ligne-action';
    const btnVerifier = document.createElement('button');
    btnVerifier.type = 'button';
    btnVerifier.className = 'exercice-btn-verifier';
    btnVerifier.textContent = texteInterface('boutonVerifier');
    ligneAction.appendChild(champ);
    ligneAction.appendChild(btnVerifier);
    wrapper.appendChild(ligneAction);

    const feedback = document.createElement('div');
    feedback.className = 'exercice-feedback';
    wrapper.appendChild(feedback);

    let essais = 0;
    let motsAcquis = []; // mots déjà confirmés lors d'un essai précédent

    function verifier() {
      const saisieComplete = motsAcquis.join(' ') + (motsAcquis.length ? ' ' : '') + champ.value;
      essais++;

      // 🆕 Teste la saisie contre chaque réponse acceptée (principale +
      // alternatives, voir reponsesAcceptees). Dès qu'une correspond
      // entièrement, c'est gagné. Sinon, on garde pour la suite (chips
      // de progrès) la réponse qui a le mieux avancé — utile si l'élève
      // commence à taper une alternative valable (ex. "le sandwich")
      // plutôt que la réponse principale : son progrès n'est pas perdu.
      let meilleurResultat = null;
      let meilleureReponse = ex.reponse;
      reponsesAcceptees(ex).forEach(function (reponseCandidate) {
        const resultat = evaluerReponseExercice(reponseCandidate, saisieComplete);
        if (resultat.correct) { meilleurResultat = resultat; meilleureReponse = reponseCandidate; }
      });

      if (meilleurResultat && meilleurResultat.correct) {
        champ.value = meilleureReponse.join(' ');
        champ.classList.remove('fautive');
        champ.classList.add('correcte');
        champ.disabled = true;
        btnVerifier.disabled = true;
        feedback.className = 'exercice-feedback correct';
        feedback.textContent = texteInterface('feedbackCorrect');
        marquerCarteResolue(carte, ex, 'difficile', essais === 1);
        return;
      }

      // Aucune réponse acceptée n'est encore complète : le progrès
      // partiel (chips) reste calculé sur la réponse PRINCIPALE
      // uniquement (jamais une alternative) — sinon les chips affichés
      // pourraient mélanger des mots de deux formulations différentes,
      // en désaccord avec le texte "La réponse était : ..." plus bas,
      // qui montre toujours ex.reponse.
      const resultatPrincipal = evaluerReponseExercice(ex.reponse, saisieComplete);
      motsAcquis = ex.reponse.slice(0, resultatPrincipal.indexErreur);
      chips.innerHTML = '';
      motsAcquis.forEach(function (mot) {
        const chip = document.createElement('span');
        chip.className = 'exercice-chip';
        chip.textContent = mot;
        chips.appendChild(chip);
      });
      chips.style.display = motsAcquis.length ? 'flex' : 'none';
      champ.value = '';
      champ.classList.add('fautive');

      if (essais >= 2) {
        champ.disabled = true;
        btnVerifier.disabled = true;
        feedback.className = 'exercice-feedback revele';
        feedback.textContent = texteInterface('reponseEtait') + ' ' + ex.reponse.join(' ');
        const chipsFinal = ex.reponse.slice(motsAcquis.length);
        chipsFinal.forEach(function (mot) {
          const chip = document.createElement('span');
          chip.className = 'exercice-chip';
          chip.textContent = mot;
          chips.appendChild(chip);
        });
        chips.style.display = 'flex';
        marquerCarteResolue(carte, ex, 'difficile', false);
      } else {
        feedback.className = 'exercice-feedback presque';
        feedback.textContent = motsAcquis.length ? texteInterface('feedbackPresque') : '';
        champ.focus();
      }
    }

    btnVerifier.addEventListener('click', verifier);
    champ.addEventListener('keydown', function (e) { if (e.key === 'Enter') verifier(); });

    return wrapper;
  }

  // ---------- Mode facile : mots fournis, à remettre en ordre ----------
  // 🆕 (session du 13-08-2026, demande de Raphaël) : en plus des tuiles,
  // l'élève peut maintenant basculer vers une saisie manuelle — même
  // champ/bouton que le mode difficile (classes .exercice-champ/
  // .exercice-btn-verifier réutilisées telles quelles), mais avec la
  // correction "tout ou rien" du mode facile (comparaison à la phrase
  // entière, PAS la correction progressive mot à mot du mode difficile
  // — voir evaluerReponseExercice, réservée à creerZoneDifficile) :
  // rester fidèle à l'esprit "facile" même en tapant. Le compteur
  // d'essais (2 avant révélation) est PARTAGÉ entre les deux méthodes de
  // saisie — un élève qui rate une fois aux tuiles puis bascule vers le
  // clavier n'obtient pas un essai supplémentaire gratuit. La bascule
  // elle-même se désactive une fois l'exercice résolu ou révélé, comme
  // le reste de la carte.
  function creerZoneFacile(ex, carte) {
    const wrapper = document.createElement('div');
    wrapper.style.display = 'flex';
    wrapper.style.flexDirection = 'column';
    wrapper.style.gap = '10px';

    const phraseConstruite = document.createElement('div');
    phraseConstruite.className = 'exercice-phrase-construite';

    const banque = document.createElement('div');
    banque.className = 'exercice-banque-mots';

    const zoneTuiles = document.createElement('div');
    zoneTuiles.style.display = 'flex';
    zoneTuiles.style.flexDirection = 'column';
    zoneTuiles.style.gap = '10px';
    zoneTuiles.appendChild(phraseConstruite);
    zoneTuiles.appendChild(banque);

    // ---------- Zone saisie manuelle (repliée par défaut) ----------
    const champ = document.createElement('input');
    champ.type = 'text';
    champ.className = 'exercice-champ';
    champ.placeholder = texteInterface('placeholderReponse');
    champ.autocomplete = 'off';
    champ.autocapitalize = 'off';
    champ.spellcheck = false;

    // 🆕 (14-08-2026, quatrième vague) : même branchement que la zone
    // difficile — voir annoncerReponseEnCours. Ce champ n'est visible que
    // si l'élève a basculé vers la saisie manuelle (modeSaisie === 'texte'),
    // mais l'écouteur peut rester posé inconditionnellement : aucun 'input'
    // ne peut se déclencher tant que le champ est caché/non focusé.
    champ.addEventListener('input', function () { annoncerReponseEnCours(ex.id, champ.value); });

    const btnVerifierTexte = document.createElement('button');
    btnVerifierTexte.type = 'button';
    btnVerifierTexte.className = 'exercice-btn-verifier';
    btnVerifierTexte.textContent = texteInterface('boutonVerifier');

    const ligneActionTexte = document.createElement('div');
    ligneActionTexte.className = 'exercice-ligne-action';
    ligneActionTexte.appendChild(champ);
    ligneActionTexte.appendChild(btnVerifierTexte);

    const zoneTexte = document.createElement('div');
    zoneTexte.style.display = 'none';
    zoneTexte.appendChild(ligneActionTexte);

    const lienBascule = document.createElement('button');
    lienBascule.type = 'button';
    lienBascule.className = 'exercice-lien-bascule';

    const feedback = document.createElement('div');
    feedback.className = 'exercice-feedback';

    const btnRecommencer = document.createElement('button');
    btnRecommencer.type = 'button';
    btnRecommencer.className = 'exercice-btn-recommencer';
    btnRecommencer.textContent = texteInterface('boutonRecommencer');
    btnRecommencer.style.display = 'none';
    btnRecommencer.style.alignSelf = 'flex-start';

    let essais = 0;
    let modeSaisie = 'tuiles'; // 'tuiles' | 'texte'
    let resolu = false; // correct OU révélé — gèle les deux méthodes de saisie
    // reponseChoisie contient des { mot, index } — index se référant à
    // motsMelanges, pour permettre de retirer précisément un mot cliqué
    // par erreur (utile depuis l'ajout des distracteurs, sinon un seul
    // clic sur un leurre forçait un recommencement complet).
    let reponseChoisie = [];
    // 🆕 banqueFacile (optionnel) : mode « choix multiple » — chaque
    // entrée est une phrase complète, un seul clic suffit (nbAChoisir
    // = 1), au lieu du mode habituel de remise en ordre mot par mot.
    // La bonne entrée doit correspondre exactement à ex.reponse.join(' ').
    const nbAChoisir = ex.banqueFacile ? 1 : ex.reponse.length;
    const motsDisponibles = ex.banqueFacile ? ex.banqueFacile.slice() : ex.reponse.concat(ex.distracteurs || []);
    let motsMelanges = melangerMots(motsDisponibles);

    function metAJourLienBascule() {
      lienBascule.textContent = texteInterface(modeSaisie === 'tuiles' ? 'basculerVersTexte' : 'basculerVersTuiles');
    }

    function basculerModeSaisie() {
      modeSaisie = modeSaisie === 'tuiles' ? 'texte' : 'tuiles';
      zoneTuiles.style.display = modeSaisie === 'tuiles' ? 'flex' : 'none';
      zoneTexte.style.display = modeSaisie === 'texte' ? 'block' : 'none';
      metAJourLienBascule();
      if (modeSaisie === 'texte') { champ.value = ''; champ.classList.remove('fautive', 'correcte'); champ.focus(); }
    }
    lienBascule.addEventListener('click', basculerModeSaisie);

    function rendreBanque() {
      banque.innerHTML = '';
      motsMelanges.forEach(function (mot, i) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'exercice-mot-btn';
        btn.textContent = mot;
        btn.dataset.indexMot = i;
        if (reponseChoisie.some(function (item) { return item.index === i; })) {
          btn.classList.add('utilise');
        }
        btn.addEventListener('click', function () {
          if (btn.classList.contains('utilise')) return;
          if (reponseChoisie.length >= nbAChoisir) return;
          btn.classList.add('utilise');
          reponseChoisie.push({ mot: mot, index: i });
          rendrePhraseConstruite();
          if (reponseChoisie.length === nbAChoisir) {
            verifier(reponseChoisie.map(function (item) { return item.mot; }).join(' '));
          }
        });
        banque.appendChild(btn);
      });
    }

    function rendrePhraseConstruite() {
      phraseConstruite.innerHTML = '';
      reponseChoisie.forEach(function (item) {
        const chip = document.createElement('span');
        chip.className = 'exercice-chip exercice-chip-amovible';
        chip.textContent = item.mot;
        chip.title = texteInterface('boutonRecommencer');
        chip.addEventListener('click', function () {
          if (resolu) return;
          // Retirer ce mot précis (et non tout recommencer) — remet le
          // bouton correspondant dans la banque.
          reponseChoisie = reponseChoisie.filter(function (autre) { return autre.index !== item.index; });
          const btnCorrespondant = banque.querySelector('[data-index-mot="' + item.index + '"]');
          if (btnCorrespondant) btnCorrespondant.classList.remove('utilise');
          feedback.textContent = '';
          feedback.className = 'exercice-feedback';
          rendrePhraseConstruite();
        });
        phraseConstruite.appendChild(chip);
      });
    }

    function reinitialiser() {
      reponseChoisie = [];
      motsMelanges = melangerMots(motsDisponibles);
      champ.value = '';
      champ.classList.remove('fautive', 'correcte');
      feedback.textContent = '';
      feedback.className = 'exercice-feedback';
      btnRecommencer.style.display = 'none';
      rendreBanque();
      rendrePhraseConstruite();
    }

    // 🆕 Cœur commun aux deux méthodes de saisie — reçoit la phrase déjà
    // assemblée (jointe par des espaces), qu'elle vienne des tuiles
    // cliquées ou du champ texte. Correction "tout ou rien", identique
    // à l'ancien verifierFacile() : c'est ce qui distingue ce mode du
    // mode difficile (progressif, voir creerZoneDifficile), même quand
    // la saisie se fait maintenant au clavier ici aussi.
    function verifier(texteBrutChoisi) {
      if (resolu) return;
      essais++;
      const texteChoisi = texteBrutChoisi.trim().toLowerCase();
      const correct = reponsesAcceptees(ex).some(function (reponseCandidate) {
        return texteChoisi === reponseCandidate.join(' ').toLowerCase();
      });
      if (correct) {
        resolu = true;
        feedback.className = 'exercice-feedback correct';
        feedback.textContent = texteInterface('feedbackCorrect');
        champ.value = ex.reponse.join(' ');
        champ.classList.remove('fautive');
        champ.classList.add('correcte');
        champ.disabled = true;
        btnVerifierTexte.disabled = true;
        lienBascule.style.display = 'none';
        marquerCarteResolue(carte, ex, 'facile', essais === 1);
        return;
      }
      if (essais >= 2) {
        resolu = true;
        feedback.className = 'exercice-feedback revele';
        feedback.textContent = texteInterface('reponseEtait') + ' ' + ex.reponse.join(' ');
        reponseChoisie = ex.reponse.map(function (mot) { return { mot: mot, index: -1 }; });
        rendrePhraseConstruite();
        champ.value = ex.reponse.join(' ');
        champ.classList.remove('fautive');
        champ.disabled = true;
        btnVerifierTexte.disabled = true;
        lienBascule.style.display = 'none';
        marquerCarteResolue(carte, ex, 'facile', false);
      } else {
        feedback.className = 'exercice-feedback presque';
        feedback.textContent = texteInterface('feedbackPresque');
        champ.classList.add('fautive');
        btnRecommencer.style.display = 'inline-block';
      }
    }

    btnVerifierTexte.addEventListener('click', function () { verifier(champ.value); });
    champ.addEventListener('keydown', function (e) { if (e.key === 'Enter') verifier(champ.value); });
    btnRecommencer.addEventListener('click', reinitialiser);

    metAJourLienBascule();
    rendreBanque();
    wrapper.appendChild(zoneTuiles);
    wrapper.appendChild(zoneTexte);
    wrapper.appendChild(lienBascule);
    wrapper.appendChild(feedback);
    wrapper.appendChild(btnRecommencer);
    return wrapper;
  }

  function melangerMots(mots) {
    const copie = mots.slice();
    for (let i = copie.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = copie[i]; copie[i] = copie[j]; copie[j] = tmp;
    }
    // Un ordre différent de l'ordre correct dès que possible, pour ne
    // pas donner la réponse gratuitement quand elle tient en 2-3 mots.
    if (copie.length > 1 && copie.join(' ') === mots.join(' ')) {
      const tmp = copie[0]; copie[0] = copie[1]; copie[1] = tmp;
    }
    return copie;
  }

  btnTerminerExercices.addEventListener('click', terminerLecon);


  async function terminerLecon() {
    if (leconTerminee) return;
    leconTerminee = true;
    btnSuivant.disabled = true;
    btnSuivant.textContent = 'Enregistrement…';
    try {
      // 🐛 CORRIGÉ : attend restaurationSessionPromesse (voir tout en
      // haut du fichier) avant d'écrire — même raison que
      // toucherSandwich(). C'est ici le point le plus critique : sans ce
      // await, un élève connecté qui termine vite pourrait voir tout le
      // chapitre 'd1' marqué complété en mode invité (localStorage) au
      // lieu de son compte.
      await restaurationSessionPromesse;
      await KebBekProgression.marquerChapitreComplete('d1');
    } catch (e) {
      console.warn('dialogue-d1.html : impossible d\u2019enregistrer la fin du dialogue.', e);
    }
    // 🐛 CORRIGÉ (retour Raphaël, session du 13-08-2026) : la récompense
    // 5 P$ était donnée ici, au simple clic sur « Terminer », SANS
    // vérifier que les exercices avaient été faits. Le nouveau système
    // à trois paliers (voir verifierRecompensesExercices, déclenché
    // depuis marquerCarteResolue à chaque exercice résolu) exige belle
    // et bien la complétion réelle des 4 exercices — ce bouton ne gère
    // donc plus que marquerChapitreComplete (déblocage du parcours),
    // une notion distincte de la monnaie P$/PB.
    // 🐛 CORRIGÉ (retour Raphaël, capture 404) : cette ligne écrivait
    // 'parcours.html' — un chemin RELATIF au dossier courant
    // (francais/dialogues/d1/), donc résolu vers .../d1/parcours.html,
    // qui n'a jamais existé → 404. Le vrai parcours.html vit deux
    // dossiers plus haut (francais/parcours.html) — exactement comme le
    // lien retour tout en haut du fichier (voir <a class="retour"
    // href="../../parcours.html">). Même chemin relatif ici.
    window.location.href = '../../parcours.html';
  }

  btnSuivant.addEventListener('click', suivant);
  btnPrecedent.addEventListener('click', precedent);

  // Tap direct sur la scène = avancer seulement (reculer reste un geste
  // délibéré via le bouton, voir note en tête de fichier).
  elScene.addEventListener('click', suivant);

  window.addEventListener('keydown', (e) => {
    // 🐛 CORRIGÉ (retour Raphaël) : ce raccourci global captait aussi la
    // barre espace tapée DANS un champ de réponse d'exercice (texte à
    // trous, etc.), ce qui appelait suivant() à chaque espace et effaçait
    // la réponse en cours en ramenant l'apprenant en haut de l'étape. On
    // ignore désormais le raccourci si le focus est sur un champ de
    // saisie (input / textarea / contenteditable).
    const cible = e.target;
    const dansChampSaisie = cible && (
      cible.tagName === 'INPUT' ||
      cible.tagName === 'TEXTAREA' ||
      cible.isContentEditable
    );
    if (dansChampSaisie) return;
    if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); suivant(); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); precedent(); }
  });

  // Textes d'interface dans la langue de l'apprenant — voir INTERFACE plus
  // haut. rendreEtape() gère déjà btnSuivant (Continuer/Terminer varie par
  // étape) ; ceux-ci sont fixes, donc réglés une seule fois ici.
  btnPrecedent.textContent = '\u2039 ' + texteInterface('precedent');
  document.getElementById('titrePileDialogue').textContent = texteInterface('ceQuiAEteDit');
  document.getElementById('titrePileGrammaire').textContent = texteInterface('aRetenir');

  // 🆕 Bouton global "Afficher/Cacher la traduction" (demande de Raphaël).
  // Force TOUTES les répliques déjà dans la pile à l'état choisi, et
  // devient le réglage par défaut pour les prochaines répliques ajoutées
  // — un clic individuel sur un avatar/texte reste possible ensuite pour
  // consulter une seule phrase sans toucher à ce réglage global.
  const btnToggleTraductions = document.getElementById('btnToggleTraductions');
  const txtToggleTraductions = document.getElementById('txtToggleTraductions');
  function metAJourBoutonToggleTraductions() {
    txtToggleTraductions.textContent = texteInterface(traductionsVisiblesParDefaut ? 'cacherTrad' : 'afficherTrad');
    btnToggleTraductions.setAttribute('aria-pressed', String(traductionsVisiblesParDefaut));
    btnToggleTraductions.classList.toggle('actif', traductionsVisiblesParDefaut);
  }
  btnToggleTraductions.addEventListener('click', () => {
    traductionsVisiblesParDefaut = !traductionsVisiblesParDefaut;
    elPileDialogue.querySelectorAll('.pile-trad').forEach(el => el.classList.toggle('visible', traductionsVisiblesParDefaut));
    metAJourBoutonToggleTraductions();
  });
  metAJourBoutonToggleTraductions();

  // ================================================================
  // Session en direct (session-classe.js, 14-08-2026) — voir sa propre
  // note de tête pour le modèle général. Deux rôles possibles sur CETTE
  // page, jamais mélangés :
  //   - Prof : ce navigateur fait déjà tourner une session (créée depuis
  //     le panneau Mode professeur, voir professeur.js) — synchroniserEtatSession()
  //     pousse alors l'état à chaque rendreEtape()/afficherExercices(),
  //     en plus de tout ce que ces fonctions faisaient déjà. Totalement
  //     silencieux si ce n'est pas le cas (sessionProfActive() → null).
  //   - Élève : rejoint une session par code via le petit bandeau plus
  //     haut dans le HTML — sa propre navigation est alors désactivée
  //     tant que controle === 'professeur' (voir syncControleBloque, lu
  //     par suivant()/precedent()/allerAuxExercices() plus haut), et
  //     suit les états poussés par le prof via allerAEtapeDistante().
  // ================================================================

  let syncControleBloque = false; // true seulement côté élève, tant que controle === 'professeur'

  // 🆕 (14-08-2026, quatrième vague — "voir ce que l'élève écrit") : dernier
  // etat de NAVIGATION poussé par synchroniserEtatSession ({page, section,
  // etape}) — mémorisé pour que annoncerReponseEnCours() puisse s'y greffer
  // sans l'écraser (chaque appel à annoncerActivite REMPLACE tout l'etat
  // Presence, voir sa note dans session-classe.js — jamais une fusion
  // automatique côté serveur).
  let dernierEtatSession = null;
  let minuteurReponseEnCours = null;

  // 🆕 (correctif du 14-08-2026, "élève catapulté") : signale au widget
  // flottant (widget-session-prof.js, chargé sur TOUTES les pages) que
  // CETTE page gère elle-même son propre "etat.page" (voir
  // synchroniserEtatSession juste en dessous) — le widget ne doit donc
  // JAMAIS le remettre à null ici, contrairement à parcours.html/
  // index.html où son absence signale au widget qu'il doit le faire lui-
  // même. Posé de façon inconditionnelle (avant même de savoir si CE
  // navigateur est prof ou élève) : c'est un identifiant de PAGE, pas un
  // état de session — le widget ne s'en sert de toute façon que sur le
  // navigateur du prof.
  window.KebBekPageEnDirect = 'dialogues/d1/';

  function synchroniserEtatSession(etatAPousser) {
    const sessionClasse = window.KebBekSessionClasse || null;
    if (!sessionClasse) return;
    dernierEtatSession = etatAPousser;
    // 🆕 (14-08-2026, troisième vague) : annonce l'activité LOCALE à ce
    // même point d'appel, que ce navigateur soit prof ou élève — sans
    // effet si aucune session n'a été rejointe (voir sa propre note dans
    // session-classe.js). C'est ce qui alimente "Élèves connectés" dans le
    // widget flottant du prof.
    sessionClasse.annoncerActivite(etatAPousser);
    const sessionProf = sessionClasse.sessionProfActive();
    if (!sessionProf) return; // ce navigateur n'est pas en train d'animer une session — rien à faire
    sessionClasse.pousserEtat(sessionProf.id, etatAPousser); // best-effort, résultat ignoré volontairement
  }

  // 🆕 (14-08-2026, quatrième vague) : "accompagner dans les exercices
  // écrits" — annonce la saisie EN COURS d'un élève dans un champ texte
  // libre (mode difficile, ou mode facile basculé en saisie manuelle),
  // pour que le prof puisse la voir dans son widget et intervenir avant
  // même que l'élève clique "Vérifier". Débit volontairement limité
  // (300 ms après la dernière frappe, pas à chaque touche) — Presence
  // reste léger, et un prof n'a pas besoin de voir chaque lettre tapée
  // pour aider. Se greffe sur dernierEtatSession (page/section/etape déjà
  // connus) plutôt que de le remplacer — voir sa note.
  function annoncerReponseEnCours(exerciceId, texte) {
    const sessionClasse = window.KebBekSessionClasse || null;
    if (!sessionClasse) return;
    clearTimeout(minuteurReponseEnCours);
    minuteurReponseEnCours = setTimeout(function () {
      sessionClasse.annoncerActivite(Object.assign({}, dernierEtatSession, {
        exercice_id: exerciceId,
        reponse_en_cours: texte
      }));
    }, 300);
  }

  // Amène l'élève directement à l'étape indexCible du dialogue, en
  // reconstruisant les piles depuis le début — même stratégie que
  // precedent() (voir sa note), généralisée à un index arbitraire plutôt
  // qu'un simple décrément. Si les exercices étaient déjà affichés (rare
  // — seulement si le prof recule après coup), on revient d'abord à
  // l'écran de dialogue.
  function allerAEtapeDistante(indexCible) {
    if (typeof indexCible !== 'number' || indexCible < 0 || indexCible >= ETAPES.length) return;
    if (animationEnCours) return;
    if (elSectionExercices.style.display === 'flex') {
      elSectionExercices.style.display = 'none';
      document.querySelector('.zone-bulle').style.display = '';
      document.getElementById('sceneDialogue').style.display = '';
      document.querySelector('.nav-dialogue').style.display = '';
      document.getElementById('btnRaccourciExercices').style.display = '';
      document.getElementById('compteur').style.display = '';
    } else if (indexCible === etape) {
      return; // déjà à la bonne étape, rien à refaire
    }
    etape = indexCible;
    elPileDialogue.innerHTML = '';
    elPileGrammaire.innerHTML = '';
    blocGrammaire.style.display = 'none';
    reconstructionEnCours = true;
    for (let i = 0; i <= etape; i++) {
      ajouterLigneDialogue(ETAPES[i]);
      ajouterNoteGrammaire(ETAPES[i]);
    }
    elPileDialogue.querySelectorAll('.pile-item').forEach(el => el.classList.add('in'));
    elPileGrammaire.querySelectorAll('.grammaire-item').forEach(el => el.classList.add('in'));
    rendreEtape();
    reconstructionEnCours = false;
  }

  (function initSessionEleve() {
    const sessionClasse = window.KebBekSessionClasse || null;
    const elInvite = document.getElementById('kbbSessionInvite');
    const elActif = document.getElementById('kbbSessionActif');
    const champCode = document.getElementById('kbbSessionCode');
    const btnRejoindre = document.getElementById('kbbSessionBtnRejoindre');
    const btnQuitter = document.getElementById('kbbSessionBtnQuitter');
    const statutTexte = document.getElementById('kbbSessionStatutTexte');
    const message = document.getElementById('kbbSessionMessage');

    if (!sessionClasse) { document.getElementById('kbbSession').style.display = 'none'; return; }

    // Si CE navigateur anime déjà une session comme prof, le bandeau
    // "rejoindre" n'a pas sa place ici (le prof navigue directement dans
    // la leçon, il ne suit pas son propre direct) — voir synchroniserEtatSession
    // plus haut, qui gère déjà son cas séparément.
    if (sessionClasse.sessionProfActive()) {
      document.getElementById('kbbSession').style.display = 'none';
      return;
    }

    // 🆕 Chemin canonique de CETTE page — même valeur que "page" poussé
    // par synchroniserEtatSession() plus haut, et que parcours.html
    // (NIVEAUX → d1 → page). Sert seulement à détecter un DÉCALAGE (le
    // prof a changé de leçon pendant que l'élève était encore ici) —
    // pas encore utile tant qu'une seule leçon existe, mais correct dès
    // qu'une deuxième apparaîtra plutôt que de laisser un élève bloqué
    // sur d1 pendant que le prof anime d2 ailleurs.
    const CHEMIN_CETTE_PAGE = window.KebBekPageEnDirect; // même valeur que 'dialogues/d1/' déclarée juste plus haut — une seule source

    function appliquerEtat(session) {
      // Le prof a poussé un état pour une AUTRE page — suit-le plutôt
      // que d'essayer d'appliquer un état de dialogue qui ne concerne
      // pas cette leçon. MAIS seulement quand controle === 'professeur' :
      // sinon, un élève qui a la main (controle === 'eleves') et qui
      // clique "‹" pour sortir vers parcours.html se ferait ramener ici
      // de force à sa prochaine mise à jour d'état — alors qu'il a
      // justement le droit de naviguer librement dans ce mode. Le champ
      // etat.page ne change pas automatiquement quand le contrôle
      // bascule (voir session-classe.js) : il reste égal à la dernière
      // page poussée par le prof, même après qu'il ait rendu la main —
      // donc sans ce garde-fou, "eleves" + ancien etat.page = élève
      // piégé, quelle que soit la page qu'il essaie de rejoindre.
      if (session.controle === 'professeur' && session.etat && session.etat.page && session.etat.page !== CHEMIN_CETTE_PAGE) {
        window.location.href = session.etat.page;
        return;
      }
      statutTexte.textContent = (session.controle === 'professeur')
        ? '\u25CF En direct \u2014 tu suis le prof'
        : '\u25CF En direct \u2014 \u00e0 toi de jouer !';
      syncControleBloque = (session.controle === 'professeur');
      if (session.controle !== 'professeur') return; // en mode "élèves", ne jamais forcer d'étape/section non plus — il navigue lui-même
      if (session.etat && session.etat.section === 'exercices') {
        if (elSectionExercices.style.display !== 'flex') afficherExercices();
      } else if (session.etat && session.etat.section === 'dialogue' && typeof session.etat.etape === 'number') {
        allerAEtapeDistante(session.etat.etape);
      }
    }

    // 🆕 Reprise automatique (14-08-2026, deuxième vague) — si l'élève
    // avait déjà rejoint une session ailleurs (ex. bandeau de
    // parcours.html) et navigue ici (soit par un clic normal, soit
    // amené automatiquement par le "page" ci-dessus depuis une AUTRE
    // page), la session reprend sans redemander le code. Résout aussi
    // la question de Raphaël "est-ce que quitter la leçon fait perdre
    // le contrôle ?" pour CETTE page — voir session-classe.js pour le
    // mécanisme (localStorage, symétrique du côté prof).
    sessionClasse.reprendreSessionEleve({
      onEtat: appliquerEtat,
      onFermee: function () {
        syncControleBloque = false;
        elActif.classList.add('kbb-session-cachee');
        elInvite.classList.remove('kbb-session-cachee');
        message.textContent = 'Session termin\u00e9e \u2014 tu peux continuer par toi-m\u00eame.';
        message.style.color = 'var(--brun)';
      },
      onErreur: function () { /* rien à afficher — reprise silencieuse, aucun code n'a été tapé ici */ }
    }).then(function (reussi) {
      if (reussi) {
        elInvite.classList.add('kbb-session-cachee');
        elActif.classList.remove('kbb-session-cachee');
      }
    });

    btnRejoindre.addEventListener('click', async function () {
      const code = champCode.value.trim();
      if (!code) return;
      btnRejoindre.disabled = true;
      message.textContent = '';
      const reussi = await sessionClasse.rejoindreSession(code, {
        onEtat: appliquerEtat,
        onFermee: function () {
          syncControleBloque = false;
          elActif.classList.add('kbb-session-cachee');
          elInvite.classList.remove('kbb-session-cachee');
          message.textContent = 'Session termin\u00e9e \u2014 tu peux continuer par toi-m\u00eame.';
          message.style.color = 'var(--brun)';
        },
        onErreur: function () {
          message.textContent = 'Code invalide ou session ferm\u00e9e \u2014 v\u00e9rifie avec ton prof.';
          message.style.color = '#b0402c';
        }
      });
      btnRejoindre.disabled = false;
      if (reussi) {
        elInvite.classList.add('kbb-session-cachee');
        elActif.classList.remove('kbb-session-cachee');
        message.textContent = '';
      }
    });

    champCode.addEventListener('keydown', function (e) { if (e.key === 'Enter') btnRejoindre.click(); });

    btnQuitter.addEventListener('click', function () {
      sessionClasse.quitterSession();
      syncControleBloque = false;
      elActif.classList.add('kbb-session-cachee');
      elInvite.classList.remove('kbb-session-cachee');
      message.textContent = '';
      champCode.value = '';
    });
  })();

  rendreEtape();
</script>
