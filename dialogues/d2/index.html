<style>
  /* ==================================================================
     dialogue-d2.html — DEUXIÈME leçon de dialogue du site (id 'd2'
     dans NIVEAUX, parcours.html), suite directe de d1 (même sandwich).
     Contenu confirmé par Raphaël (session du 15-08-2026) :
       Bek « Alors, comment est le sandwich ? »
       Keb « Il est bon. »       Bek « Bon ? »
       Keb « Oui... ? »          Bek « Juste... bon ? »
       Keb « Euh... il est délicieux ! »
     Échange volontairement court (demande explicite de Raphaël) : pour
     un tout début en français, un échange bref et compréhensible sans
     effort met en confiance — ce n'est pas un manque, c'est le but.
     Malgré la brièveté, plusieurs mots nouveaux par rapport à d1
     (comment / le / est / bon / euh), d'où GRAMMAIRE ci-dessous.

     MÉCANIQUE (demande explicite de Raphaël, à distinguer clairement de
     intro-bonomes.html même si l'ossature en est reprise) — DEUX choses
     bien séparées, chacune avec sa propre logique d'accumulation/retrait :

       1. La bulle du haut (#bulleDialogue) : UNE SEULE réplique visible à
          la fois, au-dessus des personnages, remplacée à chaque étape —
          jamais empilée. Défilement par flèches clavier, clic/tap sur les
          boutons Précédent/Suivant, OU tap direct sur la scène (avance
          seulement — reculer reste un geste délibéré via le bouton, pour
          éviter un retour accidentel qui ferait disparaître des lignes
          déjà accumulées).

       2. DEUX piles indépendantes en dessous, qui s'accumulent en avançant
          ET SE VIDENT PARTIELLEMENT en reculant (reconstruites depuis le
          début à chaque navigation — même stratégie que precedent() dans
          intro-bonomes.html, plus simple et plus sûre qu'un simple
          "retirer le dernier élément" quand deux piles doivent rester
          synchronisées avec la même étape courante) :
            a) #pileDialogue  : chaque réplique déjà dite, dans l'ordre.
            b) #pileGrammaire : les notes grammaticales, dans la langue de
               l'apprenant (voir GRAMMAIRE plus bas) — n'apparaît QUE pour
               les étapes qui en ont une (ici : étapes 1 et 2 seulement,
               voir ETAPES). Visuellement distincte de la pile de dialogue
               (fond pêche-pâle, même langage que .sac-intro/.iden-indice-mot
               ailleurs sur le site — un contenu "aide/explication", pas
               une réplique du dialogue lui-même).

     GENRE (masculin/féminin) : « le » et « un » sont ici présentés
     UNIQUEMENT comme deux déterminants masculins (voir GRAMMAIRE,
     gCommentEstLe) — le féminin (« la », « une ») n'est ni enseigné ni
     nommé à ce stade, demande explicite de Raphaël, cohérent avec d1.
     Le SAC À DOS, lui, continue d'afficher le genre grammatical des
     noms qu'on y ajoute (voir GENRE_NOMS/ARTICLE_NOMS plus bas) — outil
     de référence séparé, pas un enseignement actif dans le dialogue.

     IMAGES : aucune illustration propre à cette leçon n'existe encore.
     Noms de fichiers ci-dessous sont TEMPORAIRES (convention établie
     avec Raphaël, session du 15-08-2026) — c'est lui qui fournira les
     noms définitifs une fois les images prêtes, à mettre à jour dans
     ETAPES/EXERCICES ci-dessous. Même repli "Image not ready yet" que
     intro-bonomes.html/dialogue-d1.html (creerImage) en attendant — la
     mécanique fonctionne dès maintenant, sans dépendre des images.

     RÉCOMPENSES : confirmé par Raphaël (session du 13-08-2026, remplace
     la version à plat du 09-08-2026) — trois paliers indépendants liés
     à la section EXERCICES (pas au simple clic sur « Terminer ») :
       1. Les 4 exercices résolus, peu importe le niveau ou le nombre
          d'essais            → 5 P$ (une seule fois)
       2. Les 4 résolus SANS AUCUNE erreur (1er essai correct chacun),
          peu importe le niveau → +5 P$ (une seule fois)
       3. Les 4 résolus sans erreur ET en mode difficile spécifiquement
          → +1 PB (une seule fois)
     Total maximal : 10 P$ + 1 PB. Voir verifierRecompensesExercices()
     et attribuerRecompenseExercice() plus bas — appelées depuis
     marquerCarteResolue() à chaque exercice résolu, best-effort via
     KebBekProgression.attribuerRecompensePremiereFois(cle, piasses,
     pointsBonis), une clé distincte par palier (d2_exercices_base /
     d2_exercices_parfait / d2_exercices_parfait_difficile). VÉRIFIÉ
     directement sur Supabase (projet Bravo, session du 13-08-2026, via
     le connecteur) : attribuer_recompense_premiere_fois(p_eleve_id uuid,
     p_chapitre_id text, p_piasses int, p_points_bonis int) existe bien ;
     p_chapitre_id est un TEXT libre (aucune contrainte vers une table
     chapitres), utilisé comme clé de recompenses_chapitre_attribuees
     dont la PK composite est (eleve_id, chapitre_id) — donc n'importe
     quelle chaîne fonctionne comme clé d'idempotence, une par palier.
     ================================================================== */

  :root {
    --fond: #F2EDE3;
    --brun: #665045;
    --brun-fonce: #4A3B33;
    --peche: #F0A98B;
    --peche-fonce: #E08867;
    --peche-pale: #FBEAE2;
    --bek-couleur: #C97B3D;
    --keb-couleur: #5B7FA6;
    --ombre: rgba(102, 80, 69, 0.16);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: var(--fond);
  }

  body {
    font-family: 'Baloo 2', 'Noto Sans', sans-serif;
    color: var(--brun-fonce);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 60px;
  }

  /* ---------- Retour vers le parcours ---------- */
  .retour {
    position: fixed;
    top: 20px;
    left: 20px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #FFFFFF;
    color: var(--brun);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
    text-decoration: none;
    box-shadow: 0 2px 8px var(--ombre);
    opacity: 0.85;
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index: 20;
  }
  .retour:hover { opacity: 1; transform: scale(1.08); }

  .compteur {
    font-weight: 700;
    font-size: 0.9rem;
    color: var(--brun);
    opacity: 0.75;
    margin-bottom: 14px;
    letter-spacing: 0.02em;
  }

  /* ---------- Légende unique, au-dessus des personnages ---------- */
  /* 🆕 (session du 08-08-2026, 2e échange) : Raphaël ne veut PAS l'habillage
     "bulle de BD" (encadré + pointe triangulaire vers le personnage) —
     juste du texte présenté comme dans intro-bonomes.html (.legende-intro :
     encadré doux coloré selon le personnage, SANS pointe). Donc même boîte
     que .legende-intro, mais SANS le ::after qui existait ici avant. Le
     positionnement au-dessus des personnages, lui, reste : la légende vit
     simplement AVANT l'image dans le flux normal du document (pas de
     superposition en absolute), donc "au-dessus" sans jamais rien
     recouvrir — c'est cette partie-là qui n'a pas changé. */
  /* 🆕 (session du 08-08-2026, 3e échange) : les répliques flottaient trop
     loin au-dessus des têtes — les images sources ont une bonne marge vide
     en haut/en bas du cadre, donc même juste avant la scène dans le flux,
     l'écart visuel restait grand. Deux correctifs : la légende est décalée
     vers l'intérieur (padding sur .zone-bulle) plutôt que collée à
     l'extrême bord, ET l'image est légèrement zoomée/recadrée (voir
     .scene-dialogue overflow:hidden + transform sur .image-scene plus bas)
     pour réduire cette marge vide et rapprocher visuellement les têtes du
     haut du cadre. */
  .zone-bulle {
    display: flex;
    width: min(92vw, 560px);
    min-height: 60px;
    align-items: flex-end;
    gap: 8px;
    padding: 0 5%;
  }

  /* ---------- Session en direct (session-classe.js, 14-08-2026) ---------- */
  .kbb-session {
    width: min(92vw, 400px);
    margin-bottom: 10px;
    font-family: 'Baloo 2', sans-serif;
  }
  .kbb-session-cachee { display: none !important; }

  .kbb-session-invite {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .kbb-session-etiquette {
    font-weight: 700;
    font-size: 0.78rem;
    color: var(--brun);
    opacity: 0.75;
  }
  .kbb-session-ligne { display: flex; gap: 6px; flex: 1; min-width: 160px; }
  .kbb-session-champ {
    font-family: inherit;
    font-size: 0.82rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    border: 1.5px solid var(--peche);
    border-radius: 10px;
    padding: 6px 9px;
    background: #FFFFFF;
    color: var(--brun-fonce);
    width: 90px;
  }
  .kbb-session-champ:focus { outline: 2px solid var(--peche-fonce); outline-offset: 1px; }
  .kbb-session-bouton, .kbb-session-bouton-quitter {
    font-family: inherit;
    font-weight: 700;
    font-size: 0.78rem;
    border: none;
    border-radius: 999px;
    padding: 7px 14px;
    cursor: pointer;
  }
  .kbb-session-bouton { background: var(--peche-fonce); color: #FFFFFF; }
  .kbb-session-bouton:hover:not(:disabled) { opacity: 0.88; }
  .kbb-session-bouton:disabled { opacity: 0.55; cursor: default; }
  .kbb-session-bouton-quitter {
    background: transparent;
    border: 1.5px solid var(--peche);
    color: var(--brun);
  }
  .kbb-session-bouton-quitter:hover { background: var(--peche-pale, rgba(240, 169, 139, 0.16)); }

  .kbb-session-actif {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: var(--peche-pale, rgba(240, 169, 139, 0.16));
    border-radius: 12px;
    padding: 8px 12px;
  }
  .kbb-session-statut { font-weight: 700; font-size: 0.82rem; color: var(--brun-fonce); }

  .kbb-session-message {
    margin: 4px 0 0;
    font-size: 0.75rem;
    color: #b0402c;
    min-height: 1em;

  /* 🆕 (15-08-2026) même liste que le bandeau de parcours.html (voir
     .bse-liste-sessions/.bse-session-pill là-bas) — reprise ici avec les
     classes kbb- pour rester cohérente avec le reste de ce bandeau-ci. */
  }
  .kbb-session-liste {
    width: 100%;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 6px;
  }
  .kbb-session-pastille {
    font-family: inherit;
    font-weight: 700;
    font-size: 0.76rem;
    border: 1.5px solid var(--peche);
    border-radius: 999px;
    padding: 6px 13px;
    background: #FFFFFF;
    color: var(--brun-fonce);
    cursor: pointer;
  }
  .kbb-session-pastille:hover:not(:disabled) { background: var(--peche-pale, rgba(240, 169, 139, 0.16)); }
  .kbb-session-pastille:disabled { opacity: 0.55; cursor: default; }

  .bulle-dialogue {
    position: relative;
    max-width: 82%;
    font-weight: 700;
    font-size: clamp(1.05rem, 3vw, 1.35rem);
    line-height: 1.35;
    padding: 12px 20px;
    background: #FFFFFF;
    border-radius: 18px;
    box-shadow: 0 4px 14px var(--ombre);
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.3s ease, transform 0.3s ease;
  }
  .bulle-dialogue.in { opacity: 1; transform: translateY(0); }
  /* 🆕 (15-08-2026) : étape silencieuse d'ouverture (ETAPES[0]) — pas de
     bulle du tout, plutôt qu'une bulle vide qui prendrait quand même sa
     place dans la mise en page. */
  .bulle-dialogue.bulle-vide { display: none; }
  /* 🆕 (15-08-2026) : le bouton audio de la bulle n'a rien à lire pendant
     l'étape silencieuse — inutile de le laisser visible (même si audio-actif
     est activé) pour un clic qui ne ferait rien. */
  .zone-bulle:has(.bulle-vide) .bouton-audio-bulle { display: none; }

  .bulle-dialogue.cote-keb { margin-right: auto; text-align: left; border: 2.5px solid var(--keb-couleur); color: var(--keb-couleur); }
  .bulle-dialogue.cote-bek { margin-left: auto; text-align: right; border: 2.5px solid var(--bek-couleur); color: var(--bek-couleur); }
  /* Pas de pointe triangulaire (::after) ici — c'était le seul élément qui
     faisait "bulle de BD" plutôt que simple texte encadré ; retiré à la
     demande de Raphaël. cote-keb reste aligné à gauche, décalé du bord par
     le padding de .zone-bulle plutôt que flush à 0. */

  /* ---------- Scène (personnages) ---------- */
  .scene-dialogue {
    position: relative;
    width: min(92vw, 560px);
    aspect-ratio: 1408 / 768;
    overflow: hidden; /* 🆕 nécessaire pour que le zoom ci-dessous recadre au lieu de déborder */
    margin-top: 4px;
  }

  .scene-dialogue img.image-scene {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    transform: none; /* 🆕 (6e échange) : le zoom coupait la queue de cheval de Bek — annulé, priorité à ne jamais rogner les personnages */
    -webkit-mask-image: radial-gradient(ellipse 94% 90% at center, #000 74%, transparent 100%);
    mask-image: radial-gradient(ellipse 94% 90% at center, #000 74%, transparent 100%);
  }

  /* ---------- Sandwich greffé (étape "Ton sandwich ?", dernier temps de
     la séquence auto) — flotte doucement avec une lueur chaude pulsante
     autour, à l'emplacement de l'étoile déjà présente dans l'image de
     base. Voir creerImageComposite(). ---------- */
  .sandwich-greffe {
    position: absolute;
    left: 52.7%;
    top: 37%;
    width: 19%;
    transform: translate(-50%, -50%);
    animation: sandwichFlotte 2.6s ease-in-out infinite;
  }
  .sandwich-greffe-lueur {
    position: absolute;
    inset: -35%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 209, 128, 0.65) 0%, rgba(255, 209, 128, 0) 72%);
    animation: sandwichLueur 2.6s ease-in-out infinite;
    z-index: 0;
  }
  .sandwich-greffe-img {
    position: relative;
    z-index: 1;
    width: 100%;
    display: block;
    filter: drop-shadow(0 6px 12px rgba(120, 80, 40, 0.35));
  }
  @keyframes sandwichFlotte {
    0%, 100% { transform: translate(-50%, -50%); }
    50% { transform: translate(-50%, calc(-50% - 9px)); }
  }
  @keyframes sandwichLueur {
    0%, 100% { opacity: 0.75; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.1); }
  }

  .repli-image-manquante {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
    font-weight: 700;
    font-size: 0.95rem;
    color: var(--peche-fonce);
    opacity: 0.75;
  }

  /* ---------- Navigation ---------- */
  .nav-dialogue {
    display: flex;
    gap: 12px;
    margin-top: 18px;
  }

  .bouton-nav {
    font-family: inherit;
    font-weight: 700;
    font-size: 0.95rem;
    border-radius: 999px;
    padding: 10px 26px;
    cursor: pointer;
    transition: transform 0.12s ease, box-shadow 0.12s ease, opacity 0.15s ease;
  }
  .bouton-nav:disabled { opacity: 0.4; cursor: not-allowed; }

  .bouton-nav.suivant { border: none; background: var(--peche-fonce); color: #FFFFFF; box-shadow: 0 4px 0 #B5623F; }
  .bouton-nav.suivant:hover:not(:disabled) { transform: translateY(2px); box-shadow: 0 2px 0 #B5623F; }
  .bouton-nav.suivant:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 #B5623F; }

  .bouton-nav.precedent { background: #FFFFFF; color: var(--brun); border: 1.5px solid var(--brun); }
  .bouton-nav.precedent:hover:not(:disabled) { background: var(--fond); }

  /* ---------- 🆕 Raccourci "passer aux exercices" (demande de Raphaël) ----------
     Placé dans le flux normal du document, SOUS la rangée de boutons
     Précédent/Continuer — jamais en position fixe/flottante — pour ne
     jamais risquer de chevaucher #sacBouton (coin fixe, voir
     sac-a-dos.css), quelle que soit sa position exacte. Discret
     (texte souligné en pointillés) pour ne pas concurrencer visuellement
     le bouton "Continuer", qui reste l'action principale. */
  .raccourci-exercices {
    display: block;
    margin: 10px auto 0;
    background: none;
    border: none;
    font-family: inherit;
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--brun-clair, #8A7364);
    text-decoration: underline;
    text-decoration-style: dotted;
    text-underline-offset: 3px;
    cursor: pointer;
    padding: 4px 8px;
    opacity: 0.8;
    transition: opacity 0.15s ease, color 0.15s ease;
  }
  .raccourci-exercices:hover { opacity: 1; color: var(--peche-fonce); }

  /* ---------- Piles (dialogue + grammaire) ---------- */
  .piles-conteneur {
    width: min(92vw, 560px);
    margin-top: 26px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .pile-section-titre {
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--brun-clair, #8A7364);
    margin: 0 0 6px 4px;
  }

  /* 🆕 En-tête de "Ce qui a été dit" : titre + bouton de bascule globale
     pour la traduction phrase par phrase (demande de Raphaël — le
     mot-à-mot seul "n'est pas suffisant"). */
  .pile-entete {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin: 0 0 6px 4px;
  }
  .pile-entete .pile-section-titre { margin: 0; }
  .btn-toggle-trad {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    border: 1px solid var(--gris-verrou, #DDD2C4);
    background: #FFFFFF;
    color: var(--brun-clair, #8A7364);
    border-radius: 999px;
    padding: 3px 10px 3px 8px;
    font-family: inherit;
    font-size: 0.66rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .btn-toggle-trad:hover { background: var(--beige-doux, #F4EEE4); }
  .btn-toggle-trad svg { width: 12px; height: 12px; }
  .btn-toggle-trad.actif { background: var(--peche-fonce, #D98C63); border-color: var(--peche-fonce, #D98C63); color: #FFFFFF; }

  /* 🆕 (15-08-2026) Bouton 🔊 de la bulle active — jumeau visuel du
     bouton "traduction" mais rond, à côté de la bulle plutôt que dedans
     (voir HTML : sibling de #bulleDialogue dans .zone-bulle). Caché par
     défaut, révélé par body.audio-actif (voir btnToggleAudio). */
  .bouton-audio-bulle {
    flex-shrink: 0;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: none;
    display: none;
    align-items: center;
    justify-content: center;
    background: var(--peche-fonce, #D98C63);
    color: #FFFFFF;
    cursor: pointer;
    margin-bottom: 6px;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  .bouton-audio-bulle svg { width: 16px; height: 16px; }
  .bouton-audio-bulle:hover { transform: scale(1.08); }
  .bouton-audio-bulle:active { opacity: 0.7; transform: scale(0.96); }
  body.audio-actif .bouton-audio-bulle { display: flex; }

  .pile-dialogue { display: flex; flex-direction: column; gap: 2px; }

  .pile-item {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    max-height: 0;
    opacity: 0;
    overflow: hidden;
    transition: max-height 0.3s ease, opacity 0.3s ease, margin 0.3s ease;
  }
  .pile-item.in { opacity: 1; max-height: 220px; margin: 7px 0; overflow: visible; }

  .pile-avatar {
    flex-shrink: 0;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.72rem;
    font-weight: 700;
    color: #FFFFFF;
    background: var(--c, var(--brun));
    /* 🆕 Cliquable/touchable : révèle la traduction de CETTE réplique
       seule (en plus du bouton global). Même logique que le mot-à-mot :
       un clic/tap direct sur l'élément d'intérêt. */
    cursor: pointer;
    border: none;
    padding: 0;
    font-family: inherit;
    transition: transform 0.15s ease;
  }
  .pile-avatar:hover { transform: scale(1.08); }
  .pile-item.keb { --c: var(--keb-couleur); }
  .pile-item.bek { --c: var(--bek-couleur); }

  .pile-corps { flex: 1; min-width: 0; }
  .pile-qui { display: block; font-size: 0.68rem; font-weight: 700; color: var(--c, var(--brun)); margin-bottom: 1px; }
  .pile-texte {
    font-size: 0.92rem;
    line-height: 1.35;
    cursor: pointer;
    /* 🆕 Le texte lui-même est aussi cliquable — deuxième façon d'accéder
       à la traduction de la phrase, en plus du cercle-avatar. */
  }
  .pile-trad {
    font-size: 0.82rem;
    line-height: 1.3;
    color: var(--peche-fonce, #D98C63);
    font-style: italic;
    max-height: 0;
    opacity: 0;
    overflow: hidden;
    transition: max-height 0.25s ease, opacity 0.25s ease, margin 0.25s ease;
  }
  .pile-trad.visible { max-height: 80px; opacity: 1; margin-top: 3px; }

  /* 🆕 (15-08-2026) Bouton 🔊 par réplique de la pile — même logique
     de révélation que .bouton-audio-bulle (body.audio-actif). Discret
     (transparent, pas de fond) pour ne pas rivaliser avec pile-avatar. */
  .pile-audio {
    flex-shrink: 0;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: none;
    display: none;
    align-items: center;
    justify-content: center;
    background: transparent;
    color: var(--peche-fonce, #D98C63);
    cursor: pointer;
    padding: 0;
    font-family: inherit;
    transition: transform 0.15s ease;
  }
  .pile-audio svg { width: 14px; height: 14px; }
  .pile-audio:hover { transform: scale(1.15); }
  body.audio-actif .pile-audio { display: flex; }

  /* Notes grammaticales — même langage visuel qu'un contenu d'aide
     ponctuel ailleurs sur le site (.sac-intro dans sac-a-dos.css,
     .iden-indice-mot dans identite-eleve.css) : fond pêche-pâle, pour
     que ce ne soit jamais confondu avec une réplique du dialogue. */
  .pile-grammaire { display: flex; flex-direction: column; gap: 8px; }

  .grammaire-item {
    max-height: 0;
    opacity: 0;
    overflow: hidden;
    padding: 0 14px;
    background: var(--peche-pale);
    border-radius: 12px;
    font-size: 0.84rem;
    line-height: 1.45;
    color: var(--brun-fonce);
    transition: max-height 0.3s ease, opacity 0.3s ease, padding 0.3s ease;
  }
  .grammaire-item.in { opacity: 1; max-height: 160px; padding: 10px 14px; overflow: visible; }

  @media (max-width: 460px) {
    .bulle-dialogue { font-size: 1rem; padding: 10px 16px; }
    .bouton-nav { padding: 9px 20px; font-size: 0.88rem; }
  }

  /* ---------- Mots cliquables dans la bulle active ----------
     Repris À L'IDENTIQUE (mêmes noms de classes) du mécanisme déjà
     enseigné ailleurs sur le site (identite-eleve.css/.js) — demande
     explicite de Raphaël : "le mécanisme du sac demeure partout". Un
     clic/tap affiche la traduction (bulle .iden-tooltip-mot) ; un
     double-clic/double-tap range le mot dans le sac (vol animé vers
     #sacBouton, voir animerMotVersSac dans le script plus bas). Seule
     la pile #pileDialogue (réplique déjà passée) reste du texte inerte
     — seule la bulle ACTIVE est interactive, comme dans l'introduction. */
  .iden-mot {
    cursor: pointer;
    position: relative;
    display: inline-block;
    transition: color 0.15s ease, text-shadow 0.25s ease;
    animation: iden-lueur-mot 2.6s ease-in-out infinite;
    touch-action: manipulation; /* évite le zoom natif au double-tap, voir identite-eleve.css */
  }
  @keyframes iden-lueur-mot {
    0%, 100% { text-shadow: 0 0 0 rgba(224, 136, 103, 0); }
    50%      { text-shadow: 0 0 14px rgba(224, 136, 103, 0.5); }
  }
  .iden-mot:hover { color: var(--peche-fonce); animation: none; text-shadow: 0 0 16px rgba(224, 136, 103, 0.6); }

  @keyframes iden-flash-ajout {
    0%   { text-shadow: 0 0 0 rgba(111, 174, 94, 0); }
    30%  { color: #4C8A3E; text-shadow: 0 0 18px rgba(111, 174, 94, 0.85); }
    100% { text-shadow: 0 0 0 rgba(111, 174, 94, 0); }
  }
  .iden-mot.flash-ajout { animation: iden-flash-ajout 0.7s ease; }

  .iden-mot-vole {
    position: fixed;
    z-index: 250;
    font-weight: 700;
    font-size: 1rem;
    color: var(--peche-fonce);
    pointer-events: none;
    white-space: nowrap;
    transition: transform 0.55s cubic-bezier(.4, 0, .3, 1), opacity 0.55s ease;
    transform: translate(0, 0) scale(1);
    opacity: 1;
  }
  .iden-mot-vole.en-vol { transform: translate(var(--vol-dx), var(--vol-dy)) scale(0.3); opacity: 0; }

  /* 🆕 Récompense P$/PB à la section exercices (demande de Raphaël,
     session du 13-08-2026) : un petit badge apparaît près du bouton
     Terminer pour indiquer QUAND et COMBIEN de P$/PB viennent d'être
     gagnés (uniquement quand il y a effectivement un gain — voir
     afficherRecompenseEtEnvoyerAuSac plus bas), puis s'envole vers
     #sacBouton — même mécanique de vol que .iden-mot-vole ci-dessus,
     dans une classe séparée pour ne jamais se confondre avec le vol
     des mots. */
  .recompense-toast {
    position: fixed;
    z-index: 260;
    left: 50%;
    background: #FFFFFF;
    color: var(--peche-fonce);
    font-weight: 700;
    font-size: 0.95rem;
    padding: 10px 18px;
    border-radius: 999px;
    box-shadow: 0 4px 16px var(--ombre);
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transform: translate(-50%, 12px) scale(0.85);
    transition: transform 0.35s cubic-bezier(.34, 1.56, .64, 1), opacity 0.35s ease;
  }
  .recompense-toast.montre { opacity: 1; transform: translate(-50%, 0) scale(1); }
  .recompense-toast.en-vol {
    transition: transform 0.55s cubic-bezier(.4, 0, .3, 1), opacity 0.55s ease;
    transform: translate(var(--vol-dx), var(--vol-dy)) scale(0.3);
    opacity: 0;
  }

  .iden-tooltip-mot {
    position: absolute;
    left: 50%;
    top: calc(100% + 10px);
    transform: translateX(-50%);
    font-family: 'Baloo 2', sans-serif;
    font-size: 0.7rem;
    font-weight: 700;
    color: var(--brun-fonce);
    background: #FFFFFF;
    border: 1.5px solid var(--peche);
    border-radius: 8px;
    padding: 3px 8px;
    white-space: nowrap;
    z-index: 3;
    pointer-events: none;
  }
  .iden-tooltip-mot::after, .iden-tooltip-mot::before {
    content: '';
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    border-left: 6px solid transparent;
    border-right: 6px solid transparent;
  }
  .iden-tooltip-mot::after { bottom: 100%; border-bottom: 7px solid var(--peche); }
  .iden-tooltip-mot::before { bottom: calc(100% - 1.5px); border-bottom: 6px solid #FFFFFF; z-index: 1; }

  /* ---------- 🆕 Section exercices ---------- */
  #sectionExercices {
    width: min(92vw, 560px);
    margin: 34px 0 40px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  /* 🐛 CORRIGÉ (15-08-2026, retour Raphaël, capture d'écran "disposition
     étrange") : #sectionExercicesEcoute n'avait JAMAIS reçu l'équivalent
     de la règle #sectionExercices ci-dessus — sans largeur ni mise en page
     flex, ses enfants (.exercices-transition, #conteneurExercicesEcoute,
     les .exercice-carte) retombaient en bloc plein-largeur par défaut,
     d'où le fouillis constaté (cartes très larges, grands vides, chevau-
     chement avec le widget "Cours en direct"). Même règle, verbatim. */
  #sectionExercicesEcoute {
    width: min(92vw, 560px);
    margin: 34px 0 40px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  .exercices-transition { text-align: center; padding: 6px 8px 2px; }
  .exercices-transition-titre {
    font-family: 'Baloo 2', sans-serif;
    font-size: 1.5rem;
    font-weight: 800;
    color: var(--peche-fonce);
    margin-bottom: 6px;
  }
  .exercices-transition-intro {
    font-size: 0.88rem;
    color: var(--brun-clair, #8A7364);
    line-height: 1.4;
  }

  .exercice-carte {
    background: #FFFFFF;
    border-radius: 20px;
    box-shadow: 0 14px 36px var(--ombre);
    padding: 18px 18px 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    transition: box-shadow 0.2s ease;
  }
  .exercice-carte.resolue { box-shadow: 0 6px 18px var(--ombre); }

  .exercice-image-cadre {
    width: 100%;
    max-height: 220px;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    border-radius: 14px;
    background: var(--peche-pale);
  }
  .exercice-image-cadre img { max-width: 100%; max-height: 220px; object-fit: contain; }
  .exercice-image-cadre .repli-image-manquante {
    font-size: 0.75rem;
    color: var(--brun-clair, #8A7364);
    padding: 30px 10px;
  }

  /* 🆕 (15-08-2026) Carte d'écoute (creerCarteExercice, ex.type === 'ecoute') :
     même gabarit que .exercice-image-cadre (largeur, hauteur max, fond) pour
     que les deux types de carte restent visuellement cohérents dans la même
     grille — mais avec un gros bouton 🔊 rond au centre à la place d'une
     image. Même couleur/forme que .bouton-audio-bulle (identité visuelle du
     bouton audio sur tout le site), juste agrandi puisqu'il est ici le
     contenu principal de la carte plutôt qu'un accessoire à côté d'une bulle. */
  .exercice-audio-cadre {
    width: 100%;
    max-height: 220px;
    min-height: 130px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 10px;
    border-radius: 14px;
    background: var(--peche-pale);
  }
  /* 🆕 (15-08-2026) Étiquette visible uniquement du prof (voir
     estProfesseurConfirme, creerCarteExercice) — bordure en pointillés et
     icône 👁️ pour bien marquer visuellement "ceci n'existe pas côté
     élève", plutôt qu'un simple texte qui pourrait passer pour un élément
     normal de l'interface. */
  .exercice-phrase-prof {
    margin: 0;
    max-width: 90%;
    font-size: 0.8rem;
    font-weight: 700;
    text-align: center;
    color: var(--brun-fonce, var(--brun));
    background: #FFFFFF;
    border: 1.5px dashed var(--peche-fonce, #D98C63);
    border-radius: 10px;
    padding: 5px 10px;
  }
  .exercice-btn-ecouter {
    flex-shrink: 0;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--peche-fonce, #D98C63);
    color: #FFFFFF;
    cursor: pointer;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  .exercice-btn-ecouter svg { width: 30px; height: 30px; }
  .exercice-btn-ecouter:hover { transform: scale(1.08); }
  .exercice-btn-ecouter:active { opacity: 0.7; transform: scale(0.96); }

  .exercice-instruction {
    font-size: 1rem;
    font-weight: 700;
    color: var(--brun-fonce);
    line-height: 1.35;
  }

  /* 🆕 (retour Raphaël, 15-08-2026) : indice optionnel sous la consigne —
     discret (taille réduite, italique, teinte atténuée) pour rester une
     aide facultative, pas une seconde consigne. */
  .exercice-indice {
    font-size: 0.82rem;
    font-style: italic;
    color: var(--brun-clair, #8A7364);
    margin-top: -6px;
  }

  .exercice-niveau-toggle { display: inline-flex; align-self: flex-start; border-radius: 999px; background: var(--fond); padding: 3px; gap: 2px; }
  .exercice-niveau-btn {
    border: none;
    background: transparent;
    color: var(--brun-clair, #8A7364);
    font-family: inherit;
    font-weight: 700;
    font-size: 0.74rem;
    padding: 6px 14px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .exercice-niveau-btn.actif { background: var(--peche-fonce); color: #FFFFFF; }

  /* 🆕 Sélecteur de niveau global, au-dessus des cartes d'exercices —
     bascule tous les exercices d'un coup, sans empêcher un ajustement
     individuel ensuite (le toggle de chaque carte reste actif après). */
  .niveau-global-bloc {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    padding: 4px 0 2px;
  }
  .niveau-global-label {
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--brun-clair, #8A7364);
  }
  .niveau-global-toggle { background: #FFFFFF; border: 1.5px solid var(--peche-pale); }

  /* Champ libre — volontairement invitant : coins très arrondis, halo
     doux au focus, dans la couleur d'identité du personnage concerné. */
  .exercice-champ {
    width: 100%;
    font-family: inherit;
    font-size: 1.05rem;
    padding: 13px 16px;
    border-radius: 16px;
    border: 2px solid var(--peche-pale);
    background: var(--fond);
    color: var(--brun-fonce);
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
  }
  .exercice-champ::placeholder { color: var(--brun-clair, #8A7364); opacity: 0.65; }
  .exercice-champ:focus {
    border-color: var(--peche-fonce);
    background: #FFFFFF;
    box-shadow: 0 0 0 4px rgba(224, 136, 103, 0.18);
  }
  .exercice-champ.correcte { border-color: #6FAE7A; background: #F1FAF2; }
  .exercice-champ.fautive { border-color: #E0876A; }
  /* 🆕 Voir la note sur .exercice-chip-revele : même distinction pour le
     champ texte du mode facile, qui affiche la réponse complète après
     échec — rouge, jamais vert, pour ne jamais ressembler à une saisie
     validée. */
  .exercice-champ.revele { border-color: #b0402c; background: #FCEEEC; }

  .exercice-chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .exercice-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: #F1FAF2;
    border: 1.5px solid #BFE0C4;
    color: #3E7A49;
    border-radius: 999px;
    padding: 5px 12px;
    font-weight: 700;
    font-size: 0.92rem;
  }
  /* 🐛 CORRIGÉ (Raphaël, "la bonne réponse s'affiche en vert, comme si
     c'était validé") : .exercice-chip est vert par défaut, sans distinction
     entre un mot que l'élève a VRAIMENT tapé juste et un mot simplement
     RÉVÉLÉ après échec des deux essais — donnant l'impression que toute
     réponse finit "acceptée". Ce modificateur (ajouté seulement aux mots
     révélés, jamais aux mots acquis par l'élève — voir creerZoneDifficile/
     creerZoneFacile) les affiche en rouge à la place, pour que l'échec
     reste visible même si l'élève ne lit pas le message texte plus bas. */
  .exercice-chip-revele { background: #FCEEEC; border-color: #E3A99C; color: #b0402c; }

  .exercice-ligne-action { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .exercice-btn-verifier {
    border: none;
    background: var(--peche-fonce);
    color: #FFFFFF;
    font-family: inherit;
    font-weight: 700;
    font-size: 0.88rem;
    padding: 10px 20px;
    border-radius: 999px;
    cursor: pointer;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  .exercice-btn-verifier:hover { transform: translateY(-1px); }
  .exercice-btn-verifier:disabled { opacity: 0.5; cursor: default; transform: none; }

  .exercice-feedback { font-size: 0.86rem; font-weight: 700; min-height: 1.2em; }
  .exercice-feedback.correct { color: #3E7A49; }
  .exercice-feedback.presque { color: var(--peche-fonce); }
  .exercice-feedback.revele { color: var(--brun-clair, #8A7364); font-weight: 600; }

  /* Mode facile — mots à taper dans l'ordre */
  .exercice-banque-mots { display: flex; flex-wrap: wrap; gap: 8px; }
  .exercice-mot-btn {
    border: 1.5px solid var(--peche);
    background: #FFFFFF;
    color: var(--brun-fonce);
    font-family: inherit;
    font-weight: 700;
    font-size: 0.95rem;
    padding: 8px 16px;
    border-radius: 12px;
    cursor: pointer;
    transition: transform 0.12s ease, opacity 0.12s ease;
  }
  .exercice-mot-btn:hover { transform: translateY(-1px); }
  .exercice-mot-btn.utilise { opacity: 0.35; pointer-events: none; }
  .exercice-chip-amovible { cursor: pointer; }
  .exercice-chip-amovible:hover { background: #FDEDEA; border-color: var(--peche); }
  .exercice-phrase-construite {
    min-height: 44px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
    padding: 8px 12px;
    border-radius: 14px;
    background: var(--fond);
    border: 2px dashed var(--peche-pale);
  }
  .exercice-btn-recommencer {
    border: none;
    background: transparent;
    color: var(--brun-clair, #8A7364);
    font-family: inherit;
    font-weight: 700;
    font-size: 0.78rem;
    text-decoration: underline;
    cursor: pointer;
    padding: 4px;
  }

  /* 🆕 Lien de bascule tuiles ↔ saisie manuelle (demande de Raphaël,
     session du 13-08-2026) — même habillage discret que
     .exercice-btn-recommencer (jamais une pilule pleine : c'est une
     option annexe, pas l'action principale de la carte), aligné à
     gauche sous la banque de mots. */
  .exercice-lien-bascule {
    border: none;
    background: transparent;
    color: var(--brun-clair, #8A7364);
    font-family: inherit;
    font-weight: 700;
    font-size: 0.78rem;
    text-decoration: underline;
    cursor: pointer;
    padding: 4px;
    align-self: flex-start;
  }
  .exercice-lien-bascule:hover { color: var(--peche-fonce); }

  /* 🆕 Remarque affichée une fois les 4 exercices réussis en mode
     difficile — deuxième condition de déblocage de « Le sandwich de
     Ginette » (bravo-mecanique-synthese_v7.md, section 17). Volontairement
     sobre, dans le ton "on pratique" du reste de la section, jamais
     "bravo tu as débloqué X" — le nom de la carte n'est jamais affiché
     ici (cohérent avec la règle : réalisations jamais révélées pendant
     le cours). */
  .remarque-difficile {
    font-family: 'Patrick Hand', cursive;
    font-size: 1.05rem;
    color: #3E7A49;
    background: #F1FAF2;
    border: 1.5px dashed #BFE0C4;
    border-radius: 14px;
    padding: 12px 16px;
    text-align: center;
  }

  .bouton-terminer-exercices { align-self: center; }
</style>

<body>

<a class="retour" href="../../parcours.html" aria-label="Retour au parcours">‹</a>

<!-- Sac à dos : structure EXACTEMENT celle attendue par sac-a-dos.js/.css
     (voir index.html) — PAS l'ancien balisage SVG encore présent sur
     parcours.html (#sacTitre, .sac-avertissement, #btnAjouterTest), qui a
     divergé du CSS actuel. Visible dès le chargement (pas de
     style="display:none") : contrairement à index.html, où le sac doit

<button type="button" id="sacBouton" onclick="toggleSacADos()" aria-label="Backpack">

    <img class="sac-icone-img sac-icone-ouverte" src="../../images/accueil/index_bonomes_icone_sac_01_ouvert.webp" width="26" height="26" alt="">

</button>

<div id="sacPanneau">
  <div class="sac-entete">

    <div class="sac-sous-titre" id="sacSousTitre"></div>
  </div>
  <div class="sac-solde" id="sacSolde">
    <span class="sac-solde-item"><span class="sac-solde-valeur" id="sacSoldePiasses">0</span><span class="sac-solde-etiquette">P$</span></span>
    <span class="sac-solde-item"><span class="sac-solde-valeur" id="sacSoldePointsBonis">0</span><span class="sac-solde-etiquette">PB</span></span>

</div>
<!-- sac-a-dos.js (fichier partagé, voir sa note de tête) : chargé ici,
     avant le script de la leçon plus bas, pour que window.ajouterAuSac
     et toggleSacADos existent déjà quand un mot est touché. -->
<script src="../../sac-a-dos.js"></script>

<!-- 🆕 (14-08-2026) session-classe.js : bandeau pour un élève qui rejoint
     un cours en direct (code donné oralement par le prof). Absent de tout
     mécanisme de points/progression — purement une aide de navigation,
     voir session-classe.js. Reste discret : pas de bulle/flèches, même
     langage visuel simplifié que .kbp-carte (professeur.css) plutôt
     qu'une esthétique parallèle. -->
<div class="kbb-session" id="kbbSession">
  <div class="kbb-session-invite" id="kbbSessionInvite">

  // Notes grammaticales dans la langue de l'apprenant, dans les 19 langues

  const GRAMMAIRE = {
    gCommentEstLe: {
      fr: "« Comment » sert à demander une description ou une qualité — pas à faire un choix (contrairement à « quoi »). On dit « le » sandwich, pas « un » sandwich, parce que Bek et Keb parlent d'un sandwich précis, déjà connu des deux : celui que Bek vient de donner à Keb. « Le » et « un » sont ici deux déterminants masculins — le féminin (« la », « une ») arrivera bientôt. « Est » vient du verbe être, pour la toute première fois : Le sandwich est bon. / Il est bon.",
      en: "“Comment” (“how”) asks for a description or quality — not a choice (unlike “quoi,” “what”). We say “le” sandwich, not “un” sandwich, because Bek and Keb are talking about one specific, already-known sandwich — the one Bek just gave Keb. “Le” and “un” are both masculine here — the feminine forms (“la,” “une”) are coming soon. “Est” comes from the verb être (“to be”), for the very first time here: Le sandwich est bon. / Il est bon.",
      es: "“Comment” (“cómo”) pide una descripción o una cualidad — no una elección (a diferencia de “quoi”, “qué”). Se dice “le” sandwich, no “un” sandwich, porque Bek y Keb hablan de un sándwich concreto, ya conocido por los dos: el que Bek le acaba de dar a Keb. “Le” y “un” son aquí dos determinantes masculinos — el femenino (“la”, “une”) llegará pronto. “Est” viene del verbo être (“ser/estar”), por primera vez aquí: Le sandwich est bon. / Il est bon.",
      it: "“Comment” (“come”) chiede una descrizione o una qualità — non una scelta (a differenza di “quoi”, “cosa”). Si dice “le” sandwich, non “un” sandwich, perché Bek e Keb parlano di un panino preciso, già noto a entrambi: quello che Bek ha appena dato a Keb. “Le” e “un” sono qui due determinanti maschili — il femminile (“la”, “une”) arriverà presto. “Est” viene dal verbo être (“essere”), qui per la prima volta: Le sandwich est bon. / Il est bon.",
      pt: "“Comment” (“como”) pede uma descrição ou uma qualidade — não uma escolha (ao contrário de “quoi”, “o quê”). Diz-se “le” sandwich, não “un” sandwich, porque a Bek e o Keb falam de uma sandes precisa, já conhecida dos dois: aquela que a Bek acabou de dar ao Keb. “Le” e “un” são aqui dois determinantes masculinos — o feminino (“la”, “une”) chegará em breve. “Est” vem do verbo être (“ser/estar”), aqui pela primeira vez: Le sandwich est bon. / Il est bon.",
      ca: "“Comment” (“com”) demana una descripció o una qualitat — no una tria (a diferència de “quoi”, “què”). Es diu “le” sandwich, no “un” sandwich, perquè la Bek i en Keb parlen d'un entrepà concret, ja conegut pels dos: el que la Bek acaba de donar a en Keb. “Le” i “un” són aquí dos determinants masculins — el femení (“la”, “une”) arribarà aviat. “Est” ve del verb être (“ser/estar”), aquí per primera vegada: Le sandwich est bon. / Il est bon.",
      eo: "“Comment” (“kiel”) petas priskribon aŭ kvaliton — ne elekton (male al “quoi”, “kio”). Oni diras “le” sandviĉo, ne “un” sandviĉo, ĉar Bek kaj Keb parolas pri specifa, jam konata sandviĉo: tiu, kiun Bek ĵus donis al Keb. “Le” kaj “un” ĉi tie estas ambaŭ viraj artikoloj — la ina formo (“la”, “une”) baldaŭ venos. “Est” venas de la verbo être (“esti”), ĉi tie la unuan fojon: Le sandwich est bon. / Il est bon.",
      zh: "「comment」（怎么样）用来询问描述或性质，不是在做选择（这点跟「quoi」「什么」不同）。这里说「le」三明治而不是「un」三明治，因为 Bek 和 Keb 说的是一个具体的、双方都已经知道的三明治，就是 Bek 刚给 Keb 的那个。「le」和「un」在这里都是阳性冠词，阴性形式（「la」「une」）很快就会出现。「est」来自动词 être（是），这里是第一次出现：Le sandwich est bon. / Il est bon.",
      ja: "「comment」（どう）は説明や性質を尋ねるための言葉で、「quoi」（何）のような選択を尋ねるものではありません。「un」ではなく「le」サンドイッチと言うのは、ベックとケブが特定の、すでに知っているサンドイッチ——ベックがケブにあげたばかりのもの——について話しているからです。「le」と「un」はここでは両方とも男性形、女性形（「la」「une」）はもうすぐ出てきます。「est」は動詞 être（である）から来ていて、ここが初登場です：Le sandwich est bon. / Il est bon.",
      ko: "“comment”(“어떻게”)는 묘사나 성질을 물을 때 쓰여요, “quoi”(“무엇”)처럼 선택을 묻는 게 아니에요. “un” 대신 “le” 샌드위치라고 하는 건, 벡과 케브가 특정한, 둘 다 이미 알고 있는 샌드위치, 벡이 케브에게 방금 준 그것에 대해 말하고 있기 때문이에요. “le”와 “un”은 여기서 둘 다 남성형이에요, 여성형(“la”, “une”)은 곧 나올 거예요. “est”는 동사 être(“이다”)에서 왔고, 여기서 처음 등장해요: Le sandwich est bon. / Il est bon.",
      vi: "“Comment” (“như thế nào”) dùng để hỏi về mô tả hay tính chất, không phải để chọn lựa (khác với “quoi”, “cái gì”). Ta nói “le” sandwich, không phải “un” sandwich, vì Bek và Keb đang nói về một chiếc sandwich cụ thể, cả hai đều đã biết: chiếc mà Bek vừa đưa cho Keb. “Le” và “un” ở đây đều là mạo từ giống đực, dạng giống cái (“la”, “une”) sẽ sớm xuất hiện. “Est” đến từ động từ être (“là”), lần đầu tiên xuất hiện ở đây: Le sandwich est bon. / Il est bon.",
      ht: "“Comment” (“kijan”) sèvi pou mande yon deskripsyon oswa yon kalite, se pa yon chwa (kontrèman ak “quoi”, “kisa”). Nou di “le” sandwich, pa “un” sandwich, paske Bek ak Keb ap pale de yon sandwich espesifik, tou de deja konnen l: sandwich Bek fenk bay Keb la. “Le” ak “un” isit la se de atik maskilen, fòm feminen an (“la”, “une”) ap vini talè. “Est” soti nan vèb être (“se”), premye fwa isit la: Le sandwich est bon. / Il est bon.",
      tl: "Ang “comment” (“paano”) ay naghahanap ng paglalarawan o katangian, hindi pagpili (kaiba sa “quoi”, “ano”). Sinasabing “le” sandwich, hindi “un” sandwich, dahil pinag-uusapan nina Bek at Keb ang isang tiyak na sandwich na alam na nilang dalawa: iyong ibinigay lang ni Bek kay Keb. Ang “le” at “un” dito ay parehong panlalaking pantukoy, ang pambabae (“la”, “une”) ay darating na rin. Ang “est” ay mula sa pandiwang être (“maging”), unang beses lumitaw dito: Le sandwich est bon. / Il est bon.",
      id: "“Comment” (“bagaimana”) menanyakan deskripsi atau sifat, bukan pilihan (berbeda dari “quoi”, “apa”). Kita bilang “le” sandwich, bukan “un” sandwich, karena Bek dan Keb membicarakan satu sandwich tertentu yang sudah diketahui keduanya: yang baru saja diberikan Bek kepada Keb. “Le” dan “un” di sini sama-sama maskulin, bentuk feminin (“la”, “une”) akan segera muncul. “Est” berasal dari kata kerja être (“menjadi/adalah”), pertama kali muncul di sini: Le sandwich est bon. / Il est bon.",
      nl: "“Comment” (“hoe”) vraagt om een beschrijving of eigenschap, geen keuze (in tegenstelling tot “quoi”, “wat”). We zeggen “le” sandwich, niet “un” sandwich, omdat Bek en Keb het hebben over één specifieke, al bekende sandwich: degene die Bek net aan Keb heeft gegeven. “Le” en “un” zijn hier beide mannelijk, de vrouwelijke vorm (“la”, “une”) komt binnenkort. “Est” komt van het werkwoord être (“zijn”), hier voor het eerst: Le sandwich est bon. / Il est bon.",
      de: "“Comment” (“wie”) fragt nach einer Beschreibung oder Eigenschaft, keine Auswahl (anders als “quoi”, “was”). Man sagt “le” sandwich, nicht “un” sandwich, weil Bek und Keb über ein bestimmtes, beiden schon bekanntes Sandwich sprechen: das, was Bek Keb gerade gegeben hat. “Le” und “un” sind hier beide maskulin, die weibliche Form (“la”, “une”) kommt bald. “Est” kommt vom Verb être (“sein”), hier zum allerersten Mal: Le sandwich est bon. / Il est bon.",
      fa: "«comment» («چطور») برای پرسیدن توصیف یا ویژگی به‌کار می‌رود، نه برای انتخاب (برخلاف «quoi»، «چی»). می‌گوییم «le» ساندویچ، نه «un» ساندویچ، چون بک و کب درباره‌ی یک ساندویچ مشخص و از پیش شناخته‌شده حرف می‌زنند: همانی که بک تازه به کب داده. «le» و «un» اینجا هر دو مذکر هستند، شکل مؤنث («la»، «une») به‌زودی می‌آید. «est» از فعل être («بودن») می‌آید، اینجا برای اولین بار: Le sandwich est bon. / Il est bon.",
      sv: "“Comment” (“hur”) frågar efter en beskrivning eller egenskap, inte ett val (till skillnad från “quoi”, “vad”). Man säger “le” sandwich, inte “un” sandwich, för att Bek och Keb pratar om en specifik, redan känd smörgås: den som Bek just gav Keb. “Le” och “un” är här båda maskulina, den feminina formen (“la”, “une”) kommer snart. “Est” kommer från verbet être (“att vara”), här för allra första gången: Le sandwich est bon. / Il est bon.",
      no: "“Comment” (“hvordan”) spør etter en beskrivelse eller egenskap, ikke et valg (i motsetning til “quoi”, “hva”). Man sier “le” sandwich, ikke “un” sandwich, fordi Bek og Keb snakker om én bestemt, allerede kjent sandwich: den Bek nettopp ga Keb. “Le” og “un” er her begge hankjønn, hunkjønnsformen (“la”, “une”) kommer snart. “Est” kommer fra verbet être (“å være”), her for aller første gang: Le sandwich est bon. / Il est bon.",
      ru: "«Comment» («как») используется, чтобы спросить об описании или качестве, а не о выборе (в отличие от «quoi», «что»). Говорят «le» sandwich, а не «un» sandwich, потому что Бек и Кеб говорят об одном конкретном, уже известном обоим сэндвиче — том, который Бек только что отдала Кебу. «Le» и «un» здесь оба мужского рода, форма женского рода («la», «une») появится совсем скоро. «Est» происходит от глагола être («быть»), здесь оно встречается впервые: Le sandwich est bon. / Il est bon."
    },
    gBon: {
      fr: "« Bon » est un mot très polyvalent en français — il peut décrire à peu près n'importe quoi : une chose (Le sandwich est bon), un moment, ou même une personne et ses talents (Keb est bon, au soccer, par exemple).",
      en: "“Bon” (“good”) is a very versatile word in French — it can describe almost anything: a thing (Le sandwich est bon), a moment, or even a person and their talents (Keb est bon, at soccer, for instance).",
      es: "“Bon” (“bueno”) es una palabra muy versátil en francés: puede describir casi cualquier cosa: algo (Le sandwich est bon), un momento, o incluso a una persona y sus talentos (Keb est bon, en el fútbol, por ejemplo).",
      it: "“Bon” (“buono”) è una parola molto versatile in francese: può descrivere quasi qualsiasi cosa: un oggetto (Le sandwich est bon), un momento, o persino una persona e i suoi talenti (Keb est bon, a calcio, per esempio).",
      pt: "“Bon” (“bom”) é uma palavra muito versátil em francês: pode descrever quase tudo: uma coisa (Le sandwich est bon), um momento, ou até uma pessoa e os seus talentos (Keb est bon, no futebol, por exemplo).",
      ca: "“Bon” (“bo”) és una paraula molt versàtil en francès: pot descriure gairebé qualsevol cosa: una cosa (Le sandwich est bon), un moment, o fins i tot una persona i els seus talents (Keb est bon, al futbol, per exemple).",
      eo: "“Bon” (“bona”) estas tre multfunkcia vorto en la franca: ĝi povas priskribi preskaŭ ion ajn: aĵon (Le sandwich est bon), momenton, aŭ eĉ personon kaj ties talentojn (Keb est bon, en piedpilko, ekzemple).",
      zh: "「bon」（好）在法语里是个用途很广的词，几乎什么都可以用它来形容：一件东西（Le sandwich est bon）、一个时刻，甚至一个人和他的才能（比如 Keb est bon，指他足球踢得好）。",
      ja: "「bon」（良い）はフランス語でとても万能な単語です。ほとんど何にでも使えます。物（Le sandwich est bon）、瞬間、あるいは人とその才能にも（例えば Keb est bon で、サッカーが上手いという意味にもなります）。",
      ko: "“bon”(“좋은”)은 프랑스어에서 아주 다재다능한 단어예요. 거의 뭐든지 묘사할 수 있어요: 사물(Le sandwich est bon), 순간, 심지어 사람과 그 사람의 재능까지도요 (예를 들어 Keb est bon은 축구를 잘한다는 뜻도 돼요).",
      vi: "“Bon” (“ngon/tốt”) là một từ rất linh hoạt trong tiếng Pháp, có thể mô tả gần như bất cứ điều gì: một món đồ (Le sandwich est bon), một khoảnh khắc, hoặc thậm chí một người và tài năng của họ (ví dụ Keb est bon, giỏi đá bóng).",
      ht: "“Bon” se yon mo trè polivalan nan lang franse a — li ka dekri prèske nenpòt bagay: yon bagay (Le sandwich est bon), yon moman, oswa menm yon moun ak talan li (Keb est bon, nan foutbòl, pa egzanp).",
      tl: "Ang “bon” (“mabuti/masarap”) ay isang napaka-versatile na salita sa Pranses — puwede itong maglarawan ng halos kahit ano: isang bagay (Le sandwich est bon), isang sandali, o kahit isang tao at ang kanyang husay (Keb est bon, sa soccer, halimbawa).",
      id: "“Bon” (“enak/baik”) adalah kata yang sangat serbaguna dalam bahasa Prancis — bisa mendeskripsikan hampir apa saja: benda (Le sandwich est bon), momen, atau bahkan seseorang dan bakatnya (Keb est bon, dalam sepak bola, misalnya).",
      nl: "“Bon” (“goed/lekker”) is een heel veelzijdig woord in het Frans — het kan bijna alles beschrijven: een ding (Le sandwich est bon), een moment, of zelfs een persoon en zijn talenten (Keb est bon, in voetbal, bijvoorbeeld).",
      de: "“Bon” (“gut”) ist ein sehr vielseitiges Wort im Französischen — es kann fast alles beschreiben: eine Sache (Le sandwich est bon), einen Moment, oder sogar eine Person und ihre Talente (Keb est bon, im Fußball, zum Beispiel).",
      fa: "«bon» («خوب») در زبان فرانسه کلمه‌ای بسیار همه‌کاره است — تقریباً هر چیزی را می‌تواند توصیف کند: یک شیء (Le sandwich est bon)، یک لحظه، یا حتی یک فرد و استعدادهایش (مثلاً Keb est bon یعنی در فوتبال خوب است).",
      sv: "“Bon” (“god/bra”) är ett mycket mångsidigt ord på franska — det kan beskriva nästan vad som helst: en sak (Le sandwich est bon), ett ögonblick, eller till och med en person och dennes talanger (Keb est bon, i fotboll, till exempel).",
      no: "“Bon” (“god/bra”) er et svært allsidig ord på fransk — det kan beskrive nesten hva som helst: en ting (Le sandwich est bon), et øyeblikk, eller til og med en person og talentene deres (Keb est bon, i fotball, for eksempel).",
      ru: "«Bon» («хороший») — очень универсальное слово во французском языке: им можно описать почти всё — вещь (Le sandwich est bon), момент или даже человека и его таланты (например, Keb est bon — про футбол, в смысле «Кеб хорош»)."
    },
    gEuh: {
      fr: "« Euh » ne veut rien dire en soi — c'est un petit son qu'on utilise à l'oral pour marquer une hésitation, le temps de trouver ses mots. On l'entend partout en français parlé, même chez les gens qui parlent très bien !",
      en: "“Euh” doesn't actually mean anything — it's a small sound used out loud to mark hesitation, buying time to find one's words. You'll hear it everywhere in spoken French, even from people who speak beautifully!",
      es: "“Euh” no significa nada en sí mismo: es un pequeño sonido que se usa al hablar para marcar una duda, mientras se buscan las palabras. Se escucha por todas partes en el francés hablado, ¡incluso entre quienes hablan muy bien!",
      it: "“Euh” non significa nulla di per sé: è un piccolo suono usato a voce per segnalare un'esitazione, il tempo di trovare le parole. Lo si sente ovunque nel francese parlato, anche da chi parla benissimo!",
      pt: "“Euh” não significa nada em si — é um pequeno som usado ao falar para marcar uma hesitação, o tempo de encontrar as palavras. Ouve-se por todo o lado no francês falado, até por quem fala muito bem!",
      ca: "“Euh” no vol dir res en si mateix: és un petit so que s'utilitza en parlar per marcar una vacil·lació, el temps de trobar les paraules. Se sent per tot arreu en el francès parlat, fins i tot entre qui parla molt bé!",
      eo: "“Euh” signifas nenion per si mem — ĝi estas malgranda sono uzata parole por montri hezitadon, la tempon por trovi siajn vortojn. Oni aŭdas ĝin ĉie en parolata la franca, eĉ ĉe homoj, kiuj parolas tre bone!",
      zh: "「euh」本身没有任何意思，它只是口语中用来表示犹豫的一个小声音，为思考措辞争取时间。在口语法语里到处都能听到它，哪怕是说得非常好的人也一样！",
      ja: "「euh」自体には意味がありません。話し言葉で言葉を探す間、ためらいを示すために使う小さな音です。フランス語の会話ではどこでも聞こえます、とても上手に話す人でも使いますよ！",
      ko: "“euh”는 그 자체로 아무 뜻도 없어요, 말할 때 단어를 찾는 동안 머뭇거림을 나타내는 작은 소리예요. 프랑스어 회화에서는 어디서나 들려요, 아주 말을 잘하는 사람들도 써요!",
      vi: "“Euh” tự bản thân nó không có nghĩa gì cả, đó chỉ là một âm nhỏ dùng khi nói để đánh dấu sự ngập ngừng, tranh thủ thời gian tìm từ. Bạn sẽ nghe thấy nó khắp nơi trong tiếng Pháp nói, kể cả ở những người nói rất giỏi!",
      ht: "“Euh” pa vle di anyen an tèt li — se yon ti son moun itilize lè yo ap pale pou montre yon ezitasyon, tan pou jwenn mo yo. Ou tande l tout kote nan franse pale a, menm nan bouch moun ki pale trè byen!",
      tl: "Ang “euh” ay walang kahulugan sa sarili nito — isa itong maliit na tunog na ginagamit sa pagsasalita para ipakita ang pag-aatubili, habang naghahanap ng tamang salita. Naririnig ito kahit saan sa sinasalitang Pranses, kahit sa mga taong napakagaling magsalita!",
      id: "“Euh” sendiri tidak berarti apa-apa — ini adalah suara kecil yang digunakan saat bicara untuk menandai keraguan, memberi waktu mencari kata yang tepat. Kamu akan mendengarnya di mana-mana dalam bahasa Prancis lisan, bahkan dari orang yang berbicara dengan sangat baik!",
      nl: "“Euh” betekent op zichzelf niets — het is een klein geluidje dat je gebruikt om aarzeling te tonen terwijl je naar woorden zoekt. Je hoort het overal in gesproken Frans, zelfs bij mensen die heel goed spreken!",
      de: "“Euh” bedeutet an sich nichts — es ist ein kleiner Laut, den man beim Sprechen benutzt, um Zögern zu zeigen, während man nach Worten sucht. Man hört es überall im gesprochenen Französisch, sogar bei Leuten, die sehr gut sprechen!",
      fa: "«euh» به‌خودی‌خود هیچ معنایی ندارد — این فقط یک صدای کوچک است که هنگام صحبت‌کردن برای نشان‌دادن تردید و وقت‌گرفتن برای پیداکردن کلمات به‌کار می‌رود. آن را همه‌جا در فرانسه‌ی محاوره‌ای می‌شنوید، حتی از کسانی که خیلی خوب صحبت می‌کنند!",
      sv: "“Euh” betyder inget i sig själv — det är ett litet ljud man använder muntligt för att markera tvekan, tid att hitta sina ord. Man hör det överallt i talad franska, till och med hos dem som talar mycket bra!",
      no: "“Euh” betyr ingenting i seg selv — det er en liten lyd man bruker muntlig for å markere nøling, tid til å finne ordene sine. Du hører det overalt i talt fransk, selv hos dem som snakker svært godt!",
      ru: "«Euh» само по себе ничего не значит — это небольшой звук, который используют в устной речи, чтобы обозначить заминку, пока подбираешь слова. Его слышно повсюду в разговорном французском, даже у тех, кто говорит очень хорошо!"
    }
  };

  // 🆕 (15-08-2026) Exercices d'écoute — phase 2 du chantier demandé par
  // Raphaël, section séparée des EXERCICES ci-dessus (jamais mélangée :
  // récompenses, compteurs de réussite et affichage sont indépendants,
  // voir plus bas exercicesEcouteResolus etc.). Contrairement aux
  // EXERCICES d'image, la consigne est TOUJOURS la même (texteInterface
  // 'ecouteConsigne', voir texteExercice ci-dessous) — ce qui varie ici
  // c'est `texte`, la phrase à faire entendre, JAMAIS montrée à l'élève :
  //   - en session de classe active, c'est cette valeur que le prof doit
  //     lire à voix haute (voir synchroniserEtatSession dans
  //     afficherExercicesEcoute — poussée dès l'affichage, pas seulement
  //     à la saisie, contrairement à annoncerReponseEnCours) ;
  //   - en solo, c'est elle que lireAudio() (phase 1) synthétise au clic
  //     sur le bouton 🔊 de la carte (voir creerCarteExercice, branche
  //     ex.type === 'ecoute').
  // `reponse` reprend le même format que EXERCICES (mots dans l'ordre,
  // ponctuation isolée sautée par MOT_PONCTUATION_SEULE_EXERCICE) —
  // entièrement réévaluable par evaluerReponseExercice/reponsesAcceptees
  // sans aucune modification de ces fonctions.
  // Vocabulaire volontairement limité à ce qui a déjà été vu dans le
  // dialogue ci-dessus (Mange/un/sandwich/J'ai/faim/Tu/comprends/Quoi) —
  // niveau archi-débutant, rien de nouveau à deviner par-dessus l'écoute
  // elle-même.

  // comprends ?") avait été ajouté par erreur — "comprends" n'est pas un
  // mot enseigné dans ce dialogue (vocabulaire volontairement limité, voir

  // récompenses (voir plus bas) se basent déjà sur EXERCICES_ECOUTE.length,

  const EXERCICES_ECOUTE = [

  // 🆕 ex.type === 'ecoute' : consigne fixe (jamais la phrase elle-même,
  // voir note de tête d'EXERCICES_ECOUTE) — sinon comportement inchangé.
  function texteExercice(ex) {
    if (ex.type === 'ecoute') return texteInterface('ecouteConsigne');
    return ex.instruction[langueActuelle()] || ex.instruction.en;
  }

  // 🆕 Indice optionnel (voir ex.indice sur d2_e1) : même repli fr→en que
  // texteExercice ci-dessus si la langue de l'apprenant manque. Retourne
  // null quand l'exercice n'a pas d'indice — creerCarteExercice n'affiche
  // alors rien.
  function texteIndice(ex) {
    if (!ex.indice) return null;
    return ex.indice[langueActuelle()] || ex.indice.en;
  }

  // ---------- Correction progressive (mode difficile) ----------
  // Normalise pour comparaison : minuscules, apostrophes typographiques
  // ramenées à l'apostrophe simple, ponctuation finale/de bord ignorée,
  // espaces superflus réduits. Les accents restent significatifs — on
  // apprend à écrire, pas à s'en passer.
  function normaliserMotExercice(mot) {
    return mot
      .toLowerCase()
      .replace(/[\u2019]/g, "'")
      .replace(/^[.,!?…"«»\s]+|[.,!?…"«»\s]+$/g, '');
  }

  function normaliserPhraseExercice(texte) {
    return texte
      .replace(/[\u2019]/g, "'")
      .trim()
      .split(/\s+/)
      .filter(Boolean);
  }

  // Compare la saisie à la réponse attendue mot à mot, dans l'ordre.
  // Retourne jusqu'où la saisie est correcte (indexErreur) et si la
  // phrase est entièrement juste.
  //
  // 🐛 CORRIGÉ (13-08-2026, retour Raphaël sur d2 : reponse ['Mange',
  // '!']) : un élément de reponseAttendue qui n'est QUE de la ponctuation
  // isolée (ex. '!') exigeait jusqu'ici d'être tapé comme un second mot à
  // part entière ("Mange" PUIS un espace PUIS "!"), ce que personne ne
  // fait naturellement en tapant une réponse. Un tel élément est
  // maintenant sauté automatiquement côté réponse attendue (jamais une
  // étape obligatoire de la saisie), et tout token de ponctuation seule
  // que l'élève aurait quand même tapé de son côté est ignoré aussi —
  // dans les deux cas, sans jamais faire échouer la comparaison. indexErreur
  // reste un index dans reponseAttendue (pas dans une copie filtrée), donc
  // les appelants qui font ex.reponse.slice(0, indexErreur) restent corrects.
  const MOT_PONCTUATION_SEULE_EXERCICE = /^[.,!?;:…"«»]+$/;
  function evaluerReponseExercice(reponseAttendue, saisie) {
    const motsSaisis = normaliserPhraseExercice(saisie).filter(function (mot) {
      return !MOT_PONCTUATION_SEULE_EXERCICE.test(mot);
    });
    let i = 0;
    let j = 0;
    while (i < reponseAttendue.length) {
      if (MOT_PONCTUATION_SEULE_EXERCICE.test(reponseAttendue[i])) { i++; continue; }
      if (j >= motsSaisis.length) break;
      if (normaliserMotExercice(motsSaisis[j]) !== normaliserMotExercice(reponseAttendue[i])) break;
      i++; j++;
    }
    const correct = i === reponseAttendue.length && j === motsSaisis.length;

    return { correct: correct, indexErreur: i };
  }

  // 🆕 Réponses acceptées pour un exercice : la réponse principale
  // (ex.reponse), plus toute alternative entièrement correcte déclarée
  // dans ex.reponsesAlternatives (voir note sur d2_e1 ci-dessus).
  // Toujours au moins un élément (ex.reponse). Utilisée par les deux
  // modes de vérification (difficile : creerZoneDifficile ; facile :
  // creerZoneFacile), pour qu'un exercice à réponses multiples se
  // comporte pareil dans les deux modes sans dupliquer la liste.
  function reponsesAcceptees(ex) {
    return [ex.reponse].concat(ex.reponsesAlternatives || []);
  }

  function traductionDeMot(mot) {
    const dico = TRADUCTIONS[langueActuelle()] || TRADUCTIONS.en;
    return dico[mot.toLowerCase()];
  }

  function motEstInformel(mot) {
    return MOTS_INFORMELS.has(mot.toLowerCase());
  }

  // Même clé que sac-a-dos.js/menu-principal.js — un seul réglage de
  // langue pour tout le site.
  function langueActuelle() {
    try { return localStorage.getItem('kebbek_langue') || 'en'; } catch (e) { return 'en'; }
  }

  function texteGrammaire(cle) {
    const dict = GRAMMAIRE[cle];
    if (!dict) return '';
    return dict[langueActuelle()] || dict.en;
  }

  // 🆕 Traduction de la phrase complète (demande de Raphaël : le mot-à-mot
  // seul "n'est pas suffisant"). Même repli sur l'anglais que le reste du
  // site si la langue de l'apprenant manque pour une raison quelconque.
  function traductionPhrase(def) {
    if (!def.trad) return '';
    return def.trad[langueActuelle()] || def.trad.en || '';
  }

  // ---------- Image avec repli "pas encore prête" (même patron que
  // creerImage() dans intro-bonomes.html) ----------
  function creerImage(cheminImage) {
    const wrapper = document.createElement('div');
    wrapper.style.position = 'absolute';
    wrapper.style.inset = '0';
    const img = document.createElement('img');
    img.className = 'image-scene';
    img.src = cheminImage;
    img.alt = 'Keb et Bek';
    img.onerror = function () {
      const repli = document.createElement('div');
      repli.className = 'repli-image-manquante';
      repli.textContent = 'Image not ready yet';
      img.replaceWith(repli);
    };
    wrapper.appendChild(img);
    return wrapper;
  }

  // ---------- Image de base + sandwich greffé par-dessus, flottant avec
  // lueur (voir CSS .sandwich-greffe*). Même repli "pas encore prête" que
  // creerImage() pour les deux images. ----------
  function creerImageComposite(cheminBase, cheminSuperposition) {
    const wrapper = creerImage(cheminBase);
    const greffe = document.createElement('div');
    greffe.className = 'sandwich-greffe';
    const lueur = document.createElement('div');
    lueur.className = 'sandwich-greffe-lueur';
    const imgSandwich = document.createElement('img');
    imgSandwich.className = 'sandwich-greffe-img';
    imgSandwich.src = cheminSuperposition;
    imgSandwich.alt = 'Le sandwich';
    imgSandwich.onerror = function () { greffe.style.display = 'none'; };
    greffe.appendChild(lueur);
    greffe.appendChild(imgSandwich);
    wrapper.appendChild(greffe);

    // 🆕 Condition de déblocage Bravo ("Le sandwich de Ginette") — voir
    // bravo-mecanique-synthese v4, section 2/16. Toucher le sandwich greffé
    // enregistre la condition 'd1_clic_sandwich' (idempotent côté Supabase,
    // rien ne se passe mal si l'élève touche plusieurs fois). e.stopPropagation()
    // EMPÊCHE ce tap de déclencher aussi suivant() via elScene (voir plus bas
    // dans ce fichier, "Tap direct sur la scène = avancer seulement") — même
    // motif que les mots cliquables (afficherTraductionMot) juste au-dessus.
    greffe.style.cursor = 'pointer';
    greffe.tabIndex = 0;
    greffe.setAttribute('role', 'button');
    greffe.setAttribute('aria-label', 'Le sandwich');
    let sandwichDejaTouche = false; // évite un appel réseau à chaque tap répété dans la même visite
    async function toucherSandwich(e) {
      e.stopPropagation();
      if (sandwichDejaTouche) return;
      sandwichDejaTouche = true;
      // 🐛 CORRIGÉ : attend la restauration session/profil (voir tout en
      // haut du fichier) — sans ce await, un tap assez rapide sur le
      // sandwich pouvait s'exécuter AVANT que initSession() ait fini de
      // résoudre, et retombait donc en mode invité malgré un élève
      // connecté.
      await restaurationSessionPromesse;
      if (window.KebBekProgression && window.KebBekProgression.marquerConditionComplete) {
        window.KebBekProgression.marquerConditionComplete('d1_clic_sandwich')
          .catch(function (err) { console.warn('dialogue-d2.html : marquerConditionComplete a échoué.', err); });
      }
    }
    greffe.addEventListener('click', toucherSandwich);
    greffe.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toucherSandwich(e); }
    });

    return wrapper;
  }

  function afficherTraductionMot(span, mot) {
    document.querySelectorAll('.iden-tooltip-mot').forEach(function (t) { t.remove(); });
    const trad = traductionDeMot(mot);
    if (!trad) return; // pas de bulle vide si le mot n'est pas encore au dictionnaire
    const tip = document.createElement('span');
    tip.className = 'iden-tooltip-mot';
    let contenu = trad;
    if (motEstInformel(mot)) {
      const langue = langueActuelle();
      contenu += ' ' + (ETIQUETTE_INFORMEL[langue] || ETIQUETTE_INFORMEL.en);
    }
    tip.textContent = contenu;
    span.appendChild(tip);
  }

  // Anime un CLONE du mot qui s'envole depuis sa position réelle jusqu'à
  // #sacBouton, puis disparaît — repli silencieux si le sac est absent ou
  // masqué (même prudence que animerMotVersSac dans identite-eleve.js).
  function animerMotVersSac(span) {
    const bouton = document.getElementById('sacBouton');
    if (!bouton || getComputedStyle(bouton).display === 'none') return;
    const depart = span.getBoundingClientRect();
    const arrivee = bouton.getBoundingClientRect();
    const clone = document.createElement('span');
    clone.className = 'iden-mot-vole';
    clone.textContent = span.textContent;
    clone.style.left = depart.left + 'px';
    clone.style.top = depart.top + 'px';
    document.body.appendChild(clone);
    const dx = (arrivee.left + arrivee.width / 2) - (depart.left + depart.width / 2);
    const dy = (arrivee.top + arrivee.height / 2) - (depart.top + depart.height / 2);
    void clone.offsetWidth;
    clone.style.setProperty('--vol-dx', dx + 'px');
    clone.style.setProperty('--vol-dy', dy + 'px');
    clone.classList.add('en-vol');
    clone.addEventListener('transitionend', function () { clone.remove(); }, { once: true });
    bouton.classList.add('sac-recoit');
    setTimeout(function () { bouton.classList.remove('sac-recoit'); }, DUREE_VOL_MOT + DELAI_FERMETURE_SAC_APRES_RECEPTION);
  }

  const DUREE_VOL_MOT = 550;
  const DELAI_FERMETURE_SAC_APRES_RECEPTION = 350;
  const motsDejaAjoutes = new Set(); // un seul flash par mot par visite de la leçon

  function ajouterMotAuSac(span, mot) {
    if (typeof window.ajouterAuSac !== 'function') return; // sac-a-dos.js absent : repli silencieux
    const cle = mot.toLowerCase();
    const type = natureDeMot(cle);
    const item = { mot: cle, trad: traductionDeMot(mot) || '', informel: motEstInformel(mot), type: type };
    // 🆕 (retour Raphaël, 15-08-2026) : genre/article pour les noms,
    // infinitif/conjugaison pour les verbes — voir GENRE_NOMS/ARTICLE_NOMS/
    // CONJUGAISON_VERBES ci-dessus. Champs simplement absents de l'item
    // quand non applicables (ex. un nom sans article naturel comme
    // "faim") : sac-a-dos.js gère déjà leur absence proprement.
    if (type === 'nom') {
      const genre = GENRE_NOMS[cle];
      if (genre) item.genre = genre;
      const article = ARTICLE_NOMS[cle];
      if (article) item.article = article;
    } else if (type === 'verbe') {
      const conj = CONJUGAISON_VERBES[cle];
      if (conj) { item.infinitif = conj.infinitif; item.conjugaison = conj.conjugaison; }
    }
    window.ajouterAuSac('mots', item);
    animerMotVersSac(span);
    if (motsDejaAjoutes.has(cle)) return;
    motsDejaAjoutes.add(cle);
    span.classList.remove('flash-ajout');
    void span.offsetWidth;
    span.classList.add('flash-ajout');
  }

  // Découpe le texte de la bulle active en <span class="iden-mot">
  // cliquables — même logique de fusion de la ponctuation isolée
  // ("Mange\u00A0!" → un seul mot cliquable, pas un "!" à part) que
  // afficherBulle() dans identite-eleve.js.
  const PONCTUATION_SEULE = /^[.,!?;:'"«»\u2026]+$/;
  function construireBulleMots(texteBrut) {
    elBulle.innerHTML = '';
    const brutSepares = String(texteBrut).split(/\s+/).filter(Boolean);
    const mots = [];
    brutSepares.forEach(function (tok) {
      if (PONCTUATION_SEULE.test(tok) && mots.length > 0) {
        mots[mots.length - 1] += '\u00A0' + tok;
      } else {
        mots.push(tok);
      }
    });
    mots.forEach(function (motBrut, idx) {
      const span = document.createElement('span');
      span.className = 'iden-mot';
      span.textContent = motBrut + (idx < mots.length - 1 ? '\u00A0' : '');
      const motNettoye = motBrut.replace(/^[\s.,!?;:'"«»\u2026]+|[\s.,!?;:'"«»\u2026]+$/g, '');
      span.tabIndex = 0;
      span.addEventListener('click', function (e) {
        e.stopPropagation();
        afficherTraductionMot(span, motNettoye);
      });
      span.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault(); e.stopPropagation();
          afficherTraductionMot(span, motNettoye);
        }
      });
      span.addEventListener('dblclick', function (e) {
        e.stopPropagation();
        ajouterMotAuSac(span, motNettoye);
      });
      elBulle.appendChild(span);
    });
  }

  const elCompteur = document.getElementById('compteur');

  const btnSuivant = document.getElementById('btnSuivant');
  const elPileDialogue = document.getElementById('pileDialogue');
  const elPileGrammaire = document.getElementById('pileGrammaire');
  const blocGrammaire = document.getElementById('blocGrammaire');

  let etape = 0;
  let reconstructionEnCours = false;

  // raccourci clavier (flèche/espace) appelait suivant() directement, sans
  // passer par la vérification `disabled` des boutons — une pression du
  // clavier pendant l'animation 5a→5d pouvait donc démarrer une deuxième
  // séquence en parallèle de la première, ce qui brouillait l'affichage
  // (la séquence rejouée depuis 5, une fois reculée puis relancée, sautait
  // b→d et allait directement à 6). `animationEnCours` est vérifié en tête
  // de suivant() ET precedent(), donc TOUTE tentative de navigation —
  // bouton, tap sur la scène, ou clavier — est bloquée pendant l'animation,
  // peu importe le chemin par lequel elle est déclenchée.
  let animationEnCours = false;
  const sequenceAJouePourEtapeActuelle = { valeur: false }; // 🔧 (7e échange) : remplace l'ancien Set sequencesJouees. Remis à false à CHAQUE rendreEtape() (voir plus bas), peu importe la direction de navigation — élimine le besoin de le gérer manuellement dans precedent(), et donc le risque de désynchronisation qui causait le bug "5a → 6 sans rejouer la séquence" signalé par Raphaël (09-08-2026).

  // 🆕 État global d'affichage des traductions de phrase (voir demande de

  let traductionsVisiblesParDefaut = false;

    div.innerHTML = '<button type="button" class="pile-avatar" aria-label="' + texteInterface('afficherTrad') + '">' + INITIALES[def.speaker] + '</button>' +

  function ajouterNoteGrammaire(def) {
    if (!def.grammaire) return;

  function rendreEtape() {
    const def = ETAPES[etape];
    elCompteur.textContent = (etape + 1) + ' / ' + ETAPES.length;

    // 🔧 (7e échange) : remis à false ICI, inconditionnellement — dès qu'on
    // affiche une étape (par suivant() OU precedent()), sa séquence auto,
    // si elle en a une, n'a par définition pas encore joué "cette fois-ci".
    sequenceAJouePourEtapeActuelle.valeur = false;

    // Bulle unique — remplacée, jamais empilée. Mots cliquables (voir
    // construireBulleMots) : clic/tap = traduction, double-clic/double-tap
    // = ajout au sac — même mécanisme que partout ailleurs sur le site.
    // 🆕 (15-08-2026) : étape silencieuse (def.texte absent, voir ETAPES[0])
    // → bulle cachée entièrement (.bulle-vide) plutôt que d'afficher une
    // bulle avec un mot "undefined" (String(undefined) sinon construit par

    elBulle.classList.remove('in');
    if (def.texte) {
      elBulle.className = 'bulle-dialogue cote-' + def.speaker;
      construireBulleMots(def.texte);
      requestAnimationFrame(() => requestAnimationFrame(() => elBulle.classList.add('in')));
    } else {
      elBulle.className = 'bulle-dialogue bulle-vide';
      elBulle.innerHTML = '';
    }

    // Scène — une image par étape (repli gracieux tant que l'art n'existe
    // pas encore, voir creerImage()).
    elScene.innerHTML = '';
    elScene.appendChild(creerImage(def.img));

    if (!reconstructionEnCours) {
      ajouterLigneDialogue(def);
      ajouterNoteGrammaire(def);
    }

    btnPrecedent.disabled = (etape === 0);
    btnSuivant.textContent = (etape === ETAPES.length - 1)
      ? texteInterface('terminer') + ' \u203a'
      : texteInterface('continuer') + ' \u203a';

    // 🆕 (14-08-2026, session-classe.js) : best-effort, ne fait rien si ce
    // navigateur ne fait pas tourner de session prof — voir plus bas.
    // 🆕 (deuxième vague, même jour) : champ "page" ajouté — permet à une
    // AUTRE page (ex. parcours.html) de savoir vers où naviguer quand le
    // prof pousse un état depuis ICI. Chemin canonique confirmé dans
    // parcours.html (NIVEAUX → chapitre d2 → page: 'dialogues/d2/'),
    // repris tel quel plutôt que redéfini ici pour rester la seule source
    // de vérité de ce chemin.
    synchroniserEtatSession({ page: 'dialogues/d2/', section: 'dialogue', etape: etape });
  }

  // ---------- Séquence automatique (b→c→d) — exception ponctuelle pour
  // l'étape "Ton sandwich ?" (voir commentaire sur ETAPES), pas un patron
  // réutilisé ailleurs. Enchaîne les images avec un léger fondu, SANS
  // attendre de clic, pendant que la navigation est désactivée pour éviter
  // qu'un clic mal placé saute une étape ou casse l'état. ----------
  function jouerSequenceAuto(chemins, auTermine) {
    let i = 0;
    function etapeSuivante() {
      if (i >= chemins.length) {
        auTermine();
        return;
      }
      const item = chemins[i];
      const nouveau = (typeof item === 'string')
        ? creerImage(item)
        : creerImageComposite(item.img, item.superposition);
      nouveau.style.opacity = '0';
      nouveau.style.transition = 'opacity 0.55s ease'; /* 🆕 (5e échange) : plus lent qu'avant */
      elScene.innerHTML = '';
      elScene.appendChild(nouveau);
      requestAnimationFrame(() => requestAnimationFrame(() => { nouveau.style.opacity = '1'; }));
      i++;
      setTimeout(etapeSuivante, 1700); /* 🆕 (5e échange) : 1000 → 1700 ms */
    }
    etapeSuivante();
  }

  function suivant() {
    if (syncControleBloque) return; // navigation suspendue — voir session-classe.js plus bas
    if (animationEnCours) return;
    if (etape < ETAPES.length - 1) {
      const def = ETAPES[etape];
      // 🆕 (5e échange) : la séquence s'arrête maintenant à 5d — elle ne
      // fait PLUS avancer automatiquement jusqu'à l'étape 6. Une fois
      // jouée, le drapeau empêche de la rejouer : le clic Continuer
      // suivant se comporte alors comme une avance normale vers l'étape 6.
      if (def.sequenceAuto && !sequenceAJouePourEtapeActuelle.valeur) {
        animationEnCours = true;
        btnPrecedent.disabled = true;
        btnSuivant.disabled = true;
        jouerSequenceAuto(def.sequenceAuto, function () {
          sequenceAJouePourEtapeActuelle.valeur = true;
          animationEnCours = false;
          btnPrecedent.disabled = (etape === 0);
          btnSuivant.disabled = false;
        });
        return;
      }
      etape++;
      rendreEtape();
    } else {
      afficherExercices();
    }
  }

  function precedent() {
    if (syncControleBloque) return; // navigation suspendue — voir session-classe.js plus bas
    if (animationEnCours) return;
    if (etape === 0) return;
    etape--;
    // 🔧 (7e échange) : plus besoin de nettoyer sequencesJouees ici — voir
    // rendreEtape(), qui remet maintenant le drapeau à zéro à chaque appel.
    // Reconstruit les deux piles depuis le début plutôt que de retirer
    // juste le dernier élément — même stratégie que precedent() dans
    // intro-bonomes.html : plus simple et sans risque de désynchronisation
    // entre la pile de dialogue et la pile de grammaire.
    elPileDialogue.innerHTML = '';
    elPileGrammaire.innerHTML = '';
    blocGrammaire.style.display = 'none';
    reconstructionEnCours = true;
    for (let i = 0; i <= etape; i++) {
      ajouterLigneDialogue(ETAPES[i]);
      ajouterNoteGrammaire(ETAPES[i]);
    }
    elPileDialogue.querySelectorAll('.pile-item').forEach(el => el.classList.add('in'));
    elPileGrammaire.querySelectorAll('.grammaire-item').forEach(el => el.classList.add('in'));
    rendreEtape(); // 🆕 (6e échange) : appelé AVANT de repasser reconstructionEnCours à false
    reconstructionEnCours = false; // sinon rendreEtape() ci-dessus rajoute une 2e fois la ligne courante
  }

  // Fin de la leçon — enregistre la progression réelle (voir
  // marquer_chapitre_complete côté Supabase) puis retour au parcours.
  // ⚠️ N'attribue PAS encore de P$/PB (voir note en tête de fichier) —
