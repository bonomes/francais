  // 🆕 Section exercices — affichée à la place de la navigation du
  // dialogue une fois la dernière étape atteinte. Le dialogue complet
  // (#pileDialogue, déjà rempli) reste visible juste au-dessus : pas de
  // bascule séparée, l'élève peut déjà s'y référer sans rien déplier
  // (demande de Raphaël, mais la pile le couvrait déjà nativement).
  const elSectionExercices = document.getElementById('sectionExercices');
  const elConteneurExercices = document.getElementById('conteneurExercices');
  const btnTerminerExercices = document.getElementById('btnTerminerExercices');
  const elRemarqueDifficile = document.getElementById('remarqueQuatreDifficile');
  const exercicesResolus = new Set(); // ids des exercices réussis ou révélés, tout niveau confondu (usage visuel)
  const exercicesResolusDifficile = new Set(); // ids résolus spécifiquement en mode difficile — condition carte
  // 🆕 (retour Raphaël, session du 13-08-2026) — suivi séparé pour les
  // récompenses P$/PB : "sans erreur" = réussi du premier coup (essais
  // === 1 au moment de la réussite), distinct de exercicesResolus qui
  // inclut aussi les révélations après 2 essais ratés. Un exercice peut

  // — seul exercicesResolusSansErreurDifficile exige spécifiquement le
  // mode difficile (condition du 1 PB).
  const exercicesResolusSansErreur = new Set();
  const exercicesResolusSansErreurDifficile = new Set();
  // Empêche de rappeler la RPC de récompense à chaque nouvel exercice
  // résolu une fois un palier déjà atteint (elle est de toute façon
  // censée être idempotente côté serveur — voir attribuer_recompense_-
  // premiere_fois — mais autant éviter les appels réseau redondants).
  const recompensesExercicesDonnees = { base: false, parfait: false, parfaitDifficile: false };

  // 🆕 (15-08-2026, demande de Raphaël) Récompenses ÉCOUTE — état
  // ENTIÈREMENT SÉPARÉ de la section exercices d'image ci-dessus (un
  // élève qui ne fait QUE l'écoute ne doit jamais déclencher les
  // récompenses "d1_exercices_*", et vice-versa), ET un RAISONNEMENT
  // DIFFÉRENT de celui-ci (Raphaël, 15-08-2026 : "récompenser les deux
  // domaines de façon discriminée" — pas d'uniformisation). Ici, les
  // paliers sont organisés autour du NIVEAU atteint plutôt que de
  // l'absence totale d'erreur :
  //   - "réussi" (pour les deux premiers paliers) tolère UNE faute par
  //     exercice — un exercice n'est un ÉCHEC que s'il est encore faux
  //     au 2e essai (révélé). Ce seuil est déjà la limite existante du
  //     moteur d'exercice (essais >= 2 → révélation, voir
  //     creerZoneFacile/creerZoneDifficile) : aucune nouvelle mécanique
  //     de comptage n'était nécessaire, seulement distinguer "réussi"
  //     (essais 1 OU 2) d'"échec" (révélé) au moment de marquer() — voir

  //   2. Les 4 exercices RÉUSSIS (≤ 1 faute chacun) alors qu'ils étaient

  // Total maximal : 10 P$ + 1 PB — même total que la section exercices,

  // n'empêche un élève de repasser un exercice déjà réussi en facile

  const elSectionExercicesEcoute = document.getElementById('sectionExercicesEcoute');
  const elConteneurExercicesEcoute = document.getElementById('conteneurExercicesEcoute');
  const btnTerminerExercicesEcoute = document.getElementById('btnTerminerExercicesEcoute');
  const exercicesEcouteReussisFacile = new Set(); // réussis (≤ 1 faute), niveau facile au moment de la réussite
  const exercicesEcouteReussisDifficile = new Set(); // réussis (≤ 1 faute), niveau difficile
  const exercicesEcouteReussisSansErreurDifficile = new Set(); // réussis du 1er coup (0 faute), niveau difficile — condition du PB
  const recompensesExercicesEcouteDonnees = { facile: false, difficile: false, parfaitDifficile: false };

  // 🐛 CORRIGÉ (13-08-2026) : jamais déclarée nulle part dans ce fichier —
  // terminerLecon() (voir plus bas) la LISAIT (if (leconTerminee) return;)
  // avant toute affectation, ce qui levait une ReferenceError à chaque
  // clic sur « Terminer » : ni marquerChapitreComplete, ni la redirection
  // vers parcours.html ne s'exécutaient jamais. C'est ce qui rendait le
  // bouton totalement silencieux.
  let leconTerminee = false;


  // 🆕 Niveau global — état de départ appliqué à toutes les cartes à la
  // construction (voir afficherExercices). N'empêche pas un réglage
  // individuel ensuite : c'est juste le point de départ commun.
  let niveauGlobalCourant = 'facile';
  const elToggleNiveauGlobal = document.getElementById('toggleNiveauGlobal');
  const btnNiveauGlobalFacile = document.getElementById('btnNiveauGlobalFacile');
  const btnNiveauGlobalDifficile = document.getElementById('btnNiveauGlobalDifficile');

  function choisirNiveauGlobal(niveau) {

  // 🆕 (15-08-2026, demande de Raphaël) : même sélecteur de niveau global,
  // mais pour la section écoute — exactement le même patron que ci-dessus
  // (variable d'état + boutons + parcours des cartes via carte.choisirNiveau,
  // déjà exposé par creerCarteExercice pour les DEUX sections). État séparé
  // de niveauGlobalCourant : rien n'oblige les deux sections à partager le
  // même niveau de départ, l'élève peut très bien vouloir "facile" en
  // écriture et "difficile" en écoute, ou l'inverse.
  let niveauGlobalCourantEcoute = 'facile';
  const elToggleNiveauGlobalEcoute = document.getElementById('toggleNiveauGlobalEcoute');
  const btnNiveauGlobalFacileEcoute = document.getElementById('btnNiveauGlobalFacileEcoute');
  const btnNiveauGlobalDifficileEcoute = document.getElementById('btnNiveauGlobalDifficileEcoute');

  function choisirNiveauGlobalEcoute(niveau) {
    niveauGlobalCourantEcoute = niveau;
    btnNiveauGlobalFacileEcoute.classList.toggle('actif', niveau === 'facile');
    btnNiveauGlobalDifficileEcoute.classList.toggle('actif', niveau === 'difficile');
    elConteneurExercicesEcoute.querySelectorAll('.exercice-carte').forEach(function (carte) {
      if (carte.choisirNiveau) carte.choisirNiveau(niveau);

  btnNiveauGlobalFacileEcoute.addEventListener('click', function () { choisirNiveauGlobalEcoute('facile'); });
  btnNiveauGlobalDifficileEcoute.addEventListener('click', function () { choisirNiveauGlobalEcoute('difficile'); });

  // 🆕 Raccourci "passer aux exercices" (demande de Raphaël) : saute les
  // étapes du dialogue restantes sans les faire jouer une à une. Les
  // piles "Ce qui a été dit" / "À retenir" sont quand même reconstruites
  // pour toutes les étapes — même logique que precedent() — afin que le
  // résumé reste complet quand l'élève y revient depuis les exercices,
  // même s'il a sauté directement.
  const btnRaccourciExercices = document.getElementById('btnRaccourciExercices');
  function allerAuxExercices() {
    if (syncControleBloque) return; // navigation suspendue — voir session-classe.js plus bas
    if (animationEnCours) return;
    if (etape < ETAPES.length - 1) {
      etape = ETAPES.length - 1;
      elPileDialogue.innerHTML = '';
      elPileGrammaire.innerHTML = '';
      blocGrammaire.style.display = 'none';
      reconstructionEnCours = true;
      for (let i = 0; i <= etape; i++) {
        ajouterLigneDialogue(ETAPES[i]);
        ajouterNoteGrammaire(ETAPES[i]);
      }
      elPileDialogue.querySelectorAll('.pile-item').forEach(el => el.classList.add('in'));
      elPileGrammaire.querySelectorAll('.grammaire-item').forEach(el => el.classList.add('in'));
      reconstructionEnCours = false;

  function creerCarteExercice(ex, index, niveauInitial, marquerFn) {
    const carte = document.createElement('div');
    carte.className = 'exercice-carte';
    carte.dataset.exerciceId = ex.id;

    if (ex.type === 'ecoute') {
      // 🆕 Carte d'écoute : pas d'image, un bouton 🔊 central à la place
      // — clique = lireAudio(ex.texte) (phase 1). ex.texte n'apparaît
      // JAMAIS dans le DOM ni dans aucun attribut visible/lisible par
      // l'élève, uniquement capturé dans cette fermeture JS et dans
      // l'état poussé au prof (voir afficherExercicesEcoute).
      const cadreAudio = document.createElement('div');
      cadreAudio.className = 'exercice-audio-cadre';
      const btnEcouter = document.createElement('button');
      btnEcouter.type = 'button';
      btnEcouter.className = 'exercice-btn-ecouter';
      btnEcouter.setAttribute('aria-label', 'Écouter');
      btnEcouter.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
      if (!('speechSynthesis' in window)) btnEcouter.style.display = 'none'; // pas de TTS : seule la lecture par le prof en session reste possible
      btnEcouter.addEventListener('click', function () { lireAudio(ex.texte); });
      cadreAudio.appendChild(btnEcouter);
      // 🆕 (15-08-2026) Révélation LOCALE de la phrase, uniquement si CE
      // navigateur est un compte prof confirmé côté serveur (voir
      // estProfesseurConfirme) — jamais transmise ailleurs (voir la note
      // de tête de afficherExercicesEcoute sur la fuite corrigée). Permet
      // au prof de lire la phrase à voix haute directement depuis son
      // propre écran, sans dépendre du widget flottant.
      if (estProfesseurConfirme) {
        const phraseProf = document.createElement('p');
        phraseProf.className = 'exercice-phrase-prof';
        phraseProf.textContent = '\uD83D\uDC41\uFE0F ' + ex.texte;
        cadreAudio.appendChild(phraseProf);
      }
      carte.appendChild(cadreAudio);
    } else {
      const cadreImage = document.createElement('div');
      cadreImage.className = 'exercice-image-cadre';
      const img = document.createElement('img');
      img.src = ex.image;
      img.alt = '';
      img.onerror = function () {
        const repli = document.createElement('div');
        repli.className = 'repli-image-manquante';
        repli.textContent = 'Image not ready yet';
        img.replaceWith(repli);
      };
      cadreImage.appendChild(img);
      carte.appendChild(cadreImage);
    }

    const instruction = document.createElement('div');
    instruction.className = 'exercice-instruction';
    instruction.textContent = texteExercice(ex);
    carte.appendChild(instruction);

    // 🆕 (retour Raphaël, 15-08-2026) : indice optionnel, sous la
    // consigne — rien n'est ajouté au DOM si l'exercice n'en a pas.
    const indice = texteIndice(ex);
    if (indice) {
      const elIndice = document.createElement('div');
      elIndice.className = 'exercice-indice';
      elIndice.textContent = indice;
      carte.appendChild(elIndice);
    }

    const toggleNiveau = document.createElement('div');
    toggleNiveau.className = 'exercice-niveau-toggle';
    const btnFacile = document.createElement('button');
    btnFacile.type = 'button';
    btnFacile.className = 'exercice-niveau-btn';
    btnFacile.textContent = texteInterface('niveauFacile');
    const btnDifficile = document.createElement('button');
    btnDifficile.type = 'button';
    btnDifficile.className = 'exercice-niveau-btn';
    btnDifficile.textContent = texteInterface('niveauDifficile');
    toggleNiveau.appendChild(btnFacile);
    toggleNiveau.appendChild(btnDifficile);
    carte.appendChild(toggleNiveau);

    const zoneJeu = document.createElement('div');
    carte.appendChild(zoneJeu);

    // 🆕 marquerFn : par défaut marquerCarteResolue (EXERCICES d'image),
    // mais afficherExercicesEcoute passe marquerCarteEcouteResolue pour
    // que les cartes d'écoute alimentent leur PROPRE compteur/récompense,
    // jamais celui des EXERCICES (voir sa note de tête).
    const marquer = marquerFn || marquerCarteResolue;

    function choisirNiveau(niveau) {
      btnFacile.classList.toggle('actif', niveau === 'facile');
      btnDifficile.classList.toggle('actif', niveau === 'difficile');
      zoneJeu.innerHTML = '';
      zoneJeu.appendChild(niveau === 'facile' ? creerZoneFacile(ex, carte, marquer) : creerZoneDifficile(ex, carte, marquer));
    }
    btnFacile.addEventListener('click', function () { choisirNiveau('facile'); });
    btnDifficile.addEventListener('click', function () { choisirNiveau('difficile'); });

    // 🆕 carte.choisirNiveau exposé pour le sélecteur global au-dessus
    // des exercices (voir cablerNiveauGlobal) — bascule cette carte
    // précise sans empêcher un réglage individuel après coup, puisque
    // les boutons facile/difficile de la carte restent cliquables.
    carte.choisirNiveau = choisirNiveau;

    // Facile par défaut : reconnaître avant de produire, plus doux pour
    // une toute première leçon. Le sélecteur global peut changer ce
    // point de départ (voir afficherExercices).
    choisirNiveau(niveauInitial || 'facile');

    return carte;
  }

  // 🆕 (15-08-2026) Paramètre `reussi` ajouté — inutilisé PAR CETTE
  // fonction (les récompenses de la section exercices d'image restent
  // basées sur exercicesResolus/exercicesResolusSansErreur, inchangées),
  // mais creerZoneFacile()/creerZoneDifficile() sont PARTAGÉES entre
  // cette fonction et marquerCarteEcouteResolue (voir sa propre note) —
  // un seul gabarit d'appel pour les deux évite un branchement spécial
  // selon `marquerFn` à l'intérieur des zones d'exercice.
  function marquerCarteResolue(carte, ex, niveau, sansErreur, reussi, etatActiviteSupplementaire) {
    carte.classList.add('resolue');
    exercicesResolus.add(ex.id);
    // 🆕 (14-08-2026, quatrième vague) : l'exercice est réglé — fait
    // revenir le widget du prof à l'état de navigation normal plutôt que
    // de laisser affiché le dernier texte tapé, qui ne bougera plus
    // (résolu ou révélé, peu importe le niveau).
    //
    // 🐛 CORRIGÉ (Raphaël, "l'élève disparaît en appuyant sur Entrée",
    // puis "l'élève disparaît en commençant les exercices") : le
    // paramètre etatActiviteSupplementaire permet à un appelant (voir
    // annoncerErreur plus bas) de fournir un état DÉJÀ enrichi (avec
    // erreur/question) à annoncer ICI MÊME, plutôt que de faire un DEUXIÈME
    // appel à annoncerActivite juste après cette fonction. Le throttle
    // Presence qui empêche ces appels coup sur coup de dépasser la limite
    // de débit de Supabase vit maintenant dans annoncerActivite() elle-
    // même (session-classe.js) — plusieurs exercices résolus rapidement
    // à la suite sont donc protégés automatiquement, sans rien à gérer
    // ici (voir la note dans session-classe.js pour le détail).
    const sessionClasseActivite = window.KebBekSessionClasse || null;
    if (sessionClasseActivite) sessionClasseActivite.annoncerActivite(etatActiviteSupplementaire || dernierEtatSession);
    if (sansErreur) exercicesResolusSansErreur.add(ex.id);
    if (niveau === 'difficile') {
      exercicesResolusDifficile.add(ex.id);
      if (sansErreur) exercicesResolusSansErreurDifficile.add(ex.id);
      // 🆕 (d2, 15-08-2026) : contrairement à d1, AUCUNE condition de
      // déblocage Bravo n'est câblée ici pour l'instant — d1 débloquait
      // « Le sandwich de Ginette » via 'd1_exercices_completes' (voir
      // bravo-mecanique-synthese_v7.md, section 17), mais Raphaël ne
      // nous a pas encore dit ce que d2 devrait débloquer, s'il y a
      // lieu. La petite remarque encourageante (afficherRemarqueDifficile)
      // reste affichée localement, sans appel Supabase — à réévaluer
      // dès qu'une condition Bravo précise est communiquée.
      if (exercicesResolusDifficile.size === EXERCICES.length) {
        afficherRemarqueDifficile();
      }
    }
    verifierRecompensesExercices();
  }

  // 🆕 Récompenses P$/PB pour la section exercices (confirmé par
  // Raphaël, session du 13-08-2026) — TROIS paliers indépendants,
  // chacun attribué au plus une fois par élève (idempotence côté
  // serveur via attribuer_recompense_premiere_fois, une clé distincte
  // par palier) :
  //   1. d2_exercices_base            : les 4 exercices résolus, peu
  //      importe le niveau ou le nombre d'essais → 5 P$
  //   2. d2_exercices_parfait         : les 4 résolus SANS AUCUNE
  //      erreur (premier essai correct), peu importe le niveau → +5 P$
  //   3. d2_exercices_parfait_difficile : les 4 résolus sans erreur ET
  //      spécifiquement en mode difficile → +1 PB
  // Total maximal : 10 P$ + 1 PB. Remplace l'ancien câblage qui donnait
  // 5 P$ (clé 'd1') au simple clic sur « Terminer », sans vérifier que
  // les exercices avaient été faits — voir terminerLecon(), qui ne gère
  // plus que marquerChapitreComplete (déblocage du parcours), une
  // notion distincte de la monnaie.
  // ✅ Vérifié sur Supabase (projet Bravo, 13-08-2026) : p_chapitre_id
  // est un TEXT libre, clé de recompenses_chapitre_attribuees (PK
  // composite eleve_id+chapitre_id) — n'importe quelle chaîne convient
  // comme clé d'idempotence, une par palier.
  // 🐛 CORRIGÉ (13-08-2026) : même angle mort que le bug #1 (animation de
  // fin de chapitre) — cette fonction animait sur la seule foi de l'état
  // LOCAL (exercicesResolus etc., un Set qui repart à zéro à chaque
  // chargement), sans jamais regarder si le serveur avait réellement
  // accordé un gain neuf. Résultat : un "Revoir" où l'élève referait les
  // exercices parfaitement rejouerait l'animation "+10 P$ · +1 PB" (et
  // gonflerait le solde affiché par la mise à jour optimiste plus bas),
  // alors que attribuer_recompense_premiere_fois refuse silencieusement
  // (on conflict do nothing) puisque ces paliers étaient déjà donnés.
  // Le drapeau local recompensesExercicesDonnees reste utile pour éviter
  // de rappeler la RPC en boucle une fois un palier atteint DANS ce même
  // passage, mais l'animation, elle, attend maintenant la confirmation
  // serveur (true = gain neuf) avant de se déclencher.
  async function verifierRecompensesExercices() {
    const attributions = [];
    if (!recompensesExercicesDonnees.base && exercicesResolus.size === EXERCICES.length) {
      recompensesExercicesDonnees.base = true;
      attributions.push(attribuerRecompenseExercice('d2_exercices_base', 5, 0).then(function (accorde) {
        return accorde ? { piasses: 5, pointsBonis: 0 } : null;
      }));
    }
    if (!recompensesExercicesDonnees.parfait && exercicesResolusSansErreur.size === EXERCICES.length) {
      recompensesExercicesDonnees.parfait = true;
      attributions.push(attribuerRecompenseExercice('d2_exercices_parfait', 5, 0).then(function (accorde) {
        return accorde ? { piasses: 5, pointsBonis: 0 } : null;
      }));
    }
    if (!recompensesExercicesDonnees.parfaitDifficile && exercicesResolusSansErreurDifficile.size === EXERCICES.length) {
      recompensesExercicesDonnees.parfaitDifficile = true;
      attributions.push(attribuerRecompenseExercice('d2_exercices_parfait_difficile', 0, 1).then(function (accorde) {
        return accorde ? { piasses: 0, pointsBonis: 1 } : null;
      }));
    }
    if (attributions.length === 0) return;

    const resultats = await Promise.all(attributions);
    let piassesGagnees = 0;
    let pointsBonisGagnes = 0;
    resultats.forEach(function (r) {
      if (!r) return; // palier déjà donné avant (confirmé par le serveur) : pas de gain réel, pas d'animation
      piassesGagnees += r.piasses;
      pointsBonisGagnes += r.pointsBonis;
    });
    if (piassesGagnees > 0 || pointsBonisGagnes > 0) {
      afficherRecompenseEtEnvoyerAuSac(piassesGagnees, pointsBonisGagnes);
    }
  }

  // 🆕 Badge "+X P$ · +X PB" qui apparaît près du bouton Terminer puis
  // s'envole vers #sacBouton — demande de Raphaël (session du
  // 13-08-2026) : que l'apprenant voie clairement combien il vient de
  // gagner et que ces points rejoignent visuellement le sac. Repli
  // silencieux si le sac est absent/masqué, même prudence
  // qu'animerMotVersSac (identité du mécanisme sur tout le site).
  // 🆕 (15-08-2026) boutonAncre : optionnel, défaut btnTerminerExercices
  // (comportement d'origine, inchangé) — verifierRecompensesExercicesEcoute
  // passe btnTerminerExercicesEcoute pour ancrer correctement le toast
  // pendant que la section exercices d'image (et son bouton) est cachée.
  function afficherRecompenseEtEnvoyerAuSac(piasses, pointsBonis, boutonAncre) {
    const bouton = document.getElementById('sacBouton');
    if (!bouton || getComputedStyle(bouton).display === 'none') return;

    const morceaux = [];
    if (piasses > 0) morceaux.push('+' + piasses + ' P$');
    if (pointsBonis > 0) morceaux.push('+' + pointsBonis + ' PB');
    if (morceaux.length === 0) return;

    // Ancré juste au-dessus du bouton Terminer concerné (visible dès
    // qu'un palier se débloque, puisque ça n'arrive qu'une fois la
    // section correspondante déjà à l'écran).
    const ancre = (boutonAncre || btnTerminerExercices).getBoundingClientRect();
    const toast = document.createElement('div');
    toast.className = 'recompense-toast';
    toast.textContent = morceaux.join(' \u00b7 ');
    toast.style.top = (ancre.top - 54) + 'px';
    document.body.appendChild(toast);
    requestAnimationFrame(function () { toast.classList.add('montre'); });

    setTimeout(function () {
      const depart = toast.getBoundingClientRect();
      const arrivee = bouton.getBoundingClientRect();
      const dx = (arrivee.left + arrivee.width / 2) - (depart.left + depart.width / 2);
      const dy = (arrivee.top + arrivee.height / 2) - (depart.top + depart.height / 2);
      toast.style.setProperty('--vol-dx', dx + 'px');
      toast.style.setProperty('--vol-dy', dy + 'px');
      toast.classList.add('en-vol');
      toast.addEventListener('transitionend', function () { toast.remove(); }, { once: true });
      bouton.classList.add('sac-recoit');
      setTimeout(function () {
        bouton.classList.remove('sac-recoit');
        // Mise à jour optimiste de l'affichage du solde déjà présent
        // dans le panneau du sac (#sacSoldePiasses/#sacSoldePointsBonis)
        // — le gain est de toute façon déjà écrit sur Supabase via
        // attribuerRecompenseExercice/attribuerRecompensePremiereFois ;
        // ceci évite juste d'attendre une réouverture du panneau pour
        // voir le nouveau total. Repli silencieux si ces champs
        // n'existent pas encore ou ne contiennent pas encore un nombre
        // (sac-a-dos.js pas encore initialisé).
        const elPiasses = document.getElementById('sacSoldePiasses');
        const elPointsBonis = document.getElementById('sacSoldePointsBonis');
        if (elPiasses && piasses > 0) {
          const actuel = parseInt(elPiasses.textContent, 10);
          if (!isNaN(actuel)) elPiasses.textContent = String(actuel + piasses);
        }
        if (elPointsBonis && pointsBonis > 0) {
          const actuel = parseInt(elPointsBonis.textContent, 10);
          if (!isNaN(actuel)) elPointsBonis.textContent = String(actuel + pointsBonis);
        }
      }, DELAI_FERMETURE_SAC_APRES_RECEPTION);
    }, DUREE_AFFICHAGE_RECOMPENSE);
  }

  const DUREE_AFFICHAGE_RECOMPENSE = 900; // le badge reste lisible avant de s'envoler

  // 🐛 CORRIGÉ : attend restaurationSessionPromesse (voir tout en haut
  // du fichier) avant d'écrire — même raison que toucherSandwich().
  // 🐛 CORRIGÉ (13-08-2026) : renvoie maintenant le booléen du serveur
  // (true = gain neuf réellement accordé, false = palier déjà donné
  // avant) au lieu de l'avaler — verifierRecompensesExercices() en a
  // besoin pour ne pas animer un gain qui n'a pas eu lieu. En cas
  // d'erreur réseau/RPC, on renvoie false par prudence : mieux vaut ne
  // pas animer un gain qu'on n'est pas sûr d'avoir écrit.
  async function attribuerRecompenseExercice(cle, piasses, pointsBonis) {
    if (!window.KebBekProgression || !window.KebBekProgression.attribuerRecompensePremiereFois) return false;
    await restaurationSessionPromesse;
    try {
      return await window.KebBekProgression.attribuerRecompensePremiereFois(cle, piasses, pointsBonis);
    } catch (err) {
      console.warn('dialogue-d2.html : attribuerRecompensePremiereFois(' + cle + ') a échoué.', err);
      return false;
    }
  }

  function afficherRemarqueDifficile() {
    if (elRemarqueDifficile.dataset.affichee === '1') return; // une seule fois
    elRemarqueDifficile.dataset.affichee = '1';
    elRemarqueDifficile.textContent = texteInterface('remarqueQuatreDifficile');
    elRemarqueDifficile.style.display = 'block';
    elRemarqueDifficile.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  // 🆕 (15-08-2026) Pendant de marquerCarteResolue pour EXERCICES_ECOUTE
  // — mêmes mécanismes de base (Presence, appel à la vérification de
  // récompense) mais RAISONNEMENT DE RÉCOMPENSE DIFFÉRENT (voir la note
  // de tête de exercicesEcouteReussisFacile plus haut). Volontairement
  // SANS le bloc "quatre en difficile débloquent d1_exercices_completes"
  // de marquerCarteResolue : cette condition reste propre aux 2
  // EXERCICES d'image (déblocage "Le sandwich de Ginette",
  // bravo-mecanique-synthese_v7.md §17) — l'écoute n'y participe pas.
  //
  // 🆕 `reussi` (true = réponse correcte obtenue, au 1er ou 2e essai ;
  // false = révélé après 2 essais ratés, c.-à-d. un ÉCHEC) — distinct de
  // `sansErreur` (true UNIQUEMENT si correct dès le 1er essai). Un
  // exercice réussi au 2e essai compte pour les paliers 1 et 2
  // (facile/difficile, 1 faute tolérée) mais jamais pour le palier 3
  // (PB, qui exige sansErreur). Un exercice révélé (reussi === false) ne
  // compte pour AUCUN palier.
  function marquerCarteEcouteResolue(carte, ex, niveau, sansErreur, reussi, etatActiviteSupplementaire) {
    carte.classList.add('resolue');
    const sessionClasseActivite = window.KebBekSessionClasse || null;
    if (sessionClasseActivite) sessionClasseActivite.annoncerActivite(etatActiviteSupplementaire || dernierEtatSession);
    if (reussi) {
      if (niveau === 'facile') exercicesEcouteReussisFacile.add(ex.id);
      if (niveau === 'difficile') {
        exercicesEcouteReussisDifficile.add(ex.id);
        if (sansErreur) exercicesEcouteReussisSansErreurDifficile.add(ex.id);
      }
    }
    verifierRecompensesExercicesEcoute();
  }

  // 🆕 (15-08-2026) Trois paliers ORGANISÉS PAR NIVEAU (voir la note de
  // tête de exercicesEcouteReussisFacile pour le raisonnement complet) —
  // clés RPC distinctes (d1_exercices_ecoute_*), calculées sur
  // EXERCICES_ECOUTE.length, totalement indépendant de la section
  // exercices d'image.
  async function verifierRecompensesExercicesEcoute() {
    const attributions = [];
    // Palier 1 — les 4 réussis (≤ 1 faute) en FACILE.
    if (!recompensesExercicesEcouteDonnees.facile && exercicesEcouteReussisFacile.size === EXERCICES_ECOUTE.length) {
      recompensesExercicesEcouteDonnees.facile = true;
      attributions.push(attribuerRecompenseExercice('d2_exercices_ecoute_facile', 5, 0).then(function (accorde) {
        return accorde ? { piasses: 5, pointsBonis: 0 } : null;
      }));
    }
    // Palier 2 — les 4 réussis (≤ 1 faute) en DIFFICILE. Si le palier 1
    // n'a jamais été accordé (élève passé directement au difficile, sans
    // jamais réussir les 4 en facile), il est accordé EN MÊME TEMPS ici
    // — sinon un élève qui ne fait QUE du difficile ne toucherait jamais
    // les 5 P$ du palier 1, ce qui contredit la demande de Raphaël
    // ("avec les 5P$ automatiques du mode facile s'ils n'ont jamais été
    // accordés").
    if (!recompensesExercicesEcouteDonnees.difficile && exercicesEcouteReussisDifficile.size === EXERCICES_ECOUTE.length) {
      recompensesExercicesEcouteDonnees.difficile = true;
      if (!recompensesExercicesEcouteDonnees.facile) {
        recompensesExercicesEcouteDonnees.facile = true;
        attributions.push(attribuerRecompenseExercice('d2_exercices_ecoute_facile', 5, 0).then(function (accorde) {
          return accorde ? { piasses: 5, pointsBonis: 0 } : null;
        }));
      }
      attributions.push(attribuerRecompenseExercice('d2_exercices_ecoute_difficile', 5, 0).then(function (accorde) {
        return accorde ? { piasses: 5, pointsBonis: 0 } : null;
      }));
    }
    // Palier 3 (PB) — les 4 réussis SANS AUCUNE faute, spécifiquement en
    // difficile. Implique déjà le palier 2 (un exercice réussi sans
    // faute EST un exercice réussi) : exercicesEcouteReussisDifficile
    // est toujours rempli en même temps que
    // exercicesEcouteReussisSansErreurDifficile (voir
    // marquerCarteEcouteResolue), donc le bloc ci-dessus aura déjà
    // déclenché les paliers 1 et 2 dans CE MÊME appel si besoin — pas de
    // redéclenchement nécessaire ici.
    if (!recompensesExercicesEcouteDonnees.parfaitDifficile && exercicesEcouteReussisSansErreurDifficile.size === EXERCICES_ECOUTE.length) {
      recompensesExercicesEcouteDonnees.parfaitDifficile = true;
      attributions.push(attribuerRecompenseExercice('d2_exercices_ecoute_parfait_difficile', 0, 1).then(function (accorde) {
        return accorde ? { piasses: 0, pointsBonis: 1 } : null;
      }));
    }
    if (attributions.length === 0) return;

    const resultats = await Promise.all(attributions);
    let piassesGagnees = 0;
    let pointsBonisGagnes = 0;
    resultats.forEach(function (r) {
      if (!r) return;
      piassesGagnees += r.piasses;
      pointsBonisGagnes += r.pointsBonis;
    });
    if (piassesGagnees > 0 || pointsBonisGagnes > 0) {
      afficherRecompenseEtEnvoyerAuSac(piassesGagnees, pointsBonisGagnes, btnTerminerExercicesEcoute);
    }
  }

  // ---------- Mode difficile : réponse libre, correction progressive ----------
  function creerZoneDifficile(ex, carte, marquerFn) {
    const marquer = marquerFn || marquerCarteResolue;
    const wrapper = document.createElement('div');
    wrapper.style.display = 'flex';
    wrapper.style.flexDirection = 'column';
    wrapper.style.gap = '10px';

    const chips = document.createElement('div');
    chips.className = 'exercice-chips';
    chips.style.display = 'none';
    wrapper.appendChild(chips);

    const champ = document.createElement('input');
    champ.type = 'text';
    champ.className = 'exercice-champ';
    champ.placeholder = texteInterface('placeholderReponse');
    champ.autocomplete = 'off';
    champ.autocapitalize = 'off';
    champ.spellcheck = false;

    // 🆕 (14-08-2026, quatrième vague) : voir annoncerReponseEnCours plus
    // bas — permet au prof d'accompagner l'élève en direct sur cet
    // exercice précis (mode difficile = production écrite libre).
    champ.addEventListener('input', function () { annoncerReponseEnCours(ex, champ.value); });

    const ligneAction = document.createElement('div');
    ligneAction.className = 'exercice-ligne-action';
    const btnVerifier = document.createElement('button');
    btnVerifier.type = 'button';
    btnVerifier.className = 'exercice-btn-verifier';
    btnVerifier.textContent = texteInterface('boutonVerifier');
    ligneAction.appendChild(champ);
    ligneAction.appendChild(btnVerifier);
    wrapper.appendChild(ligneAction);

    const feedback = document.createElement('div');
    feedback.className = 'exercice-feedback';
    wrapper.appendChild(feedback);

    let essais = 0;
    let motsAcquis = []; // mots déjà confirmés lors d'un essai précédent

    function verifier() {
      const saisieComplete = motsAcquis.join(' ') + (motsAcquis.length ? ' ' : '') + champ.value;
      essais++;

      // 🆕 Teste la saisie contre chaque réponse acceptée (principale +
      // alternatives, voir reponsesAcceptees). Dès qu'une correspond
      // entièrement, c'est gagné. Sinon, on garde pour la suite (chips
      // de progrès) la réponse qui a le mieux avancé — utile si l'élève
      // commence à taper une alternative valable (ex. "le sandwich")
      // plutôt que la réponse principale : son progrès n'est pas perdu.
      let meilleurResultat = null;
      let meilleureReponse = ex.reponse;
      reponsesAcceptees(ex).forEach(function (reponseCandidate) {
        const resultat = evaluerReponseExercice(reponseCandidate, saisieComplete);
        if (resultat.correct) { meilleurResultat = resultat; meilleureReponse = reponseCandidate; }
      });

      if (meilleurResultat && meilleurResultat.correct) {
        champ.value = meilleureReponse.join(' ');
        champ.classList.remove('fautive');
        champ.classList.add('correcte');
        champ.disabled = true;
        btnVerifier.disabled = true;
        feedback.className = 'exercice-feedback correct';
        feedback.textContent = texteInterface('feedbackCorrect');
        marquer(carte, ex, 'difficile', essais === 1, true);
        return;
      }

      // Aucune réponse acceptée n'est encore complète : le progrès
      // partiel (chips) reste calculé sur la réponse PRINCIPALE
      // uniquement (jamais une alternative) — sinon les chips affichés
      // pourraient mélanger des mots de deux formulations différentes,
      // en désaccord avec le texte "La réponse était : ..." plus bas,
      // qui montre toujours ex.reponse.
      const resultatPrincipal = evaluerReponseExercice(ex.reponse, saisieComplete);
      motsAcquis = ex.reponse.slice(0, resultatPrincipal.indexErreur);
      chips.innerHTML = '';
      motsAcquis.forEach(function (mot) {
        const chip = document.createElement('span');
        chip.className = 'exercice-chip';
        chip.textContent = mot;
        chips.appendChild(chip);
      });
      chips.style.display = motsAcquis.length ? 'flex' : 'none';
      champ.value = '';
      champ.classList.add('fautive');

      if (essais >= 2) {
        champ.disabled = true;
        btnVerifier.disabled = true;
        champ.classList.remove('fautive');
        champ.classList.add('revele');
        feedback.className = 'exercice-feedback revele';
        feedback.textContent = texteInterface('reponseEtait') + ' ' + ex.reponse.join(' ');
        const chipsFinal = ex.reponse.slice(motsAcquis.length);
        chipsFinal.forEach(function (mot) {
          const chip = document.createElement('span');
          // 🐛 CORRIGÉ (Raphaël) : ces mots n'ont PAS été acquis par
          // l'élève, contrairement aux chips de motsAcquis juste au-dessus
          // (boucle motsAcquis.forEach, classe 'exercice-chip' seule,
          // verte, inchangée) — voir la note sur exercice-chip-revele.
          chip.className = 'exercice-chip exercice-chip-revele';
          chip.textContent = mot;
          chips.appendChild(chip);
        });
        chips.style.display = 'flex';
        marquer(carte, ex, 'difficile', false, false, etatErreur(ex, saisieComplete));
      } else {
        feedback.className = 'exercice-feedback presque';
        feedback.textContent = motsAcquis.length ? texteInterface('feedbackPresque') : '';
        champ.focus();
      }
    }

    btnVerifier.addEventListener('click', verifier);
    champ.addEventListener('keydown', function (e) { if (e.key === 'Enter') verifier(); });

    return wrapper;
  }

  // ---------- Mode facile : mots fournis, à remettre en ordre ----------
  // 🆕 (session du 13-08-2026, demande de Raphaël) : en plus des tuiles,
  // l'élève peut maintenant basculer vers une saisie manuelle — même
  // champ/bouton que le mode difficile (classes .exercice-champ/
  // .exercice-btn-verifier réutilisées telles quelles), mais avec la
  // correction "tout ou rien" du mode facile (comparaison à la phrase
  // entière, PAS la correction progressive mot à mot du mode difficile
  // — voir evaluerReponseExercice, réservée à creerZoneDifficile) :
  // rester fidèle à l'esprit "facile" même en tapant. Le compteur
  // d'essais (2 avant révélation) est PARTAGÉ entre les deux méthodes de
  // saisie — un élève qui rate une fois aux tuiles puis bascule vers le
  // clavier n'obtient pas un essai supplémentaire gratuit. La bascule
  // elle-même se désactive une fois l'exercice résolu ou révélé, comme
  // le reste de la carte.
  function creerZoneFacile(ex, carte, marquerFn) {
    const marquer = marquerFn || marquerCarteResolue;
    const wrapper = document.createElement('div');
    wrapper.style.display = 'flex';
    wrapper.style.flexDirection = 'column';
    wrapper.style.gap = '10px';

    const phraseConstruite = document.createElement('div');
    phraseConstruite.className = 'exercice-phrase-construite';

    const banque = document.createElement('div');
    banque.className = 'exercice-banque-mots';

    const zoneTuiles = document.createElement('div');
    zoneTuiles.style.display = 'flex';
    zoneTuiles.style.flexDirection = 'column';
    zoneTuiles.style.gap = '10px';
    zoneTuiles.appendChild(phraseConstruite);
    zoneTuiles.appendChild(banque);

    // ---------- Zone saisie manuelle (repliée par défaut) ----------
    const champ = document.createElement('input');
    champ.type = 'text';
    champ.className = 'exercice-champ';
    champ.placeholder = texteInterface('placeholderReponse');
    champ.autocomplete = 'off';
    champ.autocapitalize = 'off';
    champ.spellcheck = false;

    // 🆕 (14-08-2026, quatrième vague) : même branchement que la zone
    // difficile — voir annoncerReponseEnCours. Ce champ n'est visible que
    // si l'élève a basculé vers la saisie manuelle (modeSaisie === 'texte'),
    // mais l'écouteur peut rester posé inconditionnellement : aucun 'input'
    // ne peut se déclencher tant que le champ est caché/non focusé.
    champ.addEventListener('input', function () { annoncerReponseEnCours(ex, champ.value); });

    const btnVerifierTexte = document.createElement('button');
    btnVerifierTexte.type = 'button';
    btnVerifierTexte.className = 'exercice-btn-verifier';
    btnVerifierTexte.textContent = texteInterface('boutonVerifier');

    const ligneActionTexte = document.createElement('div');
    ligneActionTexte.className = 'exercice-ligne-action';
    ligneActionTexte.appendChild(champ);
    ligneActionTexte.appendChild(btnVerifierTexte);

    const zoneTexte = document.createElement('div');
    zoneTexte.style.display = 'none';
    zoneTexte.appendChild(ligneActionTexte);

    const lienBascule = document.createElement('button');
    lienBascule.type = 'button';
    lienBascule.className = 'exercice-lien-bascule';

    const feedback = document.createElement('div');
    feedback.className = 'exercice-feedback';

    const btnRecommencer = document.createElement('button');
    btnRecommencer.type = 'button';
    btnRecommencer.className = 'exercice-btn-recommencer';
    btnRecommencer.textContent = texteInterface('boutonRecommencer');
    btnRecommencer.style.display = 'none';
    btnRecommencer.style.alignSelf = 'flex-start';

    let essais = 0;
    let modeSaisie = 'tuiles'; // 'tuiles' | 'texte'
    let resolu = false; // correct OU révélé — gèle les deux méthodes de saisie
    // reponseChoisie contient des { mot, index } — index se référant à
    // motsMelanges, pour permettre de retirer précisément un mot cliqué
    // par erreur (utile depuis l'ajout des distracteurs, sinon un seul
    // clic sur un leurre forçait un recommencement complet).
    let reponseChoisie = [];
    // 🆕 banqueFacile (optionnel) : mode « choix multiple » — chaque
    // entrée est une phrase complète, un seul clic suffit (nbAChoisir
    // = 1), au lieu du mode habituel de remise en ordre mot par mot.
    // La bonne entrée doit correspondre exactement à ex.reponse.join(' ').
    const nbAChoisir = ex.banqueFacile ? 1 : ex.reponse.length;
    const motsDisponibles = ex.banqueFacile ? ex.banqueFacile.slice() : ex.reponse.concat(ex.distracteurs || []);
    let motsMelanges = melangerMots(motsDisponibles);

    function metAJourLienBascule() {
      lienBascule.textContent = texteInterface(modeSaisie === 'tuiles' ? 'basculerVersTexte' : 'basculerVersTuiles');
    }

    function basculerModeSaisie() {
      modeSaisie = modeSaisie === 'tuiles' ? 'texte' : 'tuiles';
      zoneTuiles.style.display = modeSaisie === 'tuiles' ? 'flex' : 'none';
      zoneTexte.style.display = modeSaisie === 'texte' ? 'block' : 'none';
      metAJourLienBascule();
      if (modeSaisie === 'texte') { champ.value = ''; champ.classList.remove('fautive', 'correcte'); champ.focus(); }
    }
    lienBascule.addEventListener('click', basculerModeSaisie);

    function rendreBanque() {
      banque.innerHTML = '';
      motsMelanges.forEach(function (mot, i) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'exercice-mot-btn';
        btn.textContent = mot;
        btn.dataset.indexMot = i;
        if (reponseChoisie.some(function (item) { return item.index === i; })) {
          btn.classList.add('utilise');
        }
        btn.addEventListener('click', function () {
          if (btn.classList.contains('utilise')) return;
          if (reponseChoisie.length >= nbAChoisir) return;
          btn.classList.add('utilise');
          reponseChoisie.push({ mot: mot, index: i });
          rendrePhraseConstruite();
          if (reponseChoisie.length === nbAChoisir) {
            verifier(reponseChoisie.map(function (item) { return item.mot; }).join(' '));
          }
        });
        banque.appendChild(btn);
      });
    }

    function rendrePhraseConstruite() {
      phraseConstruite.innerHTML = '';
      reponseChoisie.forEach(function (item) {
        const chip = document.createElement('span');
        // 🐛 CORRIGÉ (Raphaël) : item.revele distingue un mot RÉVÉLÉ après
        // échec (jamais choisi par l'élève, voir la branche essais >= 2 de
        // verifier()) d'un mot que l'élève a réellement cliqué/tapé — voir
        // la note sur exercice-chip-revele, même raisonnement que le mode
        // difficile juste au-dessus dans ce fichier.
        chip.className = 'exercice-chip exercice-chip-amovible' + (item.revele ? ' exercice-chip-revele' : '');
        chip.textContent = item.mot;
        chip.title = texteInterface('boutonRecommencer');
        chip.addEventListener('click', function () {
          if (resolu) return;
          // Retirer ce mot précis (et non tout recommencer) — remet le
          // bouton correspondant dans la banque.
          reponseChoisie = reponseChoisie.filter(function (autre) { return autre.index !== item.index; });
          const btnCorrespondant = banque.querySelector('[data-index-mot="' + item.index + '"]');
          if (btnCorrespondant) btnCorrespondant.classList.remove('utilise');
          feedback.textContent = '';
          feedback.className = 'exercice-feedback';
          rendrePhraseConstruite();
        });
        phraseConstruite.appendChild(chip);
      });
      // 🆕 (14-08-2026, cinquième vague — "voir autant que possible") :
      // annonce aussi la construction par TUILES, pas seulement la saisie
      // clavier — demande explicite de Raphaël d'aller aussi loin que
      // possible pour épauler l'élève. Rappelée à chaque ajout ET retrait
      // de mot (cette fonction gère les deux), donc reste synchronisée en
      // continu avec la phrase en cours de construction. Vide (aucun mot
      // encore choisi) envoie quand même l'annonce — utile pour effacer un
      // ancien "en train d'écrire" resté affiché côté widget.
      if (!resolu) annoncerReponseEnCours(ex, reponseChoisie.map(function (item) { return item.mot; }).join(' '));
    }

    function reinitialiser() {
      reponseChoisie = [];
      motsMelanges = melangerMots(motsDisponibles);
      champ.value = '';
      champ.classList.remove('fautive', 'correcte');
      feedback.textContent = '';
      feedback.className = 'exercice-feedback';
      btnRecommencer.style.display = 'none';
      rendreBanque();
      rendrePhraseConstruite();
    }

    // 🆕 Cœur commun aux deux méthodes de saisie — reçoit la phrase déjà
    // assemblée (jointe par des espaces), qu'elle vienne des tuiles
    // cliquées ou du champ texte. Correction "tout ou rien", identique
    // à l'ancien verifierFacile() : c'est ce qui distingue ce mode du
    // mode difficile (progressif, voir creerZoneDifficile), même quand
    // la saisie se fait maintenant au clavier ici aussi.
    function verifier(texteBrutChoisi) {
      if (resolu) return;
      essais++;
      const texteChoisi = texteBrutChoisi.trim().toLowerCase();
      const correct = reponsesAcceptees(ex).some(function (reponseCandidate) {
        return texteChoisi === reponseCandidate.join(' ').toLowerCase();
      });
      if (correct) {
        resolu = true;
        feedback.className = 'exercice-feedback correct';
        feedback.textContent = texteInterface('feedbackCorrect');
        champ.value = ex.reponse.join(' ');
        champ.classList.remove('fautive');
        champ.classList.add('correcte');
        champ.disabled = true;
        btnVerifierTexte.disabled = true;
        lienBascule.style.display = 'none';
        marquer(carte, ex, 'facile', essais === 1, true);
        return;
      }
      if (essais >= 2) {
        resolu = true;
        feedback.className = 'exercice-feedback revele';
        feedback.textContent = texteInterface('reponseEtait') + ' ' + ex.reponse.join(' ');
        reponseChoisie = ex.reponse.map(function (mot) { return { mot: mot, index: -1, revele: true }; });
        rendrePhraseConstruite();
        champ.value = ex.reponse.join(' ');
        champ.classList.remove('fautive');
        champ.classList.add('revele');
        champ.disabled = true;
        btnVerifierTexte.disabled = true;
        lienBascule.style.display = 'none';
        marquer(carte, ex, 'facile', false, false, etatErreur(ex, texteBrutChoisi));
      } else {
        feedback.className = 'exercice-feedback presque';
        feedback.textContent = texteInterface('feedbackPresque');
        champ.classList.add('fautive');
        btnRecommencer.style.display = 'inline-block';
      }
    }

    btnVerifierTexte.addEventListener('click', function () { verifier(champ.value); });
    champ.addEventListener('keydown', function (e) { if (e.key === 'Enter') verifier(champ.value); });
    btnRecommencer.addEventListener('click', reinitialiser);

    metAJourLienBascule();
    rendreBanque();
    wrapper.appendChild(zoneTuiles);
    wrapper.appendChild(zoneTexte);
    wrapper.appendChild(lienBascule);
    wrapper.appendChild(feedback);
    wrapper.appendChild(btnRecommencer);
    return wrapper;
  }

  function melangerMots(mots) {
    const copie = mots.slice();
    for (let i = copie.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = copie[i]; copie[i] = copie[j]; copie[j] = tmp;
    }
    // Un ordre différent de l'ordre correct dès que possible, pour ne
    // pas donner la réponse gratuitement quand elle tient en 2-3 mots.
    if (copie.length > 1 && copie.join(' ') === mots.join(' ')) {
      const tmp = copie[0]; copie[0] = copie[1]; copie[1] = tmp;
    }
    return copie;
  }

  // 🆕 (15-08-2026) Mène désormais à la section écoute plutôt que de
  // terminer directement la leçon (phase 2 du chantier) — c'est
  // btnTerminerExercicesEcoute, juste en dessous, qui appelle terminerLecon().
  btnTerminerExercices.addEventListener('click', afficherExercicesEcoute);
  btnTerminerExercicesEcoute.addEventListener('click', terminerLecon);


  async function terminerLecon() {
    if (leconTerminee) return;
    leconTerminee = true;
    btnSuivant.disabled = true;
    btnSuivant.textContent = 'Enregistrement…';
    try {
      // 🐛 CORRIGÉ : attend restaurationSessionPromesse (voir tout en
      // haut du fichier) avant d'écrire — même raison que
      // toucherSandwich(). C'est ici le point le plus critique : sans ce
      // await, un élève connecté qui termine vite pourrait voir tout le
      // chapitre 'd2' marqué complété en mode invité (localStorage) au
      // lieu de son compte.
      await restaurationSessionPromesse;
      await KebBekProgression.marquerChapitreComplete('d2');
    } catch (e) {
      console.warn('dialogue-d2.html : impossible d\u2019enregistrer la fin du dialogue.', e);
    }

  // individuels (bulle active + chaque réplique déjà dans la pile) —
  // l'élève choisit quoi écouter et quand, comme demandé.
  // ================================================================
  let voixFrancaise = null;
  function choisirVoixFrancaise() {
    if (!('speechSynthesis' in window)) return null;
    const voix = window.speechSynthesis.getVoices();
    if (!voix.length) return null;
    // Préférence fr-CA (accent québécois) si présente sur l'appareil,
    // sinon n'importe quelle voix française — mieux que de forcer
    // fr-FR et se retrouver sans voix du tout sur certains systèmes.
    return voix.find(v => v.lang === 'fr-CA') ||
           voix.find(v => v.lang && v.lang.toLowerCase().startsWith('fr')) ||
           null;
  }
  const synthesesDisponibles = 'speechSynthesis' in window;
  if (synthesesDisponibles) {
    voixFrancaise = choisirVoixFrancaise();
    // Sur Chrome, la liste des voix arrive de façon asynchrone après le
    // chargement de la page — sans ça, le tout premier essai peut se
    // retrouver sans voix française sélectionnée.
    window.speechSynthesis.onvoiceschanged = () => { voixFrancaise = choisirVoixFrancaise(); };
  }

  function lireAudio(texte) {
    if (!synthesesDisponibles || !texte) return;
    // Retire toute balise HTML par prudence (texte vient normalement
    // déjà en texte brut depuis ETAPES/EXERCICES, mais mieux vaut ne
    // jamais faire lire des chevrons à la synthèse).
    const propre = String(texte).replace(/<[^>]*>/g, '').trim();
    if (!propre) return;
    window.speechSynthesis.cancel(); // une seule lecture à la fois
    const enonce = new SpeechSynthesisUtterance(propre);
    enonce.lang = voixFrancaise ? voixFrancaise.lang : 'fr-FR';
    if (voixFrancaise) enonce.voice = voixFrancaise;
    enonce.rate = 0.92; // légèrement ralenti, public débutant
    window.speechSynthesis.speak(enonce);
  }

  function annoncerReponseEnCours(ex, texte) {

  function etatErreur(ex, reponseDonnee) {

      if (reussi) {
        elInvite.classList.add('kbb-session-cachee');
        elActif.classList.remove('kbb-session-cachee');
        message.textContent = '';
      }
    });

    champCode.addEventListener('keydown', function (e) { if (e.key === 'Enter') btnRejoindre.click(); });

    btnQuitter.addEventListener('click', function () {
      sessionClasse.quitterSession();
      syncControleBloque = false;
      elActif.classList.add('kbb-session-cachee');
      elInvite.classList.remove('kbb-session-cachee');
      message.textContent = '';
      champCode.value = '';
      rafraichirListeSessionsKbb();
    });
  })();

  rendreEtape();
</script>

</body>
</html>
