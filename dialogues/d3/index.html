  /* ==================================================================
     dialogue-d3.html — TROISIÈME leçon de dialogue du site (id 'd3'

       (1) Bek à l'avant-scène, en aparté (parfois tournée vers nous,

       (2) Bek « Eh, Keb ! Il est bon, le sandwich ? »

     🐛 CORRIGÉ (retour Raphaël, 16-08-2026) : une première ébauche de

     Callback volontaire à d2 : Keb corrige lui-même « bon » en

     fait faire en d2 — d'où la remarque de Bek. Échange encore une fois

     GRAMMAIRE — cinq points nouveaux (clés `g...`, voir GRAMMAIRE plus
     bas), tous confirmés par Raphaël (session du 16-08-2026) :
       a) gTroisiemePersonne — 3e pers. sing. des verbes en -er : on
          retire le -er (manger → mang-) et on ajoute -e. Ressemble
          volontairement à l'impératif informel déjà enseigné en d1
          (« Mange ! »), donc rien de déboussolant.
       b) gFeminin — PREMIÈRE apparition du féminin sur le site :
          « une chaise » (une = équivalent féminin de un). Contrairement
          à d1/d2 (voir note GENRE ci-dessous, maintenant obsolète), le
          féminin est ici explicitement nommé, pas juste affiché dans
          le sac à dos.
       c) gInsistance — structure « Il est bon, le sandwich ? » :
          répétition du sujet/objet par insistance/précision, formule
          ordinaire à l'oral, pas une bizarrerie.
       d) gIl — le pronom « il », 3e pers. masc. sing. (Le sandwich est

       e) gApprendre — le verbe irrégulier « apprendre » (Il apprend).

     GENRE (masculin/féminin) — 🐛 note historique de d1/d2 devenue
     caduque ici : « le »/« un » y étaient présentés comme deux

     MÉCANIQUE — inchangée par rapport à d2, DEUX choses bien séparées,

       1. La bulle du haut (#bulleDialogue) : UNE SEULE réplique visible à

            b) #pileGrammaire : les notes grammaticales, dans la langue de

     IMAGES : aucune illustration propre à cette leçon n'existe encore.

     DÉBLOCAGE DE CARTE — nouveau mécanisme (voir bravo-mecanique-
     synthese_v8.md, section 17, et le patron déjà câblé en d1 pour « Le

       1. Les 5 exercices résolus, peu importe le niveau ou le nombre

  :root {
    --fond: #F2EDE3;
    --brun: #665045;
    --brun-fonce: #4A3B33;
    --peche: #F0A98B;
    --peche-fonce: #E08867;
    --peche-pale: #FBEAE2;
    --bek-couleur: #C97B3D;
    --keb-couleur: #5B7FA6;
    --ombre: rgba(102, 80, 69, 0.16);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: var(--fond);
  }

  body {
    font-family: 'Baloo 2', 'Noto Sans', sans-serif;
    color: var(--brun-fonce);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 60px;
  }

  /* ---------- Retour vers le parcours ---------- */
  .retour {
    position: fixed;
    top: 20px;
    left: 20px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #FFFFFF;
    color: var(--brun);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
    text-decoration: none;
    box-shadow: 0 2px 8px var(--ombre);
    opacity: 0.85;
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index: 20;
  }
  .retour:hover { opacity: 1; transform: scale(1.08); }

  .compteur {
    font-weight: 700;
    font-size: 0.9rem;
    color: var(--brun);
    opacity: 0.75;
    margin-bottom: 14px;
    letter-spacing: 0.02em;
  }

  /* ---------- Légende unique, au-dessus des personnages ---------- */
  /* 🆕 (session du 08-08-2026, 2e échange) : Raphaël ne veut PAS l'habillage
     "bulle de BD" (encadré + pointe triangulaire vers le personnage) —
     juste du texte présenté comme dans intro-bonomes.html (.legende-intro :
     encadré doux coloré selon le personnage, SANS pointe). Donc même boîte
     que .legende-intro, mais SANS le ::after qui existait ici avant. Le
     positionnement au-dessus des personnages, lui, reste : la légende vit
     simplement AVANT l'image dans le flux normal du document (pas de
     superposition en absolute), donc "au-dessus" sans jamais rien
     recouvrir — c'est cette partie-là qui n'a pas changé. */
  /* 🆕 (session du 08-08-2026, 3e échange) : les répliques flottaient trop
     loin au-dessus des têtes — les images sources ont une bonne marge vide
     en haut/en bas du cadre, donc même juste avant la scène dans le flux,
     l'écart visuel restait grand. Deux correctifs : la légende est décalée
     vers l'intérieur (padding sur .zone-bulle) plutôt que collée à
     l'extrême bord, ET l'image est légèrement zoomée/recadrée (voir
     .scene-dialogue overflow:hidden + transform sur .image-scene plus bas)
     pour réduire cette marge vide et rapprocher visuellement les têtes du
     haut du cadre. */
  .zone-bulle {
    display: flex;
    width: min(92vw, 560px);
    min-height: 60px;
    align-items: flex-end;
    gap: 8px;
    padding: 0 5%;
  }

  /* ---------- Session en direct (session-classe.js, 14-08-2026) ---------- */
  .kbb-session {
    width: min(92vw, 400px);
    margin-bottom: 10px;
    font-family: 'Baloo 2', sans-serif;
  }
  .kbb-session-cachee { display: none !important; }

  .kbb-session-invite {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .kbb-session-etiquette {
    font-weight: 700;
    font-size: 0.78rem;
    color: var(--brun);
    opacity: 0.75;
  }
  .kbb-session-ligne { display: flex; gap: 6px; flex: 1; min-width: 160px; }
  .kbb-session-champ {
    font-family: inherit;
    font-size: 0.82rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    border: 1.5px solid var(--peche);
    border-radius: 10px;
    padding: 6px 9px;
    background: #FFFFFF;
    color: var(--brun-fonce);
    width: 90px;
  }
  .kbb-session-champ:focus { outline: 2px solid var(--peche-fonce); outline-offset: 1px; }
  .kbb-session-bouton, .kbb-session-bouton-quitter {
    font-family: inherit;
    font-weight: 700;
    font-size: 0.78rem;
    border: none;
    border-radius: 999px;
    padding: 7px 14px;
    cursor: pointer;
  }
  .kbb-session-bouton { background: var(--peche-fonce); color: #FFFFFF; }
  .kbb-session-bouton:hover:not(:disabled) { opacity: 0.88; }
  .kbb-session-bouton:disabled { opacity: 0.55; cursor: default; }
  .kbb-session-bouton-quitter {
    background: transparent;
    border: 1.5px solid var(--peche);
    color: var(--brun);
  }
  .kbb-session-bouton-quitter:hover { background: var(--peche-pale, rgba(240, 169, 139, 0.16)); }

  .kbb-session-actif {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: var(--peche-pale, rgba(240, 169, 139, 0.16));
    border-radius: 12px;
    padding: 8px 12px;
  }
  .kbb-session-statut { font-weight: 700; font-size: 0.82rem; color: var(--brun-fonce); }

  .kbb-session-message {
    margin: 4px 0 0;
    font-size: 0.75rem;
    color: #b0402c;
    min-height: 1em;

  /* 🆕 (15-08-2026) même liste que le bandeau de parcours.html (voir
     .bse-liste-sessions/.bse-session-pill là-bas) — reprise ici avec les
     classes kbb- pour rester cohérente avec le reste de ce bandeau-ci. */
  }
  .kbb-session-liste {
    width: 100%;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 6px;
  }
  .kbb-session-pastille {
    font-family: inherit;
    font-weight: 700;
    font-size: 0.76rem;
    border: 1.5px solid var(--peche);
    border-radius: 999px;
    padding: 6px 13px;
    background: #FFFFFF;
    color: var(--brun-fonce);
    cursor: pointer;
  }
  .kbb-session-pastille:hover:not(:disabled) { background: var(--peche-pale, rgba(240, 169, 139, 0.16)); }
  .kbb-session-pastille:disabled { opacity: 0.55; cursor: default; }

  .bulle-dialogue {
    position: relative;
    width: fit-content;
    max-width: 82%;
    font-weight: 700;
    font-size: clamp(1.05rem, 3vw, 1.35rem);
    line-height: 1.35;
    padding: 12px 20px;
    background: #FFFFFF;
    border-radius: 18px;
    box-shadow: 0 4px 14px var(--ombre);
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.3s ease, transform 0.3s ease;
    /* 🆕 (15-08-2026) : width: fit-content ci-dessus fait déjà que la bulle
       épouse la ligne la plus longue plutôt que de s'étirer sur toute la
       largeur disponible ; text-wrap: balance répartit en plus le texte
       entre les lignes de façon plus équilibrée qu'un retour à la ligne
       "au plus près", pour éviter une 2e ligne très courte perdue dans
       une bulle large — demande explicite de Raphaël (bulle mal utilisée
       par rapport au texte). Filet de sécurité pour navigateurs sans
       support (rare) : le retour à la ligne standard reste correct. */
    text-wrap: balance;
  }
  .bulle-dialogue.in { opacity: 1; transform: translateY(0); }
  /* 🆕 (15-08-2026) : étape silencieuse d'ouverture (ETAPES[0]) — pas de
     bulle du tout, plutôt qu'une bulle vide qui prendrait quand même sa
     place dans la mise en page. */
  .bulle-dialogue.bulle-vide { display: none; }
  /* 🆕 (15-08-2026) : le bouton audio de la bulle n'a rien à lire pendant
     l'étape silencieuse — inutile de le laisser visible (même si audio-actif
     est activé) pour un clic qui ne ferait rien. */
  .zone-bulle:has(.bulle-vide) .bouton-audio-bulle { display: none; }

  .bulle-dialogue.cote-keb { margin-right: auto; text-align: left; border: 2.5px solid var(--keb-couleur); color: var(--keb-couleur); }
  .bulle-dialogue.cote-bek { margin-left: auto; text-align: right; border: 2.5px solid var(--bek-couleur); color: var(--bek-couleur); }
  /* Pas de pointe triangulaire (::after) ici — c'était le seul élément qui
     faisait "bulle de BD" plutôt que simple texte encadré ; retiré à la
     demande de Raphaël. cote-keb reste aligné à gauche, décalé du bord par
     le padding de .zone-bulle plutôt que flush à 0. */

  /* ---------- Scène (personnages) ---------- */
  .scene-dialogue {
    position: relative;
    width: min(92vw, 560px);
    aspect-ratio: 1408 / 768;
    overflow: hidden; /* 🆕 nécessaire pour que le zoom ci-dessous recadre au lieu de déborder */
    margin-top: 4px;
  }

  .scene-dialogue img.image-scene {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    /* 🆕 (15-08-2026) : explicite plutôt que la valeur par défaut du
       navigateur — pour la transition automatique de ETAPES[0] (image
       silencieuse → question de Bek), les deux images doivent s'ancrer au
       même point pendant le fondu. Vérifié : les deux fichiers actuels
       (d2_01_..._01/02.webp) sont déjà alignés ligne pour ligne (même
       cadrage), donc rien à corriger sur ces deux-là — object-position
       verrouille ce comportement pour la suite. */
    object-position: center center;
    display: block;
    transform: none; /* 🆕 (6e échange) : le zoom coupait la queue de cheval de Bek — annulé, priorité à ne jamais rogner les personnages */
    -webkit-mask-image: radial-gradient(ellipse 94% 90% at center, #000 74%, transparent 100%);
    mask-image: radial-gradient(ellipse 94% 90% at center, #000 74%, transparent 100%);
  }

  /* ---------- Sandwich greffé (étape "Ton sandwich ?", dernier temps de
     la séquence auto) — flotte doucement avec une lueur chaude pulsante
     autour, à l'emplacement de l'étoile déjà présente dans l'image de
     base. Voir creerImageComposite(). ---------- */
  .sandwich-greffe {
    position: absolute;
    left: 52.7%;
    top: 37%;
    width: 19%;
    transform: translate(-50%, -50%);
    animation: sandwichFlotte 2.6s ease-in-out infinite;
  }
  .sandwich-greffe-lueur {
    position: absolute;
    inset: -35%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 209, 128, 0.65) 0%, rgba(255, 209, 128, 0) 72%);
    animation: sandwichLueur 2.6s ease-in-out infinite;
    z-index: 0;
  }
  .sandwich-greffe-img {
    position: relative;
    z-index: 1;
    width: 100%;
    display: block;
    filter: drop-shadow(0 6px 12px rgba(120, 80, 40, 0.35));
  }
  @keyframes sandwichFlotte {
    0%, 100% { transform: translate(-50%, -50%); }
    50% { transform: translate(-50%, calc(-50% - 9px)); }
  }
  @keyframes sandwichLueur {
    0%, 100% { opacity: 0.75; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.1); }
  }

  }

  .pile-section-titre {
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--brun-clair, #8A7364);
    margin: 0 0 6px 4px;
  }

  /* 🆕 En-tête de "Ce qui a été dit" : titre + bouton de bascule globale
     pour la traduction phrase par phrase (demande de Raphaël — le
     mot-à-mot seul "n'est pas suffisant"). */
  .pile-entete {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin: 0 0 6px 4px;
  }
  .pile-entete .pile-section-titre { margin: 0; }
  .btn-toggle-trad {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    border: 1px solid var(--gris-verrou, #DDD2C4);
    background: #FFFFFF;
    color: var(--brun-clair, #8A7364);
    border-radius: 999px;
    padding: 3px 10px 3px 8px;
    font-family: inherit;
    font-size: 0.66rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .btn-toggle-trad:hover { background: var(--beige-doux, #F4EEE4); }
  .btn-toggle-trad svg { width: 12px; height: 12px; }
  .btn-toggle-trad.actif { background: var(--peche-fonce, #D98C63); border-color: var(--peche-fonce, #D98C63); color: #FFFFFF; }

  /* 🆕 (15-08-2026) Bouton 🔊 de la bulle active — jumeau visuel du
     bouton "traduction" mais rond, à côté de la bulle plutôt que dedans
     (voir HTML : sibling de #bulleDialogue dans .zone-bulle). Caché par
     défaut, révélé par body.audio-actif (voir btnToggleAudio). */
  .bouton-audio-bulle {
    flex-shrink: 0;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: none;
    display: none;
    align-items: center;
    justify-content: center;
    background: var(--peche-fonce, #D98C63);
    color: #FFFFFF;
    cursor: pointer;
    margin-bottom: 6px;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  .bouton-audio-bulle svg { width: 16px; height: 16px; }
  .bouton-audio-bulle:hover { transform: scale(1.08); }
  .bouton-audio-bulle:active { opacity: 0.7; transform: scale(0.96); }
  body.audio-actif .bouton-audio-bulle { display: flex; }

  .pile-dialogue { display: flex; flex-direction: column; gap: 2px; }

  .pile-item {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    max-height: 0;
    opacity: 0;
    overflow: hidden;
    transition: max-height 0.3s ease, opacity 0.3s ease, margin 0.3s ease;
  }
  .pile-item.in { opacity: 1; max-height: 220px; margin: 7px 0; overflow: visible; }

  .pile-avatar {
    flex-shrink: 0;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.72rem;
    font-weight: 700;
    color: #FFFFFF;
    background: var(--c, var(--brun));
    /* 🆕 Cliquable/touchable : révèle la traduction de CETTE réplique
       seule (en plus du bouton global). Même logique que le mot-à-mot :
       un clic/tap direct sur l'élément d'intérêt. */
    cursor: pointer;
    border: none;
    padding: 0;
    font-family: inherit;
    transition: transform 0.15s ease;
  }
  .pile-avatar:hover { transform: scale(1.08); }
  .pile-item.keb { --c: var(--keb-couleur); }
  .pile-item.bek { --c: var(--bek-couleur); }

  .pile-corps { flex: 1; min-width: 0; }
  .pile-qui { display: block; font-size: 0.68rem; font-weight: 700; color: var(--c, var(--brun)); margin-bottom: 1px; }
  .pile-texte {
    font-size: 0.92rem;
    line-height: 1.35;
    cursor: pointer;
    /* 🆕 Le texte lui-même est aussi cliquable — deuxième façon d'accéder
       à la traduction de la phrase, en plus du cercle-avatar. */
  }
  .pile-trad {
    font-size: 0.82rem;
    line-height: 1.3;
    color: var(--peche-fonce, #D98C63);
    font-style: italic;
    max-height: 0;
    opacity: 0;
    overflow: hidden;
    transition: max-height 0.25s ease, opacity 0.25s ease, margin 0.25s ease;
  }
  .pile-trad.visible { max-height: 80px; opacity: 1; margin-top: 3px; }

  /* 🆕 (15-08-2026) Bouton 🔊 par réplique de la pile — même logique
     de révélation que .bouton-audio-bulle (body.audio-actif). Discret
     (transparent, pas de fond) pour ne pas rivaliser avec pile-avatar. */
  .pile-audio {
    flex-shrink: 0;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: none;
    display: none;
    align-items: center;
    justify-content: center;
    background: transparent;
    color: var(--peche-fonce, #D98C63);
    cursor: pointer;
    padding: 0;
    font-family: inherit;
    transition: transform 0.15s ease;
  }
  .pile-audio svg { width: 14px; height: 14px; }
  .pile-audio:hover { transform: scale(1.15); }
  body.audio-actif .pile-audio { display: flex; }

  /* Notes grammaticales — même langage visuel qu'un contenu d'aide
     ponctuel ailleurs sur le site (.sac-intro dans sac-a-dos.css,
     .iden-indice-mot dans identite-eleve.css) : fond pêche-pâle, pour
     que ce ne soit jamais confondu avec une réplique du dialogue. */
  .pile-grammaire { display: flex; flex-direction: column; gap: 8px; }

  .grammaire-item {
    max-height: 0;
    opacity: 0;
    overflow: hidden;
    padding: 0 14px;
    background: var(--peche-pale);
    border-radius: 12px;
    font-size: 0.84rem;
    line-height: 1.45;
    color: var(--brun-fonce);
    transition: max-height 0.3s ease, opacity 0.3s ease, padding 0.3s ease;
  }
  .grammaire-item.in { opacity: 1; max-height: 160px; padding: 10px 14px; overflow: visible; }

  /* 🆕 (16-08-2026, chantier "contexte + grammaire dans le sac") : voir
     dialogue-d1.html pour la même règle, même intention. */
  .grammaire-ajouter-sac {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin-top: 8px;
    padding: 3px 10px;
    border: 1px solid rgba(102, 80, 69, 0.25);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.5);
    color: var(--brun-fonce);
    font: inherit;
    font-size: 0.72rem;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .grammaire-ajouter-sac:hover { background: #fff; border-color: var(--peche-fonce); }
  .grammaire-ajouter-sac.ajoute { color: #2E7D32; border-color: #2E7D32; }
  .grammaire-ajouter-sac svg { width: 12px; height: 12px; flex-shrink: 0; }

  @media (max-width: 460px) {
    .bulle-dialogue { font-size: 1rem; padding: 10px 16px; }
    .bouton-nav { padding: 9px 20px; font-size: 0.88rem; }
  }

  /* ---------- Mots cliquables dans la bulle active ----------
     Repris À L'IDENTIQUE (mêmes noms de classes) du mécanisme déjà
     enseigné ailleurs sur le site (identite-eleve.css/.js) — demande
     explicite de Raphaël : "le mécanisme du sac demeure partout". Un
     clic/tap affiche la traduction (bulle .iden-tooltip-mot) ; un
     double-clic/double-tap range le mot dans le sac (vol animé vers
     #sacBouton, voir animerMotVersSac dans le script plus bas). Seule
     la pile #pileDialogue (réplique déjà passée) reste du texte inerte
     — seule la bulle ACTIVE est interactive, comme dans l'introduction. */
  .iden-mot {
    cursor: pointer;
    position: relative;
    display: inline-block;
    transition: color 0.15s ease, text-shadow 0.25s ease;
    animation: iden-lueur-mot 2.6s ease-in-out infinite;
    touch-action: manipulation; /* évite le zoom natif au double-tap, voir identite-eleve.css */
  }
  @keyframes iden-lueur-mot {
    0%, 100% { text-shadow: 0 0 0 rgba(224, 136, 103, 0); }
    50%      { text-shadow: 0 0 14px rgba(224, 136, 103, 0.5); }
  }
  .iden-mot:hover { color: var(--peche-fonce); animation: none; text-shadow: 0 0 16px rgba(224, 136, 103, 0.6); }

  @keyframes iden-flash-ajout {
    0%   { text-shadow: 0 0 0 rgba(111, 174, 94, 0); }
    30%  { color: #4C8A3E; text-shadow: 0 0 18px rgba(111, 174, 94, 0.85); }
    100% { text-shadow: 0 0 0 rgba(111, 174, 94, 0); }
  }
  .iden-mot.flash-ajout { animation: iden-flash-ajout 0.7s ease; }

  .iden-mot-vole {
    position: fixed;
    z-index: 250;
    font-weight: 700;
    font-size: 1rem;
    color: var(--peche-fonce);
    pointer-events: none;
    white-space: nowrap;
    transition: transform 0.55s cubic-bezier(.4, 0, .3, 1), opacity 0.55s ease;
    transform: translate(0, 0) scale(1);
    opacity: 1;
  }
  .iden-mot-vole.en-vol { transform: translate(var(--vol-dx), var(--vol-dy)) scale(0.3); opacity: 0; }

  /* 🆕 Récompense P$/PB à la section exercices (demande de Raphaël,
     session du 13-08-2026) : un petit badge apparaît près du bouton
     Terminer pour indiquer QUAND et COMBIEN de P$/PB viennent d'être
     gagnés (uniquement quand il y a effectivement un gain — voir
     afficherRecompenseEtEnvoyerAuSac plus bas), puis s'envole vers
     #sacBouton — même mécanique de vol que .iden-mot-vole ci-dessus,
     dans une classe séparée pour ne jamais se confondre avec le vol
     des mots. */
  .recompense-toast {
    position: fixed;
    z-index: 260;
    left: 50%;
    background: #FFFFFF;
    color: var(--peche-fonce);
    font-weight: 700;
    font-size: 0.95rem;
    padding: 10px 18px;
    border-radius: 999px;
    box-shadow: 0 4px 16px var(--ombre);
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transform: translate(-50%, 12px) scale(0.85);
    transition: transform 0.35s cubic-bezier(.34, 1.56, .64, 1), opacity 0.35s ease;
  }
  .recompense-toast.montre { opacity: 1; transform: translate(-50%, 0) scale(1); }
  .recompense-toast.en-vol {
    transition: transform 0.55s cubic-bezier(.4, 0, .3, 1), opacity 0.55s ease;
    transform: translate(var(--vol-dx), var(--vol-dy)) scale(0.3);
    opacity: 0;
  }

  .iden-tooltip-mot {
    position: absolute;
    left: 50%;
    top: calc(100% + 10px);
    transform: translateX(-50%);
    font-family: 'Baloo 2', sans-serif;
    font-size: 0.7rem;
    font-weight: 700;
    color: var(--brun-fonce);
    background: #FFFFFF;
    border: 1.5px solid var(--peche);
    border-radius: 8px;
    padding: 3px 8px;
    white-space: nowrap;
    z-index: 3;
    pointer-events: none;
  }
  .iden-tooltip-mot::after, .iden-tooltip-mot::before {
    content: '';
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    border-left: 6px solid transparent;
    border-right: 6px solid transparent;
  }
  .iden-tooltip-mot::after { bottom: 100%; border-bottom: 7px solid var(--peche); }
  .iden-tooltip-mot::before { bottom: calc(100% - 1.5px); border-bottom: 6px solid #FFFFFF; z-index: 1; }

  /* ---------- 🆕 Section exercices ---------- */
  #sectionExercices {
    width: min(92vw, 560px);
    margin: 34px 0 40px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  /* 🐛 CORRIGÉ (15-08-2026, retour Raphaël, capture d'écran "disposition
     étrange") : #sectionExercicesEcoute n'avait JAMAIS reçu l'équivalent
     de la règle #sectionExercices ci-dessus — sans largeur ni mise en page
     flex, ses enfants (.exercices-transition, #conteneurExercicesEcoute,
     les .exercice-carte) retombaient en bloc plein-largeur par défaut,
     d'où le fouillis constaté (cartes très larges, grands vides, chevau-
     chement avec le widget "Cours en direct"). Même règle, verbatim. */
  #sectionExercicesEcoute {
    width: min(92vw, 560px);
    margin: 34px 0 40px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  .exercices-transition { text-align: center; padding: 6px 8px 2px; }
  .exercices-transition-titre {
    font-family: 'Baloo 2', sans-serif;
    font-size: 1.5rem;
    font-weight: 800;
    color: var(--peche-fonce);
    margin-bottom: 6px;
  }
  .exercices-transition-intro {
    font-size: 0.88rem;
    color: var(--brun-clair, #8A7364);
    line-height: 1.4;
  }

  .exercice-carte {
    background: #FFFFFF;
    border-radius: 20px;
    box-shadow: 0 14px 36px var(--ombre);
    padding: 18px 18px 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    transition: box-shadow 0.2s ease;
  }
  .exercice-carte.resolue { box-shadow: 0 6px 18px var(--ombre); }

  .exercice-image-cadre {
    width: 100%;
    max-height: 220px;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    border-radius: 14px;
    background: var(--peche-pale);
  }
  .exercice-image-cadre img { max-width: 100%; max-height: 220px; object-fit: contain; }
  .exercice-image-cadre .repli-image-manquante {
    font-size: 0.75rem;
    color: var(--brun-clair, #8A7364);
    padding: 30px 10px;
  }

  /* 🆕 (15-08-2026) Carte d'écoute (creerCarteExercice, ex.type === 'ecoute') :
     même gabarit que .exercice-image-cadre (largeur, hauteur max, fond) pour
     que les deux types de carte restent visuellement cohérents dans la même
     grille — mais avec un gros bouton 🔊 rond au centre à la place d'une
     image. Même couleur/forme que .bouton-audio-bulle (identité visuelle du
     bouton audio sur tout le site), juste agrandi puisqu'il est ici le
     contenu principal de la carte plutôt qu'un accessoire à côté d'une bulle. */
  .exercice-audio-cadre {
    width: 100%;
    max-height: 220px;
    min-height: 130px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 10px;
    border-radius: 14px;
    background: var(--peche-pale);
  }
  /* 🆕 (15-08-2026) Étiquette visible uniquement du prof (voir
     estProfesseurConfirme, creerCarteExercice) — bordure en pointillés et
     icône 👁️ pour bien marquer visuellement "ceci n'existe pas côté
     élève", plutôt qu'un simple texte qui pourrait passer pour un élément
     normal de l'interface. */
  .exercice-phrase-prof {
    margin: 0;
    max-width: 90%;
    font-size: 0.8rem;
    font-weight: 700;
    text-align: center;
    color: var(--brun-fonce, var(--brun));
    background: #FFFFFF;
    border: 1.5px dashed var(--peche-fonce, #D98C63);
    border-radius: 10px;
    padding: 5px 10px;
  }
  .exercice-btn-ecouter {
    flex-shrink: 0;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--peche-fonce, #D98C63);
    color: #FFFFFF;
    cursor: pointer;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  .exercice-btn-ecouter svg { width: 30px; height: 30px; }
  .exercice-btn-ecouter:hover { transform: scale(1.08); }
  .exercice-btn-ecouter:active { opacity: 0.7; transform: scale(0.96); }

  .exercice-instruction {
    font-size: 1rem;
    font-weight: 700;
    color: var(--brun-fonce);
    line-height: 1.35;
  }

  /* 🆕 (retour Raphaël, 15-08-2026) : indice optionnel sous la consigne —
     discret (taille réduite, italique, teinte atténuée) pour rester une
     aide facultative, pas une seconde consigne. */
  .exercice-indice {
    font-size: 0.82rem;
    font-style: italic;
    color: var(--brun-clair, #8A7364);
    margin-top: -6px;
  }

  .exercice-niveau-toggle { display: inline-flex; align-self: flex-start; border-radius: 999px; background: var(--fond); padding: 3px; gap: 2px; }
  .exercice-niveau-btn {
    border: none;
    background: transparent;
    color: var(--brun-clair, #8A7364);
    font-family: inherit;
    font-weight: 700;
    font-size: 0.74rem;
    padding: 6px 14px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .exercice-niveau-btn.actif { background: var(--peche-fonce); color: #FFFFFF; }

  /* 🆕 Sélecteur de niveau global, au-dessus des cartes d'exercices —
     bascule tous les exercices d'un coup, sans empêcher un ajustement
     individuel ensuite (le toggle de chaque carte reste actif après). */
  .niveau-global-bloc {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    padding: 4px 0 2px;
  }
  .niveau-global-label {
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--brun-clair, #8A7364);
  }
  .niveau-global-toggle { background: #FFFFFF; border: 1.5px solid var(--peche-pale); }

  /* Champ libre — volontairement invitant : coins très arrondis, halo
     doux au focus, dans la couleur d'identité du personnage concerné. */
  .exercice-champ {
    width: 100%;
    font-family: inherit;
    font-size: 1.05rem;
    padding: 13px 16px;
    border-radius: 16px;
    border: 2px solid var(--peche-pale);
    background: var(--fond);
    color: var(--brun-fonce);
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
  }
  .exercice-champ::placeholder { color: var(--brun-clair, #8A7364); opacity: 0.65; }
  .exercice-champ:focus {
    border-color: var(--peche-fonce);
    background: #FFFFFF;
    box-shadow: 0 0 0 4px rgba(224, 136, 103, 0.18);
  }
  .exercice-champ.correcte { border-color: #6FAE7A; background: #F1FAF2; }
  .exercice-champ.fautive { border-color: #E0876A; }
  /* 🆕 Voir la note sur .exercice-chip-revele : même distinction pour le
     champ texte du mode facile, qui affiche la réponse complète après
     échec — rouge, jamais vert, pour ne jamais ressembler à une saisie
     validée. */
  .exercice-champ.revele { border-color: #b0402c; background: #FCEEEC; }

  .exercice-chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .exercice-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: #F1FAF2;
    border: 1.5px solid #BFE0C4;
    color: #3E7A49;
    border-radius: 999px;
    padding: 5px 12px;
    font-weight: 700;
    font-size: 0.92rem;
  }
  /* 🐛 CORRIGÉ (Raphaël, "la bonne réponse s'affiche en vert, comme si
     c'était validé") : .exercice-chip est vert par défaut, sans distinction
     entre un mot que l'élève a VRAIMENT tapé juste et un mot simplement
     RÉVÉLÉ après échec des deux essais — donnant l'impression que toute
     réponse finit "acceptée". Ce modificateur (ajouté seulement aux mots
     révélés, jamais aux mots acquis par l'élève — voir creerZoneDifficile/
     creerZoneFacile) les affiche en rouge à la place, pour que l'échec
     reste visible même si l'élève ne lit pas le message texte plus bas. */
  .exercice-chip-revele { background: #FCEEEC; border-color: #E3A99C; color: #b0402c; }

  .exercice-ligne-action { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .exercice-btn-verifier {
    border: none;
    background: var(--peche-fonce);
    color: #FFFFFF;
    font-family: inherit;
    font-weight: 700;
    font-size: 0.88rem;
    padding: 10px 20px;
    border-radius: 999px;
    cursor: pointer;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  .exercice-btn-verifier:hover { transform: translateY(-1px); }
  .exercice-btn-verifier:disabled { opacity: 0.5; cursor: default; transform: none; }

  .exercice-feedback { font-size: 0.86rem; font-weight: 700; min-height: 1.2em; }
  .exercice-feedback.correct { color: #3E7A49; }
  /* 🆕 (d3, bonus "délicieux") : ligne supplémentaire, distincte du
     feedback normal — ne remplace jamais feedbackCorrect, s'ajoute en
     dessous (voir creerZoneDifficile). */
  .exercice-feedback-bonus { font-size: 0.86rem; font-weight: 700; color: #B8722E; margin-top: 4px; }
  .exercice-feedback.presque { color: var(--peche-fonce); }
  .exercice-feedback.revele { color: var(--brun-clair, #8A7364); font-weight: 600; }

  /* Mode facile — mots à taper dans l'ordre */
  .exercice-banque-mots { display: flex; flex-wrap: wrap; gap: 8px; }
  .exercice-mot-btn {
    border: 1.5px solid var(--peche);
    background: #FFFFFF;
    color: var(--brun-fonce);
    font-family: inherit;
    font-weight: 700;
    font-size: 0.95rem;
    padding: 8px 16px;
    border-radius: 12px;
    cursor: pointer;
    transition: transform 0.12s ease, opacity 0.12s ease;
  }
  .exercice-mot-btn:hover { transform: translateY(-1px); }
  .exercice-mot-btn.utilise { opacity: 0.35; pointer-events: none; }
  .exercice-chip-amovible { cursor: pointer; }
  .exercice-chip-amovible:hover { background: #FDEDEA; border-color: var(--peche); }
  .exercice-phrase-construite {
    min-height: 44px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
    padding: 8px 12px;
    border-radius: 14px;
    background: var(--fond);
    border: 2px dashed var(--peche-pale);
  }
  .exercice-btn-recommencer {
    border: none;
    background: transparent;

      ca: "La 3a persona del singular dels verbs en **-er** és fàcil: es treu el **-er** i s'afegeix una **-e**. “Mang**er**” esdevé “il/elle mang**e**”. Ja ho vas fer amb l'imperatiu informal (“Mange!”) — la forma s'assembla, només canvia el sentit.",
      eo: "La 3a persono singularo de **-er**-verboj estas facila: forigu la **-er** kaj aldonu **-e**. “Mang**er**” fariĝas “li/ŝi mang**e**”. Vi jam faris tion por la neformala imperativo (“Mange!”) — la formo similas, nur la senco ŝanĝiĝas.",
      zh: "以 **-er** 结尾的动词的第三人称单数很简单：去掉 **-er**，加上 **-e**。“mang**er**”变成“il/elle mang**e**”。你在非正式命令式（“Mange!”）里已经用过这个变化，形式一样，只是意思不同。",
      ja: "**-er** で終わる動詞の3人称単数形は簡単です。**-er** を取って **-e** を付けるだけ。「mang**er**」は「il/elle mang**e**」になります。すでにくだけた命令形（「Mange!」）で同じ形を使っていますね——形は同じで、意味だけが変わります。",
      ko: "**-er**로 끝나는 동사의 3인칭 단수형은 쉬워요: **-er**를 떼고 **-e**를 붙이면 돼요. “mang**er**”가 “il/elle mang**e**”가 되죠. 비격식 명령형(“Mange!”)에서 이미 해본 거예요 — 형태는 같고 의미만 달라져요.",
      vi: "Ngôi thứ ba số ít của động từ tận cùng bằng **-er** rất dễ: bỏ **-er** rồi thêm **-e**. “Mang**er**” trở thành “il/elle mang**e**”. Bạn đã làm điều này với thể mệnh lệnh thân mật (“Mange!”) rồi — hình thức giống nhau, chỉ nghĩa thay đổi.",
      ht: "3yèm pèsonn siNGilye vèb ki fini an **-er** fasil: retire **-er** epi ajoute yon **-e**. “Mang**er**” vin “il/elle mang**e**”. Ou te deja fè sa pou enperatif enfòmèl la (“Mange!”) — fòm nan sanble, se sans lan sèlman ki chanje.",
      tl: "Madali ang ikatlong panauhan isahan ng mga pandiwang nagtatapos sa **-er**: alisin ang **-er** at magdagdag ng **-e**. Ang “mang**er**” ay nagiging “il/elle mang**e**”. Nagawa mo na ito para sa impormal na utos (“Mange!”) — magkatulad ang anyo, ang kahulugan lang ang nagbabago.",
      id: "Orang ketiga tunggal untuk kata kerja berakhiran **-er** itu mudah: hilangkan **-er**, tambahkan **-e**. “Mang**er**” menjadi “il/elle mang**e**”. Kamu sudah melakukannya untuk bentuk perintah informal (“Mange!”) — bentuknya mirip, hanya artinya yang berubah.",
      nl: "De derde persoon enkelvoud van werkwoorden op **-er** is makkelijk: haal de **-er** weg en voeg een **-e** toe. “Mang**er**” wordt “il/elle mang**e**”. Dat deed je al bij de informele gebiedende wijs (“Mange!”) — de vorm lijkt hetzelfde, alleen de betekenis verandert.",
      de: "Die 3. Person Singular von Verben auf **-er** ist einfach: Man streicht das **-er** und fügt ein **-e** an. „Mang**er**“ wird zu „il/elle mang**e**“. Das hast du schon beim informellen Imperativ gemacht („Mange!“) — die Form sieht gleich aus, nur die Bedeutung ändert sich.",
      fa: "سوم‌شخص مفرد فعل‌های **-er**دار ساده است: **-er** را حذف کن و **-e** اضافه کن. «mang**er**» می‌شود «il/elle mang**e**». تو این کار را قبلاً برای امر غیررسمی («Mange!») هم انجام داده‌ای — شکلش شبیه است، فقط معنی فرق می‌کند.",
      sv: "Tredje person singular av verb på **-er** är enkelt: ta bort **-er** och lägg till **-e**. “Mang**er**” blir “il/elle mang**e**”. Du gjorde redan det för den informella imperativformen (“Mange!”) — formen ser likadan ut, bara betydelsen ändras.",
      no: "Tredje person entall av verb på **-er** er enkelt: fjern **-er** og legg til **-e**. “Mang**er**” blir “il/elle mang**e**”. Du gjorde allerede dette for den uformelle imperativformen (“Mange!”) — formen ser lik ut, bare betydningen endrer seg.",
      ru: "3-е лицо единственного числа глаголов на **-er** — это просто: убираем **-er** и добавляем **-e**. «Mang**er**» становится «il/elle mang**e**». Ты уже делал это для неформального повелительного наклонения («Mange!») — форма похожа, меняется только смысл."
    },
    gFeminin: {
      fr: "Voici la première apparition du féminin sur le site : « **une** chaise ». **Une** est l'équivalent féminin de **un** — « chaise » est un nom féminin. Pourquoi féminin ? C'est comme ça, il faut le retenir — mais il existe des indices pour deviner le genre d'un mot, on les verra en temps et lieu.",
      en: "This is the first appearance of the feminine on the site: “**une** chaise.” **Une** is the feminine equivalent of **un** — “chaise” (chair) is a feminine noun. Why feminine? That's just how it is, you need to remember it — but there are clues for guessing a word's gender, we'll see those in due time.",
      es: "Esta es la primera aparición del femenino en el sitio: “**une** chaise”. **Une** es el equivalente femenino de **un** — “chaise” (silla) es un sustantivo femenino. ¿Por qué femenino? Simplemente es así, hay que memorizarlo — pero existen pistas para adivinar el género de una palabra, las veremos a su debido tiempo.",
      it: "Ecco la prima apparizione del femminile sul sito: “**une** chaise”. **Une** è l'equivalente femminile di **un** — “chaise” (sedia) è un nome femminile. Perché femminile? È così, bisogna memorizzarlo — ma esistono indizi per indovinare il genere di una parola, li vedremo a tempo debito.",
      pt: "Eis a primeira aparição do feminino no site: “**une** chaise”. **Une** é o equivalente feminino de **un** — “chaise” (cadeira) é um substantivo feminino. Porquê feminino? É assim mesmo, tens de memorizar — mas há pistas para adivinhar o género de uma palavra, vamos vê-las a seu tempo.",
      ca: "Aquí tens la primera aparició del femení al lloc: “**une** chaise”. **Une** és l'equivalent femení de **un** — “chaise” (cadira) és un nom femení. Per què femení? És així, cal memoritzar-ho — però hi ha pistes per endevinar el gènere d'una paraula, les veurem al seu moment.",
      eo: "Jen la unua apero de la ina genro sur la retejo: “**une** chaise”. **Une** estas la ina ekvivalento de **un** — “chaise” (seĝo) estas ina substantivo. Kial ina? Simple tiel estas, oni devas memorfiksi ĝin — sed ekzistas indikiloj por diveni la genron de vorto, ni vidos ilin siatempe.",
      zh: "这是本网站第一次出现阴性词：「**une** chaise」。**une** 是 **un** 的阴性形式——“chaise”（椅子）是阴性名词。为什么是阴性？没有理由，就是要记住——不过判断词性也有一些线索，以后会慢慢学到。",
      ja: "サイト初の女性形の登場です：「**une** chaise」。**une** は **un** の女性形——「chaise」（椅子）は女性名詞です。なぜ女性形なのか？そういうものなので覚えるしかありません——ただ、単語の性別を見分けるヒントもあるので、いずれ学んでいきましょう。",
      ko: "사이트에서 여성형이 처음 등장하는 순간이에요: “**une** chaise”. **une**는 **un**의 여성형이에요 — “chaise”(의자)는 여성 명사예요. 왜 여성형이냐고요? 그냥 그런 거예요, 외워야 해요 — 하지만 단어의 성을 짐작할 단서들도 있어요, 때가 되면 배우게 될 거예요.",
      vi: "Đây là lần đầu tiên giống cái xuất hiện trên trang web: “**une** chaise”. **Une** là dạng giống cái tương ứng với **un** — “chaise” (cái ghế) là danh từ giống cái. Tại sao lại giống cái? Đơn giản là vậy, phải ghi nhớ thôi — nhưng có những dấu hiệu để đoán giới tính của một từ, chúng ta sẽ học dần.",
      ht: "Men premye fwa fòm feminen parèt sou sit la: “**une** chaise”. **Une** se ekivalan feminen **un** — “chaise” se yon non feminen. Poukisa feminen? Se konsa li ye, fòk ou sonje l — men gen endis ki ka ede w devine sèks yon mo, n ap wè yo pi devan.",
      tl: "Narito ang unang paglitaw ng pambabae sa site: “**une** chaise”. Ang **une** ang katumbas na pambabae ng **un** — ang “chaise” (upuan) ay pangngalang pambabae. Bakit pambabae? Ganoon lang talaga, kailangan mong tandaan — pero may mga palatandaan para mahulaan ang kasarian ng salita, makikita natin ito sa tamang panahon.",
      id: "Inilah kemunculan pertama bentuk feminin di situs ini: “**une** chaise”. **Une** adalah padanan feminin dari **un** — “chaise” (kursi) adalah kata benda feminin. Mengapa feminin? Memang begitu adanya, harus dihafalkan — tapi ada petunjuk untuk menebak gender sebuah kata, akan kita pelajari nanti.",
      nl: "Dit is de eerste keer dat het vrouwelijke op de site verschijnt: “**une** chaise”. **Une** is de vrouwelijke vorm van **un** — “chaise” (stoel) is een vrouwelijk zelfstandig naamwoord. Waarom vrouwelijk? Dat is nu eenmaal zo, je moet het onthouden — maar er zijn aanwijzingen om het geslacht van een woord te raden, die zien we later.",
      de: "Hier taucht zum ersten Mal auf der Seite das Femininum auf: „**une** chaise“. **Une** ist die weibliche Form von **un** — „chaise“ (Stuhl) ist ein feminines Substantiv. Warum feminin? Das ist einfach so, man muss es sich merken — aber es gibt Hinweise, um das Geschlecht eines Wortes zu erraten, die sehen wir zu gegebener Zeit.",
      fa: "این نخستین باری است که مؤنث در سایت ظاهر می‌شود: «**une** chaise». **une** معادل مؤنث **un** است — «chaise» (صندلی) اسمی مؤنث است. چرا مؤنث؟ همین‌طور است، باید حفظش کنی — اما نشانه‌هایی هم برای حدس‌زدن جنسیت یک کلمه هست، در وقتش می‌بینیم.",
      sv: "Här är den feminina formens första framträdande på sajten: “**une** chaise”. **Une** är den feminina motsvarigheten till **un** — “chaise” (stol) är ett feminint substantiv. Varför feminint? Det är bara så, man måste komma ihåg det — men det finns ledtrådar för att gissa ett ords genus, dem tar vi i sinom tid.",
      no: "Her er den første feminine formen på siden: “**une** chaise”. **Une** er den feminine motsvarigheten til **un** — “chaise” (stol) er et feminint substantiv. Hvorfor feminint? Det er bare sånn det er, du må huske det — men det finnes hint for å gjette et ords kjønn, dem ser vi etter hvert.",
      ru: "Вот первое появление женского рода на сайте: «**une** chaise». **Une** — это женский эквивалент **un** — «chaise» (стул) — существительное женского рода. Почему женского? Это просто нужно запомнить — но есть подсказки, как угадать род слова, мы их увидим в своё время."
    },
    gInsistance: {
      fr: "« Il est bon, **le sandwich** ? » peut paraître étrange, mais c'est une formule d'insistance très ordinaire en français : on répète le sujet ou l'objet, par insistance, par précision, ou simplement par habitude. C'est très naturel à l'oral.",
      en: "“Il est bon, **le sandwich** ?” might look strange, but it's a very ordinary emphatic pattern in French: the subject or object gets repeated, for emphasis, for precision, or just out of habit. It sounds completely natural in spoken French.",
      es: "“Il est bon, **le sandwich** ?” puede parecer raro, pero es una fórmula de énfasis muy corriente en francés: se repite el sujeto o el objeto, por énfasis, por precisión, o simplemente por costumbre. Suena muy natural al hablar.",
      it: "“Il est bon, **le sandwich** ?” può sembrare strano, ma è una formula d'insistenza molto comune in francese: si ripete il soggetto o l'oggetto, per enfasi, per precisione, o semplicemente per abitudine. È molto naturale nel parlato.",
      pt: "“Il est bon, **le sandwich** ?” pode parecer estranho, mas é uma fórmula de ênfase muito comum em francês: repete-se o sujeito ou o objeto, por ênfase, por precisão, ou simplesmente por hábito. Soa muito natural na oralidade.",
      ca: "“Il est bon, **le sandwich** ?” pot semblar estrany, però és una fórmula d'èmfasi molt corrent en francès: es repeteix el subjecte o l'objecte, per èmfasi, per precisió, o simplement per costum. Sona molt natural en la parla.",
      eo: "“Il est bon, **le sandwich** ?” povas ŝajni stranga, sed ĝi estas tre kutima emfaza esprimo en la franca: oni ripetas la subjekton aŭ objekton, por emfazo, por precizeco, aŭ simple pro kutimo. Ĝi sonas tute nature parole.",
      zh: "「Il est bon, **le sandwich** ?」听起来可能有点怪，但这在法语里是很常见的强调句式：把主语或宾语重复一遍，为了强调、为了明确，或者只是习惯，说出来非常自然。",
      ja: "「Il est bon, **le sandwich** ?」は不思議に聞こえるかもしれませんが、フランス語ではごく普通の強調表現です。主語や目的語を繰り返すことで、強調したり、はっきりさせたり、あるいは単に習慣的にそう言うだけです。話し言葉としてとても自然です。",
      ko: "“Il est bon, **le sandwich** ?”는 좀 이상하게 들릴 수 있지만, 프랑스어에서 아주 흔한 강조 표현이에요: 주어나 목적어를 반복하는 건, 강조하거나 명확히 하거나 그냥 습관적으로 그렇게 하는 거예요. 구어체에서는 아주 자연스럽죠.",
      vi: "“Il est bon, **le sandwich** ?” nghe có vẻ lạ, nhưng đây là một cách nhấn mạnh rất bình thường trong tiếng Pháp: chủ ngữ hoặc tân ngữ được lặp lại, để nhấn mạnh, để rõ ràng hơn, hoặc đơn giản là theo thói quen. Nghe rất tự nhiên khi nói.",
      ht: "“Il est bon, **le sandwich** ?” ka sanble dwòl, men se yon fòmil ensistans byen òdinè an franse: yo repete sijè a oswa objè a, pou ensiste, pou presizyon, oswa senpleman pa abitid. Sa sonnen byen natirèl lè w ap pale.",
      tl: "Maaaring kakaiba ang tunog ng “Il est bon, **le sandwich** ?” pero isa itong napaka-ordinaryong paraan ng pagbibigay-diin sa Pranses: inuulit ang paksa o layon, para sa diin, kalinawan, o simpleng ugali lang. Napaka-natural nito kapag pinag-uusapan.",
      id: "“Il est bon, **le sandwich** ?” mungkin terdengar aneh, tapi ini adalah pola penekanan yang sangat biasa dalam bahasa Prancis: subjek atau objeknya diulang, untuk penekanan, kejelasan, atau sekadar kebiasaan. Terdengar sangat alami saat bicara.",
      nl: "“Il est bon, **le sandwich** ?” klinkt misschien vreemd, maar het is een heel gewone nadrukkelijke vorm in het Frans: het onderwerp of lijdend voorwerp wordt herhaald, voor nadruk, voor duidelijkheid, of gewoon uit gewoonte. Het klinkt heel natuurlijk in gesproken taal.",
      de: "„Il est bon, **le sandwich** ?“ mag seltsam klingen, ist aber eine ganz gewöhnliche Betonungsform im Französischen: Das Subjekt oder Objekt wird wiederholt, zur Betonung, zur Präzisierung, oder einfach aus Gewohnheit. Gesprochen klingt das völlig natürlich.",
      fa: "«Il est bon, **le sandwich** ?» شاید عجیب به‌نظر برسد، اما این یک ساختار تأکیدی بسیار معمول در فرانسه است: فاعل یا مفعول تکرار می‌شود، برای تأکید، برای دقت، یا فقط از روی عادت. در گفتار کاملاً طبیعی به‌نظر می‌رسد.",
      sv: "“Il est bon, **le sandwich** ?” kan låta märkligt, men det är ett helt vanligt betoningsmönster på franska: subjektet eller objektet upprepas, för betoning, för tydlighet, eller bara av vana. Det låter helt naturligt i talspråk.",
      no: "“Il est bon, **le sandwich** ?” kan høres rart ut, men det er et helt vanlig betoningsmønster på fransk: subjektet eller objektet gjentas, for vektlegging, for presisjon, eller bare av vane. Det høres helt naturlig ut muntlig.",
      ru: "«Il est bon, **le sandwich** ?» может показаться странным, но это очень обычная во французском форма выделения: подлежащее или дополнение повторяется — для акцента, для уточнения или просто по привычке. В устной речи это звучит совершенно естественно."
    },
    gIl: {
      fr: "« Il » est le pronom masculin de la 3e personne du singulier. Il remplace un nom masculin déjà connu : Le sandwich est bon → **Il** est bon. Keb mange un sandwich → **Il** mange un sandwich.",
      en: "“Il” is the masculine 3rd-person singular pronoun. It replaces an already-known masculine noun: Le sandwich est bon → **Il** est bon. Keb mange un sandwich → **Il** mange un sandwich.",
      es: "“Il” es el pronombre masculino de la 3ª persona del singular. Sustituye a un sustantivo masculino ya conocido: Le sandwich est bon → **Il** est bon. Keb mange un sandwich → **Il** mange un sandwich.",
      it: "“Il” è il pronome maschile della 3ª persona singolare. Sostituisce un nome maschile già noto: Le sandwich est bon → **Il** est bon. Keb mange un sandwich → **Il** mange un sandwich.",
      pt: "“Il” é o pronome masculino da 3ª pessoa do singular. Substitui um substantivo masculino já conhecido: Le sandwich est bon → **Il** est bon. Keb mange un sandwich → **Il** mange un sandwich.",
      ca: "“Il” és el pronom masculí de la 3a persona del singular. Substitueix un nom masculí ja conegut: Le sandwich est bon → **Il** est bon. Keb mange un sandwich → **Il** mange un sandwich.",
      eo: "“Il” estas la vira triapersona singulara pronomo. Ĝi anstataŭigas jam konatan viran substantivon: Le sandwich est bon → **Il** est bon. Keb mange un sandwich → **Il** mange un sandwich.",
      zh: "“il”是阳性第三人称单数代词，用来替代已经提到过的阳性名词：Le sandwich est bon → **Il** est bon（它很好吃）。Keb mange un sandwich → **Il** mange un sandwich（他在吃三明治）。",
      ja: "「il」は男性形の三人称単数代名詞です。すでに出てきた男性名詞の代わりに使います：Le sandwich est bon → **Il** est bon。Keb mange un sandwich → **Il** mange un sandwich。",
      ko: "“il”은 남성 3인칭 단수 대명사예요. 이미 알고 있는 남성 명사를 대신하죠: Le sandwich est bon → **Il** est bon. Keb mange un sandwich → **Il** mange un sandwich.",
      vi: "“Il” là đại từ giống đực ngôi thứ ba số ít. Nó thay thế cho một danh từ giống đực đã biết: Le sandwich est bon → **Il** est bon. Keb mange un sandwich → **Il** mange un sandwich.",
      ht: "“Il” se pwonon maskilen twazyèm pèsonn siNGilye a. Li ranplase yon non maskilen ki deja konnen: Le sandwich est bon → **Il** est bon. Keb mange un sandwich → **Il** mange un sandwich.",
      tl: "Ang “il” ay ang panlalaking panghalip sa ikatlong panauhan isahan. Pinapalitan nito ang isang panlalaking pangngalang alam na: Le sandwich est bon → **Il** est bon. Keb mange un sandwich → **Il** mange un sandwich.",
      id: "“Il” adalah kata ganti maskulin orang ketiga tunggal. Ia menggantikan kata benda maskulin yang sudah diketahui: Le sandwich est bon → **Il** est bon. Keb mange un sandwich → **Il** mange un sandwich.",
      nl: "“Il” is het mannelijke voornaamwoord van de derde persoon enkelvoud. Het vervangt een al bekend mannelijk zelfstandig naamwoord: Le sandwich est bon → **Il** est bon. Keb mange un sandwich → **Il** mange un sandwich.",
      de: "„Il“ ist das männliche Pronomen der 3. Person Singular. Es ersetzt ein bereits bekanntes männliches Substantiv: Le sandwich est bon → **Il** est bon. Keb mange un sandwich → **Il** mange un sandwich.",
      fa: "«il» ضمیر مذکر سوم‌شخص مفرد است. جایگزین اسم مذکری می‌شود که قبلاً شناخته شده: Le sandwich est bon → **Il** est bon. Keb mange un sandwich → **Il** mange un sandwich.",
      sv: "“Il” är det maskulina pronomenet i tredje person singular. Det ersätter ett redan känt maskulint substantiv: Le sandwich est bon → **Il** est bon. Keb mange un sandwich → **Il** mange un sandwich.",
      no: "“Il” er det maskuline pronomenet i tredje person entall. Det erstatter et allerede kjent maskulint substantiv: Le sandwich est bon → **Il** est bon. Keb mange un sandwich → **Il** mange un sandwich.",
      ru: "«Il» — местоимение мужского рода 3-го лица единственного числа. Оно заменяет уже известное существительное мужского рода: Le sandwich est bon → **Il** est bon. Keb mange un sandwich → **Il** mange un sandwich."
    },
    gApprendre: {
      fr: "« Apprend » vient du verbe **apprendre**, un verbe irrégulier — il ne suit pas le modèle classique des verbes en -er. Il y a plusieurs verbes irréguliers en français, mais aucune inquiétude à avoir : ils s'apprennent naturellement, avec la pratique, et ils ne sont pas si compliqués.",
      en: "“Apprend” comes from the verb **apprendre** (to learn), an irregular verb — it doesn't follow the classic -er verb pattern. French has several irregular verbs, but no need to worry: you'll pick them up naturally with practice, and they're not as complicated as they sound.",
      es: "“Apprend” viene del verbo **apprendre** (aprender), un verbo irregular: no sigue el modelo clásico de los verbos en -er. Hay varios verbos irregulares en francés, pero no hay de qué preocuparse: se aprenden de forma natural, con la práctica, y no son tan complicados.",
      it: "“Apprend” viene dal verbo **apprendre** (imparare), un verbo irregolare: non segue il modello classico dei verbi in -er. Ci sono diversi verbi irregolari in francese, ma niente paura: si imparano naturalmente, con la pratica, e non sono così complicati.",
      pt: "“Apprend” vem do verbo **apprendre** (aprender), um verbo irregular: não segue o modelo clássico dos verbos em -er. Há vários verbos irregulares em francês, mas não te preocupes: aprendem-se naturalmente, com a prática, e não são assim tão complicados.",
      ca: "“Apprend” ve del verb **apprendre** (aprendre), un verb irregular: no segueix el model clàssic dels verbs en -er. Hi ha diversos verbs irregulars en francès, però no cal preocupar-se: s'aprenen de manera natural, amb la pràctica, i no són tan complicats.",
      eo: "“Apprend” venas de la verbo **apprendre** (lerni), neregula verbo — ĝi ne sekvas la klasikan -er-模ellon. Estas pluraj neregulaj verboj en la franca, sed ne maltrankviliĝu: oni lernas ilin nature, per praktiko, kaj ili ne estas tiel malfacilaj.",
      zh: "“apprend”来自动词 **apprendre**（学习），是个不规则动词——不遵循 -er 动词的常规变化。法语里有好几个不规则动词，但不用担心：多加练习自然就会掌握，它们其实没有想象中那么复杂。",
      ja: "「apprend」は動詞 **apprendre**（学ぶ）から来ています。不規則動詞で、-er 動詞の一般的な変化パターンには従いません。フランス語には不規則動詞がいくつかありますが、心配いりません。練習しているうちに自然に覚えられますし、思ったほど複雑ではありません。",
      ko: "“apprend”는 동사 **apprendre**(배우다)에서 왔어요, 불규칙 동사라서 -er 동사의 기본 패턴을 따르지 않아요. 프랑스어에는 불규칙 동사가 여러 개 있지만 걱정하지 마세요: 연습하다 보면 자연스럽게 익히게 되고, 생각보다 복잡하지 않아요.",
      vi: "“Apprend” đến từ động từ **apprendre** (học), một động từ bất quy tắc — không theo khuôn mẫu thông thường của động từ -er. Tiếng Pháp có nhiều động từ bất quy tắc, nhưng đừng lo: bạn sẽ học được chúng một cách tự nhiên qua luyện tập, và chúng không phức tạp như vẻ ngoài.",
      ht: "“Apprend” soti nan vèb **apprendre** (aprann), yon vèb irègilye — li pa swiv modèl klasik vèb ki fini an -er yo. Gen plizyè vèb irègilye an franse, men pa gen anyen pou enkyete w: ou aprann yo natirèlman, ak pratik, e yo pa tèlman konplike.",
      tl: "Ang “apprend” ay galing sa pandiwang **apprendre** (matuto), isang di-regular na pandiwa — hindi ito sumusunod sa karaniwang huwaran ng mga pandiwang -er. May ilang di-regular na pandiwa sa Pranses, pero huwag mag-alala: natututuhan mo ang mga ito nang natural, sa pamamagitan ng pagsasanay, at hindi naman ito ganoong kakomplikado.",
      id: "“Apprend” berasal dari kata kerja **apprendre** (belajar), kata kerja tidak beraturan — tidak mengikuti pola klasik kata kerja -er. Ada beberapa kata kerja tidak beraturan dalam bahasa Prancis, tapi jangan khawatir: kamu akan menguasainya secara alami lewat latihan, dan sebenarnya tidak serumit kelihatannya.",
      nl: "“Apprend” komt van het werkwoord **apprendre** (leren), een onregelmatig werkwoord — het volgt niet het klassieke patroon van -er-werkwoorden. Er zijn verschillende onregelmatige werkwoorden in het Frans, maar geen zorgen: je pikt ze vanzelf op met oefening, en ze zijn niet zo ingewikkeld als ze lijken.",
      de: "„Apprend“ kommt vom Verb **apprendre** (lernen), einem unregelmäßigen Verb — es folgt nicht dem klassischen Muster der -er-Verben. Es gibt mehrere unregelmäßige Verben im Französischen, aber keine Sorge: Man lernt sie ganz natürlich mit der Übung, und sie sind nicht so kompliziert, wie sie klingen.",
      fa: "«apprend» از فعل **apprendre** (یادگرفتن) می‌آید، فعلی بی‌قاعده — از الگوی معمول فعل‌های -er پیروی نمی‌کند. در فرانسه چند فعل بی‌قاعده دیگر هم هست، اما جای نگرانی نیست: با تمرین به‌طور طبیعی یاد می‌گیری‌شان، و آن‌قدرها هم پیچیده نیستند.",
      sv: "“Apprend” kommer från verbet **apprendre** (att lära sig), ett oregelbundet verb — det följer inte det klassiska mönstret för -er-verb. Det finns flera oregelbundna verb på franska, men ingen fara: du lär dig dem naturligt med övning, och de är inte så komplicerade som de verkar.",
      no: "“Apprend” kommer fra verbet **apprendre** (å lære), et uregelmessig verb — det følger ikke det klassiske mønsteret til -er-verb. Det finnes flere uregelmessige verb på fransk, men ingen grunn til bekymring: du lærer dem naturlig med øvelse, og de er ikke så kompliserte som de virker.",
      ru: "«Apprend» происходит от глагола **apprendre** (учиться) — неправильного глагола, который не следует классической модели глаголов на -er. Во французском есть несколько неправильных глаголов, но переживать не стоит: они запоминаются естественным образом, с практикой, и на деле не так уж сложны."

  // 🆕 (15-08-2026) Exercices d'écoute — phase 2 du chantier demandé par
  // Raphaël, section séparée des EXERCICES ci-dessus (jamais mélangée :
  // récompenses, compteurs de réussite et affichage sont indépendants,
  // voir plus bas exercicesEcouteResolus etc.). Contrairement aux
  // EXERCICES d'image, la consigne est TOUJOURS la même (texteInterface
  // 'ecouteConsigne', voir texteExercice ci-dessous) — ce qui varie ici
  // c'est `texte`, la phrase à faire entendre, JAMAIS montrée à l'élève :
  //   - en session de classe active, c'est cette valeur que le prof doit
  //     lire à voix haute (voir synchroniserEtatSession dans
  //     afficherExercicesEcoute — poussée dès l'affichage, pas seulement
  //     à la saisie, contrairement à annoncerReponseEnCours) ;
  //   - en solo, c'est elle que lireAudio() (phase 1) synthétise au clic
  //     sur le bouton 🔊 de la carte (voir creerCarteExercice, branche
  //     ex.type === 'ecoute').
  // `reponse` reprend le même format que EXERCICES (mots dans l'ordre,
  // ponctuation isolée sautée par MOT_PONCTUATION_SEULE_EXERCICE) —
  // entièrement réévaluable par evaluerReponseExercice/reponsesAcceptees
  // sans aucune modification de ces fonctions.
  // Vocabulaire volontairement limité à ce qui a déjà été vu dans le
  // dialogue ci-dessus (Mange/un/sandwich/J'ai/faim/Tu/comprends/Quoi) —
  // niveau archi-débutant, rien de nouveau à deviner par-dessus l'écoute
  // elle-même.
  // 🐛 CORRIGÉ (retour Raphaël, 15-08-2026) : un 4e exercice ("Tu
  // comprends ?") avait été ajouté par erreur — "comprends" n'est pas un
  // mot enseigné dans ce dialogue (vocabulaire volontairement limité, voir
  // note ci-dessus). Retiré ; les 3 exercices restants suffisent, et les
  // récompenses (voir plus bas) se basent déjà sur EXERCICES_ECOUTE.length,
  // donc rien d'autre à ajuster.
    const EXERCICES_ECOUTE = [
    {
