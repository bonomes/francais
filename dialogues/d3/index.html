  // 🆕 ex.type === 'ecoute' : consigne fixe (jamais la phrase elle-même,
  // voir note de tête d'EXERCICES_ECOUTE) — sinon comportement inchangé.
  function texteExercice(ex) {
    if (ex.type === 'ecoute') return texteInterface('ecouteConsigne');
    return ex.instruction[langueActuelle()] || ex.instruction.en;
  }

  // 🆕 Indice optionnel (voir ex.indice sur d2_e1) : même repli fr→en que
  // texteExercice ci-dessus si la langue de l'apprenant manque. Retourne
  // null quand l'exercice n'a pas d'indice — creerCarteExercice n'affiche
  // alors rien.
  function texteIndice(ex) {
    if (!ex.indice) return null;
    return ex.indice[langueActuelle()] || ex.indice.en;
  }

  // ---------- Correction progressive (mode difficile) ----------
  // Normalise pour comparaison : minuscules, apostrophes typographiques
  // ramenées à l'apostrophe simple, ponctuation finale/de bord ignorée,
  // espaces superflus réduits. Les accents restent significatifs — on
  // apprend à écrire, pas à s'en passer.
  function normaliserMotExercice(mot) {
    return mot
      .toLowerCase()
      .replace(/[\u2019]/g, "'")
      .replace(/^[.,!?…"«»\s]+|[.,!?…"«»\s]+$/g, '');
  }

  function normaliserPhraseExercice(texte) {
    return texte
      .replace(/[\u2019]/g, "'")
      .trim()
      .split(/\s+/)
      .filter(Boolean);
  }

  // Compare la saisie à la réponse attendue mot à mot, dans l'ordre.
  // Retourne jusqu'où la saisie est correcte (indexErreur) et si la
  // phrase est entièrement juste.
  //
  // 🐛 CORRIGÉ (13-08-2026, retour Raphaël sur d2 : reponse ['Mange',
  // '!']) : un élément de reponseAttendue qui n'est QUE de la ponctuation
  // isolée (ex. '!') exigeait jusqu'ici d'être tapé comme un second mot à
  // part entière ("Mange" PUIS un espace PUIS "!"), ce que personne ne
  // fait naturellement en tapant une réponse. Un tel élément est
  // maintenant sauté automatiquement côté réponse attendue (jamais une
  // étape obligatoire de la saisie), et tout token de ponctuation seule
  // que l'élève aurait quand même tapé de son côté est ignoré aussi —
  // dans les deux cas, sans jamais faire échouer la comparaison. indexErreur
  // reste un index dans reponseAttendue (pas dans une copie filtrée), donc
  // les appelants qui font ex.reponse.slice(0, indexErreur) restent corrects.
  const MOT_PONCTUATION_SEULE_EXERCICE = /^[.,!?;:…"«»]+$/;
  function evaluerReponseExercice(reponseAttendue, saisie) {
    const motsSaisis = normaliserPhraseExercice(saisie).filter(function (mot) {
      return !MOT_PONCTUATION_SEULE_EXERCICE.test(mot);
    });
    let i = 0;
    let j = 0;
    while (i < reponseAttendue.length) {
      if (MOT_PONCTUATION_SEULE_EXERCICE.test(reponseAttendue[i])) { i++; continue; }
      if (j >= motsSaisis.length) break;
      if (normaliserMotExercice(motsSaisis[j]) !== normaliserMotExercice(reponseAttendue[i])) break;
      i++; j++;
    }
    const correct = i === reponseAttendue.length && j === motsSaisis.length;

    return { correct: correct, indexErreur: i };
  }

  // 🆕 Réponses acceptées pour un exercice : la réponse principale
  // (ex.reponse), plus toute alternative entièrement correcte déclarée
  // dans ex.reponsesAlternatives (voir note sur d2_e1 ci-dessus).
  // Toujours au moins un élément (ex.reponse). Utilisée par les deux
  // modes de vérification (difficile : creerZoneDifficile ; facile :
  // creerZoneFacile), pour qu'un exercice à réponses multiples se
  // comporte pareil dans les deux modes sans dupliquer la liste.
  function reponsesAcceptees(ex) {
    return [ex.reponse].concat(ex.reponsesAlternatives || []);
  }

  function traductionDeMot(mot) {
    const dico = TRADUCTIONS[langueActuelle()] || TRADUCTIONS.en;
    return dico[mot.toLowerCase()];
  }

  function motEstInformel(mot) {
    const entree = VOCABULAIRE[mot.toLowerCase()];
    return !!(entree && entree.informel);
  }

  // Même clé que sac-a-dos.js/menu-principal.js — un seul réglage de
  // langue pour tout le site.
  function langueActuelle() {
    try { return localStorage.getItem('kebbek_langue') || 'en'; } catch (e) { return 'en'; }
  }

  // 🆕 (16-08-2026, demande de Raphaël) : les notes grammaticales sont
  // écrites en Markdown très simple (**gras** / *italique*) dans GRAMMAIRE,
  // pour faire ressortir les mots-clés — rendu plus vivant qu'un bloc de
  // texte uniforme. On échappe d'abord le HTML (défense en profondeur, même
  // si le contenu vient de nous et pas de l'utilisateur), PUIS on convertit
  // les marqueurs Markdown en balises — sinon un "<" tapé dans une note
  // casserait le rendu.
  function echapperHtml(texte) {
    const div = document.createElement('div');
    div.textContent = texte;
    return div.innerHTML;
  }

  function markdownVersHtml(texte) {
    return echapperHtml(texte)
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.+?)\*/g, '<em>$1</em>');
  }

  function texteGrammaire(cle) {
    const dict = GRAMMAIRE[cle];
    if (!dict) return '';
    return markdownVersHtml(dict[langueActuelle()] || dict.en);
  }

  // 🆕 Traduction de la phrase complète (demande de Raphaël : le mot-à-mot
  // seul "n'est pas suffisant"). Même repli sur l'anglais que le reste du
  // site si la langue de l'apprenant manque pour une raison quelconque.
  function traductionPhrase(def) {
    if (!def.trad) return '';
    return def.trad[langueActuelle()] || def.trad.en || '';
  }

  // ---------- Image avec repli "pas encore prête" (même patron que
  // creerImage() dans intro-bonomes.html) ----------
  // 🆕 (15-08-2026) : léger fondu à l'apparition — surtout utile pour la
  // transition automatique de ETAPES[0] (image silencieuse → question de
  // Bek), pour que ce ne soit pas un cut sec, mais s'applique à chaque
  // changement d'étape par cohérence.
  function creerImage(cheminImage) {
    const wrapper = document.createElement('div');
    wrapper.style.position = 'absolute';
    wrapper.style.inset = '0';
    const img = document.createElement('img');
    img.className = 'image-scene';
    img.src = cheminImage;
    img.alt = 'Keb et Bek';
    img.style.opacity = '0';
    img.style.transition = 'opacity 0.5s ease';
    img.onload = function () {
      requestAnimationFrame(() => requestAnimationFrame(() => { img.style.opacity = '1'; }));
    };
    img.onerror = function () {
      const repli = document.createElement('div');
      repli.className = 'repli-image-manquante';
      repli.textContent = 'Image not ready yet';
      img.replaceWith(repli);
    };
    wrapper.appendChild(img);
    return wrapper;
  }

  // ---------- Image de base + sandwich greffé par-dessus, flottant avec
  // lueur (voir CSS .sandwich-greffe*). Même repli "pas encore prête" que
  // creerImage() pour les deux images. ----------
  function creerImageComposite(cheminBase, cheminSuperposition) {
    const wrapper = creerImage(cheminBase);
    const greffe = document.createElement('div');
    greffe.className = 'sandwich-greffe';
    const lueur = document.createElement('div');
    lueur.className = 'sandwich-greffe-lueur';
    const imgSandwich = document.createElement('img');
    imgSandwich.className = 'sandwich-greffe-img';
    imgSandwich.src = cheminSuperposition;
    imgSandwich.alt = 'Le sandwich';
    imgSandwich.onerror = function () { greffe.style.display = 'none'; };
    greffe.appendChild(lueur);
    greffe.appendChild(imgSandwich);
    wrapper.appendChild(greffe);

    // 🆕 Condition de déblocage Bravo ("Le sandwich de Ginette") — voir
    // bravo-mecanique-synthese v4, section 2/16. Toucher le sandwich greffé
    // enregistre la condition 'd1_clic_sandwich' (idempotent côté Supabase,
    // rien ne se passe mal si l'élève touche plusieurs fois). e.stopPropagation()
    // EMPÊCHE ce tap de déclencher aussi suivant() via elScene (voir plus bas
    // dans ce fichier, "Tap direct sur la scène = avancer seulement") — même
    // motif que les mots cliquables (afficherTraductionMot) juste au-dessus.
    greffe.style.cursor = 'pointer';
    greffe.tabIndex = 0;
    greffe.setAttribute('role', 'button');
    greffe.setAttribute('aria-label', 'Le sandwich');
    let sandwichDejaTouche = false; // évite un appel réseau à chaque tap répété dans la même visite
    async function toucherSandwich(e) {
      e.stopPropagation();
      if (sandwichDejaTouche) return;
      sandwichDejaTouche = true;
      // 🐛 CORRIGÉ : attend la restauration session/profil (voir tout en
      // haut du fichier) — sans ce await, un tap assez rapide sur le
      // sandwich pouvait s'exécuter AVANT que initSession() ait fini de
      // résoudre, et retombait donc en mode invité malgré un élève
      // connecté.
      await restaurationSessionPromesse;
      if (window.KebBekProgression && window.KebBekProgression.marquerConditionComplete) {
        window.KebBekProgression.marquerConditionComplete('d1_clic_sandwich')
          .catch(function (err) { console.warn('dialogue-d3.html : marquerConditionComplete a échoué.', err); });
      }
    }
    greffe.addEventListener('click', toucherSandwich);
    greffe.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toucherSandwich(e); }
    });

    return wrapper;
  }

  function afficherTraductionMot(span, mot) {
    document.querySelectorAll('.iden-tooltip-mot').forEach(function (t) { t.remove(); });
    const trad = traductionDeMot(mot);
    if (!trad) return; // pas de bulle vide si le mot n'est pas encore au dictionnaire
    const tip = document.createElement('span');
    tip.className = 'iden-tooltip-mot';
    let contenu = trad;
    if (motEstInformel(mot)) {
      const langue = langueActuelle();
      contenu += ' ' + (ETIQUETTE_INFORMEL[langue] || ETIQUETTE_INFORMEL.en);
    }
    tip.textContent = contenu;
    span.appendChild(tip);
  }

  // Anime un CLONE du mot qui s'envole depuis sa position réelle jusqu'à
  // #sacBouton, puis disparaît — repli silencieux si le sac est absent ou
  // masqué (même prudence que animerMotVersSac dans identite-eleve.js).
  function animerMotVersSac(span) {
    const bouton = document.getElementById('sacBouton');
    if (!bouton || getComputedStyle(bouton).display === 'none') return;
    const depart = span.getBoundingClientRect();
    const arrivee = bouton.getBoundingClientRect();
    const clone = document.createElement('span');
    clone.className = 'iden-mot-vole';
    clone.textContent = span.textContent;
    clone.style.left = depart.left + 'px';
    clone.style.top = depart.top + 'px';
    document.body.appendChild(clone);
    const dx = (arrivee.left + arrivee.width / 2) - (depart.left + depart.width / 2);
    const dy = (arrivee.top + arrivee.height / 2) - (depart.top + depart.height / 2);
    void clone.offsetWidth;
    clone.style.setProperty('--vol-dx', dx + 'px');
    clone.style.setProperty('--vol-dy', dy + 'px');
    clone.classList.add('en-vol');
    clone.addEventListener('transitionend', function () { clone.remove(); }, { once: true });
    bouton.classList.add('sac-recoit');
    setTimeout(function () { bouton.classList.remove('sac-recoit'); }, DUREE_VOL_MOT + DELAI_FERMETURE_SAC_APRES_RECEPTION);
  }

  const DUREE_VOL_MOT = 550;
  const DELAI_FERMETURE_SAC_APRES_RECEPTION = 350;
  const motsDejaAjoutes = new Set(); // un seul flash par mot par visite de la leçon

  function ajouterMotAuSac(span, mot) {
    if (typeof window.ajouterAuSac !== 'function') return; // sac-a-dos.js absent : repli silencieux
    const cle = mot.toLowerCase();
    const type = natureDeMot(cle);
    const item = { mot: cle, trad: traductionDeMot(mot) || '', informel: motEstInformel(mot), type: type, source: 'd3' };
    // 🆕 (retour Raphaël, 15-08-2026) : genre/article pour les noms,
    // infinitif/conjugaison pour les verbes — voir VOCABULAIRE ci-dessus.
    // Champs simplement absents de l'item quand non applicables : sac-a-
    // dos.js gère déjà leur absence proprement.
    const entree = VOCABULAIRE[cle];
    if (type === 'nom' && entree) {
      if (entree.genre) item.genre = entree.genre;
      if (entree.article) item.article = entree.article;
    } else if (type === 'verbe' && entree) {
      if (entree.infinitif) item.infinitif = entree.infinitif;
      if (entree.conjugaison) item.conjugaison = entree.conjugaison;
    }
    // 🆕 (16-08-2026, chantier "contexte + grammaire dans le sac") : phrase
    // d'exemple = la réplique affichée au moment du clic, et sa traduction
    // complète (même fonction que celle déjà utilisée pour l'affichage de
    // la traduction sous la bulle — pas de logique dupliquée).
    const def = ETAPES[etape];
    if (def && def.texte) {
      item.exemple = def.texte;
      const trad = traductionPhrase(def);
      if (trad) item.exempleTrad = trad;
    }
    window.ajouterAuSac('mots', item);
    animerMotVersSac(span);
    if (motsDejaAjoutes.has(cle)) return;
    motsDejaAjoutes.add(cle);
    span.classList.remove('flash-ajout');
    void span.offsetWidth;
    span.classList.add('flash-ajout');
  }

  // Découpe le texte de la bulle active en <span class="iden-mot">
  // cliquables — même logique de fusion de la ponctuation isolée
  // ("Mange\u00A0!" → un seul mot cliquable, pas un "!" à part) que
  // afficherBulle() dans identite-eleve.js.
  // 🆕 (15-08-2026) : correctif largeur de bulle trop large. Cause :
  // `width: fit-content` calcule sa largeur d'après le texte SANS retour
  // à la ligne (une seule ligne), puis `text-wrap: balance` ne fait que
  // réparti le texte en plusieurs lignes COURTES à l'intérieur de cette
  // largeur déjà figée — la bulle garde donc la largeur d'une ligne
  // unique même quand le texte affiché tient sur deux lignes bien plus
  // étroites (vérifié en isolant le cas dans un navigateur : la bulle
  // NE RÉTRÉCIT PAS après le retour à la ligne équilibré). Solution :
  // une fois le texte posé et équilibré, on mesure la largeur réelle de
  // la ligne la plus longue via Range.getClientRects() (fonctionne même
  // avec les <span class="iden-mot"> à l'intérieur) et on resserre la
  // bulle sur cette valeur avec une largeur explicite en pixels.
  function ajusterLargeurBulle(el) {
    // 🔧 (correctif du correctif, même session) : le contenu de la bulle
    // est fait de plusieurs <span class="iden-mot"> (un par mot, pour le
    // clic/traduction) — Range.getClientRects() renvoie alors UN rect PAR
    // <span>, pas un rect par LIGNE VISUELLE. Prendre le rect le plus
    // large donnait donc la largeur du mot le plus large, pas celle de la
    // ligne la plus large (bulle trop resserrée, ex-catastrophe : 4 lignes
    // au lieu de 2). Il faut regrouper les rects par ligne (même position
    // verticale) puis mesurer l'étendue horizontale totale de chaque
    // ligne (bord gauche du 1er rect au bord droit du dernier).
    const zone = document.createRange();
    zone.selectNodeContents(el);
    const rects = Array.from(zone.getClientRects()).filter(r => r.width > 0);
    if (!rects.length) return; // bulle vide ou pas encore rendue
    const lignes = [];
    rects.forEach(r => {
      let ligne = lignes.find(l => Math.abs(l.top - r.top) < 4);
      if (!ligne) { ligne = { top: r.top, gauche: r.left, droite: r.right }; lignes.push(ligne); }
      ligne.gauche = Math.min(ligne.gauche, r.left);
      ligne.droite = Math.max(ligne.droite, r.right);
    });
    const largeurMax = Math.max(...lignes.map(l => l.droite - l.gauche));
    const style = getComputedStyle(el);
    const largeurTotale = Math.ceil(largeurMax)
      + parseFloat(style.paddingLeft) + parseFloat(style.paddingRight)
      + parseFloat(style.borderLeftWidth) + parseFloat(style.borderRightWidth)
      + 1; // +1px de marge de sécurité contre l'arrondi sous-pixel
    el.style.width = largeurTotale + 'px';
  }

  const PONCTUATION_SEULE = /^[.,!?;:'"«»\u2026]+$/;
  function construireBulleMots(texteBrut) {
    elBulle.innerHTML = '';
    const brutSepares = String(texteBrut).split(/\s+/).filter(Boolean);
    const mots = [];
    brutSepares.forEach(function (tok) {
      if (PONCTUATION_SEULE.test(tok) && mots.length > 0) {
        mots[mots.length - 1] += '\u00A0' + tok;
      } else {
        mots.push(tok);
      }
    });
    mots.forEach(function (motBrut, idx) {
      const span = document.createElement('span');
      span.className = 'iden-mot';
      span.textContent = motBrut + (idx < mots.length - 1 ? '\u00A0' : '');
      const motNettoye = motBrut.replace(/^[\s.,!?;:'"«»\u2026]+|[\s.,!?;:'"«»\u2026]+$/g, '');
      span.tabIndex = 0;
      span.addEventListener('click', function (e) {
        e.stopPropagation();
        afficherTraductionMot(span, motNettoye);
      });
      span.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault(); e.stopPropagation();
          afficherTraductionMot(span, motNettoye);
        }
      });
      span.addEventListener('dblclick', function (e) {
        e.stopPropagation();
        ajouterMotAuSac(span, motNettoye);
      });
      elBulle.appendChild(span);
    });
  }

  const elCompteur = document.getElementById('compteur');
  const elBulle = document.getElementById('bulleDialogue');
  const elScene = document.getElementById('sceneDialogue');
  const btnPrecedent = document.getElementById('btnPrecedent');
  const btnSuivant = document.getElementById('btnSuivant');
  const elPileDialogue = document.getElementById('pileDialogue');
  const elPileGrammaire = document.getElementById('pileGrammaire');
  const blocGrammaire = document.getElementById('blocGrammaire');

  let etape = 0;
  let reconstructionEnCours = false;
  // 🐛 CORRIGÉ (diagnostiqué par l'autre Claude, terminé ici) : le
  // raccourci clavier (flèche/espace) appelait suivant() directement, sans
  // passer par la vérification `disabled` des boutons — une pression du
  // clavier pendant l'animation 5a→5d pouvait donc démarrer une deuxième
  // séquence en parallèle de la première, ce qui brouillait l'affichage
  // (la séquence rejouée depuis 5, une fois reculée puis relancée, sautait
  // b→d et allait directement à 6). `animationEnCours` est vérifié en tête
  // de suivant() ET precedent(), donc TOUTE tentative de navigation —
  // bouton, tap sur la scène, ou clavier — est bloquée pendant l'animation,
  // peu importe le chemin par lequel elle est déclenchée.
  let animationEnCours = false;
  const sequenceAJouePourEtapeActuelle = { valeur: false }; // 🔧 (7e échange) : remplace l'ancien Set sequencesJouees. Remis à false à CHAQUE rendreEtape() (voir plus bas), peu importe la direction de navigation — élimine le besoin de le gérer manuellement dans precedent(), et donc le risque de désynchronisation qui causait le bug "5a → 6 sans rejouer la séquence" signalé par Raphaël (09-08-2026).

  // 🆕 État global d'affichage des traductions de phrase (voir demande de
  // Raphaël) — appliqué par défaut à chaque nouvelle réplique ajoutée à la
  // pile ; un clic sur l'avatar ou le texte d'UNE réplique bascule
  // seulement celle-là, sans toucher à ce réglage global.
  let traductionsVisiblesParDefaut = false;

  function ajouterLigneDialogue(def) {
    // 🆕 (15-08-2026) : étape silencieuse (voir ETAPES[0]) — rien à pousser
    // dans #pileDialogue, même patron que ajouterNoteGrammaire() ci-dessous.
    if (!def.texte) return;
    const div = document.createElement('div');
    div.className = 'pile-item ' + def.speaker;
    const trad = traductionPhrase(def);
    // 🆕 (15-08-2026) .pile-audio : bouton 🔊 par réplique, sibling de
    // pile-avatar (même logique de révélation que btnAudioBulle, voir
    // body.audio-actif) — lit def.texte via lireAudio() au clic.
    div.innerHTML = '<button type="button" class="pile-avatar" aria-label="' + texteInterface('afficherTrad') + '">' + INITIALES[def.speaker] + '</button>' +
      '<div class="pile-corps"><span class="pile-qui">' + NOMS[def.speaker] + '</span>' +
      '<div class="pile-texte">' + def.texte + '</div>' +
      (trad ? '<div class="pile-trad">' + trad + '</div>' : '') +
      '</div>' +
      '<button type="button" class="pile-audio" aria-label="Écouter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg></button>';
    const elTrad = div.querySelector('.pile-trad');
    if (elTrad && traductionsVisiblesParDefaut) elTrad.classList.add('visible');
    if (elTrad) {
      const bascule = () => elTrad.classList.toggle('visible');
      div.querySelector('.pile-avatar').addEventListener('click', bascule);
      div.querySelector('.pile-texte').addEventListener('click', bascule);
    }
    div.querySelector('.pile-audio').addEventListener('click', (e) => {
      e.stopPropagation();
      lireAudio(def.texte);
    });
    elPileDialogue.appendChild(div);
    requestAnimationFrame(() => requestAnimationFrame(() => div.classList.add('in')));
  }

  // 🆕 (16-08-2026, chantier "contexte + grammaire dans le sac") :
  // formaterMarkdownLeger() vient de sac-a-dos.js — un seul endroit où la
  // règle "**gras** -> <strong>" est définie, partagée avec le rendu du
  // sac. Corrige au passage un bug réel : `div.innerHTML =
  // texteGrammaire(cle)` injectait le texte AVEC ses ** littéraux non
  // convertis (ils s'affichaient tels quels au lieu d'un gras) — cette
  // page utilisait innerHTML sans jamais convertir le Markdown. Chaque
  // note gagne aussi un bouton "Ajouter au sac" (demande de Raphaël :
  // "copier" les points de grammaire, pas seulement les mots).
  function ajouterNoteGrammaire(def) {
    if (!def.grammaire) return;
    // 🆕 (16-08-2026, demande de Raphaël) : "une ligne de dialogue peut
    // engendrer plus qu'une note grammaticale" — def.grammaire est
    // maintenant un tableau de clés (repli sur [def.grammaire] si jamais
    // une étape garde encore une simple chaîne). Chaque clé produit SA
    // PROPRE boîte .grammaire-item dans la pile, au lieu d'un unique bloc
    // de texte agglutiné — plus lisible, moins intimidant.
    const cles = Array.isArray(def.grammaire) ? def.grammaire : [def.grammaire];
    blocGrammaire.style.display = 'block';
    cles.forEach(function (cle) {
      const texteBrut = texteGrammaire(cle);
      if (!texteBrut) return;
      const div = document.createElement('div');
      div.className = 'grammaire-item';
      const corps = document.createElement('div');
      corps.className = 'grammaire-item-texte';
      corps.innerHTML = (typeof formaterMarkdownLeger === 'function') ? formaterMarkdownLeger(texteBrut) : texteBrut;
      div.appendChild(corps);

      if (typeof window.ajouterAuSac === 'function') {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'grammaire-ajouter-sac';
        btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg><span>' +
          (typeof tSacOuDefaut === 'function' ? tSacOuDefaut('sacAjouterAuSac', 'Add to backpack') : 'Add to backpack') + '</span>';
        btn.addEventListener('click', function () {
          ajouterPointGrammaireAuSac(cle, texteBrut, def);
          btn.classList.add('ajoute');
          const svg = btn.querySelector('svg');
          if (svg) svg.innerHTML = '<path d="M5 13l4 4L19 7"/>';
          setTimeout(function () {
            btn.classList.remove('ajoute');
            if (svg) svg.innerHTML = '<path d="M12 5v14M5 12h14"/>';
          }, 1100);
        });
        div.appendChild(btn);
      }

      elPileGrammaire.appendChild(div);
      requestAnimationFrame(() => requestAnimationFrame(() => div.classList.add('in')));
    });
  }

  // 🆕 (16-08-2026) : "Ajouter au sac" pour un point de grammaire entier
  // — voir dialogue-d1.html pour la même fonction, même logique. `cle`
  // est préfixée par l'identifiant de la leçon ('d3_') pour rester
  // unique même si une leçon future réutilise un nom de clé court.
  function ajouterPointGrammaireAuSac(cle, texteBrut, def) {
    if (typeof window.ajouterAuSac !== 'function') return;
    const item = { cle: 'd3_' + cle, texte: texteBrut, source: 'd3' };
    if (def && def.texte) {
      item.exemple = def.texte;
      const trad = traductionPhrase(def);
      if (trad) item.exempleTrad = trad;
    }
    window.ajouterAuSac('grammaire', item);
  }

  function rendreEtape() {
    const def = ETAPES[etape];
    // 🐛 CORRIGÉ (17-08-2026) : contrairement à d2, AUCUNE étape de d3
    // n'est silencieuse (voir correction en tête de fichier — l'étape 1
    // EST parlée par Bek). La numérotation spéciale héritée de d2
    // (Math.max(1, etape) / ETAPES.length - 1, qui compensait une étape
    // fantôme ETAPES[0] sans texte) n'a donc plus lieu d'être ici :
    // chaque entrée de ETAPES est une vraie réplique, numérotée 1 à 1.
    const numeroAffiche = etape + 1;
    elCompteur.textContent = numeroAffiche + ' / ' + ETAPES.length;

    // 🔧 (7e échange) : remis à false ICI, inconditionnellement — dès qu'on
    // affiche une étape (par suivant() OU precedent()), sa séquence auto,
    // si elle en a une, n'a par définition pas encore joué "cette fois-ci".
    sequenceAJouePourEtapeActuelle.valeur = false;

    // Bulle + scène. La plupart des étapes s'affichent d'un bloc (branche
    // "else"). Certaines (voir def.imgAvant/def.texteAvant plus bas) se
    // révèlent en DEUX temps, SANS changer de numéro ni d'étape — demande
    // explicite de Raphaël (17-08-2026) pour deux moments précis de d3 :
    //   1) Bek en position neutre → transition automatique vers la pose où
    //      elle parle de Keb à la 3e personne (ETAPES[0]).
    //   2) Keb "Oui. Il est bon..." → la bulle S'ALLONGE automatiquement
    //      pour inclure la rétractation ("... euh, non, il est délicieux !"),
    //      avec un changement de pose assorti (ETAPES[2]).
    // Rejoue seulement au premier passage AVANT (sequenceAJouePourEtapeActuelle,
    // remis à false en tête de rendreEtape) — un retour en arrière puis un
    // nouveau passage (reconstructionEnCours) affiche directement l'état
    // final, sans réanimer.
    const aReveal = !!(def.imgAvant || def.texteAvant) && !reconstructionEnCours;

    function afficherBulle(texte) {
      elBulle.classList.remove('in');
      if (texte) {
        elBulle.style.width = ''; // repart de fit-content avant de re-mesurer (voir ajusterLargeurBulle)
        elBulle.className = 'bulle-dialogue cote-' + def.speaker;
        construireBulleMots(texte);
        requestAnimationFrame(() => requestAnimationFrame(() => {
          elBulle.classList.add('in');
          ajusterLargeurBulle(elBulle);
        }));
      } else {
        elBulle.className = 'bulle-dialogue bulle-vide';
        elBulle.innerHTML = '';
      }
    }

    function afficherScene(img) {
      elScene.innerHTML = '';
      elScene.appendChild(creerImage(img));
    }

    if (aReveal) {
      afficherBulle(def.texteAvant);
      afficherScene(def.imgAvant || def.img);

      animationEnCours = true;
      btnPrecedent.disabled = true;
      btnSuivant.disabled = true;
      const etapeActuelle = etape;
      setTimeout(() => {
        if (etape !== etapeActuelle) return; // navigation entre-temps (prof, flèches…) — on abandonne
        afficherBulle(def.texte);
        afficherScene(def.img);
        if (!reconstructionEnCours) {
          ajouterLigneDialogue(def);
          ajouterNoteGrammaire(def);
        }
        animationEnCours = false;
        btnPrecedent.disabled = (etape === 0);
        btnSuivant.disabled = false;
      }, def.delaiReveal || 1400);
    } else {
      afficherBulle(def.texte);
      afficherScene(def.img);
      if (!reconstructionEnCours) {
        ajouterLigneDialogue(def);
        ajouterNoteGrammaire(def);
      }
    }

    btnPrecedent.disabled = (etape === 0);
    btnSuivant.textContent = (etape === ETAPES.length - 1)
      ? texteInterface('terminer') + ' \u203a'
      : texteInterface('continuer') + ' \u203a';

    // 🐛 RETIRÉ (17-08-2026) : le bloc avanceAuto hérité de d2 (avance
    // automatique sans clic depuis une étape silencieuse) n'a plus de
    // raison d'être ici — aucune étape de d3 n'est silencieuse (voir
    // correction en tête de fichier). La révélation en deux temps
    // ci-dessus (def.imgAvant/def.texteAvant) couvre maintenant ce besoin,
    // SANS avancer d'étape.

    // 🆕 (14-08-2026, session-classe.js) : best-effort, ne fait rien si ce
    // navigateur ne fait pas tourner de session prof — voir plus bas.
    // 🆕 (deuxième vague, même jour) : champ "page" ajouté — permet à une
    // AUTRE page (ex. parcours.html) de savoir vers où naviguer quand le
    // prof pousse un état depuis ICI. Chemin canonique confirmé dans
    // parcours.html (NIVEAUX → chapitre d3 → page: 'dialogues/d3/'),
    // repris tel quel plutôt que redéfini ici pour rester la seule source
    // de vérité de ce chemin.
    synchroniserEtatSession({ page: 'dialogues/d3/', section: 'dialogue', etape: etape });
  }

  // ---------- Séquence automatique (b→c→d) — exception ponctuelle pour
  // l'étape "Ton sandwich ?" (voir commentaire sur ETAPES), pas un patron
  // réutilisé ailleurs. Enchaîne les images avec un léger fondu, SANS
  // attendre de clic, pendant que la navigation est désactivée pour éviter
  // qu'un clic mal placé saute une étape ou casse l'état. ----------
  function jouerSequenceAuto(chemins, auTermine) {
    let i = 0;
    function etapeSuivante() {
      if (i >= chemins.length) {
        auTermine();
        return;
      }
      const item = chemins[i];
      const nouveau = (typeof item === 'string')
        ? creerImage(item)
        : creerImageComposite(item.img, item.superposition);
      nouveau.style.opacity = '0';
      nouveau.style.transition = 'opacity 0.55s ease'; /* 🆕 (5e échange) : plus lent qu'avant */
      elScene.innerHTML = '';
      elScene.appendChild(nouveau);
      requestAnimationFrame(() => requestAnimationFrame(() => { nouveau.style.opacity = '1'; }));
      i++;
      setTimeout(etapeSuivante, 1700); /* 🆕 (5e échange) : 1000 → 1700 ms */
    }
    etapeSuivante();
  }

  function suivant() {
    if (syncControleBloque) return; // navigation suspendue — voir session-classe.js plus bas
    if (animationEnCours) return;
    if (etape < ETAPES.length - 1) {
      const def = ETAPES[etape];
      // 🆕 (5e échange) : la séquence s'arrête maintenant à 5d — elle ne
      // fait PLUS avancer automatiquement jusqu'à l'étape 6. Une fois
      // jouée, le drapeau empêche de la rejouer : le clic Continuer
      // suivant se comporte alors comme une avance normale vers l'étape 6.
      if (def.sequenceAuto && !sequenceAJouePourEtapeActuelle.valeur) {
        animationEnCours = true;
        btnPrecedent.disabled = true;
        btnSuivant.disabled = true;
        jouerSequenceAuto(def.sequenceAuto, function () {
          sequenceAJouePourEtapeActuelle.valeur = true;
          animationEnCours = false;
          btnPrecedent.disabled = (etape === 0);
          btnSuivant.disabled = false;
        });
        return;
      }
      etape++;
      rendreEtape();
    } else {
      afficherExercices();
    }
  }

  function precedent() {
    if (syncControleBloque) return; // navigation suspendue — voir session-classe.js plus bas
    if (animationEnCours) return;
    if (etape === 0) return;
    etape--;
    // 🔧 (7e échange) : plus besoin de nettoyer sequencesJouees ici — voir
    // rendreEtape(), qui remet maintenant le drapeau à zéro à chaque appel.
    // Reconstruit les deux piles depuis le début plutôt que de retirer
    // juste le dernier élément — même stratégie que precedent() dans
    // intro-bonomes.html : plus simple et sans risque de désynchronisation
    // entre la pile de dialogue et la pile de grammaire.
    elPileDialogue.innerHTML = '';
    elPileGrammaire.innerHTML = '';
    blocGrammaire.style.display = 'none';
    reconstructionEnCours = true;
    for (let i = 0; i <= etape; i++) {
      ajouterLigneDialogue(ETAPES[i]);
      ajouterNoteGrammaire(ETAPES[i]);
    }
    elPileDialogue.querySelectorAll('.pile-item').forEach(el => el.classList.add('in'));
    elPileGrammaire.querySelectorAll('.grammaire-item').forEach(el => el.classList.add('in'));
    rendreEtape(); // 🆕 (6e échange) : appelé AVANT de repasser reconstructionEnCours à false
    reconstructionEnCours = false; // sinon rendreEtape() ci-dessus rajoute une 2e fois la ligne courante
  }

  // Fin de la leçon — enregistre la progression réelle (voir
  // marquer_chapitre_complete côté Supabase) puis retour au parcours.
  // ⚠️ N'attribue PAS encore de P$/PB (voir note en tête de fichier) —
  // en attente d'un montant/une logique confirmés par Raphaël.
  // 🆕 Section exercices — affichée à la place de la navigation du
  // dialogue une fois la dernière étape atteinte. Le dialogue complet
  // (#pileDialogue, déjà rempli) reste visible juste au-dessus : pas de
  // bascule séparée, l'élève peut déjà s'y référer sans rien déplier
  // (demande de Raphaël, mais la pile le couvrait déjà nativement).
  const elSectionExercices = document.getElementById('sectionExercices');
  const elConteneurExercices = document.getElementById('conteneurExercices');
  const btnTerminerExercices = document.getElementById('btnTerminerExercices');
  const elRemarqueDifficile = document.getElementById('remarqueQuatreDifficile');

  const exercicesResolusDifficile = new Set(); // ids résolus spécifiquement en mode difficile — condition carte
  // 🆕 (retour Raphaël, session du 13-08-2026) — suivi séparé pour les
  // récompenses P$/PB : "sans erreur" = réussi du premier coup (essais

  const exercicesResolusSansErreur = new Set();

  // Empêche de rappeler la RPC de récompense à chaque nouvel exercice

  // censée être idempotente côté serveur — voir attribuer_recompense_-
  // premiere_fois — mais autant éviter les appels réseau redondants).
  const recompensesExercicesDonnees = { base: false, parfait: false, parfaitDifficile: false };

  // 🆕 (15-08-2026, demande de Raphaël) Récompenses ÉCOUTE — état
  // ENTIÈREMENT SÉPARÉ de la section exercices d'image ci-dessus (un
  // élève qui ne fait QUE l'écoute ne doit jamais déclencher les
  // récompenses "d1_exercices_*", et vice-versa), ET un RAISONNEMENT
  // DIFFÉRENT de celui-ci (Raphaël, 15-08-2026 : "récompenser les deux
  // domaines de façon discriminée" — pas d'uniformisation). Ici, les
  // paliers sont organisés autour du NIVEAU atteint plutôt que de
  // l'absence totale d'erreur :
  //   - "réussi" (pour les deux premiers paliers) tolère UNE faute par
  //     exercice — un exercice n'est un ÉCHEC que s'il est encore faux
  //     au 2e essai (révélé). Ce seuil est déjà la limite existante du
  //     moteur d'exercice (essais >= 2 → révélation, voir
  //     creerZoneFacile/creerZoneDifficile) : aucune nouvelle mécanique
  //     de comptage n'était nécessaire, seulement distinguer "réussi"
  //     (essais 1 OU 2) d'"échec" (révélé) au moment de marquer() — voir
  //     le nouveau paramètre `reussi`.
  //   1. Les 4 exercices RÉUSSIS (≤ 1 faute chacun) alors qu'ils étaient
  //      réglés en FACILE            → 5 P$ (une seule fois)
  //   2. Les 4 exercices RÉUSSIS (≤ 1 faute chacun) alors qu'ils étaient
  //      réglés en DIFFICILE          → +5 P$ (une seule fois) — ET si le
  //      palier 1 n'a JAMAIS été accordé (élève qui saute directement en
  //      difficile sans jamais passer par facile), il est accordé EN
  //      MÊME TEMPS ici plutôt que de rester à jamais hors d'atteinte
  //      (voir verifierRecompensesExercicesEcoute).
  //   3. Les 4 exercices réussis SANS AUCUNE FAUTE (1er essai correct)
  //      spécifiquement en DIFFICILE → +1 PB (une seule fois)
  // Total maximal : 10 P$ + 1 PB — même total que la section exercices,
  // mais atteint différemment. Un exercice déjà résolu reste rejouable
  // (voir carte.choisirNiveau, toujours reconstruit à neuf) : rien
  // n'empêche un élève de repasser un exercice déjà réussi en facile
  // pour aller chercher le palier difficile, puis le palier PB, jusqu'à
  // avoir obtenu tous les paliers.
  const elSectionExercicesEcoute = document.getElementById('sectionExercicesEcoute');
  const elConteneurExercicesEcoute = document.getElementById('conteneurExercicesEcoute');
  const btnTerminerExercicesEcoute = document.getElementById('btnTerminerExercicesEcoute');
  const exercicesEcouteReussisFacile = new Set(); // réussis (≤ 1 faute), niveau facile au moment de la réussite
  const exercicesEcouteReussisDifficile = new Set(); // réussis (≤ 1 faute), niveau difficile
  const exercicesEcouteReussisSansErreurDifficile = new Set(); // réussis du 1er coup (0 faute), niveau difficile — condition du PB
  const recompensesExercicesEcouteDonnees = { facile: false, difficile: false, parfaitDifficile: false };

  // 🐛 CORRIGÉ (13-08-2026) : jamais déclarée nulle part dans ce fichier —
  // terminerLecon() (voir plus bas) la LISAIT (if (leconTerminee) return;)
  // avant toute affectation, ce qui levait une ReferenceError à chaque
  // clic sur « Terminer » : ni marquerChapitreComplete, ni la redirection
  // vers parcours.html ne s'exécutaient jamais. C'est ce qui rendait le
  // bouton totalement silencieux.
  let leconTerminee = false;


  // 🆕 Niveau global — état de départ appliqué à toutes les cartes à la
  // construction (voir afficherExercices). N'empêche pas un réglage
  // individuel ensuite : c'est juste le point de départ commun.
  let niveauGlobalCourant = 'facile';
  const elToggleNiveauGlobal = document.getElementById('toggleNiveauGlobal');
  const btnNiveauGlobalFacile = document.getElementById('btnNiveauGlobalFacile');
  const btnNiveauGlobalDifficile = document.getElementById('btnNiveauGlobalDifficile');

  function choisirNiveauGlobal(niveau) {
    niveauGlobalCourant = niveau;
    btnNiveauGlobalFacile.classList.toggle('actif', niveau === 'facile');
    btnNiveauGlobalDifficile.classList.toggle('actif', niveau === 'difficile');

      if (carte.choisirNiveau) carte.choisirNiveau(niveau);
