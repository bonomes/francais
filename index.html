  // ==================================================================
  // 🆕 (demande de Raphaël) Repositionnement du sélecteur de langue selon
  // l'écran actif :
  //   - Menu principal : coin supérieur droit, juste à gauche du widget
  //     "Cours en direct" (#kbwWidget, widget-session-prof.js) s'il existe
  //     (comptes profs uniquement — sa propre garde interne le crée ou non),
  //     sinon dans le coin lui-même. Avant ce correctif, le bouton flottait
  //     à sa position par défaut (left:20px/top:280px, pensée pour l'écran
  //     d'accueil) au milieu du menu, sans rien à côté de lui.
  //   - Écran d'accueil : rapproché des personnages plutôt que planté à
  //     20px du bord de la FENÊTRE — sur un écran large, .personnages-groupe
  //     (max-width: 900px) est centré dans le viewport, donc l'ancien
  //     left:20px fixe se retrouvait très loin des personnages, eux
  //     centrés. Position mesurée dynamiquement via getBoundingClientRect()
  //     plutôt que recalculée en CSS pur (calc/min) : .personnages-groupe
  //     est une grille 1fr/auto/1fr dont la répartition exacte des deux
  //     pistes 1fr dépend du contenu réel de .connexion-choix (voir CSS),
  //     donc une formule CSS statique se serait vite désynchronisée du
  //     rendu réel.
  //   - Séquence identité / mode professeur : position par défaut
  //     d'origine, inchangée (déjà mesurée pour ces écrans — voir le long
  //     commentaire CSS sur .selecteur-langue).
  // Recalculé au redimensionnement de la fenêtre, ainsi qu'à chaque
  // apparition/disparition du menu, de l'accueil, ou du widget "Cours en
  // direct" — observé (MutationObserver) plutôt que rappelé explicitement à
  // chacun des multiples endroits qui bascule ces affichages
  // (allerAuMenuPrincipal, onRetourAccueil, allerAuModeProfesseur,
  // demarrerIdentiteSiPremiereFois, demarrerReconnexionDepuisIndex, leurs
  // onQuitter respectifs…) : plus sûr, ne peut pas être oublié si un futur
  // endroit vient s'ajouter à cette liste.
  // ==================================================================
  const MENU_PRINCIPAL_EL = document.getElementById('menuPrincipal');

  function repositionnerSelecteurLangue() {
    const menuVisible = MENU_PRINCIPAL_EL.style.display !== 'none';
    const accueilVisible = sceneRangee.style.display !== 'none';

    zoneApercuGauche.style.left = '';

    if (menuVisible) {
      const MARGE = 12;
      const ECART = 10;
      const widget = document.getElementById('kbwWidget');
      // ⚠️ offsetParent est TOUJOURS null pour un élément position:fixed
      // (comme #kbwWidget), qu'il soit visible ou non — ce n'est donc pas
      // un test de visibilité fiable ici. display est vérifié directement
      // à la place, cohérent avec masquer()/afficher() (widget-session-prof.js),
      // qui basculent justement ce widget via style.display.
      const decalage = (widget && widget.style.display !== 'none')
        ? MARGE + widget.getBoundingClientRect().width + ECART
        : MARGE;
      zone.style.top = MARGE + 'px';
      zone.style.left = 'auto';
      zone.style.right = decalage + 'px';
    } else if (accueilVisible) {
      const MARGE = 20;
      const ECART = 14;
      const rectPersonnages = personnages.getBoundingClientRect();
      const gauche = Math.max(MARGE, rectPersonnages.left - ECART - zone.offsetWidth);
      zone.style.top = '280px';
      zone.style.right = 'auto';
      zone.style.left = gauche + 'px';
      // .zone-apercu-gauche (anneau de survol élargi, voir HTML/CSS) garde
      // le même rapport -40px que sa position CSS d'origine par rapport au
      // déclencheur — sans ça, il resterait planté à son ancien left:20px
      // pendant que le bouton visible, lui, se serait déplacé : l'anneau
      // ne recouvrirait plus le bouton qu'il est censé élargir.
      zoneApercuGauche.style.left = (gauche - 40) + 'px';
    } else {
      zone.style.top = '';
      zone.style.left = '';
      zone.style.right = '';
    }
  }

  new MutationObserver(repositionnerSelecteurLangue)
    .observe(MENU_PRINCIPAL_EL, { attributes: true, attributeFilter: ['style'] });
  new MutationObserver(repositionnerSelecteurLangue)
    .observe(sceneRangee, { attributes: true, attributeFilter: ['style'] });
  // #kbwWidget est ajouté au <body> de façon asynchrone (voir
  // KebBekWidgetSessionProf.initialiser(), appelé sans await depuis
  // allerAuMenuPrincipal) — observé pour recaler le sélecteur dès son
  // apparition, pas seulement au chargement initial de la page.
  new MutationObserver(repositionnerSelecteurLangue)
    .observe(document.body, { childList: true });
  window.addEventListener('resize', repositionnerSelecteurLangue);
  repositionnerSelecteurLangue();

  // 🆕 Petite séquence animée au survol de "Non" : posture normale (01)
  // → bras levé façon salut (02) pendant un court instant → retour à la
  // posture normale (01), pour imiter un mouvement de salutation plutôt
  // qu'un simple changement d'image figé. Minuteries gardées dans des
  // variables pour pouvoir les annuler si la souris quitte le bouton
  // avant la fin (arreterSequenceEquipes(), voir masquerApercuPremiereFois
  // plus bas) — sinon une image pourrait s'afficher après coup, une fois
  // le survol déjà terminé.
  let minuterieSalutDebut = null;
  let minuterieSalutFin = null;

  function jouerSequenceEquipes() {
    arreterSequenceEquipes();
    afficherImage(imgEquipes); // 01, posture normale, tout de suite
    minuterieSalutDebut = setTimeout(() => {
      afficherImage(imgEquipesSalut); // 02, le salut, une fraction de seconde plus tard
    }, 180);
    minuterieSalutFin = setTimeout(() => {
      afficherImage(imgEquipes); // retour à 01, un peu moins d'une seconde après le salut
    }, 800);
  }

  function arreterSequenceEquipes() {
    clearTimeout(minuterieSalutDebut);
    clearTimeout(minuterieSalutFin);
  }

  // 🆕 (18-08-2026) Aperçu au survol (souris) / tap (tactile) des
  // boutons "Première leçon" / "Connexion" — même esprit que le reste
  // des interactions de cette page (sélecteur de langue, "Bonjour !") :
  // on prévisualise avant même de cliquer. "Première leçon" (nouvel
  // élève) fait apparaître la bulle "Bienvenue !" en plus du changement
  // d'image, comme l'ancien "Oui" ; "Connexion" (élève qui revient
  // récupérer son compte) déclenche la petite séquence de salut
  // ci-dessus, pas de bulle, comme l'ancien "Non".
  function apercuConnexionChoix(cible) {
    if (modeSecretActif()) return; // case secrète prioritaire sur tout le reste
    bulleBonjour.classList.remove('visible'); // un seul mot à la fois au-dessus des personnages
    if (cible === 'lecon') {
      arreterSequenceEquipes();
      afficherImage(imgBienvenue);
      bulleBienvenue.classList.add('visible');
    } else {
      bulleBienvenue.classList.remove('visible');
      jouerSequenceEquipes();
    }
  }

  function masquerApercuConnexionChoix() {
    arreterSequenceEquipes();
    bulleBienvenue.classList.remove('visible');
    if (!modeSecretActif() && !hoverBonjourActif && !estOuvert()) afficherImage(imgNeutre);
  }

  [btnPremiereLeconIndex, btnConnexionIndex].forEach(bouton => {
    bouton.addEventListener('mouseenter', () => apercuConnexionChoix(bouton.dataset.cible));
    bouton.addEventListener('mouseleave', masquerApercuConnexionChoix);
  });
  // 🆕 (20-08-2026) "Première leçon" mène maintenant directement à la
  // vraie Leçon 1 (lecons/lecon-01-rencontre.html), qui capte elle-même
  // le prénom au fil de son dialogue — plus besoin de passer par
  // demarrerIdentiteSiPremiereFois()/#sequenceIdentite pour ce chemin.
  // Cette fonction et #sequenceIdentite restent utilisés ailleurs (voir
  // demarrerReconnexionDepuisIndex() et onCreerCompte dans
  // menu-principal.js plus bas) — on ne les retire donc PAS du fichier.
  btnPremiereLeconIndex.addEventListener('click', () => { window.location.href = 'lecons/lecon-01-rencontre.html'; });
  btnConnexionIndex.addEventListener('click', () => demarrerReconnexionDepuisIndex('accueil'));

  const panneau = document.getElementById('slPanneau');
  const slTitreForce = document.getElementById('slTitreForce');
  const slTitreForceTexte = document.getElementById('slTitreForceTexte');
  const recherche = document.getElementById('slRecherche');
  const grilleConteneur = document.getElementById('slGrille');
  const grilleVide = document.getElementById('slVide');

  // 🆕 (demande de Raphaël, 19-08-2026) Rotation de "Quelle langue
  // parles-tu ?" à travers les 19 langues du site, français en
  // premier (déjà affiché avant même que la rotation démarre — voir
  // demarrerRotationTitreForce()). L'objectif n'est PAS que l'élève
  // lise chaque phrase : c'est une RECONNAISSANCE visuelle — l'élève
  // regarde défiler, et reconnaît sa langue au passage, même une
  // écriture non familière (japonais, coréen...) n'a pas besoin d'être
  // lisible, juste vue. D'où le rythme volontairement rapide (1s) et
  // le fait que l'ordre suit exactement LANGUES (voir plus haut) plutôt
  // que d'être dupliqué à la main : une langue ajoutée à LANGUES un
  // jour rejoint automatiquement cette rotation sans y repenser.
  const TRADUCTIONS_QUESTION_LANGUE = {
    en: 'What language do you speak?',
    es: '¿Qué idioma hablas?',
    it: 'Che lingua parli?',
    pt: 'Que língua falas?',
    ca: 'Quina llengua parles?',
    eo: 'Kiun lingvon vi parolas?',
    zh: '你说什么语言？',
    ja: '何語を話しますか？',
    ko: '어떤 언어를 하세요?',
    vi: 'Bạn nói ngôn ngữ gì?',
    ht: 'Ki lang ou pale?',
    tl: 'Anong wika ang sinasalita mo?',
    id: 'Bahasa apa yang kamu bicarakan?',
    nl: 'Welke taal spreek je?',
    de: 'Welche Sprache sprichst du?',
    fa: 'به چه زبانی صحبت می‌کنی؟',
    sv: 'Vilket språk talar du?',
    no: 'Hvilket språk snakker du?',
    ru: 'На каком языке ты говоришь?',
  };
  const ROTATION_TITRE_FORCE = [
    { code: 'fr', texte: 'Quelle langue parles-tu ?' },
    ...LANGUES.map(l => ({ code: l.code, texte: TRADUCTIONS_QUESTION_LANGUE[l.code] })),
  ];
  // 🆕 Même correctif que .sl-chip-natif ci-dessus (voir son commentaire
  // pour le détail russe/vietnamien) — mais appliqué ici DYNAMIQUEMENT,
  // puisque #slTitreForceTexte est un seul et même élément dont le
  // CONTENU change toutes les secondes (pas une carte par langue comme
  // dans la grille, où un sélecteur CSS data-code suffisait). Recalculé
  // à chaque étape de la rotation dans etapeRotationTitre()/
  // demarrerRotationTitreForce() ci-dessous.
  const LANGUES_POLICE_SYSTEME = new Set(['ru', 'vi']);
  const prefereMouvementReduit = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const DELAI_ROTATION_TITRE = 1000;
  const DUREE_FONDU_TITRE = 180; // doit correspondre à la transition CSS de #slTitreForceTexte
  let indexRotationTitre = 0;
  let minuteurRotationTitre = null;
  let rotationTitreEnPause = false;

  function afficherEtapeRotationTitre(entree) {
    slTitreForceTexte.textContent = entree.texte;
    slTitreForceTexte.classList.toggle('sl-titre-police-systeme', LANGUES_POLICE_SYSTEME.has(entree.code));
  }

  function etapeRotationTitre() {
    if (rotationTitreEnPause) return;
    indexRotationTitre = (indexRotationTitre + 1) % ROTATION_TITRE_FORCE.length;
    slTitreForceTexte.classList.add('sl-titre-fige');
    setTimeout(() => {
      afficherEtapeRotationTitre(ROTATION_TITRE_FORCE[indexRotationTitre]);
      slTitreForceTexte.classList.remove('sl-titre-fige');
    }, DUREE_FONDU_TITRE);
  }

  function demarrerRotationTitreForce() {
    indexRotationTitre = 0;
    afficherEtapeRotationTitre(ROTATION_TITRE_FORCE[0]);
    slTitreForceTexte.classList.remove('sl-titre-fige');
    clearInterval(minuteurRotationTitre);
    // 🆕 prefers-reduced-motion : le français reste affiché, fixe —
    // aucun minuteur n'est même démarré, pas juste "mis en pause".
    if (prefereMouvementReduit) return;
    minuteurRotationTitre = setInterval(etapeRotationTitre, DELAI_ROTATION_TITRE);
  }

  function arreterRotationTitreForce() {
    clearInterval(minuteurRotationTitre);
    minuteurRotationTitre = null;
  }

  // 🆕 Pause dès que la souris ou le clavier entre dans le panneau —
  // pour ne jamais faire sentir à un élève qui prend plus de temps
  // qu'il "rate" quelque chose de minuté. focusin/focusout (et non
  // focus/blur) car ils remontent (bubbling), donc un seul écouteur
  // sur le panneau suffit pour tous ses enfants (recherche, cartes...).
  panneau.addEventListener('mouseenter', () => { rotationTitreEnPause = true; });
  panneau.addEventListener('mouseleave', () => { rotationTitreEnPause = false; });
  panneau.addEventListener('focusin', () => { rotationTitreEnPause = true; });
  panneau.addEventListener('focusout', () => { rotationTitreEnPause = false; });

  function normaliser(s) {
    return s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  }

  // ---------- Construction de la grille ----------

  function creerChipGrille(langue) {
    const el = document.createElement('div');
    el.className = 'sl-chip';
    el.dataset.code = langue.code;
    el.setAttribute('role', 'option');
    el.innerHTML = `
      <span class="sl-chip-badge" aria-hidden="true">${langue.code.toUpperCase()}</span>
      <span class="sl-chip-natif">${langue.natif}</span>
      <span class="sl-chip-code">${langue.fr}</span>`;
    el.addEventListener('click', () => choisir(langue.code));
    return el;
  }

  LANGUES.forEach(l => grilleConteneur.appendChild(creerChipGrille(l)));

  function rafraichirSelection() {
    document.querySelectorAll('.sl-chip').forEach(el => {
      el.classList.toggle('selectionne', el.dataset.code === langueActuelle);
    });
    code.textContent = langueActuelle.toUpperCase();
  }
  rafraichirSelection();

  // ---------- Filtrage (recherche) ----------

  function filtrer() {
    const q = normaliser(recherche.value.trim());
    let visibles = 0;
    Array.from(grilleConteneur.children).forEach(el => {
      const langue = LANGUES.find(l => l.code === el.dataset.code);
      const correspond = !q || normaliser(langue.natif).includes(q) || normaliser(langue.fr).includes(q);
      el.hidden = !correspond;
      if (correspond) visibles++;
    });
    grilleVide.hidden = visibles > 0;
  }

  recherche.addEventListener('input', filtrer);

  // ==================================================================
  // Affichage des 7 images de #personnages — une seule "active" à la
  // fois (4 d'origine + 🆕 imgBienvenue/imgEquipes/imgEquipesSalut pour
  // le bloc "First time?", voir plus haut). Remplace le crossfade en
  // pur CSS :hover de l'original (.survol dans index (2)) par un point
  // d'entrée JS unique, pour que le survol du sélecteur de langue, le
  // mécanisme "Bonjour !" et le bloc "First time?" (voir plus bas et
  // plus haut) puissent tous décider quelle image montrer sans se
  // marcher dessus.
  // ==================================================================
  function afficherImage(imgAAfficher) {
    [imgNeutre, imgGauche, imgSaluent, imgClique, imgBienvenue, imgEquipes, imgEquipesSalut].forEach(img => {
      img.classList.toggle('actif', img === imgAAfficher);
    });
  }

  // ==================================================================
  // Mécanisme "Bonjour !" — COPIÉ de index (2) (BONOMES_v57/v58 :
  // .survol / .bulle-bonjour / .zone-case / compteur de 50 survols),
  // adapté à afficherImage() ci-dessus plutôt qu'au crossfade CSS
  // :hover original (voir CSS). Déclencheur : survol souris DIRECT de
  // #personnages (le survol du sélecteur de langue reste un
  // déclencheur séparé, inchangé plus bas) ; sur tactile, où il n'y a
  // pas de survol, un tap fait office de bascule — même esprit que le
  // "premier tap ouvre et maintient, tap ailleurs ferme" déjà utilisé
  // pour .pile-tooltip ailleurs sur le site (voir BONOMES_v61).
  //
  // ⚠️ Clé localStorage DISTINCTE de celle d'index (2)
  // (kebbek_compteur_bonjour) volontairement : cet essai est autonome
  // et pourrait être ouvert sur le même domaine que le vrai site un
  // jour — mieux vaut ne pas fausser un compteur réel avec des tests.
  //
  // 🐛 CORRIGÉ (retour Raphaël) : le compteur ne se remettait JAMAIS à
  // zéro tout seul — une fois le seuil de 50 atteint (ce qui arrive
  // vite en testant/rechargeant souvent la page), l'image "clique ici"
  // restait affichée à chaque visite suivante, indéfiniment, tant que
  // la case secrète n'avait pas été trouvée. Ajout d'un horodatage
  // (CLE_HORODATAGE_BONJOUR_ESSAI) : si plus de 30 minutes se sont
  // écoulées depuis le dernier survol compté, lireCompteurBonjour()
  // remet le compteur à zéro avant de le lire — comme une session
  // fraîche. Le jeu (survoler 50 fois pour débloquer la case secrète)
  // reste intact TANT QUE les survols restent rapprochés dans le
  // temps ; seule une longue pause (nouvelle visite, jour suivant...)
  // repart de zéro plutôt que de rester bloqué indéfiniment.
  // ==================================================================
  const CLE_COMPTEUR_BONJOUR_ESSAI = 'kebbek_essai_compteur_bonjour';
  const CLE_CASE_SECRETE_ESSAI = 'kebbek_essai_case_secrete_trouvee';
  const CLE_HORODATAGE_BONJOUR_ESSAI = 'kebbek_essai_horodatage_bonjour';
  const SEUIL_BONJOUR = 50;
  const EXPIRATION_COMPTEUR_BONJOUR_MS = 30 * 60 * 1000; // 30 minutes d'inactivité

  let hoverBonjourActif = false;

  function caseSecreteDejaTrouvee() {
    return localStorage.getItem(CLE_CASE_SECRETE_ESSAI) === '1';
  }
  function lireCompteurBonjour() {
    const horodatage = parseInt(localStorage.getItem(CLE_HORODATAGE_BONJOUR_ESSAI) || '0', 10);
    if (horodatage && (Date.now() - horodatage) > EXPIRATION_COMPTEUR_BONJOUR_MS) {
      localStorage.setItem(CLE_COMPTEUR_BONJOUR_ESSAI, '0');
      return 0;
    }
    return parseInt(localStorage.getItem(CLE_COMPTEUR_BONJOUR_ESSAI) || '0', 10);
  }
  function modeSecretActif() {
    return !caseSecreteDejaTrouvee() && lireCompteurBonjour() >= SEUIL_BONJOUR;
  }

  // À appeler après tout changement du compteur (ou au chargement de la
  // page, pour reprendre correctement un compteur déjà élevé lors d'un
  // rechargement en plein essai — même précaution que index (2)).
  function majModeSecret() {
    const actif = modeSecretActif();
    personnages.classList.toggle('mode-secret', actif);
    if (actif) {
      bulleBonjour.classList.remove('visible');
      afficherImage(imgClique);
    }
  }

  function survolBonjourDebut() {
    if (modeSecretActif()) return; // la case secrète prime sur le "Bonjour !" normal
    hoverBonjourActif = true;
    afficherImage(imgSaluent);
    bulleBonjour.classList.add('visible');
    if (!caseSecreteDejaTrouvee()) {
      localStorage.setItem(CLE_COMPTEUR_BONJOUR_ESSAI, String(lireCompteurBonjour() + 1));
      localStorage.setItem(CLE_HORODATAGE_BONJOUR_ESSAI, String(Date.now()));
      majModeSecret(); // peut basculer immédiatement en mode secret si le seuil vient d'être atteint
    }
  }

  function survolBonjourFin() {
    hoverBonjourActif = false;
    bulleBonjour.classList.remove('visible');
    if (!modeSecretActif() && !estOuvert()) afficherImage(imgNeutre);
  }

  personnages.addEventListener('mouseenter', survolBonjourDebut);
  personnages.addEventListener('mouseleave', survolBonjourFin);

  // Tactile : pas d'événement mouseenter, donc le clic en tient lieu.
  // Un premier tap ouvre (et compte), un tap ailleurs sur la page
  // referme — la .zone-case (visible seulement en mode secret, voir
  // CSS) a son propre gestionnaire séparé plus bas et n'est jamais
  // affectée par celui-ci.
  personnages.addEventListener('click', (e) => {
    if (modeSecretActif()) return; // en mode secret, seule .zone-case répond
    if (hoverBonjourActif) return; // déjà ouvert par la souris : rien à faire
    e.stopPropagation();
    survolBonjourDebut();
  });

  document.addEventListener('click', (e) => {
    if (hoverBonjourActif && !personnages.contains(e.target)) survolBonjourFin();
  });

  // ---------- Case secrète (4e image, "clique ici") ----------
  //
  // Succès si le clic tombe exactement dans .zone-case (coordonnées
  // calibrées sur la bulle "CLIQUE ICI" de la 4e image, voir CSS).
  zoneCaseSecrete.addEventListener('click', (e) => {
    e.preventDefault();
    e.stopPropagation();
    localStorage.setItem(CLE_CASE_SECRETE_ESSAI, '1');
    localStorage.setItem(CLE_COMPTEUR_BONJOUR_ESSAI, '0');
    personnages.classList.remove('mode-secret');
    hoverBonjourActif = false;
    bulleBonjour.classList.remove('visible');
    afficherImage(imgNeutre);
    declencherSucces();
  });

  function declencherSucces() {
    // Cet essai est autonome (sac-a-dos.js pas chargé ici, voir tête de
    // fichier de sac-a-dos.js) — indicateur visuel simple pour
    // l'instant. À remplacer par un vrai ajouterAuSac('succes', {...})
    // le jour où ce mécanisme est intégré dans une page qui charge le
    // sac à dos.
    personnages.classList.add('succes-flash');
    setTimeout(() => personnages.classList.remove('succes-flash'), 900);
  }

  majModeSecret(); // reprise correcte si la page est rechargée en pleine série de survols

  // ---------- Ouverture / fermeture ----------
  //
  // Le survol (mouseenter / mouseleave) est la manière PRINCIPALE
  // d'ouvrir et de fermer le panneau : dès que la souris touche le
  // déclencheur ou le panneau, ça s'ouvre et les personnages se
  // tournent. Un petit délai de fermeture évite que le panneau se
  // referme si la souris traverse rapidement l'espace entre le
  // déclencheur et le panneau. Le clic reste disponible en secours
  // (tactile, clavier) pour basculer l'ouverture manuellement.

  const DELAI_FERMETURE = 180; // ms
  let minuteurFermeture = null;
  let ouvertParClic = false;

  function estOuvert() {
    return zone.classList.contains('ouvert');
  }

  function ouvrir() {
    clearTimeout(minuteurFermeture);
    if (estOuvert()) return;
    if (modeSecretActif()) return; // case secrète prioritaire, voir mécanisme "Bonjour !" plus haut
    zone.classList.add('ouvert');
    declencheur.setAttribute('aria-expanded', 'true');
    afficherImage(imgGauche);
  }

  function fermer() {
    // 🆕 (18-08-2026) Tant que le choix de langue est obligatoire
    // (première visite, voir ouvrirChoixLangueForce() plus bas), aucun
    // des déclencheurs habituels de fermeture (fond, clic extérieur,
    // Échap, sortie de survol) ne doit pouvoir refermer le panneau sans
    // qu'une pastille ait été choisie — choisir() est le seul chemin
    // qui retire .forme-obligatoire, et donc le seul à pouvoir fermer
    // le panneau dans ce cas précis.
    if (zone.classList.contains('forme-obligatoire')) return;
    clearTimeout(minuteurFermeture);
    zone.classList.remove('ouvert');
    declencheur.setAttribute('aria-expanded', 'false');
    ouvertParClic = false;
    recherche.value = '';
    filtrer();
    // Ne reprend l'image neutre que si rien d'autre ne se dispute
    // l'affichage en ce moment (survol "Bonjour !" en cours, ou mode
    // secret déjà actif) — évite un clignotement vers "neutre" entre
    // deux états.
    if (!modeSecretActif() && !hoverBonjourActif) afficherImage(imgNeutre);
  }

  function programmerFermeture() {
    clearTimeout(minuteurFermeture);
    minuteurFermeture = setTimeout(() => {
      if (!ouvertParClic) fermer();
    }, DELAI_FERMETURE);
  }

  // 🆕 (18-08-2026) Choix de langue obligatoire — première visite (voir
  // la logique de démarrage tout en bas du script). Ajoute
  // .forme-obligatoire
  // (masque le déclencheur discret, voir CSS) PUIS ouvre normalement
  // via ouvrir() — le panneau, déjà un recouvrement centré plein écran
  // à toutes les largeurs, se retrouve donc grand ouvert dès le
  // chargement, simplement caché sous l'écran-titre (#ecranTitre,
  // z-index 500 contre 20 ici) jusqu'à ce que celui-ci se retire tout
  // seul — rien à séquencer en plus ici, l'ordre des z-index suffit.
  function ouvrirChoixLangueForce() {
    zone.classList.add('forme-obligatoire');
    slTitreForce.hidden = false;
    demarrerRotationTitreForce();
    ouvrir();
  }

  function choisir(codeLangue) {
    langueActuelle = codeLangue;
    sauvegarderLangue(codeLangue);
    appliquerDirectionLangue(codeLangue);
    rafraichirSelection();
    code.style.transform = 'scale(0.7)';
    requestAnimationFrame(() => {
      code.style.transition = 'transform 0.28s cubic-bezier(.34,1.6,.4,1)';
      code.style.transform = 'scale(1)';
    });
    // 🆕 (18-08-2026) Premier choix forcé (voir ouvrirChoixLangueForce()
    // plus bas) : referme le mode obligatoire et révèle le bloc
    // Connexion/Première leçon — c'est LE moment où ce bloc apparaît
    // pour la toute première fois, plus jamais ensuite (une langue
    // enregistrée envoie directement au menu principal, voir la
    // logique de démarrage tout en bas du script). Un changement de
    // langue fait ailleurs (déjà au menu, etc.) ne rouvre jamais ce
    // bloc, puisque .forme-obligatoire n'est alors pas présente.
    if (zone.classList.contains('forme-obligatoire')) {
      zone.classList.remove('forme-obligatoire');
      slTitreForce.hidden = true;
      arreterRotationTitreForce();
      afficherConnexionChoix();
    }
    rafraichirLienCoursPrives();
    rafraichirConnexionBoutons();
    rafraichirEnteteSac();
    fermer();
  }

  // Survol de toute la zone (déclencheur + pont + panneau) : ouvre.
  zone.addEventListener('mouseenter', ouvrir);
  zone.addEventListener('mouseleave', programmerFermeture);

  // ---------- Anneau de survol/tap élargi (juste la pose, pas le panneau) ----------
  //
  // 🆕 (retour Raphaël) : #zoneApercuGauche (voir HTML/CSS) est un
  // anneau invisible d'environ 1cm tout autour du déclencheur. Il ne
  // touche JAMAIS à .ouvert (donc n'ouvre jamais le panneau) — il
  // bascule seulement vers la pose "Keb et Bek regardent vers la
  // gauche" (imgGauche), pour que le geste soit plus facile à
  // découvrir qu'un tout petit bouton isolé dans le coin de l'écran.
  //
  // Garde sur #sceneRangee : n'agit que sur l'écran d'ACCUEIL, seul
  // endroit où #imgGauche/.personnages existent visuellement (sur les
  // autres écrans, #sceneRangee passe en display:none — voir
  // demarrerIdentiteSiPremiereFois()/demarrerMenuPrincipal()) ; lu à
  // chaque survol plutôt que mis en cache, pour rester exact même si
  // l'écran change pendant que la page est ouverte.
  function surAccueil() {
    const sr = document.getElementById('sceneRangee');
    return !!sr && sr.style.display !== 'none';
  }

  let apercuGaucheActif = false;

  function survolApercuGaucheDebut() {
    if (!surAccueil()) return;
    // Ne dispute rien d'autre déjà affiché (panneau ouvert, mode
    // secret, ou survol "Bonjour !" en cours sur les personnages).
    if (estOuvert() || modeSecretActif() || hoverBonjourActif) return;
    apercuGaucheActif = true;
    afficherImage(imgGauche);
  }

  function survolApercuGaucheFin() {
    if (!apercuGaucheActif) return;
    apercuGaucheActif = false;
    if (!estOuvert() && !modeSecretActif() && !hoverBonjourActif) afficherImage(imgNeutre);
  }

  zoneApercuGauche.addEventListener('mouseenter', survolApercuGaucheDebut);
  zoneApercuGauche.addEventListener('mouseleave', survolApercuGaucheFin);

  // Tactile : pas de survol, donc un tap dans l'anneau affiche la pose
  // (un tap AILLEURS referme, jamais un second tap au même endroit) —
  // même patron que .personnages/survolBonjourDebut plus haut.
  // 🐛 Une première version « bascule » (tap referme si déjà actif) a dû
  // être abandonnée : mouseenter se déclenche juste avant click, même
  // au doigt sur la plupart des navigateurs mobiles, donc le tap voyait
  // l'aperçu déjà actif (via mouseenter) et le refermait aussitôt.
  zoneApercuGauche.addEventListener('click', (e) => {
    if (!surAccueil()) return;
    if (apercuGaucheActif) return; // déjà affiché (survol en cours) : rien à faire
    e.stopPropagation();
    survolApercuGaucheDebut();
  });

  document.addEventListener('click', (e) => {
    if (apercuGaucheActif && !zoneApercuGauche.contains(e.target)) survolApercuGaucheFin();
  });

  // Focus clavier : ouvre aussi, pour l'accessibilité.
  declencheur.addEventListener('focus', ouvrir);
  zone.addEventListener('focusout', (e) => {
    if (!zone.contains(e.relatedTarget)) fermer();
  });

  // Clic sur le déclencheur : bascule manuellement (utile au tactile,
  // où il n'y a pas de survol).
  declencheur.addEventListener('click', () => {
    if (estOuvert()) {
      ouvertParClic = false;
      fermer();
    } else {
      ouvertParClic = true;
      ouvrir();
    }
  });

  fond.addEventListener('click', fermer);
  boutonFermer.addEventListener('click', fermer);

  document.addEventListener('click', (e) => {
    if (!zone.contains(e.target) && estOuvert()) fermer();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && estOuvert()) fermer();
  });

  // ==================================================================
  // 🆕 (18-08-2026, demande de Raphaël) Logique de démarrage de
  // l'accueil — remplace l'ancien déclencheur ponctuel (qui ne sautait
  // au menu que sur le fragment #menu-principal, cas du retour depuis
  // parcours.html) par une règle générale, appliquée à CHAQUE
  // chargement de index.html :
  //
  //   - Une langue est déjà enregistrée (kebbek_langue, voir
  //     langueSauvegardee()) → l'élève est déjà venu au moins une fois,
  //     peu importe la page de départ (accueil, #menu-principal, ou
  //     toute autre) : direct au menu principal, sans repasser par
  //     l'écran de bienvenue Keb/Bek ni par le bloc Connexion/Première
  //     leçon. Recoupe et généralise l'ancien cas #menu-principal
  //     (toujours couvert, puisque langueSauvegardee() y est vraie),
  //     et complète verifierReconnexionAutomatique() tout en haut de ce
  //     script (qui ne couvre que les VRAIS comptes Supabase — celle-ci
  //     couvre aussi le mode invité, dès qu'une langue est enregistrée).
  //
  //   - Aucune langue enregistrée → toute première visite : force le
  //     sélecteur de langue plein écran (voir ouvrirChoixLangueForce())
  //     immédiatement après l'écran-titre "Le français avec les
  //     Bonomes" (superposé au-dessus le temps de son propre timing,
  //     rien à coordonner ici, voir le commentaire de la fonction). Le
  //     bloc Connexion/Première leçon n'apparaît qu'ensuite, une fois
  //     la langue choisie (voir choisir()).
  // ==================================================================
  if (langueSauvegardee()) {
    allerAuMenuPrincipal('retour');
  } else {
    ouvrirChoixLangueForce();
  }
</script>

</body>
</html>
