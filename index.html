<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apprends le français avec Keb &amp; Bek — Learn French with Keb &amp; Bek</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;700&family=Chewy&display=swap" rel="stylesheet">
<!-- Séquence identité (nom + genre + tranche d'âge, chemin "Oui" de First
     time?) — voir identite-eleve.js plus bas pour la logique et
     #sequenceIdentite plus bas dans le body pour le conteneur. -->
<link rel="stylesheet" href="identite-eleve.css">
<style>
  /* ==================================================================
     index.html — page d'accueil officielle du site (voir BONOMES_v61,
     "reste à faire" #2 : l'index est la première leçon au sens large).

     Sélecteur de langue en grille de pastilles, ouverture AU SURVOL de
     la souris (clic disponible en secours pour le tactile et le
     clavier) :
       - dès que la souris touche le déclencheur (ou le panneau), le
         panneau s'ouvre et les personnages se tournent vers lui ;
       - le panneau se referme quand la souris quitte toute la zone
         (petit délai pour ne pas fermer en traversant l'espace entre
         le bouton et le panneau) ;
       - sur tactile / clavier (pas de survol disponible), un clic
         sur le déclencheur bascule l'ouverture, avec fermeture au
         clic extérieur et à la touche Échap ;
       - un champ de recherche en haut permet de filtrer par nom natif
         ou nom français.

     Images des personnages (neutre / présentent-gauche / saluent /
     clique-ici, 896×936) servies depuis images/accueil/*.webp — voir
     BONOMES_v61 sur la règle .webp pour tout nouveau contenu. Mécanisme
     "Bonjour !" : survol ou tap direct sur #personnages fait saluer
     Keb & Bek avec une bulle "Bonjour !" (police Chewy, déjà chargée
     ci-dessus) ; après 50 déclenchements sans avoir trouvé la case
     secrète, l'image bascule sur "clique ici" (4e image) — un succès
     s'active seulement si le clic tombe dans la zone précise du
     bouton "clique ici" (.zone-case, coordonnées calibrées sur la
     bulle "CLIQUE ICI" de la 4e image — voir CSS et JS plus bas si un
     réajustement est un jour nécessaire).
     ================================================================== */

  :root {
    --fond: #F2EDE3;
    --brun: #665045;
    --brun-fonce: #4A3B33;
    --peche: #F0A98B;
    --peche-fonce: #E08867;
    --peche-pale: rgba(240, 169, 139, 0.16);
    --peche-pale-vif: rgba(240, 169, 139, 0.30);
    --ombre: rgba(102, 80, 69, 0.18);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--fond);
    overflow: hidden;
    font-family: 'Baloo 2', sans-serif;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .scene {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(10px, 2vh, 20px);
  }

  /* Ligne horizontale d'origine (sélecteur de langue + personnages),
     inchangée — juste déplacée dans son propre conteneur flex pour
     laisser .scene devenir une colonne accueillant aussi le lien vers
     les cours privés en dessous, sans toucher au calcul déjà en place
     (order:-1, gap, etc.) à l'intérieur de cette ligne. */
  .scene-rangee {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(16px, 4vw, 32px);
  }

  /* ---------- Personnages centraux ---------- */

  .personnages {
    position: relative;
    width: min(60vw, 460px);
    aspect-ratio: 1 / 1;
    flex-shrink: 0;
  }

  .personnages img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    opacity: 0;
    transition: opacity 0.35s ease;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
  }

  .personnages img.actif { opacity: 1; }

  /* ==================================================================
     Groupe personnages + bloc "First time?" — voir la note sur
     #premiereFois plus haut dans le HTML. Un simple conteneur flex pour
     que le bloc reste toujours collé au bord droit des personnages, à
     n'importe quelle largeur d'écran (plutôt qu'un positionnement
     absolu qui aurait dû recalculer le bord droit réel de .personnages
     à chaque taille de fenêtre).
     ================================================================== */

  .personnages-groupe {
    display: flex;
    align-items: center;
    gap: clamp(10px, 2vw, 20px);
    flex-shrink: 0;
  }

  /* ==================================================================
     Bloc "First time?" — remplace l'ancienne flèche "continuer" (v61).
     Sur demande de Raphaël : au lieu d'un simple bouton neutre, on
     demande explicitement si c'est la première visite, avec deux
     réponses oui/non qui mènent chacune au menu principal (destination
     encore à définir, voir JS). Même apparition différée/au choix de
     langue que l'ancien bouton (classe .visible, voir JS
     afficherPremiereFois()), même habillage visuel (verre dépoli,
     bordure pêche) que le reste des contrôles de cette page.
     ================================================================== */
  .premiere-fois {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
    padding: 10px 16px;
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.5);
    backdrop-filter: blur(9px) saturate(160%);
    -webkit-backdrop-filter: blur(9px) saturate(160%);
    border: 1.5px solid var(--peche);
    box-shadow: 6px 6px 20px var(--ombre), inset -1px 0 0 rgba(255,255,255,0.5);
    opacity: 0;
    transform: scale(0.75);
    pointer-events: none;
    transition: opacity 0.35s ease, transform 0.4s cubic-bezier(.34,1.6,.4,1), box-shadow 0.25s ease;
  }

  .premiere-fois.visible {
    opacity: 1;
    transform: scale(1);
    pointer-events: auto;
  }

  /* Libellé traduit via DICO_PREMIERE_FOIS (JS plus bas), même esprit
     que DICO_COURS_PRIVES — mis à jour au choix de langue par
     rafraichirPremiereFois(). Contrairement aux boutons Oui/Non
     ci-dessous, ce texte est un habillage d'interface, pas un mot de
     vocabulaire français à retenir : il suit donc la langue choisie. */
  .pf-question {
    margin: 0;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 0.8rem;
    color: var(--brun);
    text-align: center;
    white-space: nowrap;
  }

  .pf-boutons {
    display: flex;
    gap: 8px;
  }

  /* Libellés "Oui" / "Non" volontairement laissés en français, jamais
     traduits (comme la bulle "Bonjour !" plus haut) : ce sont eux-mêmes
     des mots français que l'immersion expose dès cette première page. */
  .pf-bouton {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 0.85rem;
    padding: 6px 18px;
    border-radius: 999px;
    border: 1.5px solid var(--peche);
    background: rgba(255, 255, 255, 0.6);
    color: var(--brun);
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
  }

  .pf-bouton:hover,
  .pf-bouton:focus-visible {
    background: var(--peche);
    color: #fff;
    transform: translateY(-1px);
    box-shadow: 4px 4px 14px var(--ombre);
  }

  /* ==================================================================
     Lien "Information et cours privés" — voir note dans le HTML.
     Discret par construction : texte plutôt qu'un bloc plein, opacité
     réduite au repos, ne se détache qu'au survol/focus — pense à un
     lien de bas de page, pas à un second appel à l'action à côté du
     bloc "First time?".
     ================================================================== */
  .lien-cours-prives {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 0.82rem;
    letter-spacing: 0.01em;
    color: var(--brun);
    opacity: 0.62;
    text-decoration: none;
    padding: 6px 4px;
    border-bottom: 1.5px solid transparent;
    transition: opacity 0.2s ease, border-color 0.2s ease;
    flex-shrink: 0;
  }

  .lien-cours-prives:hover,
  .lien-cours-prives:focus-visible {
    opacity: 1;
    border-bottom-color: var(--peche);
  }

  @media (max-height: 560px) {
    .lien-cours-prives { font-size: 0.74rem; padding: 2px 4px; }
  }

  /* ==================================================================
     Mécanisme "Bonjour !" — COPIÉ de index (2) (BONOMES_v57/v58,
     .survol / .bulle-bonjour / .zone-case), adapté ici à la structure
     de .personnages (4 images empilées + classe .actif déjà gérée en
     JS pour le sélecteur de langue, plutôt que le crossfade en pur CSS
     :hover de l'original) — un seul mécanisme d'affichage pour les 4
     images, piloté depuis afficherImage() en JS, voir plus bas.

     Déclencheurs de "Bonjour !" : survol souris DIRECT de #personnages
     (pas du sélecteur de langue, qui reste un déclencheur séparé et
     inchangé) OU tap tactile (pas de survol sur tactile — voir JS pour
     le bascule au clic qui en tient lieu). Après SEUIL_BONJOUR (50)
     déclenchements sans avoir trouvé la case secrète, l'image bascule
     sur "clique ici" (mode-secret) — copie du comportement original.
     ================================================================== */

  /* Police et habillage copiés tels quels de .bulle-bonjour dans
     index (2) (Chewy déjà chargée dans le <link> de cette page, voir
     tête de fichier — rien à ajouter côté polices).

     🆕 Cette même classe est réutilisée telle quelle pour #bulleBienvenue
     (mot "Bienvenue !" au survol du bouton "Oui" du bloc First time?,
     voir HTML/JS plus bas) — même bulle visuelle, juste un texte et un
     déclencheur différents ; aucune règle CSS supplémentaire requise. */
  .bulle-bonjour {
    position: absolute;
    left: 50%;
    top: -14%;
    width: 80%;
    transform: translateX(-50%) translateY(10px) scale(0.85) rotate(-3deg);
    font-family: 'Chewy', cursive;
    font-weight: 400;
    font-size: clamp(1.8rem, 9vw, 3.6rem);
    line-height: 1;
    text-align: center;
    color: #4A3B33;
    -webkit-text-stroke: 2px #F2EDE3;
    paint-order: stroke fill;
    opacity: 0;
    pointer-events: none;
    z-index: 2;
    transition: opacity 0.3s ease 0.08s, transform 0.35s cubic-bezier(.3,1.4,.4,1) 0.08s;
  }
  .bulle-bonjour.visible {
    opacity: 1;
    transform: translateX(-50%) translateY(0) scale(1) rotate(-3deg);
  }

  /* Case secrète (4e image, "clique ici") : coordonnées recalculées —
     DEUX erreurs corrigées cette fois-ci (voir capture d'écran fournie,
     qui montrait la case ailleurs que sur la bulle) :
       1) La bulle avait été mal repérée sur l'image source la première
          fois (zone détectée = le t-shirt blanc de Bek, pas la bulle
          tan "Clique ici" plus bas) — recalculé par détection de la
          couleur tan de la bulle elle-même (237,215,183), pas à l'œil.
       2) #personnages est un CARRÉ (aspect-ratio: 1/1) alors que
          l'image source est PORTRAIT (896×936, plus haute que large).
          Avec object-fit:contain dans un conteneur carré, l'image est
          calée sur la hauteur et laisse une marge vide de chaque côté
          (environ 2.14% de la largeur du conteneur, de part et
          d'autre) — un pourcentage calculé directement sur les pixels
          de l'image (comme la 1ʳᵉ tentative) est donc décalé
          horizontalement une fois rapporté au conteneur. Les valeurs
          ci-dessous sont déjà converties en pourcentage du CONTENEUR
          (pas de l'image brute) ; le calcul en amont est documenté
          dans l'échange pour toute future image qui ne serait pas
          carrée. */
  .zone-case {
    position: absolute;
    left: 30.66%;
    top: 63.25%;
    width: 40.06%;
    height: 13.14%;
    z-index: 3;
    display: none;
    cursor: pointer;
    /* Décommenter le temps de vérifier le calage à l'œil, puis
       recommenter :
    background: rgba(224, 103, 103, 0.35); border: 2px dashed red;
    */
  }
  .personnages.mode-secret .zone-case { display: block; }

  /* Petit flash de succès sur .personnages quand la case secrète est
     trouvée — indicateur volontairement simple : cet essai est
     autonome (ne charge pas sac-a-dos.js), donc pas de vrai
     ajouterAuSac('succes', ...) ici ; à brancher dessus une fois ce
     mécanisme intégré dans une page qui a le sac à dos (voir JS). */
  .personnages.succes-flash::after {
    content: "";
    position: absolute;
    inset: -6%;
    border-radius: 24px;
    box-shadow: 0 0 0 6px rgba(120, 190, 110, 0.55);
    animation: flashSucces 0.9s ease-out;
    pointer-events: none;
  }
  @keyframes flashSucces {
    0%   { opacity: 0; }
    25%  { opacity: 1; }
    100% { opacity: 0; }
  }

  /* ==================================================================
     Sélecteur de langue — déclencheur + panneau grille

     Le déclencheur est un vrai élément flex, frère de .personnages
     dans .scene (gap fixe entre les deux, voir .scene ci-dessus) —
     plus de positionnement en pourcentage du viewport, donc plus de
     dérive selon la largeur d'écran. `order: -1` le place visuellement
     à GAUCHE du personnage sans toucher à l'ordre du DOM (accessibilité
     inchangée).

     Le panneau (.sl-panneau) a deux comportements distincts, séparés
     par largeur d'écran :
       - en dessous de 1200px : recouvrement centré plein écran (comme
         avant sur mobile) — accepté même si ça passe par-dessus le
         personnage, cf. échange précédent ;
       - à partir de 1200px : panneau ancré qui s'ouvre vers la GAUCHE
         du déclencheur, donc à l'opposé du personnage — la marge
         disponible à 1200px+ est calculée pour qu'il ne puisse
         jamais toucher le personnage ni sortir de l'écran.
     ================================================================== */

  .selecteur-langue {
    position: relative;
    order: -1;
    flex-shrink: 0;
    z-index: 10;
  }

  /* Petit pont invisible entre le déclencheur et le panneau : évite
     que la souris "sorte" de la zone survolée pendant le trajet et
     ferme le panneau par erreur. */
  .selecteur-langue::after {
    content: "";
    position: absolute;
    top: 50%;
    right: 100%;
    width: 18px;
    height: 140%;
    transform: translateY(-50%);
  }

  .sl-declencheur {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 0.92rem;
    letter-spacing: 0.03em;
    color: var(--brun);
    text-transform: uppercase;
    background: rgba(255, 255, 255, 0.5);
    backdrop-filter: blur(9px) saturate(160%);
    -webkit-backdrop-filter: blur(9px) saturate(160%);
    border: 1.5px solid var(--peche);
    border-radius: 999px;
    padding: 10px 16px;
    cursor: pointer;
    box-shadow: 6px 6px 20px var(--ombre), inset -1px 0 0 rgba(255,255,255,0.5);
    transition: box-shadow 0.25s ease, transform 0.25s cubic-bezier(.34,1.4,.4,1), background 0.2s ease;
  }

  .sl-declencheur:hover {
    box-shadow: 8px 8px 26px var(--ombre), inset -1px 0 0 rgba(255,255,255,0.6);
    transform: translateY(-1px);
  }

  /* ==================================================================
     Radiance d'invitation — attire l'œil vers le sélecteur de langue
     tant qu'aucun choix actif n'a été fait (classe .invite, retirée par
     choisir() au premier vrai choix, voir JS). Anneau qui s'étend et
     s'efface en boucle, superposé au box-shadow existant plutôt qu'à sa
     place (d'où la 3ᵉ valeur ajoutée dans chaque état des keyframes).
     ================================================================== */
  .selecteur-langue.invite .sl-declencheur {
    animation: radianceInvite 2s ease-out infinite;
  }

  @keyframes radianceInvite {
    0%   { box-shadow: 6px 6px 20px var(--ombre), inset -1px 0 0 rgba(255,255,255,0.5), 0 0 0 0 rgba(240, 169, 139, 0.55); }
    70%  { box-shadow: 6px 6px 20px var(--ombre), inset -1px 0 0 rgba(255,255,255,0.5), 0 0 0 14px rgba(240, 169, 139, 0); }
    100% { box-shadow: 6px 6px 20px var(--ombre), inset -1px 0 0 rgba(255,255,255,0.5), 0 0 0 0 rgba(240, 169, 139, 0); }
  }

  .selecteur-langue.ouvert .sl-declencheur {
    background: var(--peche);
    color: #fff;
  }

  .sl-chevron {
    color: currentColor;
    transition: transform 0.25s cubic-bezier(.34,1.4,.4,1);
    flex-shrink: 0;
  }

  .selecteur-langue.ouvert .sl-chevron { transform: rotate(180deg); }

  /* ---------- Panneau (grille) ---------- */

  .sl-panneau {
    /* Défaut (< 1200px) : recouvrement centré plein écran, cf.
       commentaire plus haut — voir le bloc @media (min-width: 1200px)
       plus bas pour le mode « panneau ancré » du grand écran. */
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    transform-origin: center;
    width: min(86vw, 340px);
    max-height: 70vh;
    display: flex;
    flex-direction: column;
    background: rgba(250, 246, 240, 0.88);
    backdrop-filter: blur(14px) saturate(160%);
    -webkit-backdrop-filter: blur(14px) saturate(160%);
    border: 1.5px solid var(--peche);
    border-radius: 22px;
    box-shadow: 14px 14px 38px var(--ombre), inset 0 1px 0 rgba(255,255,255,0.6);
    padding: 12px;
    opacity: 0;
    pointer-events: none;
    z-index: 20;
    transition: opacity 0.22s ease, transform 0.32s cubic-bezier(.32,1.35,.4,1);
  }

  .selecteur-langue.ouvert .sl-panneau {
    opacity: 1;
    pointer-events: auto;
    transform: translate(-50%, -50%) scale(1);
  }

  .sl-recherche {
    font-family: 'Baloo 2', sans-serif;
    font-size: 0.86rem;
    color: var(--brun-fonce);
    background: #fff;
    border: 1.5px solid var(--peche-pale-vif);
    border-radius: 999px;
    padding: 9px 14px;
    outline: none;
    margin-bottom: 10px;
    flex-shrink: 0;
    transition: border-color 0.2s ease;
  }

  .sl-recherche::placeholder { color: var(--brun); opacity: 0.5; }
  .sl-recherche:focus { border-color: var(--peche-fonce); }

  .sl-vide {
    font-size: 0.8rem;
    color: var(--brun);
    opacity: 0.55;
    text-align: center;
    margin: 18px 0;
  }

  .sl-grille {
    overflow-y: auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    scrollbar-width: thin;
    scrollbar-color: var(--peche) transparent;
  }

  .sl-grille::-webkit-scrollbar { width: 6px; }
  .sl-grille::-webkit-scrollbar-thumb { background: var(--peche); border-radius: 999px; }
  .sl-grille::-webkit-scrollbar-track { background: transparent; }

  .sl-chip {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 2px;
    padding: 10px 6px;
    border-radius: 14px;
    border: 1.5px solid transparent;
    background: rgba(255,255,255,0.55);
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
  }

  .sl-chip:hover {
    background: var(--peche-pale);
    transform: translateY(-1px);
  }

  .sl-chip.selectionne {
    background: var(--peche-pale-vif);
    border-color: var(--peche-fonce);
  }

  .sl-chip-natif {
    font-weight: 700;
    font-size: 0.78rem;
    color: var(--brun-fonce);
    line-height: 1.15;
  }

  .sl-chip.selectionne .sl-chip-natif { color: var(--peche-fonce); }

  .sl-chip-code {
    font-weight: 500;
    font-size: 0.62rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--brun);
    opacity: 0.55;
  }

  /* ---------- Fond estompé ----------
     Visible par défaut (mode recouvrement plein écran) ; désactivé
     à partir de 1200px, où le panneau devient un dropdown ancré qui
     n'a pas besoin d'assombrir la scène. */

  .sl-fond {
    display: block;
    position: fixed;
    inset: 0;
    background: rgba(74, 59, 51, 0.28);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
    z-index: 5;
  }

  .selecteur-langue.ouvert .sl-fond {
    opacity: 1;
    pointer-events: auto;
  }

  @media (max-width: 460px) {
    .personnages { width: min(70vw, 320px); }
  }

  /* ==================================================================
     À partir de 1200px : le panneau devient un dropdown ancré au
     déclencheur, qui s'ouvre vers la GAUCHE — donc à l'opposé du
     personnage, qui est toujours à sa droite (voir .scene / order:-1
     plus haut). Le seuil de 1200px n'est pas arbitraire : à cette
     largeur, la marge disponible à gauche du déclencheur (une fois
     .scene centrée) dépasse toujours la largeur du panneau (280px)
     + son décalage (14px), donc le panneau ne peut ni chevaucher le
     personnage ni sortir de l'écran.
     ================================================================== */

  @media (min-width: 1200px) {
    .sl-fond { display: none; }

    .sl-panneau {
      position: absolute;
      top: 50%;
      left: auto;
      right: calc(100% + 14px);
      transform: translateY(-50%) scale(0.85);
      transform-origin: right center;
      width: 280px;
      max-height: min(62vh, 460px);
    }

    .selecteur-langue.ouvert .sl-panneau {
      transform: translateY(-50%) scale(1);
    }
  }
</style>
</head>
<body>

  <div class="scene">
   <div class="scene-rangee">
    <div class="personnages-groupe">
      <div class="personnages" id="personnages">
        <img id="imgNeutre" class="actif" src="images/accueil/index_bonomes_keb_bek_neutres_01.webp" alt="Keb et Bek">
        <img id="imgGauche" src="images/accueil/index_bonomes_keb_bek_presentent-gauche_01.webp" alt="Keb et Bek regardant vers le sélecteur de langue">

        <img id="imgEquipesSalut" src="images/accueil/index_bonomes_keb_bek_equipes_02.webp" alt="Keb et Bek équipés qui font un salut de la main">

        <p class="bulle-bonjour" id="bulleBienvenue" aria-hidden="true">Bienvenue !</p>

      <!-- 🆕 Bloc "First time?" : remplace l'ancien bouton "continuer" (une

      <div class="premiere-fois" id="premiereFois">

    <div class="selecteur-langue invite" id="selecteurLangue">

        <svg class="sl-chevron" viewBox="0 0 20 20" width="14" height="14">

   </div>

    <!-- 🆕 Séquence identité (nom + genre + tranche d'âge) — se substitue
         à la scène d'accueil ci-dessus quand l'élève répond "Oui" à
         "First time?" (voir demarrerIdentiteSiPremiereFois() plus bas).
         Masqué par défaut (display:none) plutôt que retiré du DOM, pour
         pouvoir y revenir sans tout reconstruire ; demarrerSequenceIdentite
         (identite-eleve.js) réécrit tout son contenu à chaque étape. -->
    <div id="sequenceIdentite" style="display:none;"></div>

    <!-- Lien vers les cours privés — pensé pour un parent qui atterrit
         ici en quête d'info, pas pour l'enfant en immersion : volontairement
         discret (petit lien, pas un bouton en évidence) pour ne pas
         concurrencer le sélecteur de langue / bouton continuer, qui restent
         le parcours principal. Libellé traduit via DICO_COURS_PRIVES (JS
         plus bas), mis à jour au choix de langue par rafraichirLienCoursPrives(). -->
    <a class="lien-cours-prives" id="lienCoursPrives" href="cours-prives/">Information et cours privés</a>

<!-- Chargé AVANT le script principal ci-dessous : demarrerIdentiteSiPremiereFois()
     (voir plus bas) appelle KebBekIdentite.demarrerSequenceIdentite(), qui
     doit donc déjà exister au moment où ce script s'exécute. -->
<script src="identite-eleve.js"></script>

<script>
  // ================================================================
  // 19 langues : nom natif (affiché en priorité) + libellé français
  // (affiché en plus petit, sert aussi à la recherche). Le code est
  // celui utilisé ailleurs sur le site (data-lang).
  // ================================================================
  const LANGUES = [
    { code: 'en', natif: 'English',           fr: 'Anglais' },
    { code: 'es', natif: 'Español',           fr: 'Espagnol' },
    { code: 'it', natif: 'Italiano',          fr: 'Italien' },
    { code: 'pt', natif: 'Português',         fr: 'Portugais' },
    { code: 'ca', natif: 'Català',            fr: 'Catalan' },
    { code: 'eo', natif: 'Esperanto',         fr: 'Esperanto' },
    { code: 'zh', natif: '中文',               fr: 'Chinois (mandarin)' },
    { code: 'ja', natif: '日本語',             fr: 'Japonais' },
    { code: 'ko', natif: '한국어',             fr: 'Coréen' },
    { code: 'vi', natif: 'Tiếng Việt',        fr: 'Vietnamien' },
    { code: 'ht', natif: 'Kreyòl ayisyen',    fr: 'Créole haïtien' },
    { code: 'tl', natif: 'Tagalog',           fr: 'Tagalog' },
    { code: 'id', natif: 'Bahasa Indonesia',  fr: 'Indonésien' },
    { code: 'nl', natif: 'Nederlands',        fr: 'Néerlandais' },
    { code: 'de', natif: 'Deutsch',           fr: 'Allemand' },
    { code: 'fa', natif: 'فارسی',             fr: 'Farsi' },
    { code: 'sv', natif: 'Svenska',           fr: 'Suédois' },
    { code: 'no', natif: 'Norsk',             fr: 'Norvégien' },
    { code: 'ru', natif: 'Русский',           fr: 'Russe' },
  ];

  // Clé PARTAGÉE avec tout le reste du site (sac-a-dos.js — voir
  // CLE_LANGUE_SAC/langueActuelleSac — ainsi que cours-prives/index.html,
  // methode.html, tarifs.html, qui lisent tous ce même
  // localStorage.getItem('kebbek_langue')). Jusqu'ici cette page ne
  // faisait QUE tenir langueActuelle en mémoire JS sans jamais l'écrire
  // ici : choisir() changeait l'affichage local, mais rien n'était
  // persisté, donc toute page suivante (comme le lien vers les cours
  // privés) retombait sur son propre repli 'en' — corrigé ci-dessous.
  const CLE_LANGUE = 'kebbek_langue';
  function langueSauvegardee() {
    try { return localStorage.getItem(CLE_LANGUE); }
    catch (e) { return null; }
  }
  function sauvegarderLangue(codeLangue) {
    try { localStorage.setItem(CLE_LANGUE, codeLangue); }
    catch (e) { console.warn('Langue non sauvegardée (localStorage indisponible ou plein).', e); }
  }

  // Reprend le choix déjà fait lors d'une visite précédente s'il existe
  // — sinon 'en' comme avant. La distinction avec un choix "jamais
  // fait" (voir .invite / afficherPremiereFois plus bas) se base
  // sur la présence même de la clé, pas sur sa valeur.
  let langueActuelle = langueSauvegardee() || 'en';

  // ==================================================================
  // Libellé du lien "Information et cours privés" — traduit pour
  // chacune des 19 langues du sélecteur (voir LANGUES plus haut). Pas
  // de fonction t() globale sur cette page (contrairement à
  // sac-a-dos.js, qui retombe sur celle d'index.html/parcours.html) :
  // dictionnaire autonome, même esprit que DICO_SAC, mais propre à ce
  // seul lien. 'fr' ajouté aussi par cohérence même si absent de
  // LANGUES (l'interface ne propose pas le français comme langue
  // d'apprenant, voir BONOMES_v61), au cas où langueActuelle vaudrait
  // 'fr' un jour.
  // ==================================================================
  const DICO_COURS_PRIVES = {
    fr: 'Information et cours privés',
    en: 'Information & private lessons',
    es: 'Información y clases particulares',
    it: 'Informazioni e lezioni private',
    pt: 'Informações e aulas particulares',
    ca: 'Informació i classes particulars',
    eo: 'Informoj kaj privataj lecionoj',
    zh: '信息与私人课程',
    ja: '情報とプライベートレッスン',
    ko: '정보 및 개인 수업',
    vi: 'Thông tin và các lớp học riêng',
    ht: 'Enfòmasyon ak kou prive',
    tl: 'Impormasyon at pribadong mga aralin',
    id: 'Informasi dan les privat',
    nl: 'Informatie en privélessen',
    de: 'Informationen und Privatunterricht',
    fa: 'اطلاعات و کلاس‌های خصوصی',
    sv: 'Information och privatlektioner',
    no: 'Informasjon og privattimer',
    ru: 'Информация и частные уроки'
  };

  // ==================================================================
  // 🆕 Libellé de la question "First time?" du bloc qui remplace
  // l'ancien bouton "continuer" — même esprit et mêmes 19+1 langues que
  // DICO_COURS_PRIVES juste au-dessus (dictionnaire autonome, mis à
  // jour au choix de langue par rafraichirPremiereFois() plus bas).
  // Contrairement aux libellés "Oui"/"Non" des boutons (volontairement
  // laissés en français, voir HTML), ce texte est un habillage
  // d'interface : il suit la langue choisie comme le lien vers les
  // cours privés.
  // ==================================================================
  const DICO_PREMIERE_FOIS = {
    fr: 'Première fois ?',
    en: 'First time?',
    es: '¿Primera vez?',
    it: 'Prima volta?',
    pt: 'Primeira vez?',
    ca: 'Primera vegada?',
    eo: 'Unuafoje?',
    zh: '第一次来吗？',
    ja: '初めてですか？',
    ko: '처음이신가요?',
    vi: 'Lần đầu tiên?',
    ht: 'Premye fwa?',
    tl: 'Unang beses?',
    id: 'Pertama kali?',
    nl: 'Eerste keer?',
    de: 'Zum ersten Mal?',
    fa: 'اولین باره؟',
    sv: 'Första gången?',
    no: 'Første gang?',
    ru: 'Первый раз?'
  };

  const zone = document.getElementById('selecteurLangue');
  const declencheur = document.getElementById('slDeclencheur');
  const code = document.getElementById('slCode');
  const fond = document.getElementById('slFond');
  const personnages = document.getElementById('personnages');
  const imgNeutre = document.getElementById('imgNeutre');
  const imgGauche = document.getElementById('imgGauche');
  const imgSaluent = document.getElementById('imgSaluent');
  const imgClique = document.getElementById('imgClique');
  const imgBienvenue = document.getElementById('imgBienvenue');
  const imgEquipes = document.getElementById('imgEquipes');
  const imgEquipesSalut = document.getElementById('imgEquipesSalut');
  const bulleBonjour = document.getElementById('bulleBonjour');
  const bulleBienvenue = document.getElementById('bulleBienvenue');
  const zoneCaseSecrete = document.getElementById('zoneCaseSecrete');
  const premiereFois = document.getElementById('premiereFois');
  const pfQuestion = document.getElementById('pfQuestion');
  const pfOui = document.getElementById('pfOui');
  const pfNon = document.getElementById('pfNon');
  const lienCoursPrives = document.getElementById('lienCoursPrives');

  // ==================================================================
  // Bloc "First time?" — apparaît par le premier de ces deux
  // déclencheurs à se produire : un vrai choix de langue (voir
  // choisir() plus bas) ou 15s passées sur la page sans choix. Les deux
  // chemins appellent cette même fonction, idempotente (classList.add
  // ne fait rien si "visible" y est déjà) — pas besoin de coordonner
  // qui a "gagné".
  // ==================================================================
  function afficherPremiereFois() {
    premiereFois.classList.add('visible');
  }
  setTimeout(afficherPremiereFois, 15000);

  function rafraichirLienCoursPrives() {
    lienCoursPrives.textContent = DICO_COURS_PRIVES[langueActuelle] || DICO_COURS_PRIVES.en;
  }
  rafraichirLienCoursPrives();

  // 🆕 Même principe que rafraichirLienCoursPrives() ci-dessus, pour la
  // question "First time?" — voir DICO_PREMIERE_FOIS plus haut.
  function rafraichirPremiereFois() {
    pfQuestion.textContent = DICO_PREMIERE_FOIS[langueActuelle] || DICO_PREMIERE_FOIS.en;
  }
  rafraichirPremiereFois();

  // Visite de retour avec une langue déjà choisie précédemment : le
  // choix est déjà fait, donc la radiance d'invitation n'a plus lieu
  // d'être et le bloc "First time?" peut apparaître tout de suite, sans
  // attendre les 15s ni un nouveau clic sur une pastille.
  if (langueSauvegardee()) {
    zone.classList.remove('invite');
    afficherPremiereFois();
  }

  // Destination du menu principal pas encore définie côté contenu (pas
  // de page suivante précisée) — laissé en point d'ancrage explicite
  // plutôt que deviné, à brancher dès que la suite existe.
  function allerAuMenuPrincipal(reponse) {
    console.info(`Bloc "First time?" — réponse "${reponse}", destination du menu principal à définir.`);
  }

  // 🆕 "Oui" (première visite) ouvre désormais la séquence identité
  // (identite-eleve.js) avant le menu, comme évoqué par Raphaël — "Non"
  // continue de mener directement à allerAuMenuPrincipal ci-dessus, rien
  // de changé de ce côté. La scène d'accueil (personnages + bloc "First
  // time?" + sélecteur de langue) est masquée pendant la séquence, puis
  // ce sera au menu principal — pas à cette page — de prendre le relais
  // une fois onComplet() déclenché (voir note de tête de identite-eleve.js :
  // ce module ne fait que collecter { prenom, genre, adulte }, jamais de
  // persistance Supabase/localStorage lui-même).
  const sequenceIdentite = document.getElementById('sequenceIdentite');
  const scene = document.querySelector('.scene');

  function demarrerIdentiteSiPremiereFois() {
    if (modeSecretActif()) return; // case secrète prioritaire sur tout le reste
    scene.style.display = 'none';
    sequenceIdentite.style.display = '';
    KebBekIdentite.demarrerSequenceIdentite('sequenceIdentite', {}, {
      onComplet: function (identite) {
        // identite = { prenom, genre, adulte } — à transmettre à
        // KebBekProgression.creerProfil()/.enregistrerIdentite() une fois
        // cette étape suivante définie, voir note ci-dessus.
        allerAuMenuPrincipal('oui');
      }
    });
  }

  // 🆕 Petite séquence animée au survol de "Non" : posture normale (01)
  // → bras levé façon salut (02) pendant un court instant → retour à la
  // posture normale (01), pour imiter un mouvement de salutation plutôt
  // qu'un simple changement d'image figé. Minuteries gardées dans des
  // variables pour pouvoir les annuler si la souris quitte le bouton
  // avant la fin (arreterSequenceEquipes(), voir masquerApercuPremiereFois
  // plus bas) — sinon une image pourrait s'afficher après coup, une fois
  // le survol déjà terminé.
  let minuterieSalutDebut = null;
  let minuterieSalutFin = null;

  function jouerSequenceEquipes() {
    arreterSequenceEquipes();
    afficherImage(imgEquipes); // 01, posture normale, tout de suite
    minuterieSalutDebut = setTimeout(() => {
      afficherImage(imgEquipesSalut); // 02, le salut, une fraction de seconde plus tard
    }, 180);
    minuterieSalutFin = setTimeout(() => {
      afficherImage(imgEquipes); // retour à 01, un peu moins d'une seconde après le salut
    }, 800);
  }

  function arreterSequenceEquipes() {
    clearTimeout(minuterieSalutDebut);
    clearTimeout(minuterieSalutFin);
  }

  // 🆕 Aperçu au survol (souris) / tap (tactile) des boutons Oui/Non,
  // même esprit que le reste des interactions de cette page (sélecteur
  // de langue, "Bonjour !") : on prévisualise avant même de cliquer.
  // "Oui" fait apparaître la bulle "Bienvenue !" en plus du changement
  // d'image ; "Non" déclenche la petite séquence de salut ci-dessus, pas
  // de bulle, l'image étant pensée pour se suffire à elle-même (HTML).
  function apercuPremiereFois(cible) {
    if (modeSecretActif()) return; // case secrète prioritaire sur tout le reste
    bulleBonjour.classList.remove('visible'); // un seul mot à la fois au-dessus des personnages
    if (cible === 'oui') {
      arreterSequenceEquipes();
      afficherImage(imgBienvenue);
      bulleBienvenue.classList.add('visible');
    } else {
      bulleBienvenue.classList.remove('visible');
      jouerSequenceEquipes();
    }
  }

  function masquerApercuPremiereFois() {
    arreterSequenceEquipes();
    bulleBienvenue.classList.remove('visible');
    if (!modeSecretActif() && !hoverBonjourActif && !estOuvert()) afficherImage(imgNeutre);
  }

  [pfOui, pfNon].forEach(bouton => {
    bouton.addEventListener('mouseenter', () => apercuPremiereFois(bouton.dataset.cible));
    bouton.addEventListener('mouseleave', masquerApercuPremiereFois);
  });
  pfOui.addEventListener('click', demarrerIdentiteSiPremiereFois);
  pfNon.addEventListener('click', () => allerAuMenuPrincipal('non'));

  const panneau = document.getElementById('slPanneau');
  const recherche = document.getElementById('slRecherche');
  const grilleConteneur = document.getElementById('slGrille');
  const grilleVide = document.getElementById('slVide');

  function normaliser(s) {
    return s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  }

  // ---------- Construction de la grille ----------

  function creerChipGrille(langue) {
    const el = document.createElement('div');
    el.className = 'sl-chip';
    el.dataset.code = langue.code;
    el.setAttribute('role', 'option');
    el.innerHTML = `
      <span class="sl-chip-natif">${langue.natif}</span>
      <span class="sl-chip-code">${langue.fr}</span>`;
    el.addEventListener('click', () => choisir(langue.code));
    return el;
  }

  LANGUES.forEach(l => grilleConteneur.appendChild(creerChipGrille(l)));

  function rafraichirSelection() {
    document.querySelectorAll('.sl-chip').forEach(el => {
      el.classList.toggle('selectionne', el.dataset.code === langueActuelle);
    });
    code.textContent = langueActuelle.toUpperCase();
  }
  rafraichirSelection();

  // ---------- Filtrage (recherche) ----------

  function filtrer() {
    const q = normaliser(recherche.value.trim());
    let visibles = 0;
    Array.from(grilleConteneur.children).forEach(el => {
      const langue = LANGUES.find(l => l.code === el.dataset.code);
      const correspond = !q || normaliser(langue.natif).includes(q) || normaliser(langue.fr).includes(q);
      el.hidden = !correspond;
      if (correspond) visibles++;
    });
    grilleVide.hidden = visibles > 0;
  }

  recherche.addEventListener('input', filtrer);

  // ==================================================================
  // Affichage des 7 images de #personnages — une seule "active" à la
  // fois (4 d'origine + 🆕 imgBienvenue/imgEquipes/imgEquipesSalut pour
  // le bloc "First time?", voir plus haut). Remplace le crossfade en
  // pur CSS :hover de l'original (.survol dans index (2)) par un point
  // d'entrée JS unique, pour que le survol du sélecteur de langue, le
  // mécanisme "Bonjour !" et le bloc "First time?" (voir plus bas et
  // plus haut) puissent tous décider quelle image montrer sans se
  // marcher dessus.
  // ==================================================================
  function afficherImage(imgAAfficher) {
    [imgNeutre, imgGauche, imgSaluent, imgClique, imgBienvenue, imgEquipes, imgEquipesSalut].forEach(img => {
      img.classList.toggle('actif', img === imgAAfficher);
    });
  }

  // ==================================================================
  // Mécanisme "Bonjour !" — COPIÉ de index (2) (BONOMES_v57/v58 :
  // .survol / .bulle-bonjour / .zone-case / compteur de 50 survols),
  // adapté à afficherImage() ci-dessus plutôt qu'au crossfade CSS
  // :hover original (voir CSS). Déclencheur : survol souris DIRECT de
  // #personnages (le survol du sélecteur de langue reste un
  // déclencheur séparé, inchangé plus bas) ; sur tactile, où il n'y a
  // pas de survol, un tap fait office de bascule — même esprit que le
  // "premier tap ouvre et maintient, tap ailleurs ferme" déjà utilisé
  // pour .pile-tooltip ailleurs sur le site (voir BONOMES_v61).
  //
  // ⚠️ Clé localStorage DISTINCTE de celle d'index (2)
  // (kebbek_compteur_bonjour) volontairement : cet essai est autonome
  // et pourrait être ouvert sur le même domaine que le vrai site un
  // jour — mieux vaut ne pas fausser un compteur réel avec des tests.
  // ==================================================================
  const CLE_COMPTEUR_BONJOUR_ESSAI = 'kebbek_essai_compteur_bonjour';
  const CLE_CASE_SECRETE_ESSAI = 'kebbek_essai_case_secrete_trouvee';
  const SEUIL_BONJOUR = 50;

  let hoverBonjourActif = false;

  function caseSecreteDejaTrouvee() {
    return localStorage.getItem(CLE_CASE_SECRETE_ESSAI) === '1';
  }
  function lireCompteurBonjour() {
    return parseInt(localStorage.getItem(CLE_COMPTEUR_BONJOUR_ESSAI) || '0', 10);
  }
  function modeSecretActif() {
    return !caseSecreteDejaTrouvee() && lireCompteurBonjour() >= SEUIL_BONJOUR;
  }

  // À appeler après tout changement du compteur (ou au chargement de la
  // page, pour reprendre correctement un compteur déjà élevé lors d'un
  // rechargement en plein essai — même précaution que index (2)).
  function majModeSecret() {
    const actif = modeSecretActif();
    personnages.classList.toggle('mode-secret', actif);
    if (actif) {
      bulleBonjour.classList.remove('visible');
      afficherImage(imgClique);
    }
  }

  function survolBonjourDebut() {
    if (modeSecretActif()) return; // la case secrète prime sur le "Bonjour !" normal
    hoverBonjourActif = true;
    afficherImage(imgSaluent);
    bulleBonjour.classList.add('visible');
    if (!caseSecreteDejaTrouvee()) {
      localStorage.setItem(CLE_COMPTEUR_BONJOUR_ESSAI, String(lireCompteurBonjour() + 1));
      majModeSecret(); // peut basculer immédiatement en mode secret si le seuil vient d'être atteint
    }
  }

  function survolBonjourFin() {
    hoverBonjourActif = false;
    bulleBonjour.classList.remove('visible');
    if (!modeSecretActif() && !estOuvert()) afficherImage(imgNeutre);
  }

  personnages.addEventListener('mouseenter', survolBonjourDebut);
  personnages.addEventListener('mouseleave', survolBonjourFin);

  // Tactile : pas d'événement mouseenter, donc le clic en tient lieu.
  // Un premier tap ouvre (et compte), un tap ailleurs sur la page
  // referme — la .zone-case (visible seulement en mode secret, voir
  // CSS) a son propre gestionnaire séparé plus bas et n'est jamais
  // affectée par celui-ci.
  personnages.addEventListener('click', (e) => {
    if (modeSecretActif()) return; // en mode secret, seule .zone-case répond
    if (hoverBonjourActif) return; // déjà ouvert par la souris : rien à faire
    e.stopPropagation();
    survolBonjourDebut();
  });

  document.addEventListener('click', (e) => {
    if (hoverBonjourActif && !personnages.contains(e.target)) survolBonjourFin();
  });

  // ---------- Case secrète (4e image, "clique ici") ----------
  //
  // Succès si le clic tombe exactement dans .zone-case (coordonnées
  // calibrées sur la bulle "CLIQUE ICI" de la 4e image, voir CSS).
  zoneCaseSecrete.addEventListener('click', (e) => {
    e.preventDefault();
    e.stopPropagation();
    localStorage.setItem(CLE_CASE_SECRETE_ESSAI, '1');
    localStorage.setItem(CLE_COMPTEUR_BONJOUR_ESSAI, '0');
    personnages.classList.remove('mode-secret');
    hoverBonjourActif = false;
    bulleBonjour.classList.remove('visible');
    afficherImage(imgNeutre);
    declencherSucces();
  });

  function declencherSucces() {
    // Cet essai est autonome (sac-a-dos.js pas chargé ici, voir tête de
    // fichier de sac-a-dos.js) — indicateur visuel simple pour
    // l'instant. À remplacer par un vrai ajouterAuSac('succes', {...})
    // le jour où ce mécanisme est intégré dans une page qui charge le
    // sac à dos.
    personnages.classList.add('succes-flash');
    setTimeout(() => personnages.classList.remove('succes-flash'), 900);
  }

  majModeSecret(); // reprise correcte si la page est rechargée en pleine série de survols

  // ---------- Ouverture / fermeture ----------
  //
  // Le survol (mouseenter / mouseleave) est la manière PRINCIPALE
  // d'ouvrir et de fermer le panneau : dès que la souris touche le
  // déclencheur ou le panneau, ça s'ouvre et les personnages se
  // tournent. Un petit délai de fermeture évite que le panneau se
  // referme si la souris traverse rapidement l'espace entre le
  // déclencheur et le panneau. Le clic reste disponible en secours
  // (tactile, clavier) pour basculer l'ouverture manuellement.

  const DELAI_FERMETURE = 180; // ms
  let minuteurFermeture = null;
  let ouvertParClic = false;

  function estOuvert() {
    return zone.classList.contains('ouvert');
  }

  function ouvrir() {
    clearTimeout(minuteurFermeture);
    if (estOuvert()) return;
    if (modeSecretActif()) return; // case secrète prioritaire, voir mécanisme "Bonjour !" plus haut
    zone.classList.add('ouvert');
    declencheur.setAttribute('aria-expanded', 'true');
    afficherImage(imgGauche);
  }

  function fermer() {
    clearTimeout(minuteurFermeture);
    zone.classList.remove('ouvert');
    declencheur.setAttribute('aria-expanded', 'false');
    ouvertParClic = false;
    recherche.value = '';
    filtrer();
    // Ne reprend l'image neutre que si rien d'autre ne se dispute
    // l'affichage en ce moment (survol "Bonjour !" en cours, ou mode
    // secret déjà actif) — évite un clignotement vers "neutre" entre
    // deux états.
    if (!modeSecretActif() && !hoverBonjourActif) afficherImage(imgNeutre);
  }

  function programmerFermeture() {
    clearTimeout(minuteurFermeture);
    minuteurFermeture = setTimeout(() => {
      if (!ouvertParClic) fermer();
    }, DELAI_FERMETURE);
  }

  function choisir(codeLangue) {
    langueActuelle = codeLangue;
    sauvegarderLangue(codeLangue);
    rafraichirSelection();
    code.style.transform = 'scale(0.7)';
    requestAnimationFrame(() => {
      code.style.transition = 'transform 0.28s cubic-bezier(.34,1.6,.4,1)';
      code.style.transform = 'scale(1)';
    });
    zone.classList.remove('invite');
    afficherPremiereFois();
    rafraichirLienCoursPrives();
    rafraichirPremiereFois();
    fermer();
  }

  // Survol de toute la zone (déclencheur + pont + panneau) : ouvre.
  zone.addEventListener('mouseenter', ouvrir);
  zone.addEventListener('mouseleave', programmerFermeture);

  // Focus clavier : ouvre aussi, pour l'accessibilité.
  declencheur.addEventListener('focus', ouvrir);
  zone.addEventListener('focusout', (e) => {
    if (!zone.contains(e.relatedTarget)) fermer();
  });

  // Clic sur le déclencheur : bascule manuellement (utile au tactile,
  // où il n'y a pas de survol).
  declencheur.addEventListener('click', () => {
    if (estOuvert()) {
      ouvertParClic = false;
      fermer();
    } else {
      ouvertParClic = true;
      ouvrir();
    }
  });

  fond.addEventListener('click', fermer);

  document.addEventListener('click', (e) => {
    if (!zone.contains(e.target) && estOuvert()) fermer();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && estOuvert()) fermer();
  });
</script>

</body>
</html>
