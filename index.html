<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le français avec Keb &amp; Bek</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Fuzzy+Bubbles:wght@400;700&family=Caveat+Brush&display=swap" rel="stylesheet">
<style>
  :root {
    --fond: #F2EDE3;
    --brun: #665045;
    --brun-fonce: #4A3B33;
    --blonde: #F1DC99;
    --peche: #F0A98B;
    --peche-fonce: #E08867;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--fond);
    overflow: hidden;
  }

  body {
    font-family: 'Baloo 2', 'Noto Sans', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }

  #app {
    width: 100%;
    height: 100vh;
    position: relative;
  }

  .vue {
    display: none;
    position: absolute;
    inset: 0;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.4s ease;
  }

  .vue.actif {
    display: flex;
    opacity: 1;
  }

  /* ---------- Vue 1 : accueil ---------- */

  .survol {
    position: relative;
    width: min(90vw, 520px);
    aspect-ratio: 1408 / 768;
    display: block;
  }

  .survol img {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    transition: opacity 0.35s ease;
  }

  .survol img.image-base { opacity: 1; }
  .survol img.image-survol { opacity: 0; }
  .survol:hover img.image-base { opacity: 0; }
  .survol:hover img.image-survol { opacity: 1; }

  /* ---------- Vue 2 : choix de langue ---------- */

  /* Une seule image (Keb et Bek qui présentent), le menu de langues est
     superposé en position absolue exactement dans l'espace vide entre
     les deux personnages, repéré en pourcentage de la taille de l'image
     (1380 x 752 px d'origine) pour rester aligné à toutes les tailles. */

  .scene-langues {
    position: relative;
    width: min(92vw, 640px);
    aspect-ratio: 1380 / 752;
  }

  .image-langues {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  .menu-langues-conteneur {
    position: absolute;
    left: 36.88%;
    width: 27.83%;
    top: 10.77%;
    height: 82.45%;
  }

  .menu-langues {
    list-style: none;
    margin: 0;
    padding: 0; /* ajusté dynamiquement en JS pour centrer le premier/dernier item */
    height: 100%;
    overflow-y: auto;
    scroll-snap-type: y mandatory;
    scrollbar-width: none;
    -ms-overflow-style: none;
    cursor: grab;
  }

  .menu-langues::-webkit-scrollbar { display: none; }

  .menu-langues.glissement {
    cursor: grabbing;
  }

  .menu-langues.sans-magnetisme {
    scroll-snap-type: none; /* désactivé pendant le glisser-déposer et l'auto-scroll ; le magnétisme reprend une fois relâché/arrêté */
  }

  .menu-langues li {
    scroll-snap-align: center;
    text-align: center;
    padding: 6px 6px;
    margin: 3px 6px;
    border-radius: 999px;
    font-size: clamp(0.68rem, 2.6vw, 1.05rem);
    font-weight: 500;
    color: var(--brun);
    opacity: 0.35;
    transform: scale(0.82);
    transition: opacity 0.15s ease, transform 0.15s ease, background 0.15s ease, color 0.15s ease;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }

  .menu-langues li.au-centre {
    opacity: 1;
    transform: scale(1.18);
    font-weight: 700;
    color: var(--peche-fonce);
    background: #FFFFFF;
    box-shadow: 0 2px 10px rgba(102, 80, 69, 0.12);
  }

  .fondu {
    position: absolute;
    left: 0;
    right: 0;
    height: 22%;
    pointer-events: none;
    z-index: 2;
  }

  .fondu-haut {
    top: 0;
    background: linear-gradient(var(--fond), transparent);
  }

  .fondu-bas {
    bottom: 0;
    background: linear-gradient(transparent, var(--fond));
  }

  .retour {
    position: absolute;
    top: 24px;
    left: 24px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #FFFFFF;
    color: var(--brun);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
    text-decoration: none;
    box-shadow: 0 2px 8px rgba(102, 80, 69, 0.15);
    opacity: 0.85;
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index: 3;
  }

  .retour:hover {
    opacity: 1;
    transform: scale(1.08);
  }

  @media (max-width: 560px) {
    .scene-langues { width: 96vw; }
  }

  /* ---------- Vue 3 : première fois (anglais) ---------- */

  /* Cadre plus haut que l'image seule : l'image des personnages est ancrée
     en bas, l'espace libéré au-dessus accueille la bulle "First time?"
     et la boîte de réponse Yes/No. Ratio choisi à partir de la maquette
     (image 1408x768 + environ 182px d'espace supplémentaire en haut). */

  .scene-premiere-fois {
    position: relative;
    width: min(90vw, 520px);
    aspect-ratio: 1408 / 950;
  }

  .image-premiere-fois {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: auto;
    display: block;
  }

  .bulle-first-time {
    position: absolute;
    left: 2%;
    top: 4%;
    width: 34%;
    font-family: 'Fuzzy Bubbles', cursive;
    font-weight: 700;
    font-size: clamp(1.3rem, 5.2vw, 2.15rem);
    line-height: 1.05;
    text-align: center;
    color: var(--peche-fonce);
    -webkit-text-stroke: 2.5px var(--brun-fonce);
    paint-order: stroke fill;
    transform: rotate(-4deg);
    pointer-events: none;
    z-index: 2;
  }

  .boite-reponse {
    position: absolute;
    right: 3%;
    top: 4%;
    width: fit-content;
    background: #FFFFFF;
    border-radius: 28px;
    padding: 10px 14px;
    display: flex;
    gap: 10px;
    justify-content: center;
    box-shadow: 0 4px 14px rgba(102, 80, 69, 0.18);
    z-index: 3;
  }

  .bouton-reponse {
    font-family: 'Caveat Brush', cursive;
    font-size: clamp(1.2rem, 4.4vw, 1.7rem);
    border: none;
    border-radius: 999px;
    padding: 8px 20px;
    white-space: nowrap;
    cursor: pointer;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }

  .bouton-reponse.oui {
    background: var(--peche-fonce);
    color: #FFFFFF;
    box-shadow: 0 4px 0 #B5623F;
  }

  .bouton-reponse.non {
    background: #FFFFFF;
    color: var(--peche-fonce);
    border: 2px solid var(--peche-fonce);
    box-shadow: 0 4px 0 #D9C9BC;
  }

  .bouton-reponse:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 rgba(102, 80, 69, 0.3);
  }

  @media (max-width: 560px) {
    .scene-premiere-fois { width: 96vw; }
  }
</style>
</head>
<body>

  <main id="app">

    <section id="accueil" class="vue">
      <a class="survol" href="#choix-langue">
        <img class="image-base" src="images/bonomes_keb_bek_principal_sans_fond_01.png" alt="Keb et Bek">
        <img class="image-survol" src="images/bonomes_keb_bek_principal_saluent_sans_fond_01.png" alt="Keb et Bek qui saluent">
      </a>
    </section>

    <section id="choix-langue" class="vue">
      <a class="retour" href="#accueil" aria-label="Retour">‹</a>
      <div class="scene-langues">
        <img class="image-langues" src="images/bonomes_keb_bek_principal_presentent_langues_sans_fond_01.png" alt="Keb et Bek qui présentent le choix des langues">

        <div class="menu-langues-conteneur">
          <div class="fondu fondu-haut"></div>
          <ul class="menu-langues" id="menuLangues">
            <li data-lang="en">English</li>
            <li data-lang="es">Español</li>
            <li data-lang="pt">Português</li>
            <li data-lang="it">Italiano</li>
            <li data-lang="zh">中文</li>
            <li data-lang="ko">한국어</li>
            <li data-lang="vi">Tiếng Việt</li>
            <li data-lang="ja">日本語</li>
            <li data-lang="tl">Tagalog</li>
            <li data-lang="de">Deutsch</li>
            <li data-lang="nl">Nederlands</li>
            <li data-lang="ca">Català</li>
            <li data-lang="ht">Kreyòl</li>
            <li data-lang="id">Bahasa Indonesia</li>
            <li data-lang="fa">فارسی</li>
            <li data-lang="ru">Русский</li>
            <li data-lang="no">Norsk</li>
            <li data-lang="sv">Svenska</li>
            <li data-lang="eo">Esperanto</li>
          </ul>
          <div class="fondu fondu-bas"></div>
        </div>
      </div>
    </section>

    <section id="premiere-fois-en" class="vue">
      <a class="retour" href="#choix-langue" aria-label="Retour">‹</a>
      <div class="scene-premiere-fois">
        <img class="image-premiere-fois" src="images/bonomes_keb_bek_principal_premiere_fois_sans_fond_01.png" alt="Keb et Bek qui demandent si c'est la première fois">
        <p class="bulle-first-time">First<br>time?</p>
        <div class="boite-reponse">
          <button type="button" class="bouton-reponse oui" data-reponse="oui">Yes</button>
          <button type="button" class="bouton-reponse non" data-reponse="non">No</button>
        </div>
      </div>
    </section>

  </main>

  <script>
    // Navigation entre les vues via le hash de l'URL
    const vues = document.querySelectorAll('.vue');
    const VUES_VALIDES = new Set(['accueil', 'choix-langue', 'premiere-fois-en']);

    function afficherVue() {
      const brut = window.location.hash.replace('#', '');
      const cible = VUES_VALIDES.has(brut) ? brut : 'accueil';
      vues.forEach(v => v.classList.toggle('actif', v.id === cible));
      if (cible === 'choix-langue') {
        requestAnimationFrame(() => {
          ajusterEspaceur();
          centrerMenu();
        });
      }
    }

    window.addEventListener('hashchange', afficherVue);
    afficherVue();

    // ---------- Effet "roue" : l'item le plus proche du centre grossit ----------

    const conteneurMenu = document.querySelector('.menu-langues-conteneur');
    const menu = document.getElementById('menuLangues');
    const items = Array.from(menu.querySelectorAll('li'));
    let repositionnement = false;

    function centrerMenu() {
      const rectMenu = menu.getBoundingClientRect();
      const centreMenu = rectMenu.top + rectMenu.height / 2;
      let plusProche = null;
      let plusPetiteDistance = Infinity;

      items.forEach(item => {
        const rect = item.getBoundingClientRect();
        const centreItem = rect.top + rect.height / 2;
        const distance = Math.abs(centreItem - centreMenu);
        if (distance < plusPetiteDistance) {
          plusPetiteDistance = distance;
          plusProche = item;
        }
      });

      items.forEach(item => item.classList.toggle('au-centre', item === plusProche));
    }

    // Espaceur haut/bas recalculé selon la hauteur réelle du conteneur,
    // pour que le premier et le dernier item puissent aussi se centrer.
    function ajusterEspaceur() {
      const hauteurConteneur = conteneurMenu.clientHeight;
      const hauteurItem = items[0] ? items[0].offsetHeight : 40;
      const padding = Math.max(0, hauteurConteneur / 2 - hauteurItem / 2);
      menu.style.paddingTop = padding + 'px';
      menu.style.paddingBottom = padding + 'px';
    }

    window.addEventListener('resize', () => {
      ajusterEspaceur();
      centrerMenu();
    });

    menu.addEventListener('scroll', () => {
      if (!repositionnement) {
        repositionnement = true;
        requestAnimationFrame(() => {
          centrerMenu();
          repositionnement = false;
        });
      }
    });

    // ---------- Défilement automatique au survol des bords ----------

    const ZONE_BORD = 0.3;   // fraction de la hauteur du menu qui déclenche l'auto-scroll
    const VITESSE_MAX = 12;  // px par frame tout au bord

    let vitesseAutoScroll = 0;

    function boucleAutoScroll() {
      if (vitesseAutoScroll !== 0 && !enTrainDeGlisser) {
        menu.scrollTop += vitesseAutoScroll;
      }
      requestAnimationFrame(boucleAutoScroll);
    }
    boucleAutoScroll();

    conteneurMenu.addEventListener('mousemove', (e) => {
      if (enTrainDeGlisser) return;
      const rect = menu.getBoundingClientRect();
      const y = e.clientY - rect.top;
      const ratio = y / rect.height;

      let nouvelleVitesse = 0;
      if (ratio < ZONE_BORD) {
        const intensite = 1 - Math.max(0, ratio) / ZONE_BORD;
        nouvelleVitesse = -intensite * VITESSE_MAX;
      } else if (ratio > 1 - ZONE_BORD) {
        const intensite = (Math.min(1, ratio) - (1 - ZONE_BORD)) / ZONE_BORD;
        nouvelleVitesse = intensite * VITESSE_MAX;
      }

      // Le scroll-snap CSS annule sinon chaque petit incrément programmatique :
      // on le désactive pendant l'auto-scroll et on le rétablit à l'arrêt.
      if (nouvelleVitesse !== 0 && vitesseAutoScroll === 0) {
        menu.classList.add('sans-magnetisme');
      } else if (nouvelleVitesse === 0 && vitesseAutoScroll !== 0) {
        menu.classList.remove('sans-magnetisme');
        requestAnimationFrame(centrerMenu);
      }
      vitesseAutoScroll = nouvelleVitesse;
    });

    conteneurMenu.addEventListener('mouseleave', () => {
      if (vitesseAutoScroll !== 0) {
        vitesseAutoScroll = 0;
        menu.classList.remove('sans-magnetisme');
        requestAnimationFrame(centrerMenu);
      }
    });

    // ---------- Glisser-déposer à la souris (souhaité pour la version en ligne) ----------

    let enTrainDeGlisser = false;
    let aBouge = false;
    let departY = 0;
    let departScroll = 0;

    menu.addEventListener('mousedown', (e) => {
      enTrainDeGlisser = true;
      aBouge = false;
      vitesseAutoScroll = 0;
      departY = e.clientY;
      departScroll = menu.scrollTop;
      menu.classList.add('glissement', 'sans-magnetisme');
      e.preventDefault();
    });

    window.addEventListener('mousemove', (e) => {
      if (!enTrainDeGlisser) return;
      const delta = e.clientY - departY;
      if (Math.abs(delta) > 4) aBouge = true;
      menu.scrollTop = departScroll - delta;
    });

    window.addEventListener('mouseup', () => {
      if (enTrainDeGlisser) {
        enTrainDeGlisser = false;
        menu.classList.remove('glissement', 'sans-magnetisme');
        requestAnimationFrame(centrerMenu);
      }
    });

    // ---------- Sélection d'une langue ----------

    // Seul l'anglais mène quelque part pour l'instant ; les autres langues
    // se contentent de se centrer dans le menu (pages pas encore construites).
    const DESTINATIONS_LANGUES = {
      en: 'premiere-fois-en'
    };

    items.forEach(item => {
      item.addEventListener('click', () => {
        if (aBouge) return; // c'était un glisser-déposer, pas un clic

        const dejaAuCentre = item.classList.contains('au-centre');
        const destination = DESTINATIONS_LANGUES[item.dataset.lang];

        if (dejaAuCentre && destination) {
          window.location.hash = '#' + destination;
          return;
        }

        item.scrollIntoView({ behavior: 'smooth', block: 'center' });
      });
    });

    // ---------- Vue "première fois" : boutons Yes / No ----------

    document.querySelectorAll('.bouton-reponse').forEach(bouton => {
      bouton.addEventListener('click', () => {
        // Branchement du tutoriel (Yes) et du menu simple (No) à venir
        // une fois ces deux écrans construits.
        console.log('Réponse choisie :', bouton.dataset.reponse);
      });
    });
  </script>

</body>
</html>
