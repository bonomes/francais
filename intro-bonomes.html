<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meet the Bonomes — Keb &amp; Bek</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Fuzzy+Bubbles:wght@400;700&family=Caveat+Brush&display=swap" rel="stylesheet">
<style>
  /* ==================================================================
     intro-bonomes.html — reconstruction complète.

     PRINCIPE DIRECTEUR : ceci appartient à la famille visuelle
     "index.html / parcours.html" (voir BONOMES_v32, section Concepts
     fondamentaux) — Baloo 2 / Fuzzy Bubbles / Caveat Brush, palette
     --fond/--brun/--peche. La tentative précédente avait bêtement repris
     le style de zh_histoire_001_p02.html (Patrick Hand/Nunito, palette
     violette) au lieu d'adapter le MÉCANISME de p02 à l'HABILLAGE du
     nouveau site. Ici, seul le mécanisme est repris (voir .bulle-pile
     plus bas, structure/logique identique à p02) ; les couleurs et
     polices sont celles du site actuel, pas celles de p02.

     STRUCTURE NARRATIVE (voir le script fourni par Raphaël, 15 sections) :
     - CORRECTION IMPORTANTE (relecture de Raphaël) : la légende du haut
       (rattachée à l'image, une seule réplique à la fois) et la pile du
       bas (qui s'accumule, .pile-item, mécanisme réel de p02 .bulle-pile)
       sont COMPLÉMENTAIRES, jamais substituables l'une à l'autre. Chaque
       réplique, du début à la fin des 15 sections, s'affiche TOUJOURS en
       haut (légende, remplacée à chaque nouvelle réplique). En PLUS de ça,
       si (et seulement si) la réplique est effectivement dite en français
       (ligne.francais === true — en pratique : les deux "Salut !" de
       l'étape 11), elle est AUSSI ajoutée à la pile du bas, où elle reste
       accumulée pour toujours (jamais remplacée ni effacée en avançant).
       Les répliques de Kloé, et tout ce qui est dans la langue de
       l'apprenant, ne rejoignent JAMAIS la pile — cette zone sert
       exclusivement à revoir ce qui a été dit en français (voir champ
       "francais" sur chaque ligne dans ETAPES plus bas).
     - Chaque mot français dans la pile est survolable/tapable (mécanisme
       porté de .vocab-mot/.vocab-tooltip de p02, voir .pile-mot-vocab plus
       bas) : ça affiche une traduction dans la langue de l'apprenant,
       jamais un texte du genre "Save X to backpack" (ça, c'est la case à
       cocher séparée de l'étape 13, un mécanisme distinct).

     COULEURS PAR PERSONNAGE (proposition de Claude, à valider par
     Raphaël — aucune fiche personnage de Kloé n'existe encore pour
     confirmer une couleur officielle, voir BONOMES_v32) :
       --bek-couleur  : ambre chaud (référence à ses cheveux blonds)
       --keb-couleur  : bleu ardoise doux (contraste calme avec l'ambre)
       --kloe-couleur : var(--peche-fonce) (déjà la teinte d'accent
                        principale du site — cohérent avec son rôle de
                        guide/interface plutôt que personnage narratif)

     IMAGES : dossiers validés par Raphaël (v34+) — deux catégories,
     jamais mélangées :
       - images/prologue/  : images propres à cette leçon (étapes 1 à 8,
         Bek et Keb seuls, avant l'arrivée de Kloé).
       - images/recurrentes/ : images générales qui reviendront dans
         plusieurs leçons — ici, l'unique image de Kloé (étapes 9 à 15),
         réutilisée telle quelle à chaque réplique tant qu'elle n'a pas
         de rotation (voir localStorage, BONOMES_v32).
     Étapes 7 et 8 utilisent encore un repli visuel "image pas encore
     prête" (chemins prévisibles dans images/prologue/, apparaîtront
     automatiquement dès que Raphaël les ajoute, sans toucher au code).
     Kloé n'a pas encore d'image définitive : voir BONOMES_v32, Raphaël
     se charge lui-même de la générer.

     PAS D'ENCADRÉ DERRIÈRE LES PERSONNAGES (relecture de Raphaël) : .scene-
     intro n'a plus de fond, de bordure ni d'ombre — ce n'est qu'un
     conteneur de positionnement pour l'image. L'image (fond beige uni
     #F2EDE3, comme le gabarit de génération des Bonomes dans BONOMES_v32)
     se retrouve donc directement sur le fond de la page, sans "boîte"
     visible autour. Le repli "image pas encore prête" suit la même
     logique : plus de bordure pointillée ni de fond teinté, juste un
     texte discret, pour ne jamais recréer un cadre le temps que les
     images manquantes arrivent.

     BUG CORRIGÉ (signalé par Raphaël, capture à l'appui) : la légende
     vivait auparavant DANS .scene-intro, en position absolute ancrée à
     "bottom: 6%" — donc littéralement par-dessus les personnages (visible
     dès l'étape 1). Elle vit désormais dans son propre conteneur,
     .legende-zone, sous l'image plutôt que dessus, alignée gauche/centre/
     droite via flexbox + marges auto plutôt que via un ancrage absolu
     dans un coin de l'image.
     ================================================================== */

  :root {
    --fond: #F2EDE3;
    --fond-carte: #FFFFFF;
    --brun: #665045;
    --brun-fonce: #4A3B33;
    --blonde: #F1DC99;
    --peche: #F0A98B;
    --peche-fonce: #E08867;
    --bek-couleur: #C97B3D;
    --keb-couleur: #5B7FA6;
    --kloe-couleur: #E08867;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: var(--fond);
  }

  body {
    font-family: 'Baloo 2', 'Noto Sans', sans-serif;
    color: var(--brun-fonce);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 60px;
  }

  /* ── Compteur d'étapes (texte simple plutôt que 15 points — trop de
       points serait visuellement chargé pour une séquence aussi longue) ── */
  .compteur-intro {
    font-family: 'Fuzzy Bubbles', cursive;
    font-weight: 700;
    font-size: 0.95rem;
    color: var(--brun);
    opacity: 0.75;
    margin-bottom: 14px;
    letter-spacing: 0.02em;
  }

  /* ── Scène : image + légende. Pas de carte/fond/ombre : les personnages
       doivent apparaître directement sur le fond de la page, sans encadré
       (relecture de Raphaël) — ce conteneur ne sert plus qu'à positionner
       la légende par-dessus l'image. ── */
  .scene-intro {
    position: relative;
    width: min(92vw, 640px);
    aspect-ratio: 1408 / 768;
    overflow: visible;
  }

  .scene-intro img.image-scene {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }

  /* Repli "image pas encore prête" — texte discret, SANS bordure ni fond
     teinté (relecture de Raphaël : aucun encadré derrière les personnages,
     même à titre de repli temporaire). Ne remplace QUE l'image elle-même
     (bug déjà rencontré et corrigé dans une session précédente : un repli
     qui efface toute la zone efface aussi la légende qui vit dans le même
     conteneur). */
  .repli-image-manquante {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
    font-family: 'Fuzzy Bubbles', cursive;
    font-size: 0.95rem;
    color: var(--peche-fonce);
    opacity: 0.75;
  }

  /* ── Zone de légende : SOUS l'image, jamais par-dessus (bug signalé par
       Raphaël — le texte recouvrait les personnages quand la bulle était
       positionnée en absolute par-dessus la scène). L'alignement
       gauche/centre/droite selon le personnage se fait maintenant via
       flexbox + marges auto sur la bulle elle-même, plutôt que via une
       position absolute ancrée dans le coin de l'image. ── */
  .legende-zone {
    display: flex;
    width: min(92vw, 640px);
    margin-top: 16px;
    min-height: 30px;
  }

  /* ── Bulle de légende (sections 1 à 10) : une seule réplique, remplacée à
       chaque étape, jamais empilée. Même famille visuelle que .bulle-tuto
       déjà utilisée ailleurs sur le site, mais avec une couleur qui varie
       vraiment selon le personnage — .bulle-tuto ne le faisait pas (seule
       la position changeait), ce qui ne suffisait pas à ce que Raphaël
       demandait ici. ── */
  .legende-intro {
    max-width: 78%;
    font-family: 'Fuzzy Bubbles', cursive;
    font-weight: 700;
    font-size: clamp(1rem, 2.6vw, 1.4rem);
    line-height: 1.3;
    padding: 10px 18px;
    background: #FFFFFF;
    border-radius: 16px;
    box-shadow: 0 4px 14px rgba(102, 80, 69, 0.12);
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.3s ease, transform 0.3s ease;
  }

  .legende-intro.in { opacity: 1; transform: translateY(0); }

  .legende-intro.cote-keb {
    margin-right: auto;
    text-align: left;
    border: 2.5px solid var(--keb-couleur);
    color: var(--keb-couleur);
  }

  .legende-intro.cote-bek {
    margin-left: auto;
    text-align: right;
    border: 2.5px solid var(--bek-couleur);
    color: var(--bek-couleur);
  }

  .legende-intro.cote-kloe {
    margin-left: auto;
    margin-right: auto;
    text-align: center;
    border: 2.5px solid var(--kloe-couleur);
    color: var(--kloe-couleur);
  }

  .legende-intro.partagee {
    margin-left: auto;
    margin-right: auto;
    text-align: center;
    border: 2.5px solid var(--brun);
    color: var(--brun-fonce);
  }

  /* ── Pile de répliques (sections 11 à 15) — mécanisme identique à
       .bulle-pile de p02 (structure, logique d'accumulation, jamais
       effacée en avançant), simplement réhabillé avec les polices et
       couleurs du site actuel plutôt que celles de p02. ── */
  .pile-intro-conteneur {
    width: min(92vw, 640px);
    margin-top: 18px;
  }

  .pile-intro { display: flex; flex-direction: column; gap: 2px; }

  .pile-item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    opacity: 0;
    max-height: 0;
    overflow: hidden;
    transition: opacity 0.4s ease, max-height 0.4s ease, margin 0.4s ease;
  }

  .pile-item.in { opacity: 1; max-height: 160px; margin: 9px 0; overflow: visible; }

  .pile-avatar {
    flex-shrink: 0;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--c, var(--brun));
    color: #FFFFFF;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Fuzzy Bubbles', cursive;
    font-weight: 700;
    font-size: 15px;
  }

  .pile-corps {
    flex: 1;
    padding: 1px 0 1px 12px;
    border-left: 2.5px solid var(--c, var(--brun));
  }

  .pile-qui {
    display: block;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: 10.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--c, var(--brun));
    margin-bottom: 2px;
  }

  .pile-texte {
    font-family: 'Fuzzy Bubbles', cursive;
    font-size: 1.15rem;
    line-height: 1.3;
    color: var(--brun-fonce);
  }

  .pile-item.bek { --c: var(--bek-couleur); }
  .pile-item.keb { --c: var(--keb-couleur); }
  .pile-item.kloe { --c: var(--kloe-couleur); }

  /* ── Mot français survolable/tapable dans la pile — mécanisme porté de
       zh_histoire_001_p02.html (.vocab-mot / .vocab-tooltip), réhabillé
       avec les couleurs/polices du site actuel. Seuls les mots ayant
       réellement été dits en français (ligne.francais === true) sont
       encapsulés ainsi. Au survol (ordinateur) ou au tap (mobile, voir
       gestion du clic délégué dans le script), affiche une traduction
       dans la langue de l'apprenant — jamais "Save X to backpack", qui
       est un mécanisme séparé (la case à cocher de l'étape 13). ── */
  .pile-mot-vocab {
    position: relative;
    border-bottom: 2.5px dashed var(--peche-fonce);
    cursor: pointer;
  }

  .pile-tooltip {
    display: none;
    position: absolute;
    left: 0;
    top: 100%;
    margin-top: 9px;
    background: #FFFFFF;
    border: 2px solid var(--peche-fonce);
    border-radius: 14px;
    padding: 10px 14px;
    width: max-content;
    max-width: 220px;
    box-shadow: 0 8px 22px rgba(102, 80, 69, 0.18);
    z-index: 20;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 500;
    font-size: 0.85rem;
    line-height: 1.4;
    color: var(--brun-fonce);
    white-space: normal;
  }

  .pile-tooltip::before {
    content: "";
    position: absolute;
    bottom: 100%;
    left: 16px;
    border: 7px solid transparent;
    border-bottom-color: var(--peche-fonce);
  }

  .pile-tooltip-qui {
    display: block;
    font-family: 'Fuzzy Bubbles', cursive;
    font-weight: 700;
    font-size: 0.78rem;
    color: var(--peche-fonce);
    margin-bottom: 2px;
  }

  .pile-mot-vocab:hover .pile-tooltip,
  .pile-mot-vocab.active .pile-tooltip { display: block; }

  /* Case à cocher pour sauvegarder un mot appris (générique — voir
     motACocher dans ETAPES) : affiche "mot : traduction", jamais un
     texte du type "Save X to backpack" (relecture de Raphaël). */
  .case-sauvegarde {
    display: none;
    align-items: center;
    gap: 8px;
    margin: 6px 0 6px 48px;
    padding: 8px 14px;
    background: var(--fond);
    border: 1.5px dashed var(--peche);
    border-radius: 12px;
    font-family: 'Baloo 2', sans-serif;
    font-size: 0.85rem;
    color: var(--brun);
    width: fit-content;
    opacity: 0;
    transition: opacity 0.35s ease;
  }
  .case-sauvegarde.visible { display: flex; }
  .case-sauvegarde.in { opacity: 1; }
  .case-sauvegarde input { width: 16px; height: 16px; accent-color: var(--peche-fonce); cursor: pointer; }
  .case-sauvegarde label { cursor: pointer; }
  .case-sauvegarde-mot { font-weight: 800; color: var(--brun-fonce); }

  /* ── Navigation ── */
  .nav-intro {
    display: flex;
    gap: 14px;
    margin-top: 22px;
  }

  .bouton-nav-intro {
    border: none;
    border-radius: 100px;
    padding: 11px 26px;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 0.92rem;
    cursor: pointer;
    transition: opacity 0.15s ease, transform 0.15s ease;
  }

  .bouton-nav-intro.suivant { background: var(--peche-fonce); color: #FFFFFF; }
  .bouton-nav-intro.precedent { background: #FFFFFF; color: var(--brun); border: 1.5px solid var(--brun); }
  .bouton-nav-intro:hover { transform: translateY(-1px); }
  .bouton-nav-intro:disabled { opacity: 0.35; cursor: default; transform: none; }

  /* ================= Sac à dos : porté tel quel depuis index.html ================= */
  /* Même ids/classes/fonctions que index.html (CLE_SAC, CATEGORIES_SAC,
     chargerSac/sauvegarderSac/ajouterAuSac/rafraichirAffichageSac...),
     pour rester trivialement resynchronisable. Seul ajout : caché par
     défaut (.cache) et révélé au moment précis où Kloé le présente
     (étape 14), plutôt que visible dès le chargement de la page — voir
     BONOMES_v32 : "l'introduction serait aussi le moment où on l'ajoute
     pour la première fois à cette page". */

  #sacBouton {
    position: fixed;
    top: 24px;
    right: 24px;
    z-index: 200;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: #FFFFFF;
    border: 2px solid var(--peche);
    box-shadow: 0 6px 18px rgba(102, 80, 69, 0.14);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.5s ease;
    opacity: 0;
    pointer-events: none;
  }

  #sacBouton.revele { opacity: 1; pointer-events: auto; animation: pulseSac 1.1s ease 2; }

  @keyframes pulseSac {
    0%, 100% { box-shadow: 0 6px 18px rgba(102, 80, 69, 0.14); }
    50% { box-shadow: 0 6px 26px rgba(224, 136, 103, 0.55); }
  }

  #sacBouton:hover { transform: translateY(-1px); box-shadow: 0 8px 22px rgba(102, 80, 69, 0.14); }
  #sacBouton:active { transform: translateY(1px); }

  .sac-badge {
    position: absolute;
    top: -4px;
    right: -4px;
    background: var(--peche-fonce);
    color: #FFFFFF;
    border-radius: 50%;
    min-width: 20px;
    height: 20px;
    padding: 0 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    box-shadow: 0 2px 5px rgba(102, 80, 69, 0.14);
  }

  .sac-badge.vide { display: none; }

  #iconeSac .rabat { transform-origin: 32px 34px; transition: transform 0.35s cubic-bezier(.34, 1.56, .64, 1); }
  #sacBouton.ouvert #iconeSac .rabat { transform: rotate(-38deg) translate(-2px, -3px); }
  #iconeSac .contenu-eclat { opacity: 0; transition: opacity 0.25s ease 0.1s; }
  #sacBouton.ouvert #iconeSac .contenu-eclat { opacity: 1; }

  #sacPanneau {
    position: fixed;
    top: 78px;
    right: 24px;
    z-index: 199;
    width: min(78vw, 300px);
    background: #FFFFFF;
    border: 1.5px solid var(--peche);
    border-radius: 20px;
    box-shadow: 0 14px 36px rgba(102, 80, 69, 0.14);
    overflow: hidden;
    max-height: 0;
    opacity: 0;
    pointer-events: none;
    transition: max-height 0.3s ease, opacity 0.25s ease;
  }

  #sacPanneau.ouvert { max-height: min(65vh, 520px); opacity: 1; pointer-events: auto; }

  .sac-entete { padding: 14px 18px; background: var(--peche); color: #FFFFFF; font-weight: 700; font-size: 1rem; }
  .sac-sous-titre { font-size: 0.72rem; font-weight: 500; opacity: 0.9; margin-top: 1px; }
  .sac-corps { max-height: calc(min(65vh, 520px) - 58px); overflow-y: auto; padding: 8px 10px 14px; }
  .sac-categorie { margin-top: 10px; }
  .sac-categorie:first-child { margin-top: 4px; }

  .sac-cat-entete {
    display: flex; align-items: center; gap: 8px; padding: 6px 8px;
    font-size: 0.85rem; font-weight: 700; color: var(--brun);
    cursor: pointer; user-select: none; border-radius: 10px;
  }
  .sac-cat-entete:hover { background: var(--fond); }
  .sac-cat-icone { width: 18px; height: 18px; flex-shrink: 0; color: var(--peche-fonce); }
  .sac-cat-compteur {
    margin-left: auto; background: var(--fond); color: var(--brun);
    border-radius: 100px; font-size: 0.72rem; padding: 1px 8px; font-weight: 700;
  }
  .sac-cat-chevron { font-size: 0.7rem; color: var(--brun); transition: transform 0.2s ease; flex-shrink: 0; width: 12px; }
  .sac-categorie.repliee .sac-cat-chevron { transform: rotate(-90deg); }
  .sac-cat-liste { padding: 2px 8px 6px 40px; }
  .sac-categorie.repliee .sac-cat-liste { display: none; }

  .sac-item {
    display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
    font-size: 0.8rem; padding: 4px 0; border-bottom: 1px dotted rgba(102, 80, 69, 0.18);
  }
  .sac-item:last-child { border-bottom: none; }
  .sac-item-nom { font-weight: 700; }
  .sac-item-detail { color: var(--brun); font-size: 0.74rem; text-align: right; }
  .sac-vide { font-size: 0.76rem; color: var(--brun); font-style: italic; padding: 4px 0; }

  .sac-pied { padding: 10px 16px 14px; border-top: 1px solid rgba(240, 169, 139, 0.35); display: flex; gap: 8px; }
  .sac-pied button {
    flex: 1; border-radius: 10px; padding: 8px; font-size: 0.78rem; font-weight: 700;
    cursor: pointer; font-family: inherit; transition: opacity 0.15s ease;
  }
  .sac-pied button:hover { opacity: 0.85; }
  #btnConnexionDepuisSac { background: var(--peche-fonce); border: none; color: #FFFFFF; }

  .sac-avertissement {
    margin: 0 10px 10px; padding: 8px 10px; background: #EAF3DE; border-radius: 10px;
    font-size: 0.72rem; color: #3d5c2c; line-height: 1.35;
  }

  @media (max-width: 560px) {
    #sacBouton { top: 16px; right: 16px; width: 40px; height: 40px; }
    #sacPanneau { top: 62px; right: 16px; }
    .legende-intro { font-size: 0.92rem; max-width: 88%; }
    .pile-texte { font-size: 1rem; }
  }
</style>
</head>
<body>

  <div class="compteur-intro" id="compteurIntro">1 / 15</div>

  <div class="scene-intro" id="sceneIntro">
    <!-- Image seule, injectée par JS — la légende ne vit plus ici (voir
         .legende-zone juste en dessous, correction du bug signalé par
         Raphaël : le texte recouvrait les personnages). -->
  </div>

  <div class="legende-zone" id="legendeZone">
    <!-- Légende injectée par JS, sous l'image -->
  </div>

  <div class="pile-intro-conteneur" id="pileConteneur" style="display:none;">
    <div class="pile-intro" id="pileIntro"></div>
  </div>

  <div class="nav-intro">
    <button type="button" class="bouton-nav-intro precedent" id="btnPrecedentIntro">‹ Back</button>
    <button type="button" class="bouton-nav-intro suivant" id="btnSuivantIntro">Continue ›</button>
  </div>

  <!-- ================= Sac à dos (réel, porté depuis index.html) ================= -->
  <button type="button" id="sacBouton" aria-label="Backpack" onclick="toggleSacADos()">
    <svg id="iconeSac" width="26" height="26" viewBox="0 0 64 64" fill="none">
      <path d="M22 22 C20 14, 24 8, 32 8 C40 8, 44 14, 42 22" stroke="#8A7364" stroke-width="3" stroke-linecap="round" fill="none"/>
      <rect x="14" y="24" width="36" height="30" rx="10" fill="#C99A7C"/>
      <rect x="20" y="38" width="24" height="14" rx="7" fill="#B5825F"/>
      <g class="contenu-eclat">
        <circle cx="26" cy="30" r="2.4" fill="#F0A98B"/>
        <circle cx="34" cy="28" r="1.8" fill="#EAF3DE"/>
        <circle cx="38" cy="32" r="2" fill="#F0A98B"/>
      </g>
      <g class="rabat">
        <path d="M14 30 C14 20, 18 16, 32 16 C46 16, 50 20, 50 30 L50 24 C50 20, 46 18, 32 18 C18 18, 14 20, 14 24 Z" fill="#C99A7C"/>
        <path d="M14 24 C14 16, 18 12, 32 12 C46 12, 50 16, 50 24 C50 25.5, 49 26, 47.5 26 L16.5 26 C15 26, 14 25.5, 14 24 Z" fill="#DCB396"/>
        <circle cx="32" cy="24" r="2.6" fill="#8A7364"/>
      </g>
    </svg>
    <span class="sac-badge" id="sacBadge">0</span>
  </button>

  <div id="sacPanneau">
    <div class="sac-entete">
      <span id="sacTitre">My backpack</span>
      <div class="sac-sous-titre" id="sacSousTitre">nothing yet</div>
    </div>
    <div class="sac-corps" id="sacCorps"></div>
    <div class="sac-avertissement" id="sacAvertissement">
      This backpack is saved on this device only. Sign in to keep it for good, even if you switch devices.
    </div>
    <div class="sac-pied">
      <button id="btnConnexionDepuisSac" onclick="window.location.hash = '#connexion'">Sign in</button>
    </div>
  </div>

<script>
  // ─────────────────────────────────────────────
  //  Script des 15 étapes — texte EXACTEMENT celui fourni par Raphaël,
  //  traduit en anglais (langue choisie pour cette version), à l'exception
  //  de "Salut !" qui reste en français dans les deux langues (c'est le
  //  mot enseigné). Aucune ligne inventée : chaque "texte" ci-dessous
  //  correspond à une réplique précise du script original.
  //
  //  Étape 7 RÉSOLUE (confirmé par Raphaël) : c'est Keb qui parle, avec une
  //  pointe d'ironie envers Bek — "Bek's second best friend", pas "our best
  //  friend" (l'ancienne formulation partagée était une correction erronée
  //  d'une coquille qui n'en était pas une).
  //  (L'attribution de l'étape 1 à Bek est confirmée par Raphaël — ce n'est
  //  plus une supposition.)
  // ─────────────────────────────────────────────

  // Chaque ligne peut porter "francais: true" + "traduction: ..." — c'est
  // ce qui décide si elle rejoint AUSSI la pile du bas (en plus d'être
  // affichée en légende, comme toutes les autres). Voir note en tête de
  // fichier. En pratique, dans cette introduction, seuls les deux
  // "Salut !" de l'étape 11 sont concernés : c'est le seul mot
  // véritablement enseigné ici.
  const ETAPES = [
    { // 1
      speaker: 'bek',
      img: 'images/prologue/bonomes_keb_bek_presente_01.png',
      texte: "Wait... have we actually never properly introduced ourselves?"
    },
    { // 2 (deux répliques, la deuxième après une courte pause automatique)
      lignes: [
        { speaker: 'bek', img: 'images/prologue/bonomes_keb_bek_se_presente_01.png', texte: "I'm Bek." },
        { speaker: 'keb', img: 'images/prologue/bonomes_keb_se_presente_bek_01.png', texte: "And I'm Keb.", delai: 1200 }
      ]
    },
    { // 3 — Keb (pas partagé) ; image de la foule de Bonomes, confirmée par Raphaël
      speaker: 'keb',
      img: 'images/prologue/bonomes_foule_01.png',
      texte: "We're Bonomes — little drawn characters who've always lived inside every book the real Bek ever owned."
    },
    { // 4 — Bek, confirmée par Raphaël
      speaker: 'bek',
      img: 'images/prologue/bonomes_keb_fier_bek_informatique_01.png',
      texte: "And now, thanks to the real Keb's computer skills, we live on the internet too — ready to teach you French."
    },
    { // 5 — toujours Bek, confirmée par Raphaël
      speaker: 'bek',
      img: 'images/prologue/bonomes_keb_bek_francais_ame_01.png',
      texte: "We can speak every language... but French is the true language of our soul."
    },
    { // 6 — c'est Keb qui parle ici (précision de Raphaël), pas une
      // réplique partagée : légende couleur --keb-couleur.
      speaker: 'keb',
      img: 'images/prologue/bonomes_keb_annonce_lecon_01.png',
      texte: "In fact, we're about to move on to your first lesson — and from then on, we'll speak only French."
    },
    { // 7 — Keb (même voix que l'étape 6), avec une pointe d'ironie envers
      // Bek : Kloé n'est PAS la meilleure amie de Keb, d'où "Bek's second
      // best friend" plutôt que "our best friend" (précision de Raphaël —
      // référence à l'ancien texte fautif résolue, voir note ci-dessus).
      speaker: 'keb',
      img: 'images/prologue/intro-bonomes-07.png',
      texte: "We're going to need Kloé — Bek's second best friend — to come and translate for you."
    },
    { // 8 — c'est Bek qui parle (précision de Raphaël)
      speaker: 'bek',
      img: 'images/prologue/intro-bonomes-08.png',
      texte: "Here she comes!"
    },
    { // 9 — scindée en deux étapes distinctes (précision de Raphaël : les
      // deux idées sont déconnectées — la salutation d'un côté, son rôle
      // de l'autre — donc chacune mérite son propre "Continue", plutôt que
      // d'être une seule légende à rallonge).
      speaker: 'kloe',
      img: 'images/recurrentes/intro-bonomes-09.png',
      texte: "Hi, I'm Kloé! Nice to meet you!"
    },
    { // 10 — suite de l'étape précédente, scindée pour la même raison
      speaker: 'kloe',
      img: 'images/recurrentes/intro-bonomes-09.png',
      texte: "I'll also take care of grammar explanations and showing you around the site."
    },
    { // 11
      speaker: 'kloe',
      img: 'images/recurrentes/intro-bonomes-09.png',
      texte: "Let's show you how this works. Say something, you two!"
    },
    { // 12 — Bek et Keb disent le premier mot français : reste en légende
      // ET rejoint la pile du bas pour toujours (francais: true).
      img: 'images/recurrentes/intro-bonomes-09.png',
      lignes: [
        { speaker: 'bek', texte: 'Salut !', francais: true, traduction: 'Hi!' },
        { speaker: 'keb', texte: 'Salut !', francais: true, traduction: 'Hi!', delai: 900 }
      ]
    },
    { // 13 — ligne de Kloé : légende seulement, ne rejoint jamais la pile
      img: 'images/recurrentes/intro-bonomes-09.png',
      lignes: [
        { speaker: 'kloe', texte: "If you hover or tap on a word, you'll get the translation — and an explanation, from me, always!" }
      ]
    },
    { // 14 — la case à cocher apparaît maintenant
      img: 'images/recurrentes/intro-bonomes-09.png',
      revealCase: true,
      motACocher: { mot: 'Salut', traduction: 'Hi!' },
      lignes: [
        { speaker: 'kloe', texte: "Then, if you'd like, you can save the new words you've learned. Just tap the box below!" }
      ]
    },
    { // 15 — le sac à dos se révèle maintenant
      img: 'images/recurrentes/intro-bonomes-09.png',
      revealSac: true,
      lignes: [
        { speaker: 'kloe', texte: "That checked word will be saved in the backpack you see in the top right corner of your screen." }
      ]
    },
    { // 16
      img: 'images/recurrentes/intro-bonomes-09.png',
      lignes: [
        { speaker: 'kloe', texte: "And by the way, everything you collect during a lesson lands there. It stays from one lesson to the next — but create an account so you never lose your progress!" }
      ]
    }
  ];

  const NOMS = { bek: 'Bek', keb: 'Keb', kloe: 'Kloé' };
  const INITIALES = { bek: 'B', keb: 'K', kloe: 'Kl' };

  let etape = 0;               // index de l'étape courante (0-based)
  let sousLigneVisible = 0;    // combien de "lignes" de l'étape courante sont déjà affichées
  let minuteriesActives = [];  // pour pouvoir annuler les délais auto au "Précédent"
  // BUG CORRIGÉ (signalé par Raphaël — "d'autres sphères apparaissent" au
  // clic sur "Précédent") : precedent() reconstruit déjà la pile au complet
  // (boucle ci-dessous), mais appelait ensuite rendreEtape() → rendreLigne(),
  // qui réinjectait UNE DEUXIÈME FOIS les lignes françaises de l'étape
  // courante (rendreLigne ajoute aussi à la pile — voir sa définition).
  // Ce drapeau, actif pendant toute la reconstruction de precedent() (y
  // compris son appel à rendreEtape()), fait que rendreLigne saute l'ajout
  // à la pile puisque precedent() s'en est déjà chargé lui-même.
  let reconstructionPileEnCours = false;

  const elScene = document.getElementById('sceneIntro');
  const elLegendeZone = document.getElementById('legendeZone');
  const elPileConteneur = document.getElementById('pileConteneur');
  const elPile = document.getElementById('pileIntro');
  const elCompteur = document.getElementById('compteurIntro');
  const btnPrecedent = document.getElementById('btnPrecedentIntro');
  const btnSuivant = document.getElementById('btnSuivantIntro');

  function viderMinuteries() {
    minuteriesActives.forEach(id => clearTimeout(id));
    minuteriesActives = [];
  }

  function creerImage(cheminImage) {
    const wrapper = document.createElement('div');
    wrapper.style.position = 'absolute';
    wrapper.style.inset = '0';

    const img = document.createElement('img');
    img.className = 'image-scene';
    img.src = cheminImage;
    img.alt = 'Keb, Bek, and Kloé';
    img.onerror = function () {
      // Ne remplace QUE l'image, jamais le conteneur entier (voir note
      // en haut de fichier — bug déjà rencontré dans une session passée).
      const repli = document.createElement('div');
      repli.className = 'repli-image-manquante';
      repli.textContent = 'Image not ready yet';
      img.replaceWith(repli);
    };
    wrapper.appendChild(img);
    return wrapper;
  }

  function construireLegende(ligne) {
    const p = document.createElement('p');
    let classe = 'legende-intro';
    if (ligne.speaker === 'keb') classe += ' cote-keb';
    else if (ligne.speaker === 'bek') classe += ' cote-bek';
    else if (ligne.speaker === 'kloe') classe += ' cote-kloe';
    else classe += ' partagee';
    p.className = classe;
    p.textContent = ligne.texte;
    return p;
  }

  // Case à cocher pour sauvegarder un mot appris — l'affichage ne doit
  // JAMAIS dire "Save X to backpack" (relecture de Raphaël, deux fois
  // maintenant) : on voit le mot en minuscules, deux-points, puis la
  // traduction dans la langue de l'apprenant (et une explication au
  // besoin). Généralisée avec motACocher = { mot, traduction } plutôt que
  // codée en dur pour "Salut", pour rester réutilisable aux prochaines
  // leçons/mots sans retoucher cette fonction.
  function afficherCaseSauvegarde(motACocher) {
    const idBase = motACocher.mot.toLowerCase().replace(/\s+/g, '-');
    if (document.getElementById('caseSauvegarde-' + idBase)) return;
    const div = document.createElement('div');
    div.className = 'case-sauvegarde visible';
    div.id = 'caseSauvegarde-' + idBase;
    div.innerHTML =
      '<input type="checkbox" id="check-' + idBase + '">' +
      '<label for="check-' + idBase + '">' +
        '<span class="case-sauvegarde-mot">' + motACocher.mot.toLowerCase() + '</span>' +
        ' : ' + motACocher.traduction +
      '</label>';
    elPile.appendChild(div);
    requestAnimationFrame(() => requestAnimationFrame(() => div.classList.add('in')));
    document.getElementById('check-' + idBase).addEventListener('change', function (e) {
      if (e.target.checked) {
        ajouterAuSac('mots', { mot: motACocher.mot, trad: motACocher.traduction });
      }
    });
  }

  function reveleSacADos() {
    document.getElementById('sacBouton').classList.add('revele');
  }

  // Construit le mot survolable/tapable (traduction dans la langue de
  // l'apprenant) pour un mot français dans la pile — mécanisme porté de
  // p02 (.vocab-mot / .vocab-tooltip). N'est utilisé QUE quand
  // ligne.francais est vrai ; jamais pour une ligne de Kloé.
  function construireTexteAvecVocab(ligne) {
    if (!ligne.francais) return ligne.texte;
    return '<span class="pile-mot-vocab" tabindex="0">' + ligne.texte +
      '<span class="pile-tooltip"><span class="pile-tooltip-qui">Kloé</span>' +
      ligne.traduction + '</span></span>';
  }

  // Rendu d'une ligne : la légende du haut (rattachée à l'image, une seule
  // réplique à la fois) et la pile du bas sont COMPLÉMENTAIRES, jamais
  // substituables (relecture de Raphaël — voir note en tête de fichier).
  // Toute ligne, quelle qu'elle soit, s'affiche d'abord en légende.
  // Seules les lignes réellement dites en français (ligne.francais) sont,
  // EN PLUS, ajoutées à la pile où elles restent accumulées pour toujours.
  function rendreLigne(def, ligne) {
    const cheminImage = ligne.img || def.img;
    if (!elScene.querySelector('img.image-scene, .repli-image-manquante') ||
        elScene.dataset.cheminImage !== cheminImage) {
      elScene.innerHTML = '';
      elScene.appendChild(creerImage(cheminImage));
      elScene.dataset.cheminImage = cheminImage;
    }
    // La légende vit dans son propre conteneur SOUS l'image (voir
    // .legende-zone) — toujours remplacée par la nouvelle réplique, qu'on
    // ait changé d'image ou non (avant cette correction, elle vivait dans
    // elScene et recouvrait les personnages — bug signalé par Raphaël).
    elLegendeZone.innerHTML = '';
    const legende = construireLegende(ligne);
    elLegendeZone.appendChild(legende);
    requestAnimationFrame(() => requestAnimationFrame(() => legende.classList.add('in')));

    if (ligne.francais && !reconstructionPileEnCours) {
      elPileConteneur.style.display = 'block';
      ajouterLigneVersPile(ligne);
    }
  }

  function ajouterLigneVersPile(ligne) {
    const div = document.createElement('div');
    div.className = 'pile-item' + (ligne.speaker ? ' ' + ligne.speaker : '');
    const avatar = ligne.speaker ? INITIALES[ligne.speaker] : '';
    const nom = ligne.speaker ? '<span class="pile-qui">' + NOMS[ligne.speaker] + '</span>' : '';
    div.innerHTML = '<div class="pile-avatar">' + avatar + '</div>' +
      '<div class="pile-corps">' + nom + '<div class="pile-texte">' + construireTexteAvecVocab(ligne) + '</div></div>';
    elPile.appendChild(div);
    requestAnimationFrame(() => requestAnimationFrame(() => div.classList.add('in')));
  }

  function rendreEtape() {
    const def = ETAPES[etape];
    elCompteur.textContent = (etape + 1) + ' / ' + ETAPES.length;

    const lignes = def.lignes || [{ speaker: def.speaker, img: def.img, texte: def.texte }];

    viderMinuteries();
    sousLigneVisible = Math.min(sousLigneVisible || 1, lignes.length);
    if (sousLigneVisible < 1) sousLigneVisible = 1;

    for (let i = 0; i < sousLigneVisible; i++) {
      rendreLigne(def, lignes[i]);
    }

    // programme l'apparition automatique des lignes suivantes de cette étape
    for (let i = sousLigneVisible; i < lignes.length; i++) {
      const delai = lignes[i].delai || 1000;
      const id = setTimeout(function () {
        sousLigneVisible++;
        rendreLigne(def, lignes[i]);
      }, delai * (i - sousLigneVisible + 1));
      minuteriesActives.push(id);
    }

    if (def.revealCase) afficherCaseSauvegarde(def.motACocher);
    if (def.revealSac) reveleSacADos();

    btnPrecedent.disabled = (etape === 0);
    btnSuivant.textContent = (etape === ETAPES.length - 1) ? 'Start the lesson ›' : 'Continue ›';
  }

  function suivant() {
    const def = ETAPES[etape];
    const lignes = def.lignes || [1];
    if (sousLigneVisible < lignes.length) {
      // encore des sous-répliques à révéler avant de changer d'étape :
      // le clic force l'apparition immédiate plutôt que d'attendre le délai
      viderMinuteries();
      sousLigneVisible++;
      rendreLigne(def, lignes[sousLigneVisible - 1]);
      return;
    }
    if (etape < ETAPES.length - 1) {
      etape++;
      sousLigneVisible = 1;
      rendreEtape();
    } else {
      console.log('Fin de l’introduction — passage à la première leçon, pas encore branché.');
    }
  }

  function precedent() {
    if (etape === 0) return;
    etape--;
    sousLigneVisible = (ETAPES[etape].lignes || [1]).length;
    // Reconstruit la pile depuis le début plutôt que de retirer juste le
    // dernier item : plus simple et sans risque d'incohérence avec les
    // reveal (case à cocher / sac) qui doivent eux aussi redisparaître
    // si on recule avant leur étape de déclenchement.
    elPile.innerHTML = '';
    elPileConteneur.style.display = 'none';
    document.getElementById('sacBouton').classList.remove('revele');
    reconstructionPileEnCours = true;
    for (let i = 0; i <= etape; i++) {
      const def = ETAPES[i];
      const lignes = def.lignes || [{ speaker: def.speaker, img: def.img, texte: def.texte }];
      const nb = (i === etape) ? sousLigneVisible : lignes.length;
      for (let j = 0; j < nb; j++) {
        if (lignes[j].francais) {
          elPileConteneur.style.display = 'block';
          ajouterLigneVersPile(lignes[j]);
        }
      }
      if (def.revealCase && nb === lignes.length) afficherCaseSauvegarde(def.motACocher);
      if (def.revealSac && nb === lignes.length) reveleSacADos();
    }
    // enlève l'animation d'entrée pour un rendu instantané (reconstruction)
    elPile.querySelectorAll('.pile-item, .case-sauvegarde').forEach(el => el.classList.add('in'));
    rendreEtape();
    reconstructionPileEnCours = false;
  }

  btnSuivant.addEventListener('click', suivant);
  btnPrecedent.addEventListener('click', precedent);

  // Mot français dans la pile — tap (mobile) ou survol (ordinateur, géré en
  // CSS) pour voir la traduction. Mécanisme porté de p02 (.vocab-mot),
  // avec fermeture des autres bulles ouvertes au clic ailleurs.
  elPile.addEventListener('click', function (e) {
    const mot = e.target.closest('.pile-mot-vocab');
    document.querySelectorAll('.pile-mot-vocab.active').forEach(function (m) {
      if (m !== mot) m.classList.remove('active');
    });
    if (mot) mot.classList.toggle('active');
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight' || e.key === 'Enter') suivant();
    if (e.key === 'ArrowLeft') precedent();
  });

  rendreEtape();

  // ═════════════════════════════════════════════
  //  Sac à dos — porté tel quel depuis index.html (mêmes ids, mêmes
  //  fonctions, même structure de données CLE_SAC). Le bouton "+ test
  //  item" du prototype original a été retiré ici : cette page a une
  //  vraie source d'ajout (la case à cocher "Salut"), donc pas besoin
  //  d'un bouton de test.
  // ═════════════════════════════════════════════

  const CLE_SAC = 'keb_bek_sac_a_dos';

  const CATEGORIES_SAC = [
    { id: 'mots',     nom: 'Words learned', icone: iconeSacLivre() },
    { id: 'codes',    nom: 'Codes',         icone: iconeSacCle() },
    { id: 'succes',   nom: 'Achievements',  icone: iconeSacEtoile() },
    { id: 'trophees', nom: 'Trophies',      icone: iconeSacTrophee() },
    { id: 'cartes',   nom: 'Cards',         icone: iconeSacCarte() }
  ];

  function sacParDefaut() {
    return { version: 1, mots: [], codes: [], succes: [], trophees: [], cartes: [] };
  }

  function chargerSac() {
    try {
      const brut = localStorage.getItem(CLE_SAC);
      if (!brut) return sacParDefaut();
      const objet = JSON.parse(brut);
      return Object.assign(sacParDefaut(), objet);
    } catch (e) {
      console.warn('Sac à dos illisible, réinitialisation.', e);
      return sacParDefaut();
    }
  }

  function sauvegarderSac(sac) {
    try {
      localStorage.setItem(CLE_SAC, JSON.stringify(sac));
    } catch (e) {
      console.warn('Impossible de sauvegarder le sac à dos.', e);
    }
  }

  function ajouterAuSac(categorie, item) {
    const sac = chargerSac();
    if (!sac[categorie]) sac[categorie] = [];
    const dejaLa = sac[categorie].some(i => (i.mot || i.code || i.titre || i.nom) === (item.mot || item.code || item.titre || item.nom));
    if (!dejaLa) {
      item.obtenu_le = item.obtenu_le || new Date().toISOString();
      sac[categorie].push(item);
      sauvegarderSac(sac);
    }
    rafraichirAffichageSac();
  }

  function compterToutSac(sac) {
    return CATEGORIES_SAC.reduce((total, cat) => total + (sac[cat.id] ? sac[cat.id].length : 0), 0);
  }

  function rafraichirAffichageSac() {
    const sac = chargerSac();
    const total = compterToutSac(sac);

    const badge = document.getElementById('sacBadge');
    badge.textContent = total;
    badge.classList.toggle('vide', total === 0);

    document.getElementById('sacSousTitre').textContent =
      total === 0 ? 'nothing yet' : (total === 1 ? '1 item saved' : total + ' items saved');

    const corps = document.getElementById('sacCorps');
    corps.innerHTML = '';

    CATEGORIES_SAC.forEach(cat => {
      const items = sac[cat.id] || [];
      const div = document.createElement('div');
      div.className = 'sac-categorie';
      div.innerHTML =
        '<div class="sac-cat-entete" onclick="toggleCategorieSac(this)">' +
          '<span class="sac-cat-icone">' + cat.icone + '</span>' +
          '<span>' + cat.nom + '</span>' +
          '<span class="sac-cat-compteur">' + items.length + '</span>' +
          '<span class="sac-cat-chevron">&#9660;</span>' +
        '</div>' +
        '<div class="sac-cat-liste">' +
          (items.length === 0
            ? '<div class="sac-vide">Nothing here yet.</div>'
            : items.map(i => '<div class="sac-item"><span class="sac-item-nom">' + (i.nom || i.mot || i.code || '—') + '</span><span class="sac-item-detail">' + (i.trad || i.description || i.titre || '') + '</span></div>').join('')
          ) +
        '</div>';
      corps.appendChild(div);
    });
  }

  function toggleCategorieSac(entete) {
    entete.parentElement.classList.toggle('repliee');
  }

  function toggleSacADos() {
    const bouton = document.getElementById('sacBouton');
    const panneau = document.getElementById('sacPanneau');
    const ouvert = panneau.classList.toggle('ouvert');
    bouton.classList.toggle('ouvert', ouvert);
  }

  document.addEventListener('click', (e) => {
    const bouton = document.getElementById('sacBouton');
    const panneau = document.getElementById('sacPanneau');
    if (panneau.classList.contains('ouvert') &&
        !panneau.contains(e.target) &&
        e.target !== bouton && !bouton.contains(e.target)) {
      panneau.classList.remove('ouvert');
      bouton.classList.remove('ouvert');
    }
  });
