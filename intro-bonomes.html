<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meet the Bonomes — Keb &amp; Bek</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Fuzzy+Bubbles:wght@400;700&family=Caveat+Brush&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sac-a-dos.css">
<!-- Page à part entière, même situation que parcours.html (voir
     COMPTES_ELEVES_v10/v11) : aucun état JS partagé avec index.html, donc
     son propre client Supabase — progression.js en crée un lui-même au
     premier appel qui en a besoin. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="progression.js"></script>
<style>
  /* ==================================================================
     intro-bonomes.html — reconstruction complète.

     PRINCIPE DIRECTEUR : ceci appartient à la famille visuelle
     "index.html / parcours.html" (voir BONOMES_v32, section Concepts
     fondamentaux) — Baloo 2 / Fuzzy Bubbles / Caveat Brush, palette
     --fond/--brun/--peche. La tentative précédente avait bêtement repris
     le style de zh_histoire_001_p02.html (Patrick Hand/Nunito, palette
     violette) au lieu d'adapter le MÉCANISME de p02 à l'HABILLAGE du
     nouveau site. Ici, seul le mécanisme est repris (voir .bulle-pile
     plus bas, structure/logique identique à p02) ; les couleurs et
     polices sont celles du site actuel, pas celles de p02.

     STRUCTURE NARRATIVE (voir le script fourni par Raphaël, 15 sections) :
     - CORRECTION IMPORTANTE (relecture de Raphaël) : la légende du haut
       (rattachée à l'image, une seule réplique à la fois) et la pile du
       bas (qui s'accumule, .pile-item, mécanisme réel de p02 .bulle-pile)
       sont COMPLÉMENTAIRES, jamais substituables l'une à l'autre. Chaque
       réplique, du début à la fin des 15 sections, s'affiche TOUJOURS en
       haut (légende, remplacée à chaque nouvelle réplique). En PLUS de ça,
       si (et seulement si) la réplique est effectivement dite en français
       (ligne.francais === true — en pratique : les deux "Salut !" de
       l'étape 11), elle est AUSSI ajoutée à la pile du bas, où elle reste
       accumulée pour toujours (jamais remplacée ni effacée en avançant).
       Les répliques de Kloé, et tout ce qui est dans la langue de
       l'apprenant, ne rejoignent JAMAIS la pile — cette zone sert
       exclusivement à revoir ce qui a été dit en français (voir champ
       "francais" sur chaque ligne dans ETAPES plus bas).
     - Chaque mot français dans la pile est survolable/tapable (mécanisme
       porté de .vocab-mot/.vocab-tooltip de p02, voir .pile-mot-vocab plus
       bas) : ça affiche une traduction dans la langue de l'apprenant,
       jamais un texte du genre "Save X to backpack" (ça, c'est la case à
       cocher séparée de l'étape 13, un mécanisme distinct).

     COULEURS PAR PERSONNAGE (proposition de Claude, à valider par
     Raphaël — aucune fiche personnage de Kloé n'existe encore pour
     confirmer une couleur officielle, voir BONOMES_v32) :
       --bek-couleur  : ambre chaud (référence à ses cheveux blonds)
       --keb-couleur  : bleu ardoise doux (contraste calme avec l'ambre)
       --kloe-couleur : var(--peche-fonce) (déjà la teinte d'accent
                        principale du site — cohérent avec son rôle de
                        guide/interface plutôt que personnage narratif)

     IMAGES : dossiers validés par Raphaël (v34+) — deux catégories,
     jamais mélangées :
       - images/prologue/  : images propres à cette leçon (étapes 1 à 8
         avec Bek et Keb seuls, MAIS AUSSI étapes 9 à 16 avec Kloé —
         CORRECTION (Raphaël, v38) : ces images-ci montrent Kloé aux
         côtés de Keb et Bek dans des scènes narratives précises et
         uniques à cette introduction ; ce ne sont PAS des images
         génériques réutilisables telles quelles ailleurs, donc
         PAS `images/recurrentes/` malgré le fait que Kloé y apparaisse.
         `images/recurrentes/` est réservé à de vraies images génériques,
         reprises identiques dans plusieurs leçons indépendamment du
         contexte narratif — pas juste "toute image où Kloé figure".
         Images utilisées, alternées selon le ton de la réplique (voir
         BONOMES_v40) :
           bonomes_keb_bek_kloe_salue_01.png        (elle salue, bras levé)
             → étape 9 seulement, la salutation initiale de Kloé.
           bonomes_keb_bek_kloe_invite_dire_02.png  (bras ouverts, invite
                                                       à parler)
             → étape 11, quand elle invite Keb et Bek à dire un mot —
               seule étape à utiliser cette image.
           bonomes_keb_bek_saluent_kloe_01.png      (Keb et Bek saluent,
                                                       Kloé mains jointes)
             → étape 12, le tout premier mot français ("Salut !", dit par
               Bek puis Keb) — seule étape à utiliser cette image.
           bonomes_keb_bek_kloe_explique_01.png     (pose plus posée)
             → étape 10 : image DÉFINITIVE, confirmée par Raphaël (v41) —
               ce n'est plus un placeholder pour cette étape précise,
               malgré l'intention initiale (v39) de lui donner une pose
               distincte (explique_02, abandonné).
           bonomes_keb_bek_pointent_kloe_explique_01.png (Keb et Bek
                                                       pointent, Kloé
                                                       explique)
             → étape 13 : image dédiée reçue et confirmée par Raphaël
               (v41) — remplace le placeholder explique_01 à cette étape
               (réf. réservée explique_04, abandonnée : Raphaël a fourni
               ce fichier sous son propre nom plutôt que suivre la
               convention explique_0X).
           bonomes_keb_bek_kloe_explique_01.png (pose plus posée, toujours
             en placeholder ici)
             → 🚧 PLACEHOLDER TEMPORAIRE restant aux étapes 14, 15 et 16
               seulement (v41 — 10 et 13 résolues, voir ci-dessus). Noms
               réservés en attendant (voir commentaire sur chaque étape
               dans ETAPES ci-dessous) :
                 étape 14 → bonomes_keb_bek_kloe_explique_05.png
                 étape 15 → bonomes_keb_bek_kloe_explique_06.png
                 étape 16 → bonomes_keb_bek_kloe_explique_07.png
               (les noms explique_02, explique_03 et explique_04,
               initialement réservés pour les étapes 10, 12 et 13, sont
               tous abandonnés — ces étapes ont chacune reçu une image
               différente ou ont été confirmées définitives, voir
               ci-dessus.) Ces numéros restent une réservation
               séquentielle de Claude, PAS confirmés par Raphaël quant à
               quelle pose ira à quelle étape précise. À chaque nouvelle
               image fournie, remplacer le placeholder explique_01
               correspondant dans ETAPES (repérer via le commentaire
               🚧 PLACEHOLDER sur l'étape concernée) et supprimer le
               commentaire une fois fait.
       - images/recurrentes/ : 🆕 plus vide — contient maintenant le
         portrait tournant de Kloé utilisé dans les infobulles de
         traduction (kloe_explique_01.png, une seule image à ce jour ;
         02, 03... à venir). Usage générique hors contexte narratif
         (médaillon d'interface), exactement le cas anticipé en v38/v42.
         Voir CLE_ROTATION_KLOE / prochaineImageKloeExplique() plus bas
         dans le script pour le mécanisme de rotation.
     Toutes les étapes (1 à 16) ont maintenant leur vraie image, fournies
     par Raphaël — plus aucun repli "image pas encore prête" actif dans
     cette introduction.

     PAS D'ENCADRÉ DERRIÈRE LES PERSONNAGES (relecture de Raphaël) : .scene-
     intro n'a plus de fond, de bordure ni d'ombre — ce n'est qu'un
     conteneur de positionnement pour l'image. L'image (fond beige uni
     #F2EDE3, comme le gabarit de génération des Bonomes dans BONOMES_v32)
     se retrouve donc directement sur le fond de la page, sans "boîte"
     visible autour. Le repli "image pas encore prête" suit la même
     logique : plus de bordure pointillée ni de fond teinté, juste un
     texte discret, pour ne jamais recréer un cadre le temps que les
     images manquantes arrivent.

     BUG CORRIGÉ (signalé par Raphaël, capture à l'appui) : la légende
     vivait auparavant DANS .scene-intro, en position absolute ancrée à
     "bottom: 6%" — donc littéralement par-dessus les personnages (visible
     dès l'étape 1). Elle vit désormais dans son propre conteneur,
     .legende-zone, sous l'image plutôt que dessus, alignée gauche/centre/
     droite via flexbox + marges auto plutôt que via un ancrage absolu
     dans un coin de l'image.
     ================================================================== */

  :root {
    --fond: #F2EDE3;
    --fond-carte: #FFFFFF;
    --brun: #665045;
    --brun-fonce: #4A3B33;
    --blonde: #F1DC99;
    --peche: #F0A98B;
    --peche-fonce: #E08867;
    --bek-couleur: #C97B3D;
    --keb-couleur: #5B7FA6;
    --kloe-couleur: #E08867;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: var(--fond);
  }

  body {
    font-family: 'Baloo 2', 'Noto Sans', sans-serif;
    color: var(--brun-fonce);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 60px;
  }

  /* ---------- Retour vers le parcours ---------- */
  /* Même look que .retour dans index.html/parcours.html — bouton manquant
     signalé par Raphaël : aucun moyen de sortir de la leçon avant cette
     correction. position: fixed (comme parcours.html, pas absolute comme
     index.html) puisque cette page peut défiler une fois la pile de
     répliques accumulée en bas. */
  .retour {
    position: fixed;
    top: 20px;
    left: 20px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #FFFFFF;
    color: var(--brun);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
    text-decoration: none;
    box-shadow: 0 2px 8px rgba(102, 80, 69, 0.15);
    opacity: 0.85;
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index: 20;
  }

  .retour:hover {
    opacity: 1;
    transform: scale(1.08);
  }

  /* ── Compteur d'étapes (texte simple plutôt que 15 points — trop de
       points serait visuellement chargé pour une séquence aussi longue) ── */
  .compteur-intro {
    font-family: 'Fuzzy Bubbles', cursive;
    font-weight: 700;
    font-size: 0.95rem;
    color: var(--brun);
    opacity: 0.75;
    margin-bottom: 14px;
    letter-spacing: 0.02em;
  }

  /* ── Scène : image + légende. Pas de carte/fond/ombre : les personnages
       doivent apparaître directement sur le fond de la page, sans encadré
       (relecture de Raphaël) — ce conteneur ne sert plus qu'à positionner
       la légende par-dessus l'image. ── */
  .scene-intro {
    position: relative;
    width: min(92vw, 640px);
    aspect-ratio: 1408 / 768;
    overflow: visible;
  }

  /* Estompe les bords de l'image dans le fond de la page plutôt que de
     laisser un contour rectangulaire net (signalé par Raphaël avec
     l'image de l'étape de ralliement, mais s'applique à toutes les
     images de cette introduction — même technique, même cause partout).
     Même si le fond des images est censé être le même beige uni que la
     page (#F2EDE3, voir gabarit de génération dans BONOMES_v32), une
     petite dérive de couleur suffit à trahir le contour sur une zone
     aussi large et unie. Un masque en dégradé radial, qui passe
     progressivement à la transparence sur les derniers ~15-20 % de
     chaque bord, laisse le vrai fond de la page prendre le relais en
     douceur — invisible pour l'œil — plutôt que de couper net. */
  .scene-intro img.image-scene {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    -webkit-mask-image: radial-gradient(ellipse 88% 82% at center, #000 68%, transparent 100%);
    mask-image: radial-gradient(ellipse 88% 82% at center, #000 68%, transparent 100%);
  }

  /* Repli "image pas encore prête" — texte discret, SANS bordure ni fond
     teinté (relecture de Raphaël : aucun encadré derrière les personnages,
     même à titre de repli temporaire). Ne remplace QUE l'image elle-même
     (bug déjà rencontré et corrigé dans une session précédente : un repli
     qui efface toute la zone efface aussi la légende qui vit dans le même
     conteneur). */
  .repli-image-manquante {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
    font-family: 'Fuzzy Bubbles', cursive;
    font-size: 0.95rem;
    color: var(--peche-fonce);
    opacity: 0.75;
  }

  /* ── Zone de légende : SOUS l'image, jamais par-dessus (bug signalé par
       Raphaël — le texte recouvrait les personnages quand la bulle était
       positionnée en absolute par-dessus la scène). L'alignement
       gauche/centre/droite selon le personnage se fait maintenant via
       flexbox + marges auto sur la bulle elle-même, plutôt que via une
       position absolute ancrée dans le coin de l'image. ── */
  .legende-zone {
    display: flex;
    width: min(92vw, 640px);
    margin-top: 16px;
    min-height: 30px;
  }

  /* ── Bulle de légende (sections 1 à 10) : une seule réplique, remplacée à
       chaque étape, jamais empilée. Même famille visuelle que .bulle-tuto
       déjà utilisée ailleurs sur le site, mais avec une couleur qui varie
       vraiment selon le personnage — .bulle-tuto ne le faisait pas (seule
       la position changeait), ce qui ne suffisait pas à ce que Raphaël
       demandait ici. ── */
  .legende-intro {
    max-width: 78%;
    font-family: 'Fuzzy Bubbles', cursive;
    font-weight: 700;
    font-size: clamp(1rem, 2.6vw, 1.4rem);
    line-height: 1.3;
    padding: 10px 18px;
    background: #FFFFFF;
    border-radius: 16px;
    box-shadow: 0 4px 14px rgba(102, 80, 69, 0.12);
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.3s ease, transform 0.3s ease;
  }

  .legende-intro.in { opacity: 1; transform: translateY(0); }

  .legende-intro.cote-keb {
    margin-right: auto;
    text-align: left;
    border: 2.5px solid var(--keb-couleur);
    color: var(--keb-couleur);
  }

  .legende-intro.cote-bek {
    margin-left: auto;
    text-align: right;
    border: 2.5px solid var(--bek-couleur);
    color: var(--bek-couleur);
  }

  .legende-intro.cote-kloe {
    margin-left: auto;
    margin-right: auto;
    text-align: center;
    border: 2.5px solid var(--kloe-couleur);
    color: var(--kloe-couleur);
  }

  .legende-intro.partagee {
    margin-left: auto;
    margin-right: auto;
    text-align: center;
    border: 2.5px solid var(--brun);
    color: var(--brun-fonce);
  }

  /* ── Pile de répliques (sections 11 à 15) — mécanisme identique à
       .bulle-pile de p02 (structure, logique d'accumulation, jamais
       effacée en avançant), simplement réhabillé avec les polices et
       couleurs du site actuel plutôt que celles de p02. ── */
  .pile-intro-conteneur {
    width: min(92vw, 640px);
    margin-top: 18px;
  }

  .pile-intro { display: flex; flex-direction: column; gap: 2px; }

  .pile-item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    opacity: 0;
    max-height: 0;
    overflow: hidden;
    transition: opacity 0.4s ease, max-height 0.4s ease, margin 0.4s ease;
  }

  .pile-item.in { opacity: 1; max-height: 160px; margin: 9px 0; overflow: visible; }

  .pile-avatar {
    flex-shrink: 0;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--c, var(--brun));
    color: #FFFFFF;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Fuzzy Bubbles', cursive;
    font-weight: 700;
    font-size: 15px;
  }

  .pile-corps {
    flex: 1;
    padding: 1px 0 1px 12px;
    border-left: 2.5px solid var(--c, var(--brun));
  }

  .pile-qui {
    display: block;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: 10.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--c, var(--brun));
    margin-bottom: 2px;
  }

  .pile-texte {
    font-family: 'Fuzzy Bubbles', cursive;
    font-size: 1.15rem;
    line-height: 1.3;
    color: var(--brun-fonce);
  }

  .pile-item.bek { --c: var(--bek-couleur); }
  .pile-item.keb { --c: var(--keb-couleur); }
  .pile-item.kloe { --c: var(--kloe-couleur); }

  /* ── Mot français survolable/tapable dans la pile — mécanisme porté de
       zh_histoire_001_p02.html (.vocab-mot / .vocab-tooltip), réhabillé
       avec les couleurs/polices du site actuel. Seuls les mots ayant
       réellement été dits en français (ligne.francais === true) sont
       encapsulés ainsi. Au survol (ordinateur) ou au tap (mobile, voir
       gestion du clic délégué dans le script), affiche une traduction
       dans la langue de l'apprenant — jamais "Save X to backpack", qui
       est un mécanisme séparé (la case à cocher de l'étape 13). ── */
  .pile-mot-vocab {
    position: relative;
    border-bottom: 2.5px dashed var(--peche-fonce);
    cursor: pointer;
  }

  .pile-tooltip {
    display: none;
    position: absolute;
    left: 0;
    top: 100%;
    margin-top: 9px;
    background: #FFFFFF;
    border: 2px solid var(--peche-fonce);
    border-radius: 14px;
    padding: 10px 14px;
    width: max-content;
    max-width: 260px;
    box-shadow: 0 8px 22px rgba(102, 80, 69, 0.18);
    z-index: 20;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 500;
    font-size: 0.85rem;
    line-height: 1.4;
    color: var(--brun-fonce);
    white-space: normal;
    /* 🆕 Portrait + texte côte à côte plutôt qu'empilés, pour que
       l'infobulle reste compacte même avec une explication plus longue. */
    align-items: flex-start;
    gap: 10px;
  }

  .pile-mot-vocab:hover .pile-tooltip,
  .pile-mot-vocab.active .pile-tooltip { display: flex; }

  /* 🆕 Portrait tournant de Kloé (demande de Raphaël) — médaillon rond,
     une image différente à chaque nouveau mot appris (voir
     prochaineImageKloeExplique). flex-shrink: 0 pour ne jamais se faire
     écraser par un texte d'explication plus long. */
  .pile-tooltip-portrait {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    object-fit: cover;
    flex-shrink: 0;
    border: 1.5px solid var(--peche);
  }

  .pile-tooltip-corps {
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  /* 🆕 Explication plus longue, optionnelle (emploi du mot, registre,
     contexte...) — n'apparaît que si ligne.explication est fourni, jamais
     inventée par Claude. Visuellement distincte de la traduction (plus
     petite, italique) pour ne pas laisser croire que c'est LA traduction. */
  .pile-tooltip-explication {
    display: block;
    font-size: 0.76rem;
    font-style: italic;
    color: var(--brun);
    opacity: 0.85;
    margin-top: 3px;
  }

  .pile-tooltip::before {
    content: "";
    position: absolute;
    bottom: 100%;
    left: 16px;
    border: 7px solid transparent;
    border-bottom-color: var(--peche-fonce);
  }

  .pile-tooltip-qui {
    display: block;
    font-family: 'Fuzzy Bubbles', cursive;
    font-weight: 700;
    font-size: 0.78rem;
    color: var(--peche-fonce);
    margin-bottom: 2px;
  }

  /* Case à cocher pour sauvegarder un mot appris (générique — voir
     motACocher dans ETAPES) : affiche "mot : traduction", jamais un
     texte du type "Save X to backpack" (relecture de Raphaël). */
  .case-sauvegarde {
    display: none;
    align-items: center;
    gap: 8px;
    margin: 6px 0 6px 48px;
    padding: 8px 14px;
    background: var(--fond);
    border: 1.5px dashed var(--peche);
    border-radius: 12px;
    font-family: 'Baloo 2', sans-serif;
    font-size: 0.85rem;
    color: var(--brun);
    width: fit-content;
    opacity: 0;
    transition: opacity 0.35s ease;
  }
  .case-sauvegarde.visible { display: flex; }
  .case-sauvegarde.in { opacity: 1; }
  .case-sauvegarde input { width: 16px; height: 16px; accent-color: var(--peche-fonce); cursor: pointer; }
  .case-sauvegarde label { cursor: pointer; }
  .case-sauvegarde-mot { font-weight: 800; color: var(--brun-fonce); }

  /* ── Navigation ── */
  .nav-intro {
    display: flex;
    gap: 14px;
    margin-top: 22px;
  }

  .bouton-nav-intro {
    border: none;
    border-radius: 100px;
    padding: 11px 26px;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 0.92rem;
    cursor: pointer;
    transition: opacity 0.15s ease, transform 0.15s ease;
  }

  .bouton-nav-intro.suivant { background: var(--peche-fonce); color: #FFFFFF; }
  .bouton-nav-intro.precedent { background: #FFFFFF; color: var(--brun); border: 1.5px solid var(--brun); }
  .bouton-nav-intro:hover { transform: translateY(-1px); }
  .bouton-nav-intro:disabled { opacity: 0.35; cursor: default; transform: none; }

  /* Structure/couleurs/comportement communs : voir sac-a-dos.css (fichier
     partagé, mêmes ids/classes que index.html/parcours.html). Ci-dessous,
     uniquement ce qui est propre à CETTE page : le sac démarre invisible
     et n'est révélé qu'au moment précis où Kloé le présente (étape 15/16,
     voir BONOMES_v36) — partout ailleurs sur le site, il est visible en
     permanence dès le chargement. */

  #sacBouton { opacity: 0; pointer-events: none; }

  /* Apparition du sac : démarre plus gros (échelle 1.9), puis rétrécit
     jusqu'à sa taille normale avec un léger rebond (cubic-bezier "back",
     même courbe que .rabat), enchaînée avec une pulsation. Demande
     explicite de Raphaël, effet fluide plutôt qu'un simple fondu.
     .revele (permanent) porte l'état final (visible, cliquable) ;
     .revele-anim (temporaire, retiré par JS à la fin de l'animation)
     porte l'animation elle-même — les séparer évite qu'un fill-mode
     "forwards" sur le transform ne bloque en permanence l'effet de
     survol/clic du bouton après l'apparition. */
  #sacBouton.revele { opacity: 1; pointer-events: auto; }

  #sacBouton.revele-anim {
    animation: apparitionSac 0.6s cubic-bezier(.34, 1.56, .64, 1),
               pulseSac 1.1s ease 0.6s 2;
  }

  @keyframes apparitionSac {
    from { transform: scale(1.9); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  @keyframes pulseSac {
    0%, 100% { box-shadow: 0 6px 18px rgba(102, 80, 69, 0.14); }
    50% { box-shadow: 0 6px 26px rgba(224, 136, 103, 0.55); }
  }


  @media (max-width: 560px) {
    .legende-intro { font-size: 0.92rem; max-width: 88%; }
    .pile-texte { font-size: 1rem; }
  }

  /* ==================================================================
     Étape finale (18) — transition pure. Demande explicite de Raphaël :
     à ce moment précis, plus RIEN sur la page à part l'image (pas le
     bouton retour, pas le compteur, pas la légende, pas le sac à dos,
     pas la nav) — et un mouvement énergique qui va avec "lever les bras
     comme un cri de ralliement", pas un simple fondu ou un lever discret.
     body.transition-pure bascule aussi en centrage vertical plein écran,
     puisque l'image est alors seule et n'a plus besoin de partager la
     page avec le reste empilé au-dessus/en dessous.
     ================================================================== */
  body.transition-pure {
    justify-content: center;
    min-height: 100vh;
  }

  body.transition-pure .retour,
  body.transition-pure #compteurIntro,
  body.transition-pure .legende-zone,
  body.transition-pure .pile-intro-conteneur,
  body.transition-pure .nav-intro,
  body.transition-pure #sacBouton,
  body.transition-pure #sacPanneau {
    display: none !important;
  }

  /* Éclatement énergique : démarre plus petite et plus bas (comme un élan
     pris avant le saut), remonte avec un net dépassement (110%) façon
     "bras qui se lancent vers le haut", puis se stabilise avec un petit
     rebond — beaucoup plus vif qu'un simple lever, pour épouser l'énergie
     du cri de ralliement illustré dans l'image elle-même. Enchaîne avec
     une légère pulsation pendant que l'image reste affichée, pour ne pas
     retomber "morte" une fois l'élan initial retombé. */
  .image-scene.image-ralliement {
    animation: ralliementBurst 0.6s cubic-bezier(.22, 1.6, .36, 1) both,
               ralliementPulse 0.9s ease-in-out 0.6s 2;
  }

  @keyframes ralliementBurst {
    0%   { opacity: 0; transform: scale(0.7) translateY(55px); }
    55%  { opacity: 1; transform: scale(1.1) translateY(-16px); }
    78%  { transform: scale(0.96) translateY(3px); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }

  @keyframes ralliementPulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.025); }
  }

  @media (prefers-reduced-motion: reduce) {
    .image-scene.image-ralliement { animation: none; }
  }
</style>

      // n a échoué : la série s'arrête à n - 1, déjà enregistré ci-dessus
      // par l'appel précédent (ou reste à 1 si même la 01 est introuvable,
      // ce qui ne devrait jamais arriver en pratique).
    };
    img.src = 'images/recurrentes/kloe_explique_' + String(n).padStart(2, '0') + '.png';
  })(1);

  function prochaineImageKloeExplique() {
    let index = 0;
    try {
      const brut = parseInt(localStorage.getItem(CLE_ROTATION_KLOE), 10);
      if (Number.isFinite(brut) && brut >= 0) index = brut;
    } catch (e) {
      index = 0; // localStorage indisponible : on repart de 01 sans planter
    }
    const numero = (index % totalKloeExplique) + 1; // cycle 1..N, jamais 0
    try {
      localStorage.setItem(CLE_ROTATION_KLOE, String(index + 1));
    } catch (e) {
      // Rotation non persistée d'une page à l'autre, mais l'affichage
      // courant fonctionne quand même (repli silencieux, comme ailleurs
      // dans ce fichier — voir sauvegarderSac dans sac-a-dos.js).
    }
    const numeroFormatte = String(numero).padStart(2, '0');
    return 'images/recurrentes/kloe_explique_' + numeroFormatte + '.png';
  }

  let etape = 0;               // index de l'étape courante (0-based)
  let sousLigneVisible = 0;    // combien de "lignes" de l'étape courante sont déjà affichées
  let minuteriesActives = [];  // pour pouvoir annuler les délais auto au "Précédent"
  // BUG CORRIGÉ (signalé par Raphaël — "d'autres sphères apparaissent" au
  // clic sur "Précédent") : precedent() reconstruit déjà la pile au complet
  // (boucle ci-dessous), mais appelait ensuite rendreEtape() → rendreLigne(),
  // qui réinjectait UNE DEUXIÈME FOIS les lignes françaises de l'étape
  // courante (rendreLigne ajoute aussi à la pile — voir sa définition).
  // Ce drapeau, actif pendant toute la reconstruction de precedent() (y
  // compris son appel à rendreEtape()), fait que rendreLigne saute l'ajout
  // à la pile puisque precedent() s'en est déjà chargé lui-même.
  let reconstructionPileEnCours = false;

  const elScene = document.getElementById('sceneIntro');
  const elLegendeZone = document.getElementById('legendeZone');
  const elPileConteneur = document.getElementById('pileConteneur');
  const elPile = document.getElementById('pileIntro');
  const elCompteur = document.getElementById('compteurIntro');
  const btnPrecedent = document.getElementById('btnPrecedentIntro');
  const btnSuivant = document.getElementById('btnSuivantIntro');

  function viderMinuteries() {
    minuteriesActives.forEach(id => clearTimeout(id));
    minuteriesActives = [];
  }

  function creerImage(cheminImage) {
    const wrapper = document.createElement('div');
    wrapper.style.position = 'absolute';
    wrapper.style.inset = '0';

    const img = document.createElement('img');
    img.className = 'image-scene';
    img.src = cheminImage;
    img.alt = 'Keb, Bek, and Kloé';
    img.onerror = function () {
      // Ne remplace QUE l'image, jamais le conteneur entier (voir note
      // en haut de fichier — bug déjà rencontré dans une session passée).
      const repli = document.createElement('div');
      repli.className = 'repli-image-manquante';
      repli.textContent = 'Image not ready yet';
      img.replaceWith(repli);
    };
    wrapper.appendChild(img);
    return wrapper;
  }

  function construireLegende(ligne) {
    const p = document.createElement('p');
    let classe = 'legende-intro';
    if (ligne.speaker === 'keb') classe += ' cote-keb';
    else if (ligne.speaker === 'bek') classe += ' cote-bek';
    else if (ligne.speaker === 'kloe') classe += ' cote-kloe';
    else classe += ' partagee';
    p.className = classe;
    p.textContent = ligne.texte;
    return p;
  }

  // Case à cocher pour sauvegarder un mot appris — l'affichage ne doit
  // JAMAIS dire "Save X to backpack" (relecture de Raphaël, deux fois
  // maintenant) : on voit le mot en minuscules, deux-points, puis la
  // traduction dans la langue de l'apprenant (et une explication au
  // besoin). Généralisée avec motACocher = { mot, traduction } plutôt que
  // codée en dur pour "Salut", pour rester réutilisable aux prochaines
  // leçons/mots sans retoucher cette fonction.
  function afficherCaseSauvegarde(motACocher) {
    const idBase = motACocher.mot.toLowerCase().replace(/\s+/g, '-');
    if (document.getElementById('caseSauvegarde-' + idBase)) return;
    const div = document.createElement('div');
    div.className = 'case-sauvegarde visible';
    div.id = 'caseSauvegarde-' + idBase;
    div.innerHTML =
      '<input type="checkbox" id="check-' + idBase + '">' +
      '<label for="check-' + idBase + '">' +
        '<span class="case-sauvegarde-mot">' + motACocher.mot.toLowerCase() + '</span>' +
        ' : ' + motACocher.traduction +
      '</label>';
    elPile.appendChild(div);
    requestAnimationFrame(() => requestAnimationFrame(() => div.classList.add('in')));
    document.getElementById('check-' + idBase).addEventListener('change', function (e) {
      if (e.target.checked) {
        ajouterAuSac('mots', { mot: motACocher.mot, trad: motACocher.traduction });
      }
    });
  }

  function reveleSacADos() {
    const bouton = document.getElementById('sacBouton');
    bouton.classList.add('revele');
    // .revele-anim ne porte que l'animation (voir CSS) — retirée une fois
    // les deux animations enchaînées terminées, pour laisser le survol/
    // clic normal du bouton reprendre le dessus ensuite. 'once: true' :
    // un seul retrait suffit, pas besoin de désabonner manuellement.
    bouton.classList.add('revele-anim');
    bouton.addEventListener('animationend', function retirerAnim(e) {
      if (e.animationName === 'pulseSac') {
        bouton.classList.remove('revele-anim');
        bouton.removeEventListener('animationend', retirerAnim);
      }
    });
  }

  // Construit le mot survolable/tapable (traduction dans la langue de
  // l'apprenant) pour un mot français dans la pile — mécanisme porté de
  // p02 (.vocab-mot / .vocab-tooltip). N'est utilisé QUE quand
  // ligne.francais est vrai ; jamais pour une ligne de Kloé.
  // 🆕 Portrait tournant de Kloé (demande de Raphaël) : une image par
  // infobulle, choisie UNE FOIS à la création de ce mot (pas recalculée à
  // chaque survol — voir prochaineImageKloeExplique ci-dessus).
  // 🆕 Champ optionnel ligne.explication : pour certains mots, une note
  // plus longue (emploi, registre, contexte...) en plus de la simple
  // traduction — absent tant que Raphaël n'a pas fourni ce texte pour un
  // mot donné, jamais inventé par Claude.
  function construireTexteAvecVocab(ligne) {
    if (!ligne.francais) return ligne.texte;
    const explication = ligne.explication
      ? '<span class="pile-tooltip-explication">' + ligne.explication + '</span>'
      : '';
    return '<span class="pile-mot-vocab" tabindex="0">' + ligne.texte +
      '<span class="pile-tooltip">' +
        '<img class="pile-tooltip-portrait" src="' + prochaineImageKloeExplique() + '" alt="Kloé" loading="lazy">' +
        '<span class="pile-tooltip-corps">' +
          '<span class="pile-tooltip-qui">Kloé</span>' +
          '<span class="pile-tooltip-traduction">' + ligne.traduction + '</span>' +
          explication +
        '</span>' +
      '</span></span>';
  }

  // Rendu d'une ligne : la légende du haut (rattachée à l'image, une seule
  // réplique à la fois) et la pile du bas sont COMPLÉMENTAIRES, jamais
  // substituables (relecture de Raphaël — voir note en tête de fichier).
  // Toute ligne, quelle qu'elle soit, s'affiche d'abord en légende.
  // Seules les lignes réellement dites en français (ligne.francais) sont,
  // EN PLUS, ajoutées à la pile où elles restent accumulées pour toujours.
  function rendreLigne(def, ligne) {
    const cheminImage = ligne.img || def.img;
    if (!elScene.querySelector('img.image-scene, .repli-image-manquante') ||
        elScene.dataset.cheminImage !== cheminImage) {
      elScene.innerHTML = '';
      elScene.appendChild(creerImage(cheminImage));
      elScene.dataset.cheminImage = cheminImage;
    }
    const imgActuelle = elScene.querySelector('img.image-scene');
    if (imgActuelle) imgActuelle.classList.toggle('image-ralliement', !!def.transitionPure);

    // La légende vit dans son propre conteneur SOUS l'image (voir
    // .legende-zone) — toujours remplacée par la nouvelle réplique, qu'on
    // ait changé d'image ou non (avant cette correction, elle vivait dans
    // elScene et recouvrait les personnages — bug signalé par Raphaël).
    elLegendeZone.innerHTML = '';
    const legende = construireLegende(ligne);
    elLegendeZone.appendChild(legende);
    requestAnimationFrame(() => requestAnimationFrame(() => legende.classList.add('in')));

    if (ligne.francais && !reconstructionPileEnCours) {
      elPileConteneur.style.display = 'block';
      ajouterLigneVersPile(ligne);
    }
  }

  function ajouterLigneVersPile(ligne) {
    const div = document.createElement('div');
    div.className = 'pile-item' + (ligne.speaker ? ' ' + ligne.speaker : '');
    const avatar = ligne.speaker ? INITIALES[ligne.speaker] : '';
    const nom = ligne.speaker ? '<span class="pile-qui">' + NOMS[ligne.speaker] + '</span>' : '';
    div.innerHTML = '<div class="pile-avatar">' + avatar + '</div>' +
      '<div class="pile-corps">' + nom + '<div class="pile-texte">' + construireTexteAvecVocab(ligne) + '</div></div>';
    elPile.appendChild(div);
    requestAnimationFrame(() => requestAnimationFrame(() => div.classList.add('in')));
  }

  function rendreEtape() {
    const def = ETAPES[etape];
    elCompteur.textContent = (etape + 1) + ' / ' + ETAPES.length;
    document.body.classList.toggle('transition-pure', !!def.transitionPure);

    const lignes = def.lignes || [{ speaker: def.speaker, img: def.img, texte: def.texte }];

    viderMinuteries();
    sousLigneVisible = Math.min(sousLigneVisible || 1, lignes.length);
    if (sousLigneVisible < 1) sousLigneVisible = 1;

    for (let i = 0; i < sousLigneVisible; i++) {
      rendreLigne(def, lignes[i]);
    }

    // programme l'apparition automatique des lignes suivantes de cette étape
    for (let i = sousLigneVisible; i < lignes.length; i++) {
      const delai = lignes[i].delai || 1000;
      const id = setTimeout(function () {
        sousLigneVisible++;
        rendreLigne(def, lignes[i]);
      }, delai * (i - sousLigneVisible + 1));
      minuteriesActives.push(id);
    }

    if (def.revealCase) afficherCaseSauvegarde(def.motACocher);
    if (def.revealSac) reveleSacADos();

    btnPrecedent.disabled = (etape === 0);
    btnSuivant.textContent = def.boutonTexte || ((etape === ETAPES.length - 1) ? 'Start the lesson ›' : 'Continue ›');

    // Étape 18 : rien à cliquer, tout est masqué (voir body.transition-pure
    // en CSS) — l'introduction se termine toute seule après le temps
    // laissé à l'animation de ralliement de se jouer pleinement. Le délai
    // est mis dans minuteriesActives comme les autres : si jamais l'étape
    // change entre-temps (ne devrait pas arriver ici, aucun bouton n'est
    // cliquable, mais robustesse plutôt que supposition), viderMinuteries()
    // l'annule proprement au prochain rendreEtape().
    if (def.transitionPure) {
      const id = setTimeout(() => { terminerIntroduction(); }, 2500);
      minuteriesActives.push(id);
    }
  }

  function suivant() {
    const def = ETAPES[etape];
    const lignes = def.lignes || [1];
    if (sousLigneVisible < lignes.length) {
      // encore des sous-répliques à révéler avant de changer d'étape :
      // le clic force l'apparition immédiate plutôt que d'attendre le délai
      viderMinuteries();
      sousLigneVisible++;
      rendreLigne(def, lignes[sousLigneVisible - 1]);
      return;
    }
    if (etape < ETAPES.length - 1) {
      etape++;
      sousLigneVisible = 1;
      rendreEtape();
    } else {
      terminerIntroduction();
    }
  }

  // Fin de l'introduction (COMPTES_ELEVES_v11) — jusqu'ici seulement un
  // console.log en attente de branchement. chapitre_id = 'prologue' :
  // reprend l'identifiant déjà utilisé pour cette section dans
  // parcours.html (voir son curseurNiveau === -1 ? 'prologue' : ...), pas
  // une invention nouvelle pour ce fichier. Aucune "première leçon" réelle
  // n'existe encore pour enchaîner dessus (voir COMPTES_ELEVES_v10) — donc
  // retour au parcours, comme le lien "‹" déjà présent sur cette page,
  // plutôt qu'une redirection vers une page qui n'existe pas encore.
  let introTerminee = false; // évite un double appel (minuteur auto de
                              // l'étape 18 + touche Entrée/flèche pressée
                              // juste avant qu'il ne se déclenche)

  async function terminerIntroduction() {
    if (introTerminee) return;
    introTerminee = true;
    btnSuivant.disabled = true;
    btnSuivant.textContent = 'Saving…';
    try {
      await KebBekProgression.marquerChapitreComplete('prologue');
    } catch (e) {
      console.warn('Impossible d\'enregistrer la fin du prologue.', e);
    }
    window.location.href = 'parcours.html';
  }

  function precedent() {
    if (etape === 0) return;
    etape--;
    sousLigneVisible = (ETAPES[etape].lignes || [1]).length;
    // Reconstruit la pile depuis le début plutôt que de retirer juste le
    // dernier item : plus simple et sans risque d'incohérence avec les
    // reveal (case à cocher / sac) qui doivent eux aussi redisparaître
    // si on recule avant leur étape de déclenchement.
    elPile.innerHTML = '';
    elPileConteneur.style.display = 'none';
    document.getElementById('sacBouton').classList.remove('revele', 'revele-anim');
    reconstructionPileEnCours = true;
    for (let i = 0; i <= etape; i++) {
      const def = ETAPES[i];
      const lignes = def.lignes || [{ speaker: def.speaker, img: def.img, texte: def.texte }];
      const nb = (i === etape) ? sousLigneVisible : lignes.length;
      for (let j = 0; j < nb; j++) {
        if (lignes[j].francais) {
          elPileConteneur.style.display = 'block';
          ajouterLigneVersPile(lignes[j]);
        }
      }
      if (def.revealCase && nb === lignes.length) afficherCaseSauvegarde(def.motACocher);
      if (def.revealSac && nb === lignes.length) reveleSacADos();
    }
    // enlève l'animation d'entrée pour un rendu instantané (reconstruction)
    elPile.querySelectorAll('.pile-item, .case-sauvegarde').forEach(el => el.classList.add('in'));
    rendreEtape();
    reconstructionPileEnCours = false;
  }

  btnSuivant.addEventListener('click', suivant);
  btnPrecedent.addEventListener('click', precedent);

  // Mot français dans la pile — tap (mobile) ou survol (ordinateur, géré en
  // CSS) pour voir la traduction. Mécanisme porté de p02 (.vocab-mot),
  // avec fermeture des autres bulles ouvertes au clic ailleurs.
  elPile.addEventListener('click', function (e) {
    const mot = e.target.closest('.pile-mot-vocab');
    document.querySelectorAll('.pile-mot-vocab.active').forEach(function (m) {
      if (m !== mot) m.classList.remove('active');
    });
    if (mot) mot.classList.toggle('active');
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight' || e.key === 'Enter') suivant();
    if (e.key === 'ArrowLeft') precedent();
  });

  document.documentElement.setAttribute('dir', langueActuelle() === 'fa' ? 'rtl' : 'ltr');
  rendreEtape();

  // Session/profil (COMPTES_ELEVES_v11) — même pattern et mêmes limites
  // que parcours.html (dernier profil connu, ou auto-sélection si le
  // compte n'a qu'un seul profil ; voir son commentaire pour le cas non
  // résolu des comptes à 2+ profils arrivant directement ici). Lancé en
  // parallèle, sans bloquer l'affichage de la leçon : marquerChapitreComplete
  // (voir terminerIntroduction plus haut) n'est appelé qu'à la toute fin,
  // largement après que cette initialisation ait eu le temps de terminer.
  async function initProgressionReelle() {
    await KebBekProgression.initSession();
    if (KebBekProgression.session) {
      const dernier = KebBekProgression.dernierProfilConnu();
      if (dernier) {
        KebBekProgression.profilActifId = dernier;
      } else {
        const profils = await KebBekProgression.profilsDuCompte();
        if (profils.length === 1) KebBekProgression.profilActifId = profils[0].id;
      }
    }
  }
  initProgressionReelle();

</script>

</body>
