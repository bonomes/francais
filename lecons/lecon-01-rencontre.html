<!-- Page à part entière, même situation que dialogues/d1/ et parcours.html :

     de index.html, ou depuis parcours.html une fois débloquée/verrouillée

     NIVEAUX). Vit À LA RACINE de lecons/ (un seul niveau sous la racine du
     site, PAS deux comme dialogues/d1/) — donc chemins relatifs en ../
     partout ci-dessous, jamais ../../. -->
<!-- ==================================================================
     🆕 (retour Raphaël, 21-08-2026) GUIDE DE RÉUTILISATION — pense-bête
     pour quiconque reprend CE fichier comme point de départ de
     lecon-02-*.html, lecon-03-*.html, etc. Trois catégories ci-dessous.
     Rien de tout ça n'est appliqué automatiquement — c'est un guide,
     pas un mécanisme : à chaque nouvelle leçon, relire cette liste et
     ajuster/retirer à la main ce qui ne s'applique pas.

     ✅ RÉUTILISABLE TEL QUEL (copier sans réfléchir) :
       - Les deux <link> ci-dessous (sac-a-dos.css, mot-tooltip.css) et
         les <script> en bas de page (progression.js, mot-tooltip.js) —
         infrastructure commune à toute leçon.
       - Le bouton .retour (coin supérieur gauche, mène à ../parcours.html).
       - Le patron .cadre-scene / .scene-image / .zone-bulle-overlay /
         .bulle-dialogue — bulle EN SUPERPOSITION sur l'image (jamais
         poussée), voir commentaire détaillé plus bas sur .cadre-scene.
       - Le patron .nav-bas / .nav-bouton (Précédent/Suivant + compteur).
       - langueActuelle() et la fonction creerImage() (repli gracieux
         "image pas encore prête" — le repli reste TOUJOURS silencieux/
         invisible dans une séquence plein écran type genèse, voir plus
         bas, mais s'affiche normalement dans le dialogue courant).
       - L'intégration mot-tooltip : window.KebBekMotTooltip.creerMotCliquable(texte, CHAPITRE_ID)
         pour chaque bulle de dialogue.
       - La convention de dossier images/lecons/ (UN SEUL dossier
         partagé pour toutes les leçons, PAS un sous-dossier par leçon —
         les noms de fichiers se préfixent par identifiant de leçon pour
         éviter les collisions, ex. lecon-01-rencontre_e1.webp).
       - #sceneLecon cité (visibility:hidden) tant qu'une intro n'est pas
         terminée, révélé ensuite via .revele — évite tout saut de mise
         en page au moment de la révélation.
       - 🆕 (retour Raphaël, 21-08-2026) Navigation clavier (flèches
         gauche/droite) + tap direct sur la scène (moitié gauche =
         précédent, moitié droite = suivant, voir precedent()/suivant()
         et l'écouteur sur .cadre-scene) — trois déclencheurs équivalents
         aux boutons, coupés ensemble via `navigationActive` une fois le
         dialogue terminé.
       - 🆕 (retour Raphaël, 21-08-2026) La pile "Ce qui a été dit" +
         notes grammaticales (#pilesConteneur, .pile-avatar, etc.) —
         repris de dialogues/d1/index.html, adapté au style de cette
         page. ajouterLigneDialogue()/ajouterNoteGrammaire() attendent
         un objet ETAPES[i] avec {speaker, texte, trad, grammaire?} —
         même format que d1. Pour une future leçon : copier NOMS/
         INITIALES (ajuster les couleurs --keb-couleur/--bek-couleur si
         de nouveaux personnages apparaissent) et les 4 clés INTERFACE
         (ceQuiAEteDit/aRetenir/afficherTrad/cacherTrad, déjà traduites
         dans les 20 langues du site). GRAMMAIRE reste à définir par
         leçon (voir plus bas, ETAPES/GRAMMAIRE) — vide pour l'instant
         dans r1.

     🔁 RÉUTILISABLE COMME PATRON, MAIS À RÉÉCRIRE LE CONTENU :
       - CHAPITRE_ID (ici 'r1') — un identifiant unique par leçon,
         doit correspondre à l'entrée du chapitre dans parcours.html.
       - ETAPES / INTERFACE — structure de données réutilisable (tableau
         d'étapes avec speaker/texte/img/trad, dictionnaire de textes
         d'interface par langue), mais CONTENU entièrement propre à
         chaque leçon.
       - La carte titre plein écran EN GÉNÉRAL (voir catégorie suivante
         pour le choix du mécanisme).

     🚫 SPÉCIFIQUE À CETTE LEÇON (r1), NE PAS COPIER TEL QUEL :
       - #introPleinEcran / GENESE / jouerGenese() — la séquence
         MUETTE, plein écran (titre sur fond beige → bref noir/vide →
         beige à nouveau pour l'illumination → Keb seul → Bek apparaît
         → ils se remarquent, voir le champ `fond` par étape dans
         GENESE) est la genèse DE L'UNIVERS DES BONOMES lui-même,
         propre à la toute première rencontre de Keb et Bek. Aucune
         autre leçon n'a de raison de la rejouer.
         → Pour une future leçon qui a simplement besoin d'une carte
         titre (SANS narration muette avant), utiliser plutôt le module
         partagé window.KebBekLeconIntro (voir ../lecon-intro.js/.css,
         volontairement NON chargés ici — voir juste en dessous). Il
         gère déjà tout seul : plein écran, entrée/sortie animées,
         tap-pour-passer. Fond actuellement beige (var(--fond)), pas
         noir — la version noire pleine écran ci-dessus reste propre à
         r1 tant qu'aucune autre leçon n'a besoin du même traitement.
       - Si une future leçon a SA PROPRE narration spéciale (différente
         de la genèse), le patron #introPleinEcran ci-dessous peut
         servir de modèle technique (calque fixed/inset:0/fond noir,
         tableau d'étapes avec durées, tap-pour-passer) — mais son
         CONTENU (le tableau GENESE) doit être entièrement réécrit, ce
         n'est jamais un simple copier-coller.
       - #etapePrenom / soumettrePrenom() — capture du PRÉNOM
         uniquement, spécifique à cette toute première leçon (le reste
         de l'identité — genre, âge, nationalité — est capté plus tard
         par d'autres leçons via exercices.js "choix_identite", pas par
         ce mécanisme ad hoc).
     ================================================================== -->

<style>
  :root {
    --fond: #F2EDE3;
    --brun: #665045;
    --brun-fonce: #4A3B33;
    --brun-clair: #8A7364;
    --peche: #F0A98B;
    --peche-fonce: #E08867;
    --peche-pale: rgba(240, 169, 139, 0.16);
    --peche-pale-vif: rgba(240, 169, 139, 0.30);
    --vert-clair: #EAF3DE;
    --ombre: rgba(102, 80, 69, 0.16);
    /* 🆕 (retour Raphaël, 21-08-2026) Couleurs Keb/Bek — mêmes valeurs
       que dialogues/d1/index.html (seule source jusqu'ici), reprises
       ici pour les avatars-cercles de la pile "Ce qui a été dit"
       (voir .pile-avatar plus bas). N'affectent PAS .bulle-dialogue :
       demande de Raphaël = adapter le mécanisme au style de CETTE
       page, pas importer tel quel la bulle bordée-colorée de d1. */
    --keb-couleur: #5B7FA6;
    --bek-couleur: #C97B3D;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--fond);
    font-family: 'Baloo 2', sans-serif;
    color: var(--brun-fonce);
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .retour {
    position: fixed;
    top: 14px;
    left: 14px;
    z-index: 300;
    width: 38px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: #FFFFFF;
    border: 1.5px solid var(--peche);
    color: var(--peche-fonce);
    font-size: 1.3rem;
    text-decoration: none;
    box-shadow: 2px 2px 8px var(--ombre);
  }

  /* ==================================================================
     Scène — contenu masqué (visibility:hidden, pas display:none : garde
     sa place dans la mise en page pour que rien ne saute une fois révélé)
     tant que la séquence plein écran (#introPleinEcran, carte titre +
     genèse) n'est pas terminée — voir demarrerLecon() en JS.
     ================================================================== */
  #sceneLecon {
    visibility: hidden;
    /* 🆕 (retour Raphaël, 21-08-2026) 640px → 1100px : le cadre restait
       petit même sur un grand écran d'ordinateur, où il y avait
       largement la place d'en profiter. 94vw inchangé pour le mobile
       (déjà fluide, pas concerné par ce plafond). */
    width: min(94vw, 1100px);
    margin: 64px auto 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }
  #sceneLecon.revele { visibility: visible; }

  /* ==================================================================
     🆕 Bulle EN SUPERPOSITION sur l'image (demande de Raphaël, session du
     20-08-2026) : contrairement à dialogue-d1.html (bulle avant l'image
     dans le flux normal, donc pousse l'image quand le texte passe à 2
     lignes), ici .zone-bulle-overlay est en position absolute PAR-DESSUS
     .scene-image — un cadre à hauteur fixe (aspect-ratio ci-dessous),
     jamais déplacé par la bulle, qui peut chevaucher son bas sans
     jamais rien pousser. Images aussi plus grandes qu'avant (voir
     largeur du conteneur, min(94vw, 640px) contre ~500px sur d1). */
  /* ==================================================================
     🆕 (retour Raphaël, session du 21-08-2026) Intro PLEIN ÉCRAN — carte
     titre + genèse muette ne jouent PLUS dans .cadre-scene (le petit
     cadre boxé du dialogue, largeur min(94vw,640px)) : c'était le bug
     signalé — seul cet encadré passait au noir, jamais l'écran entier,
     et ça restait visuellement "encastré" dans la structure habituelle
     d'une leçon (boutons, compteur...) au lieu d'être une séquence à
     part. #introPleinEcran est un calque fixed, inset:0, indépendant de
     tout le reste de la page (#sceneLecon reste caché — visibility:
     hidden, voir plus haut — tant que cette séquence n'est pas
     terminée). z-index sous .retour (300) : la flèche de sortie reste
     cliquable même pendant la genèse, un enfant doit toujours pouvoir
     quitter. object-fit: contain (pas cover) : les scènes de la genèse
     ne sont pas forcément pensées pour un cadrage bord-à-bord sur
     n'importe quel écran ; le "letterboxing" naturel (sur le fond de
     l'étape en cours — beige la plupart du temps, noir seulement pour
     le vide juste après la carte titre, voir .intro-noir plus bas)
     évite tout rognage imprévisible des personnages. */
  .intro-plein-ecran {
    position: fixed;
    inset: 0;
    z-index: 200;
    /* 🆕 (retour Raphaël, 21-08-2026) Fond beige (var(--fond), le fond
       habituel du site) par défaut, PAS noir : la carte titre
       (l1_titre_01.webp) a été extraite avec Gimp et ses bords
       ressortent pixelisés/frangés sur un fond noir. Le noir n'arrive
       qu'ENSUITE, une seule étape (le "vide" juste après la carte
       titre, voir GENESE plus bas, pas: null), via .intro-noir —
       ajoutée/retirée dynamiquement par jouerGenese() selon le champ
       `fond` de chaque étape. Le retour au beige à ce moment-là (juste
       avant l'illumination) EST l'effet recherché : le fond "apparaît"
       pour simuler la genèse du monde, puis reste beige pour de bon
       (illumination, Keb, Bek, et ensuite tout le dialogue habituel —
       jamais de retour au noir après ce point). background-color
       transitionne comme opacity pour que ce passage noir → beige soit
       un fondu, pas un saut brusque. */
    background: var(--fond);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: opacity 0.6s ease, background-color 1s ease;
  }
  .intro-plein-ecran.intro-noir { background: #000000; }
  .intro-plein-ecran.intro-cachee {
    opacity: 0;
    pointer-events: none;
  }
  .intro-image {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.6s ease;
  }
  .intro-image img { width: 100%; height: 100%; object-fit: contain; }
  /* Même intention que l'ancien .scene-image-genese : une image pas
     encore prête doit rester un noir sobre, jamais un message d'erreur
     qui casserait l'ambiance de la genèse. */
  .intro-image .scene-image-repli { display: none; }

  /* ==================================================================
     🆕 (retour Raphaël, 22-08-2026) Écran de choix du personnage —
     "achat" à 0 P$/0 PB, à usage unique (voir choisir_personnage_initial
     côté Supabase et ecranChoixPersonnage() en JS). Demande explicite :
     disposition "digne des meilleurs sites du monde", pas d'impression
     d'amateurisme — cartes surélevées, ombre profonde, dégradé subtil,
     jamais un simple bouton texte.
     ================================================================== */
  .ecran-choix-personnage {
    position: absolute;
    inset: 0;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(24px, 5vh, 44px);
    padding: 24px;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.6s ease, transform 0.6s ease;
    pointer-events: none;
  }
  .ecran-choix-personnage.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }
  .choix-titre {
    font-family: 'Baloo 2', sans-serif;
    font-size: clamp(1.05rem, 2.6vw, 1.55rem);
    font-weight: 700;
    color: #FDFBF7;
    text-align: center;
    letter-spacing: 0.01em;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
  }
  .choix-cartes {
    display: flex;
    gap: clamp(20px, 4vw, 52px);
    flex-wrap: wrap;
    justify-content: center;
  }
  .choix-carte {
    all: unset;
    box-sizing: border-box;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    width: min(40vw, 210px);
    padding: 22px 16px 18px;
    background: linear-gradient(180deg, #FFFFFF 0%, var(--fond) 100%);
    border-radius: 26px;
    border: 2.5px solid transparent;
    box-shadow: 0 16px 36px rgba(0, 0, 0, 0.38), 0 2px 0 rgba(255, 255, 255, 0.5) inset;
    transition: transform 0.22s cubic-bezier(.2,.8,.3,1.2), box-shadow 0.22s ease, border-color 0.22s ease;
  }
  .choix-carte:hover, .choix-carte:focus-visible {
    transform: translateY(-6px) scale(1.035);
    border-color: var(--peche-fonce);
    box-shadow: 0 22px 46px rgba(0, 0, 0, 0.42), 0 2px 0 rgba(255, 255, 255, 0.5) inset;
  }
  .choix-carte:active { transform: translateY(-2px) scale(1.01); }
  /* Carte non retenue pendant l'appel réseau (voir ecranChoixPersonnage()
     en JS) — jamais un simple disabled visuel plat : on baisse
     l'opacité pour signaler "en cours", sans faire disparaître la carte. */
  .choix-carte.choix-en-cours { opacity: 0.5; pointer-events: none; }
  .choix-carte-image { width: 100%; aspect-ratio: 3 / 4; display: flex; align-items: center; justify-content: center; }
  .choix-carte-image img { width: 100%; height: 100%; object-fit: contain; }
  .choix-carte-nom { font-size: 1.18rem; font-weight: 700; color: var(--brun-fonce); }
  .choix-carte-prix {
    font-size: 0.76rem;
    font-weight: 700;
    color: var(--peche-fonce);
    background: var(--peche-pale);
    border-radius: 999px;
    padding: 4px 14px;
  }

  /* Flash blanc bref au moment où le personnage choisi "apparaît" —
     rejoué à chaque fois via un retrait/ajout de .jouer (reflow forcé,
     voir reveilPersonnage() en JS), jamais une simple transition CSS
     qui ne se rejouerait pas d'une leçon à l'autre. */
  .flash-apparition {
    position: absolute;
    inset: 0;
    z-index: 3;
    background: #FFFFFF;
    opacity: 0;
    pointer-events: none;
  }
  .flash-apparition.jouer { animation: flashApparition 0.7s ease-out; }
  @keyframes flashApparition {
    0% { opacity: 0; }
    12% { opacity: 0.92; }
    100% { opacity: 0; }
  }
  /* Le personnage vient de naître, ne comprend pas encore où il est —
     un léger balancement, jamais une secousse comique. */
  .perso-deboussole { animation: persoDeboussole 2.6s ease-in-out infinite; }
  @keyframes persoDeboussole {
    0%, 100% { transform: rotate(0deg) translateY(0); }
    25% { transform: rotate(-1.4deg) translateY(-2px); }
    75% { transform: rotate(1.4deg) translateY(-2px); }
  }

  /* 🆕 (correctif, session du 22-08-2026) .intro-image en 100%×100% du
     calque plein écran convenait à la carte titre et au vide (des
     compositions pensées pour tout l'écran), mais un PORTRAIT de
     personnage (Keb/Bek seul, canevas haut et étroit) s'y étirait
     jusqu'à toucher le haut ET le bas du viewport — géant, débordant.
     .intro-image-personnage plafonne sa taille à un gabarit de
     personnage raisonnable ; .intro-plein-ecran (flex, centré) le
     centre normalement dans l'espace restant. Appliquée/retirée par
     genererPersonnage()/reveilPersonnage()/personnageDesoriente() —
     jamais sur la carte titre ni le vide. */
  .intro-image.intro-image-personnage {
    width: min(58vw, 320px);
    height: min(62vh, 440px);
  }

  /* 🆕 Matérialisation du personnage (keb_généré_01/bek_générée_01, déjà
     scintillant/translucide par nature) — un souffle doux plutôt qu'un
     simple fade-in, pour vendre l'idée qu'il est en train de se former
     plutôt que de simplement apparaître tel quel. */
  .perso-generation { animation: persoGeneration 1.8s ease-in-out infinite; }
  @keyframes persoGeneration {
    0%, 100% { opacity: 0.82; transform: scale(0.985); }
    50%      { opacity: 1;    transform: scale(1); }
  }

  @media (prefers-reduced-motion: reduce) {
    .perso-generation, .perso-deboussole { animation: none; }
  }


  .main-salue {
    all: unset;
    box-sizing: border-box;
    position: absolute;
    z-index: 4;
    left: 50%;
    bottom: 12%;
    transform: translateX(-50%);
    width: min(24vw, 128px);
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease;
  }
  .main-salue.visible { opacity: 1; pointer-events: auto; }
  .main-salue-inner {
    display: block;
    animation: mainSalueOndulation 1.3s ease-in-out infinite;
    transition: transform 0.15s ease;
    transform-origin: 70% 85%;
  }
  .main-salue:hover .main-salue-inner,
  .main-salue:focus-visible .main-salue-inner { transform: scale(1.1); }
  .main-salue img { width: 100%; display: block; }
  @keyframes mainSalueOndulation {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(-14deg); }
  }

  .cadre-scene {
    position: relative;
    width: 100%;
    aspect-ratio: 1408 / 768;
    border-radius: 22px;
    overflow: hidden;
    background: #FFFFFF;
    box-shadow: 4px 4px 18px var(--ombre);
    /* 🆕 (retour Raphaël, 21-08-2026) Toute la scène est cliquable pour
       naviguer (moitié gauche = précédent, moitié droite = suivant —
       voir le JS plus bas) : le curseur le signale, même si le geste
       principal reste tactile sur mobile. */
    cursor: pointer;
  }

  .scene-image {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    /* 🆕 (retour Raphaël, 21-08-2026) Beige (var(--fond)), plus noir : le
       noir n'a plus lieu d'être ici — la genèse plein écran (seule
       séquence qui en avait besoin) joue désormais entièrement dans
       #introPleinEcran, plus haut. Un cadre de dialogue en attente
       d'image (ou son repli "Image not ready yet") doit rester dans le
       même univers visuel beige que le reste de la page, jamais un
       grand rectangle noir. */
    background: var(--fond);
    transition: opacity 0.6s ease;
  }
  .scene-image img { width: 100%; height: 100%; object-fit: cover; }
  .scene-image-repli {
    font-size: 0.85rem;
    color: var(--brun-clair);
    text-align: center;
    padding: 0 24px;
  }

  #navDialogue,
  .zone-bulle-overlay,
  .piles-conteneur {
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease;
  }
  #navDialogue.genese-terminee,
  .zone-bulle-overlay.genese-terminee,
  .piles-conteneur.genese-terminee { opacity: 1; pointer-events: auto; }
  .zone-bulle-overlay.genese-terminee .bulle-dialogue { pointer-events: auto; }

  .zone-bulle-overlay {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    padding: 0 16px 16px;
    pointer-events: none; /* laisse les clics traverser vers l'image en dehors de la bulle elle-même */
  }
  .zone-bulle-overlay .bulle-dialogue { pointer-events: auto; }

  .bulle-dialogue {
    max-width: 88%;
    background: rgba(255, 255, 255, 0.94);
    backdrop-filter: blur(2px);
    border-radius: 18px;
    padding: 12px 18px;
    font-size: 1.05rem;
    line-height: 1.4;
    box-shadow: 0 6px 20px rgba(74, 59, 51, 0.18);
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.25s ease, transform 0.25s cubic-bezier(.2,.8,.3,1.2);
  }
  .bulle-dialogue.in { opacity: 1; transform: translateY(0); }
  .bulle-dialogue.cote-bek { margin-left: auto; }
  .bulle-dialogue.cote-question { margin: 0 auto; text-align: center; font-weight: 700; }

  .nav-bas {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    gap: 12px;
  }
  .nav-bouton {
    font-family: inherit;
    font-weight: 700;
    font-size: 0.95rem;
    padding: 10px 22px;
    border-radius: 999px;
    border: 1.5px solid var(--peche);
    background: #FFFFFF;
    color: var(--brun-fonce);
    cursor: pointer;
    box-shadow: 0 3px 0 0 var(--peche), 2px 3px 8px var(--ombre);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .nav-bouton:hover { transform: translateY(-1px); }
  .nav-bouton:active { transform: translateY(3px); box-shadow: 0 0 0 0 var(--peche), 1px 1px 4px var(--ombre); }
  .nav-bouton:disabled { opacity: 0.4; cursor: default; box-shadow: none; transform: none; }
  .nav-bouton-suivant { background: var(--peche-fonce); border-color: var(--peche-fonce); color: #FFFFFF; box-shadow: 0 3px 0 0 var(--brun-fonce), 2px 3px 8px var(--ombre); }
  .nav-bouton-suivant:active { box-shadow: 0 0 0 0 var(--brun-fonce), 1px 1px 4px var(--ombre); }
  #compteur { font-size: 0.85rem; color: var(--brun-clair); font-weight: 700; }

  /* ---------- Étape prénom ---------- */
  #etapePrenom {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    width: 100%;
  }
  .champ-prenom {
    font-family: inherit;
    font-size: 1.1rem;
    text-align: center;
    padding: 12px 20px;
    border-radius: 999px;
    border: 1.5px solid var(--peche);
    width: min(80%, 320px);
  }
  .champ-prenom:focus { outline: 2px solid var(--peche-fonce); outline-offset: 2px; }

  /* ---------- Panneaux de réponse (saisie libre / oui-non / niveau) ----------
     🆕 (retour Raphaël, 22-08-2026) Remplacent #navDialogue le temps
     d'une étape qui attend une vraie réponse plutôt qu'un "Suivant" —
     voir rendreEtape() en JS. Cachés par défaut (display:none inline,
     posé directement dans le HTML) : c'est rendreEtape() qui bascule
     entre les quatre panneaux (#navDialogue, #reponseLibre,
     #reponseBinaire, #reponseNiveau) selon le type de l'étape courante. */
  .zone-reponse {
    display: flex;
    gap: 12px;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    width: 100%;
  }
  .zone-reponse-niveau { gap: 10px; }
  .bouton-choix {
    font-family: inherit;
    font-size: 0.92rem;
    font-weight: 700;
    color: var(--brun-fonce);
    background: #FFFFFF;
    border: 1.5px solid var(--peche);
    border-radius: 999px;
    padding: 10px 20px;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease, color 0.15s ease;
  }
  .bouton-choix:hover { background: var(--peche-pale); }
  .bouton-choix:active { background: var(--peche-fonce); border-color: var(--peche-fonce); color: #FFFFFF; transform: translateY(1px); }

  /* ---------- Étape finale ---------- */
  #etapeFin {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    width: 100%;
    text-align: center;
  }
  .message-fin { font-size: 1.15rem; font-weight: 700; }

  /* ==================================================================
     🆕 (retour Raphaël, 21-08-2026) Pile "Ce qui a été dit" + notes
     grammaticales — repris de dialogues/d1/index.html (seul endroit du
     site où ce mécanisme existait), demande explicite de Raphaël de ne
     PAS l'enlever, adapté au langage visuel de CETTE page (cadre plus
     large, palette identique, pas de bordure colorée sur les bulles —
     seuls les avatars-cercles portent la couleur du personnage).
     Même stratégie de reconstruction que d1 : à chaque Précédent, les
     deux piles sont vidées et reconstruites de 0 à l'étape courante
     plutôt que de retirer seulement le dernier élément (voir
     precedent() en JS) — plus simple, jamais de désynchronisation
     entre les deux piles.
     ================================================================== */
  .piles-conteneur {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .pile-entete {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin: 0 0 2px 4px;
  }
  .pile-section-titre {
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--brun-clair);
    margin: 0;
  }
  .btn-toggle-trad {
    flex-shrink: 0;
    border: 1.5px solid var(--peche);
    background: #FFFFFF;
    color: var(--brun-clair);
    border-radius: 999px;
    padding: 4px 12px;
    font-family: inherit;
    font-size: 0.7rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .btn-toggle-trad:hover { background: var(--peche-pale); }
  .btn-toggle-trad.actif { background: var(--peche-fonce); border-color: var(--peche-fonce); color: #FFFFFF; }

  .pile-dialogue { display: flex; flex-direction: column; }
  .pile-item {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    max-height: 0;
    opacity: 0;
    overflow: hidden;
    transition: max-height 0.3s ease, opacity 0.3s ease, margin 0.3s ease;
  }
  .pile-item.in { opacity: 1; max-height: 220px; margin: 7px 0; overflow: visible; }

  /* 🆕 C'est CE cercle — initiale du personnage qui parle (K/B), fond
     coloré selon --keb-couleur/--bek-couleur — que Raphaël appelle le
     "mécanisme de cercles avec l'acronyme du prénom". Cliquable : bascule
     la traduction de CETTE réplique seule, en plus du bouton global. */
  .pile-avatar {
    flex-shrink: 0;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.72rem;
    font-weight: 700;
    color: #FFFFFF;
    background: var(--c, var(--brun));
    cursor: pointer;
    border: none;
    padding: 0;
    font-family: inherit;
    transition: transform 0.15s ease;
  }
  .pile-avatar:hover { transform: scale(1.08); }
  .pile-item.keb { --c: var(--keb-couleur); }
  .pile-item.bek { --c: var(--bek-couleur); }
  /* La dernière étape de la démo ('Et toi, comment tu t'appelles\u00A0?')
     s'adresse directement à l'élève, ni Keb ni Bek — cercle neutre. */
  .pile-item.question { --c: var(--brun-clair); }

  .pile-corps { flex: 1; min-width: 0; }
  .pile-qui { display: block; font-size: 0.68rem; font-weight: 700; color: var(--c, var(--brun)); margin-bottom: 1px; }
  .pile-texte { font-size: 0.92rem; line-height: 1.35; cursor: pointer; }
  .pile-trad {
    font-size: 0.82rem;
    line-height: 1.3;
    color: var(--peche-fonce);
    font-style: italic;
    max-height: 0;
    opacity: 0;
    overflow: hidden;
    transition: max-height 0.25s ease, opacity 0.25s ease, margin 0.25s ease;
  }
  .pile-trad.visible { max-height: 80px; opacity: 1; margin-top: 3px; }

  /* Notes grammaticales — même langage visuel qu'un contenu d'aide
     ponctuel ailleurs sur le site (fond pêche-pâle) : jamais confondu
     avec une réplique du dialogue. Caché par défaut (#blocGrammaire),
     révélé seulement si l'étape courante porte un champ `grammaire`
     (voir ajouterNoteGrammaire() en JS) — aucune étape de CETTE leçon
     n'en a pour l'instant, le mécanisme reste prêt pour le jour où
     Raphaël en ajoutera (ex. « je m'appelle », « comment »...). */
  #blocGrammaire { display: none; }
  .pile-grammaire { display: flex; flex-direction: column; gap: 8px; }
  .grammaire-item {
    max-height: 0;
    opacity: 0;
    overflow: hidden;
    padding: 0 14px;
    background: var(--peche-pale);
    border-radius: 12px;
    font-size: 0.84rem;
    line-height: 1.45;
    color: var(--brun-fonce);
    transition: max-height 0.3s ease, opacity 0.3s ease, padding 0.3s ease;
  }
  .grammaire-item.in { opacity: 1; max-height: 160px; padding: 10px 14px; overflow: visible; }

  @media (max-width: 460px) {
    .bulle-dialogue { font-size: 0.95rem; padding: 10px 14px; }
    .nav-bouton { padding: 9px 16px; font-size: 0.88rem; }
  }
</style>

(function () {

  // Même clé que sac-a-dos.js/menu-principal.js/dialogue-d1.html — un

    try { return localStorage.getItem('kebbek_langue') || 'en'; } catch (e) { return 'en'; }

  // 🆕 (demande de Raphaël, 20-08-2026 ; restructuré 21-08-2026 ; réduit

  // 🆕 (retour Raphaël, 22-08-2026) Dialogue reconstruit en profondeur :

  // seul personnage qu'il vient de faire apparaître (voir
  // #ecranChoixPersonnage/personnageChoisi). D'où ETAPES en `let`,
  // construite par etapesDialogue() une fois personnageChoisi connu

  // Chaque étape porte un `type` qui détermine à la fois ce qui

  const NIVEAUX = [
    { id: 'nul', fr: 'Nul / débutant', en: 'None / beginner', es: 'Nulo / principiante', it: 'Nullo / principiante', pt: 'Nulo / iniciante', ca: 'Nul / principiant', eo: 'Nula / komencanto', zh: '零基础/初学', ja: 'ゼロ／初心者', ko: '전혀 없음/초급', vi: 'Không biết / mới bắt đầu', ht: 'Okenn / debutan', tl: 'Wala / baguhan', id: 'Nol / pemula', nl: 'Geen / beginner', de: 'Keine / Anfänger', fa: 'هیچ / مبتدی', sv: 'Ingen / nybörjare', no: 'Ingen / nybegynner', ru: 'Нет / начинающий' },
    { id: 'mauvais', fr: 'Mauvais', en: 'Poor', es: 'Malo', it: 'Scarso', pt: 'Fraco', ca: 'Dolent', eo: 'Malbona', zh: '较差', ja: '苦手', ko: '나쁨', vi: 'Kém', ht: 'Fèb', tl: 'Mahina', id: 'Buruk', nl: 'Zwak', de: 'Schwach', fa: 'ضعیف', sv: 'Dålig', no: 'Dårlig', ru: 'Слабый' },
    { id: 'bon', fr: 'Bon', en: 'Good', es: 'Bueno', it: 'Buono', pt: 'Bom', ca: 'Bo', eo: 'Bona', zh: '不错', ja: '良い', ko: '좋음', vi: 'Khá', ht: 'Bon', tl: 'Mabuti', id: 'Bagus', nl: 'Goed', de: 'Gut', fa: 'خوب', sv: 'Bra', no: 'Bra', ru: 'Хороший' },
    { id: 'tres_bon', fr: 'Très bon', en: 'Very good', es: 'Muy bueno', it: 'Molto buono', pt: 'Muito bom', ca: 'Molt bo', eo: 'Tre bona', zh: '很好', ja: 'とても良い', ko: '매우 좋음', vi: 'Rất tốt', ht: 'Trè bon', tl: 'Napakahusay', id: 'Sangat bagus', nl: 'Heel goed', de: 'Sehr gut', fa: 'خیلی خوب', sv: 'Mycket bra', no: 'Veldig bra', ru: 'Очень хороший' },
    { id: 'excellent', fr: 'Excellent', en: 'Excellent', es: 'Excelente', it: 'Eccellente', pt: 'Excelente', ca: 'Excel·lent', eo: 'Elstara', zh: '优秀', ja: '優秀', ko: '뛰어남', vi: 'Xuất sắc', ht: 'Ekselan', tl: 'Napakahusay talaga', id: 'Sangat baik', nl: 'Uitstekend', de: 'Exzellent', fa: 'عالی', sv: 'Utmärkt', no: 'Utmerket', ru: 'Отличный' },
    { id: 'natif', fr: 'Locuteur natif', en: 'Native speaker', es: 'Hablante nativo', it: 'Madrelingua', pt: 'Falante nativo', ca: 'Parlant natiu', eo: 'Denaska parolanto', zh: '母语者', ja: 'ネイティブ', ko: '원어민', vi: 'Người bản ngữ', ht: 'Lokitè natif', tl: 'Katutubong nagsasalita', id: 'Penutur asli', nl: 'Moedertaalspreker', de: 'Muttersprachler', fa: 'زبان مادری', sv: 'Modersmålstalare', no: 'Morsmålsbruker', ru: 'Носитель языка' }
  ];

  // Construit ETAPES une fois personnageChoisi connu (voir plus bas,

  function etapesDialogue() {
    const perso = personnageChoisi === 'Bek' ? 'bek' : 'keb';
    const nomPerso = personnageChoisi || 'Keb';
    return [
      { type: 'texte', speaker: perso, texte: "Bonjour !",

  function creerImage(nomFichier) {
    const conteneur = document.createElement('div');
    const img = new Image();
    img.onload = function () { conteneur.appendChild(img); };
    img.onerror = function () {
      const repli = document.createElement('div');
      repli.className = 'scene-image-repli';
      repli.textContent = 'Image not ready yet (' + nomFichier + ')';
      conteneur.appendChild(repli);
    };
    img.src = '../images/lecons/' + nomFichier;
    img.alt = '';
    return conteneur;
  }

    avatar.type = 'button';
    avatar.className = 'pile-avatar';
    avatar.setAttribute('aria-label', texteInterface('afficherTrad'));
    avatar.textContent = INITIALES[def.speaker] || '?';
    const corps = document.createElement('div');
    corps.className = 'pile-corps';
    if (NOMS[def.speaker]) {
      const qui = document.createElement('span');
      qui.className = 'pile-qui';
      qui.textContent = NOMS[def.speaker];
      corps.appendChild(qui);
    }
    const texte = document.createElement('div');
    texte.className = 'pile-texte';
    texte.textContent = def.texte;
    corps.appendChild(texte);
    let elTrad = null;
    if (trad) {
      elTrad = document.createElement('div');
      elTrad.className = 'pile-trad';
      elTrad.textContent = trad;
      if (traductionsVisiblesParDefaut) elTrad.classList.add('visible');
      corps.appendChild(elTrad);
    }
    div.appendChild(avatar);
    div.appendChild(corps);
    if (elTrad) {
      const bascule = () => elTrad.classList.toggle('visible');
      avatar.addEventListener('click', bascule);
      texte.addEventListener('click', bascule);
    }
    elPileDialogue.appendChild(div);
    requestAnimationFrame(() => requestAnimationFrame(() => div.classList.add('in')));
  }

  // 🆕 Mécanisme PRÊT (voir .grammaire-item en CSS), mais aucune étape de
  // CETTE leçon ne porte encore de champ `grammaire` — blocGrammaire
  // reste donc caché tant qu'aucune note n'y est ajoutée. Même patron
  // que dialogues/d1/index.html pour qu'une future leçon puisse
  // réutiliser ETAPES[i].grammaire = 'uneCle' sans rien changer ici.
  function ajouterNoteGrammaire(def) {
    if (!def.grammaire) return;
    blocGrammaire.style.display = 'block';
    const cles = Array.isArray(def.grammaire) ? def.grammaire : [def.grammaire];
    cles.forEach(function (cle) {
      const texteBrut = (typeof GRAMMAIRE !== 'undefined' && GRAMMAIRE[cle])
        ? (GRAMMAIRE[cle][langueActuelle()] || GRAMMAIRE[cle].fr)
        : null;
      if (!texteBrut) return;
      const div = document.createElement('div');
      div.className = 'grammaire-item';
      div.textContent = texteBrut;
      elPileGrammaire.appendChild(div);
      requestAnimationFrame(() => requestAnimationFrame(() => div.classList.add('in')));
    });
  }

  btnToggleTraductions.addEventListener('click', function () {
    traductionsVisiblesParDefaut = !traductionsVisiblesParDefaut;
    btnToggleTraductions.classList.toggle('actif', traductionsVisiblesParDefaut);
    btnToggleTraductions.setAttribute('aria-pressed', String(traductionsVisiblesParDefaut));
    txtToggleTraductions.textContent = texteInterface(traductionsVisiblesParDefaut ? 'cacherTrad' : 'afficherTrad');
    elPileDialogue.querySelectorAll('.pile-trad').forEach(function (el) {
      el.classList.toggle('visible', traductionsVisiblesParDefaut);
    });
  });

  function attendre(ms) {
    return new Promise(function (resolve) { setTimeout(resolve, ms); });
  }

  // Tap n'importe où sur l'écran pendant la genèse = passer directement
  // à la rencontre — un élève qui revoit la leçon n'a pas à revivre
  // toute la genèse (carte titre incluse) à chaque fois. 🆕 (retour
  // Raphaël, 22-08-2026) Ne saute plus QUE la genèse : si l'écran de
  // choix ou le réveil du personnage sont en cours, ils écoutent
  // eux-mêmes ce même indicateur pour s'interrompre proprement (voir
  // ecranChoixPersonnage()/reveilPersonnage()/attendreSalutMain()) —
  // jamais un simple "passer" qui laisserait un écran de choix à moitié
  // construit derrière lui.
  let genesePassee = false;
  function passerGenese() { genesePassee = true; }

  async function jouerGenese(liste) {
    const reduireMouvement = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    elIntroPleinEcran.addEventListener('click', passerGenese);
    for (let i = 0; i < liste.length && !genesePassee; i++) {
      const pas = liste[i];
      // 🆕 Bascule le fond (beige/noir) AVANT le fondu de l'image, pour
      // que le passage noir → beige (l'"apparition" du monde) et
      // l'arrivée de l'image d'illumination se fondent ensemble plutôt
      // que de se suivre sèchement.
      elIntroPleinEcran.classList.toggle('intro-noir', pas.fond === 'noir');
      elIntroImage.style.opacity = '0';
      await attendre(reduireMouvement ? 20 : 250);
      elIntroImage.innerHTML = '';
      if (pas.img) elIntroImage.appendChild(creerImage(pas.img));
      elIntroImage.style.opacity = '1';
      await attendre(reduireMouvement ? 40 : pas.duree);
    }
    elIntroPleinEcran.removeEventListener('click', passerGenese);
  }

  // ==================================================================
  // 🆕 (retour Raphaël, 22-08-2026) Écran de choix, réveil du
  // personnage, main qui salue — les trois étapes interactives entre la
  // genèse (titre + noir, ci-dessus) et le vrai dialogue (rendreEtape(),
  // plus bas). Chacune retourne une Promise résolue quand l'élève a agi
  // (choisi une carte / cliqué la main), pour s'enchaîner simplement
  // avec des `await` dans demarrerLecon() plutôt que de dupliquer la
  // logique de callback trois fois.
  // ==================================================================

  // Choix du personnage — appelle choisir_personnage_initial() côté
  // Supabase (voir progression.js). 'bloque_autre_deja_choisi' ne
  // devrait normalement JAMAIS survenir ici (c'est justement le tout
  // premier écran de la toute première visite) — le seul cas où ça
  // pourrait arriver est un rejeu improbable après un signet partagé ;
  // par prudence, on n'insiste pas et on repart avec le personnage déjà
  // possédé plutôt que de laisser choisir une seconde fois gratuitement.
  function ecranChoixPersonnage() {
    return new Promise(function (resolve) {
      document.getElementById('choixImageKeb').appendChild(creerImage('keb_neutre_01.webp'));
      document.getElementById('choixImageBek').appendChild(creerImage('bek_neutre_01.webp'));
      document.getElementById('choixPersonnageTitre').textContent = texteInterface('choixPersonnage');
      elEcranChoix.querySelectorAll('.choix-carte-prix').forEach(function (el) { el.textContent = texteInterface('prixChoixInitial'); });
      elEcranChoix.classList.add('visible');

      const cartes = elEcranChoix.querySelectorAll('.choix-carte');
      function surClic(e) {
        const carte = e.currentTarget;
        const personnage = carte.dataset.personnage;
        cartes.forEach(function (c) { c.classList.add('choix-en-cours'); });

        const promesse = window.KebBekProgression
          ? window.KebBekProgression.choisirPersonnageInitial(personnage)
          : Promise.resolve('nouveau');

        promesse
          .then(function (resultat) {
            personnageChoisi = (resultat === 'bloque_autre_deja_choisi')
              ? (personnage === 'Keb' ? 'Bek' : 'Keb')
              : personnage;
          })
          .catch(function (err) {
            console.warn('lecon-01-rencontre.html : choisirPersonnageInitial a échoué.', err);
            personnageChoisi = personnage; // jamais bloquer l'histoire pour un souci réseau
          })
          .then(function () {
            elEcranChoix.classList.remove('visible');
            resolve();
          });
      }
      cartes.forEach(function (c) { c.addEventListener('click', surClic, { once: true }); });
    });
  }

  // Réveil : fond noir → beige (la genèse "s'achève" pour de bon ici),
  // 🆕 matérialisation (image scintillante keb_généré/bek_générée, voir
  // .perso-generation), flash blanc — le personnage "se solidifie" —
  // puis apparition de la version nette (neutre), léger balancement
  // désorienté (.perso-deboussole) pendant une pause SANS texte — le
  // personnage ne parle pas encore, il découvre juste qu'il existe.
  async function reveilPersonnage() {
    const reduireMouvement = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    elIntroPleinEcran.classList.remove('intro-noir');
    await attendre(reduireMouvement ? 20 : 500);

    // 🆕 Matérialisation — voir imagePersonnageGenere()/.perso-generation.
    elIntroImage.classList.add('intro-image-personnage');
    elIntroImage.innerHTML = '';
    elIntroImage.appendChild(creerImage(imagePersonnageGenere()));
    elIntroImage.style.opacity = '1';
    elIntroImage.classList.add('perso-generation');
    await attendre(reduireMouvement ? 30 : 1800);
    elIntroImage.classList.remove('perso-generation');

    elFlashApparition.classList.remove('jouer');
    void elFlashApparition.offsetWidth; // force le reflow pour pouvoir rejouer l'animation d'une leçon à l'autre
    elFlashApparition.classList.add('jouer');
    elIntroImage.innerHTML = '';
    elIntroImage.appendChild(creerImage(imagePersonnageActuel()));
    elIntroImage.classList.add('perso-deboussole');
    await attendre(reduireMouvement ? 30 : 1400);
  }

  // 🆕 (demande de Raphaël, 22-08-2026) Le personnage se découvre
  // "numérique" — étonné de sa propre texture — puis cherche son ami
  // (Keb appelle Bek ou l'inverse) et n'obtient AUCUNE réponse : lui
  // seul a été généré cette fois-ci. C'est précisément ce silence qui
  // motive la main qui suit (attendreSalutMain()) — quelqu'un d'autre
  // (l'élève) lui fait signe puisque son ami ne répond pas. Purement
  // visuel, comme le reste de la genèse : aucun texte ici non plus.
  async function personnageDesoriente() {
    const reduireMouvement = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    elIntroImage.classList.remove('perso-deboussole');
    elIntroImage.innerHTML = '';
    elIntroImage.appendChild(creerImage(imagePersonnageConfus()));
    await attendre(reduireMouvement ? 30 : 1700);
    elIntroImage.innerHTML = '';
    elIntroImage.appendChild(creerImage(imagePersonnageInterpelle()));
    await attendre(reduireMouvement ? 30 : 1700);
  }

  // Main qui salue — cliquable, ondule doucement pour signaler qu'elle
  // attend un geste. Le clic MIME notre salut ; c'est ce qui fait que
  // le personnage nous "voit" et lance sa première réplique.
  function attendreSalutMain() {
    return new Promise(function (resolve) {
      document.getElementById('imageMainSalue').appendChild(creerImage('main-neutre_salue_01.webp'));
      elBtnMainSalue.classList.add('visible');
      elBtnMainSalue.addEventListener('click', function surClic() {
        elBtnMainSalue.removeEventListener('click', surClic);
        elBtnMainSalue.classList.remove('visible');
        elIntroImage.classList.remove('perso-deboussole');
        resolve();
      }, { once: true });
    });
  }

  let etape = 0;
  // 🆕 Même stratégie que precedent() dans dialogues/d1/index.html :
  // reconstruit les deux piles depuis le début plutôt que de retirer
  // juste le dernier élément — plus simple, aucun risque de
  // désynchronisation entre pile-dialogue et pile-grammaire.
  let reconstructionEnCours = false;

  // 🆕 (retour Raphaël, 22-08-2026) Reconstruite pour distinguer QUATRE
  // panneaux possibles (texte/saisie libre/binaire/niveau/prénom) au
  // lieu d'un seul #navDialogue — un seul visible à la fois, déterminé
  // par ETAPES[etape].type. La bulle-dialogue, elle, n'est mise à jour
  // QUE pour les étapes 'texte' : elle reste affichée telle quelle
  // pendant une étape de réponse (l'élève répond à la question qu'il
  // vient de lire, elle ne doit pas disparaître entre-temps).
  function rendreEtape() {
    const def = ETAPES[etape];
    elCompteur.textContent = (etape + 1) + ' / ' + ETAPES.length;
    btnPrecedent.disabled = !ETAPES.slice(0, etape).some(etapeApplicable);

    elScene.innerHTML = '';
    elScene.appendChild(creerImage(def.img || imagePersonnageActuel()));

    navDialogue.style.display = (def.type === 'texte') ? 'flex' : 'none';
    elReponseLibre.style.display = (def.type === 'saisie_libre') ? 'flex' : 'none';
    elReponseBinaire.style.display = (def.type === 'binaire') ? 'flex' : 'none';
    elReponseNiveau.style.display = (def.type === 'niveau') ? 'flex' : 'none';
    elEtapePrenom.style.display = (def.type === 'prenom') ? 'flex' : 'none';

    if (def.type === 'texte') {
      elBulle.classList.remove('in');
      elBulle.className = 'bulle-dialogue cote-' + def.speaker;
      window.KebBekMotTooltip.fermer();
      elBulle.innerHTML = '';
      elBulle.appendChild(window.KebBekMotTooltip.creerMotCliquable(def.texte, CHAPITRE_ID));
      requestAnimationFrame(() => requestAnimationFrame(() => elBulle.classList.add('in')));
      if (!reconstructionEnCours) {
        ajouterLigneDialogue(def);
        ajouterNoteGrammaire(def);
      }
    } else if (def.type === 'saisie_libre') {
      elChampReponseLibre.value = '';
      setTimeout(function () { elChampReponseLibre.focus(); }, 50);
    } else if (def.type === 'prenom') {
      document.getElementById('champPrenom').value = '';
      document.getElementById('champPrenom').placeholder = texteInterface('placeholderPrenom');
      setTimeout(function () { document.getElementById('champPrenom').focus(); }, 50);
    }
  }

  // 🆕 (retour Raphaël, 21-08-2026 ; adaptée 22-08-2026 pour sauter les
  // étapes dont `condition(reponses)` est fausse — ex. la question du
  // niveau si l'élève a répondu "non" à "Tu parles français ?") —
  // fonctions nommées pour rester réutilisables par TROIS déclencheurs
  // équivalents : les boutons, les flèches clavier gauche/droite, et le
  // tap direct sur la scène. `navigationActive` coupe les trois à la
  // toute fin du dialogue — au-delà, ‹/› et le tap sur l'écran n'ont
  // plus de sens.
  let navigationActive = true;

  function precedent() {
    if (!navigationActive) return;
    let i = etape - 1;
    while (i >= 0 && !etapeApplicable(ETAPES[i])) i -= 1;
    if (i < 0) return;
    etape = i;
    elPileDialogue.innerHTML = '';
    elPileGrammaire.innerHTML = '';
    blocGrammaire.style.display = 'none';
    reconstructionEnCours = true;
    for (let j = 0; j <= etape; j++) {
      if (ETAPES[j].type === 'texte' && etapeApplicable(ETAPES[j])) {
        ajouterLigneDialogue(ETAPES[j]);
        ajouterNoteGrammaire(ETAPES[j]);
      }
    }
    elPileDialogue.querySelectorAll('.pile-item').forEach(el => el.classList.add('in'));
    elPileGrammaire.querySelectorAll('.grammaire-item').forEach(el => el.classList.add('in'));
    rendreEtape();
    reconstructionEnCours = false;
  }

  function suivant() {
    if (!navigationActive) return;
    let i = etape + 1;
    while (i < ETAPES.length && !etapeApplicable(ETAPES[i])) i += 1;
    if (i < ETAPES.length) {
      etape = i;
      rendreEtape();
      return;
    }
    terminerConversation();
  }

  // Fin du dialogue (dernière étape 'texte' passée) — plus d'écran
  // final séparé à part #etapeFin : le prénom, lui, a déjà été capturé
  // EN COURS de conversation (étape 'prenom'), pas ici.
  function terminerConversation() {
    window.KebBekMotTooltip.fermer();
    navigationActive = false;
    navDialogue.style.display = 'none';
    elReponseLibre.style.display = 'none';
    elReponseBinaire.style.display = 'none';
    elReponseNiveau.style.display = 'none';
    elEtapeFin.style.display = 'flex';
    document.getElementById('messageFin').textContent = texteInterface('messageFin').replace('{prenom}', reponses.prenom || '');
    document.getElementById('btnTerminerLecon').textContent = texteInterface('terminer');
  }

  btnPrecedent.addEventListener('click', precedent);
  btnSuivant.addEventListener('click', suivant);

  // 🆕 Validation de la réponse libre ("Bonjour !") — reconnue ou non,
  // ça n'empêche JAMAIS d'avancer (voir SALUTATIONS_RECONNUES plus
  // haut) : l'important est que l'élève ait répondu, pas qu'il ait
  // deviné la bonne formule.
  // 🆕 Reconnaissance de la salutation — n'a AUCUN effet sur la
  // progression (voir commentaire de SALUTATIONS_RECONNUES plus haut) ;
  // seulement conservée dans `reponses` pour une future variante de
  // réplique ("Ah, tu m'as dit bonjour !" par ex.), pas exploitée pour
  // l'instant.
  function reponseSalutationReconnue(valeur) {
    const v = normaliserTexte(valeur);
    return SALUTATIONS_RECONNUES.some(function (m) { return v === m || v.indexOf(m) !== -1; });
  }

  function validerReponseLibre() {
    const def = ETAPES[etape];
    const valeur = elChampReponseLibre.value.trim();
    if (!valeur) { elChampReponseLibre.focus(); return; }
    reponses[def.cle_reponse] = valeur;
    reponses.salutationReconnue = reponseSalutationReconnue(valeur);
    suivant();
  }
  document.getElementById('btnValiderReponseLibre').addEventListener('click', validerReponseLibre);
  elChampReponseLibre.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); validerReponseLibre(); }
  });

  // 🆕 Oui/Non — répondre fait directement avancer, pas de bouton
  // "Continuer" séparé en plus (cohérent avec saisie_libre/niveau).
  elReponseBinaire.querySelectorAll('.bouton-choix').forEach(function (btn) {
    btn.addEventListener('click', function () {
      const def = ETAPES[etape];
      reponses[def.cle_reponse] = btn.dataset.valeur;
      suivant();
    });
  });

  // 🆕 Les 6 boutons de niveau sont construits une seule fois (la langue
  // ne change pas en cours de leçon), pas régénérés à chaque rendu.
  function construireBoutonsNiveau() {
    elReponseNiveau.innerHTML = '';
    NIVEAUX.forEach(function (niv) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'bouton-choix';
      btn.textContent = niv[langueActuelle()] || niv.fr;
      btn.addEventListener('click', function () {
        const def = ETAPES[etape];
        reponses[def.cle_reponse] = niv.id;
        suivant();
      });
      elReponseNiveau.appendChild(btn);
    });
  }

  document.querySelectorAll('#reponseBinaire .bouton-choix').forEach(function (btn, i) {
    btn.textContent = (OUI_NON[langueActuelle()] || OUI_NON.en)[i];
  });

  // 🆕 Navigation clavier (flèches gauche/droite) — ignorée si le focus
  // est dans un champ de saisie (le champ prénom ou la réponse libre,
  // qui gèrent déjà leurs propres touches) pour ne jamais voler une
  // frappe de texte.
  document.addEventListener('keydown', function (e) {
    const cible = e.target;
    const dansChampSaisie = cible && (cible.tagName === 'INPUT' || cible.tagName === 'TEXTAREA' || cible.isContentEditable);
    if (dansChampSaisie) return;
    if (e.key === 'ArrowLeft') { e.preventDefault(); precedent(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); suivant(); }
  });

  // 🆕 Tap/clic direct sur la scène (le personnage) — demande de
  // Raphaël, mêmes règles que dans dialogue-d1.html à l'origine : la
  // moitié GAUCHE de l'image fait reculer, la moitié DROITE fait
  // avancer, pour que le geste imite naturellement un livre qu'on
  // feuillette. Un clic sur un MOT de la bulle (traduction, voir
  // mot-tooltip.js) ne doit JAMAIS déclencher cette navigation — d'où
  // l'exclusion .closest('.bulle-dialogue') tout en haut. Sans effet
  // pendant une étape de réponse (saisie_libre/binaire/niveau/prénom) :
  // répondre EST déjà le geste qui fait avancer, un tap sur l'image à
  // côté ne doit pas resauter une étape par-dessus.
  const elCadreScene = document.querySelector('.cadre-scene');
  elCadreScene.addEventListener('click', function (e) {
    if (e.target.closest('.bulle-dialogue')) return;
    if (!navigationActive) return;
    if (ETAPES[etape] && ETAPES[etape].type !== 'texte') return;
    const rect = elCadreScene.getBoundingClientRect();
    const x = e.clientX - rect.left;
    if (x < rect.width / 2) precedent();
    else suivant();
  });

  document.getElementById('titrePileDialogue').textContent = texteInterface('ceQuiAEteDit');
  document.getElementById('titrePileGrammaire').textContent = texteInterface('aRetenir');
  txtToggleTraductions.textContent = texteInterface('afficherTrad');

  // 🆕 (retour Raphaël, 22-08-2026) Ne saute plus vers #etapeFin
  // directement : le prénom est désormais capturé EN COURS de
  // conversation (voir etapesDialogue(), type 'prenom'), donc valider
  // le prénom fait juste avancer d'une étape comme n'importe quelle
  // autre réponse — c'est suivant() qui décide s'il reste des étapes ou
  // s'il faut terminerConversation().
  function soumettrePrenom() {
    const champ = document.getElementById('champPrenom');
    const prenom = champ.value.trim();
    if (!prenom) { champ.focus(); return; }
    reponses.prenom = prenom;

    if (window.KebBekProgression) {
      window.KebBekProgression
        .enregistrerIdentite(undefined, undefined, prenom, undefined)
        .catch(function (e) { console.warn('lecon-01-rencontre.html : échec de l\u2019enregistrement du prénom.', e); });
    } else {
      console.warn('KebBekProgression indisponible — prénom non enregistré.', prenom);
    }

    suivant();
  }

  document.getElementById('btnValiderPrenom').addEventListener('click', soumettrePrenom);
  document.getElementById('champPrenom').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); soumettrePrenom(); }
  });

  document.getElementById('btnTerminerLecon').addEventListener('click', async function (e) {
    e.target.disabled = true;
    if (window.KebBekProgression) {
      try { await window.KebBekProgression.marquerChapitreComplete(CHAPITRE_ID); }
      catch (err) { console.warn('lecon-01-rencontre.html : échec de marquerChapitreComplete.', err); }
    }
    window.location.href = '../parcours.html';
  });

  btnPrecedent.textContent = '‹ ' + texteInterface('precedent');

  // ---------- Démarrage ----------
  // 🆕 (retour Raphaël, 22-08-2026) Restructuré autour du choix du
  // personnage : SI l'élève a déjà fait ce choix par le passé (rejeu de
  // la leçon — voir lirePersonnageChoisi()), on saute directement toute
  // la genèse ET l'écran d'achat, jamais réaffiché une seconde fois à
  // qui a déjà un personnage. Sinon, déroulement complet : titre + noir
  // (jouerGenese) → écran de choix (ecranChoixPersonnage, "achat" à
  // 0 P$/0 PB) → réveil du personnage choisi (reveilPersonnage) → main
  // qui salue (attendreSalutMain) → dialogue (rendreEtape, construit
  // par etapesDialogue() maintenant que personnageChoisi est connu).
  async function demarrerLecon() {
    const dejaChoisi = window.KebBekProgression
      ? await window.KebBekProgression.lirePersonnageChoisi().catch(function () { return null; })
      : null;

    if (dejaChoisi) {
      personnageChoisi = dejaChoisi;
    } else {
      await jouerGenese(GENESE_AVANT);
      if (!genesePassee) {
        await ecranChoixPersonnage();
        await reveilPersonnage();
        await personnageDesoriente();
        await attendreSalutMain();
      } else {
        // Genèse sautée en cours de route (tap précoce) — pas de choix
        // fait, pas de personnage révélé : on ne peut pas improviser un
        // choix à la place de l'élève, donc on le pose quand même, sans
        // l'animation, plutôt que de planter sur personnageChoisi vide.
        await ecranChoixPersonnage();
        elIntroPleinEcran.classList.remove('intro-noir');
        elIntroImage.classList.add('intro-image-personnage');
        elIntroImage.innerHTML = '';
        elIntroImage.appendChild(creerImage(imagePersonnageActuel()));
        elIntroImage.style.opacity = '1';
      }
    }

    ETAPES = etapesDialogue();
    construireBoutonsNiveau();
    etape = 0;
    while (etape < ETAPES.length && !etapeApplicable(ETAPES[etape])) etape += 1;

    elIntroPleinEcran.classList.add('intro-cachee');
    rendreEtape();
    elSceneLecon.classList.add('revele');
    navDialogue.classList.add('genese-terminee');
    elBulleOverlay.classList.add('genese-terminee');
    document.getElementById('pilesConteneur').classList.add('genese-terminee');
  }
  demarrerLecon();

})();
</script>
</body>
</html>
