  // pourrait arriver est un rejeu improbable après un signet partagé ;
  // par prudence, on n'insiste pas et on repart avec le personnage déjà
  // possédé plutôt que de laisser choisir une seconde fois gratuitement.
  function ecranChoixPersonnage() {
    return new Promise(function (resolve) {
      document.getElementById('choixImageKeb').appendChild(creerImage('keb_neutre_01.webp'));
      document.getElementById('choixImageBek').appendChild(creerImage('bek_neutre_03.webp'));
      document.getElementById('choixPersonnageTitre').textContent = texteInterface('choixPersonnage');
      elEcranChoix.querySelectorAll('.choix-carte-prix').forEach(function (el) { el.textContent = texteInterface('prixChoixInitial'); });
      elEcranChoix.classList.add('visible');

      const cartes = elEcranChoix.querySelectorAll('.choix-carte');
      function surClic(e) {
        const carte = e.currentTarget;
        const personnage = carte.dataset.personnage;
        cartes.forEach(function (c) { c.classList.add('choix-en-cours'); });

        const promesse = window.KebBekProgression
          ? window.KebBekProgression.choisirPersonnageInitial(personnage)
          : Promise.resolve('nouveau');

        promesse
          .then(function (resultat) {
            personnageChoisi = (resultat === 'bloque_autre_deja_choisi')
              ? (personnage === 'Keb' ? 'Bek' : 'Keb')
              : personnage;
          })
          .catch(function (err) {
            console.warn('lecon-01-rencontre.html : choisirPersonnageInitial a échoué.', err);
            personnageChoisi = personnage; // jamais bloquer l'histoire pour un souci réseau
          })
          .then(function () {
            elEcranChoix.classList.remove('visible');
            resolve();
          });
      }
      cartes.forEach(function (c) { c.addEventListener('click', surClic, { once: true }); });
    });
  }

  // Réveil : fond noir → beige (la genèse "s'achève" pour de bon ici),
  // flash blanc, apparition du personnage choisi, léger balancement
  // désorienté (.perso-deboussole) pendant une pause SANS texte — le
  // personnage ne parle pas encore, il découvre juste qu'il existe.
  // 🆕 (session 22-08-2026, suite) DEUX correctifs appliqués ici même :
  //   1. .intro-image-personnage était déjà écrite en CSS (plafonne la
  //      taille au lieu du plein écran) mais jamais ajoutée en JS — Keb
  //      apparaissait donc géant. Ajoutée ci-dessous, une fois pour
  //      toutes pour le reste de la séquence plein écran (elle reste en
  //      place pendant jouerBeats() juste après, qui réutilise la même
  //      #introImage).
  //   2. Enchaîne maintenant sur jouerBeats() (confus → "je suis où ?"
  //      → cherche son ami → l'appelle) au lieu de sauter direct à la
  //      main qui salue — c'est la séquence que Raphaël avait décrite
  //      et que les données (IMAGES_PERSO.confus/je_suis_ou/ou_est_ami/
  //      appelle_ami) et le CSS (.intro-legende) attendaient déjà.
  async function reveilPersonnage() {
    const reduireMouvement = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    elIntroPleinEcran.classList.remove('intro-noir');
    await attendre(reduireMouvement ? 20 : 500);
    elFlashApparition.classList.remove('jouer');
    void elFlashApparition.offsetWidth; // force le reflow pour pouvoir rejouer l'animation d'une leçon à l'autre
    elFlashApparition.classList.add('jouer');
    elIntroImage.classList.add('intro-image-personnage');
    elIntroImage.innerHTML = '';
    elIntroImage.style.opacity = '1';

    // 🆕 (Raphaël, 22-08-2026) Demande explicite : la toute première
    // image du personnage doit être sa version "généré" (scintillante),
    // avec l'impression qu'elle vient d'apparaître spontanément — voir
    // .intro-image-genere / @keyframes materialisationPersonnage en CSS.
    // La pose neutre est posée dessous, invisible, prête à recevoir le
    // fondu-enchaîné une fois la matérialisation vue (deux calques
    // superposés, jamais un simple remplacement de src).
    const calqueGenere = creerImage(imagePerso('genere'));
    calqueGenere.classList.add('intro-image-genere');
    const calqueNeutre = creerImage(imagePersonnageActuel());
    calqueNeutre.classList.add('intro-image-neutre-fondu');
    elIntroImage.appendChild(calqueNeutre);
    elIntroImage.appendChild(calqueGenere);

    // Laisse le temps de VOIR la matérialisation avant d'entamer le
    // fondu (1.6s d'animation + une courte pause sur l'image stabilisée).
    await attendre(reduireMouvement ? 30 : 2000);

    // Fondu-enchaîné : le calque généré s'efface pendant que le neutre
    // monte en opacité — les deux transitions durent le même temps
    // (0.9s, voir CSS) donc se croisent sans à-coup.
    calqueGenere.classList.add('intro-image-stabilise');
    calqueNeutre.classList.add('visible');
    await attendre(reduireMouvement ? 20 : 900);
    calqueGenere.remove();

    elIntroImage.classList.add('perso-deboussole');
    await attendre(reduireMouvement ? 30 : 700);

    const nomAutre = personnageChoisi === 'Bek' ? 'Keb' : 'Bek';
    await jouerBeats(nomAutre);
  }

  // 🆕 (Raphaël, 22-08-2026, session de reprise) Variante de
  // reveilPersonnage() pour un RETOUR en cours de désorientation
  // (dejaChoisi vrai + une position 'r1_intro' existe déjà, voir
  // demarrerLecon()) : le personnage a déjà vécu sa matérialisation
  // pendant la session précédente — on ne rejoue JAMAIS une seconde
  // fois le flash + fondu-enchaîné généré→neutre (ce serait lui faire
  // revivre une naissance déjà arrivée), on retrouve directement la
  // pose neutre désorientée, puis jouerBeats() reprend pile à l'index
  // sauvegardé (qui peut être BEATS_DESORIENTATION.length lui-même, si
  // la désorientation était déjà terminée et qu'il ne restait que le
  // salut — jouerBeats() ne boucle alors pas du tout, ce qui est
  // voulu : la pose reste affichée telle quelle derrière la main).
  async function reveilPersonnageResume(indexDepart) {
    elIntroPleinEcran.classList.remove('intro-noir');
    elIntroImage.classList.add('intro-image-personnage');
    elIntroImage.innerHTML = '';
    elIntroImage.appendChild(creerImage(imagePersonnageActuel()));
    elIntroImage.style.opacity = '1';
    elIntroImage.classList.add('perso-deboussole');
    const nomAutre = personnageChoisi === 'Bek' ? 'Keb' : 'Bek';
    await jouerBeats(nomAutre, indexDepart);
  }

  // 🆕 (session 22-08-2026, suite) Séquence de désorientation —
  // "confus" → "Je suis où ?" → "Où est [ami] ?" → l'appelle deux fois,
  // sans réponse (voir #introLegende/.intro-legende en CSS et HTML,
  // déjà prêts mais jamais utilisés jusqu'ici). Contrairement à
  // jouerGenese() (chronométrée, muette), on avance ici au TAP — il y a
  // du texte à lire, comme annoncé par le commentaire CSS de
  // .intro-legende. .perso-deboussole reste actif tout du long (retiré
  // seulement au clic sur la main, dans attendreSalutMain()) : le
  // personnage est toujours désorienté pendant qu'il cherche et appelle.
  const BEATS_DESORIENTATION = [
    // 🆕 (Raphaël, 22-08-2026, session de reprise) Chaînon ajouté entre
    // la matérialisation et 'confus' — Raphaël a signalé que la
    // transition ne se sentait pas naturelle sans lui. `flash: true`
    // rejoue #flashApparition juste avant d'afficher l'image de CE
    // beat (voir jouerBeats()) pour simuler l'éblouissement.
    // Pas de réplique ici (retour Raphaël, 22-08-2026) : juste le
    // flash + l'image, aucun texte inventé — voir plus bas dans
    // jouerBeats(), la légende n'est affichée que si fr/en existent.
    { cle: 'ebloui', flash: true },
    { cle: 'confus', fr: 'Hmm\u2026 ?', en: 'Hmm\u2026?' },
    { cle: 'je_suis_ou', fr: 'Je suis o\u00f9\u00a0?', en: 'Where am I?' },
    { cle: 'ou_est_ami',
      fr: function (nomAutre) { return 'O\u00f9 est ' + nomAutre + '\u00a0?'; },
      en: function (nomAutre) { return 'Where is ' + nomAutre + '?'; } },
    { cle: 'appelle_ami',
      fr: function (nomAutre) { return nomAutre + '\u00a0? ' + nomAutre + '\u00a0?'; },
      en: function (nomAutre) { return nomAutre + '? ' + nomAutre + '?'; } }
  ];

  // 🆕 (Raphaël, 22-08-2026, retour) Reprise exacte de la
  // séquence d'intro (réveil + désorientation + main qui salue), même
  // principe que sauvegarderPosition() plus bas pour le VRAI dialogue,
  // mais sous une clé de chapitre distincte ('r1_intro' plutôt que
  // 'r1') : ce n'est pas une étape de ETAPES, il n'y a pas encore de
  // `reponses` à cette phase, et surtout, le choix du personnage
  // lui-même (achat unique, voir choisirPersonnageInitial()) doit
  // rester intouché par ce mécanisme. `indexBeat` va de 0 à
  // BEATS_DESORIENTATION.length (ce dernier signifiant "désorientation
  // terminée, en attente du salut"). Best-effort et fire-and-forget,
  // même philosophie que sauvegarderPosition().
  function sauvegarderPositionIntro(indexBeat) {
    if (!window.KebBekProgression) return;
    window.KebBekProgression.enregistrerPositionLecon(CHAPITRE_ID + '_intro', indexBeat, {})
      .catch(function (e) { console.warn('lecon-01-rencontre.html : échec de la sauvegarde de position (intro).', e); });
  }

  // 🆕 (Raphaël, 22-08-2026, retour — 5ème demande) La désorientation
  // était jusqu'ici une simple boucle for + un unique clic qui ne
  // faisait qu'avancer (attendreTapIntro()) : impossible de reculer.
  // Remplacée par un contrôleur pilotable dans les deux sens —
  // `beatsControleur` retient l'index courant + la promesse à résoudre
  // une fois la désorientation terminée — pour que flèches clavier,
  // tap gauche/droite ET glissement (voir plus bas, mêmes écouteurs que
  // .cadre-scene) fonctionnent ICI AUSSI, pas seulement dans le VRAI
  // dialogue. `enTransition` empêche un double avancement pendant le
  // court délai du flash (voir plus bas) — un deuxième tap pendant ce
  // délai est ignoré plutôt que de sauter un beat.
  let beatsControleur = null;

  async function rendreBeat(nomAutre, i) {
    const beat = BEATS_DESORIENTATION[i];
    const reduireMouvement = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    elIntroLegende.classList.remove('visible');
    if (beat.flash) {
      elFlashApparition.classList.remove('jouer', 'jouer-eblouissement');
      void elFlashApparition.offsetWidth; // force le reflow, même patron que reveilPersonnage()
      elFlashApparition.classList.add('jouer-eblouissement');
      // La bascule d'image ci-dessous doit se faire PENDANT le plateau
      // blanc de l'éclat (voir @keyframes flashEblouissement, pic vers
      // 15%), jamais avant — sinon l'élève voit le personnage se
      // couvrir les yeux AVANT le flash, sans raison apparente. On
      // attend donc que l'écran soit presque tout blanc avant
      // d'échanger l'image dessous. Rejoué à l'identique qu'on arrive
      // sur ce beat en avançant OU en reculant dessus (jamais si on le
      // saute par-dessus, ex. reprise plus loin).
      await attendre(reduireMouvement ? 20 : 320);
    }
    elIntroImage.innerHTML = '';
    elIntroImage.appendChild(creerImage(imagePerso(beat.cle)));
    // beat.fr est absent pour 'ebloui' (pas de réplique voulue, juste
    // flash + image) — on laisse alors la légende vide plutôt que
    // d'afficher "undefined".
    if (beat.fr) {
      const texteFr = typeof beat.fr === 'function' ? beat.fr(nomAutre) : beat.fr;
      const texteEn = typeof beat.en === 'function' ? beat.en(nomAutre) : beat.en;
      elIntroLegende.innerHTML = '<div class="intro-legende-fr">' + texteFr + '</div>' +
        '<div class="intro-legende-trad">' + texteEn + '</div>';
      requestAnimationFrame(function () { elIntroLegende.classList.add('visible'); });
    }
    sauvegarderPositionIntro(i);
  }

  // Avance d'un beat, ou termine la désorientation (résout la promesse
  // de jouerBeats()) si on était déjà sur le dernier.
  async function avancerBeat() {
    if (!beatsControleur || beatsControleur.enTransition) return;
    const c = beatsControleur;
    if (c.index + 1 < BEATS_DESORIENTATION.length) {
      c.enTransition = true;
      c.index += 1;
      await rendreBeat(c.nomAutre, c.index);
      c.enTransition = false;
    } else {
      beatsControleur = null;
      elIntroLegende.classList.remove('visible');
      // Désorientation terminée, il ne reste plus que la main qui
      // salue — voir demarrerLecon() : une reprise à ce stade doit
      // sauter les beats mais PAS rejouer l'éblouissement/désorientation.
      sauvegarderPositionIntro(BEATS_DESORIENTATION.length);
      c.resolve();
    }
  }

  // Recule d'un beat — jamais avant le premier (index 0) : on ne
  // revient JAMAIS à l'écran de choix du personnage par ce chemin,
  // comme demandé (« on ne pourrait pas retourner à choisir soit Keb,
  // soit Bek, mais tout ce qui suit... peut être repris »).
  async function reculerBeat() {
    if (!beatsControleur || beatsControleur.enTransition) return;
    const c = beatsControleur;
    if (c.index <= 0) return;
    c.enTransition = true;
    c.index -= 1;
    await rendreBeat(c.nomAutre, c.index);
    c.enTransition = false;
  }

  // 🆕 (Raphaël, 22-08-2026, retour) `indexDepart` — permet de rentrer
  // dans la séquence à un beat précis plutôt que toujours au premier,
  // pour la reprise exacte (voir reveilPersonnageResume() et
  // sauvegarderPositionIntro() plus haut) : un élève qui quitte pendant
  // "Hmm... ?" doit retrouver "Hmm... ?" à son retour, pas revivre
  // l'éblouissement qu'il a déjà vu.
  function jouerBeats(nomAutre, indexDepart) {
    return new Promise(function (resolve) {
      const indexInitial = indexDepart || 0;
      beatsControleur = { index: indexInitial, nomAutre: nomAutre, enTransition: true, resolve: resolve };
      rendreBeat(nomAutre, indexInitial).then(function () {
        if (beatsControleur) beatsControleur.enTransition = false;
      });
    });
  }

  // Main qui salue — cliquable, ondule doucement pour signaler qu'elle
  // attend un geste. Le clic MIME notre salut ; c'est ce qui fait que
  // le personnage nous "voit" et lance sa première réplique.
  // 🆕 (session 22-08-2026, suite) "Bonjour !" (#mainSalueBonjour) était
  // déjà dans le HTML/CSS, prêt avec sa classe .visible, mais jamais
  // affiché — le clic résolvait tout de suite sans qu'on ait le temps
  // de le voir. Ajouté ci-dessous : le mot apparaît brièvement au clic,
  // PUIS la promesse se résout (petit délai, raccourci si
  // prefers-reduced-motion).
  function attendreSalutMain() {
    const reduireMouvement = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    return new Promise(function (resolve) {
      document.getElementById('imageMainSalue').appendChild(creerImage('main-neutre_salue_01.webp'));
      elBtnMainSalue.classList.add('visible');
      // 🆕 (Raphaël, 22-08-2026, retour) "Bonjour !" doit être visible
      // DÈS que la main apparaît, pas seulement après le clic — sinon
      // l'élève ne sait pas ce que le geste représente avant de l'avoir
      // fait. Reste affiché tant qu'on n'a pas cliqué ; le clic ne fait
      // plus que refermer la séquence (voir setTimeout ci-dessous).
      elMainSalueBonjour.classList.add('visible');
      elBtnMainSalue.addEventListener('click', function surClic() {
        elBtnMainSalue.removeEventListener('click', surClic);
        setTimeout(function () {
          elBtnMainSalue.classList.remove('visible');
          elMainSalueBonjour.classList.remove('visible');
          elIntroImage.classList.remove('perso-deboussole');
          resolve();
        }, reduireMouvement ? 100 : 700);
      }, { once: true });
    });
  }

  let etape = 0;
  // 🆕 Même stratégie que precedent() dans dialogues/d1/index.html :
  // reconstruit les deux piles depuis le début plutôt que de retirer
  // juste le dernier élément — plus simple, aucun risque de
  // désynchronisation entre pile-dialogue et pile-grammaire.
  let reconstructionEnCours = false;

  // 🆕 (Raphaël, demande d'origine restée en suspens pendant les
  // correctifs plus urgents — reprise ici) "la bulle de texte apparaisse
  // un peu après l'image, pour laisser le temps de voir le personnage."
  // L'image est déjà posée en tout premier dans rendreEtape() (voir plus
  // bas) ; la bulle, elle, attend ce court délai avant de s'animer —
  // minuteurBulle permet d'annuler un délai encore en attente si l'élève
  // enchaîne les clics Suivant/Précédent plus vite que ce délai lui-même
  // (sinon une bulle d'une étape déjà quittée pourrait apparaître avec
  // le contenu de la nouvelle, un flash visuel incohérent).
  const DELAI_BULLE_APRES_IMAGE = 380;
  let minuteurBulle = null;

  // 🆕 (retour Raphaël, 22-08-2026) Reconstruite pour distinguer QUATRE
  // panneaux possibles (texte/saisie libre/binaire/niveau/prénom) au
  // lieu d'un seul #navDialogue — un seul visible à la fois, déterminé
  // par ETAPES[etape].type. La bulle-dialogue, elle, n'est mise à jour
  // QUE pour les étapes 'texte' : elle reste affichée telle quelle
  // pendant une étape de réponse (l'élève répond à la question qu'il
  // vient de lire, elle ne doit pas disparaître entre-temps).
  // 🆕 (retour Raphaël, 22-08-2026) Reconstruite pour distinguer SIX
  // panneaux possibles (texte/binaire/niveau/prénom/qcm/déduction/genre)
  // au lieu d'un seul #navDialogue — un seul visible à la fois, déterminé
  // par ETAPES[etape].type. La bulle-dialogue, elle, est mise à jour pour
  // 'texte' ET pour 'qcm'/'deduction' (elle y affiche le mot/la phrase
  // testée — voir plus bas), mais reste affichée telle quelle pendant
  // binaire/niveau/prénom/genre (l'élève répond à ce qu'il vient de lire,
  // la bulle ne doit pas disparaître entre-temps).
  // 🆕 (Raphaël, 23-08-2026) Colore en pêche la ponctuation expressive
  // finale d'une réplique ("…", "?", "!" — seuls ou combinés, ex. "… ?")
  // — appliquée après coup sur le DERNIER mot cliquable construit par
  // mot-tooltip.js, puisque ce module fusionne déjà la ponctuation
  // isolée à la fin du mot précédent (voir sa propre regex
  // PONCTUATION_SEULE) : on ne peut donc pas lui demander de séparer un
  // <span class="accent"> à la construction, on le fait ici en
  // ré-analysant le texte du dernier span une fois construit.
  function accentuerPonctuation(conteneurLegende) {
    const mots = conteneurLegende.querySelectorAll('.mtt-mot');
    if (!mots.length) return;
    const dernier = mots[mots.length - 1];
    const m = dernier.textContent.match(/^(.*?)([\u2026?!\u00a0]+)(\u00a0?)$/);
    if (!m || !m[2].trim()) return;
    dernier.textContent = m[1];
    const accent = document.createElement('span');
    accent.className = 'accent';
    accent.textContent = m[2] + m[3];
    dernier.appendChild(accent);
  }

  // 🆕 (Raphaël, reprise de la demande d'origine) Retourne le suffixe de
  // classe à ajouter à .bulle-dialogue-fr selon la longueur de la
  // réplique — seuils choisis empiriquement sur les répliques les plus
  // longues déjà écrites pour cette leçon (ex. "Bek ? Papa ? Maman ?"
  // reste en taille normale ; une phrase complète avec subordonnée
  // bascule en taille réduite pour ne jamais forcer un retour à la
  // ligne qui pousserait la bulle à chevaucher le bas du cadre).
  function tailleBulleSelonLongueur(texte) {
    const longueur = (texte || '').length;
    if (longueur > 55) return ' bulle-taille-longue';
    if (longueur > 32) return ' bulle-taille-moyenne';
    return '';
  }

  // 🆕 (Raphaël, 23-08-2026) Un seul indicateur d'état : est-ce que
  // l'élève a déjà tapé pour révéler l'exercice de l'étape COURANTE ?
  // Remis à false à chaque rendreEtape() (voir plus bas), donc jamais
  // périmé d'une étape à l'autre ni après un Précédent/Suivant.
  let exerciceRevele = false;

  function rendreEtape() {
    const def = ETAPES[etape];
    elCompteur.textContent = (etape + 1) + ' / ' + ETAPES.length;
    btnPrecedent.disabled = !ETAPES.slice(0, etape).some(etapeApplicable);

    elScene.innerHTML = '';
    elScene.appendChild(creerImage(def.img || imagePersonnageActuel()));

    // 🆕 qcm/déduction/prénom sont de VRAIS exercices : jamais affichés
    // tout de suite (voir estExercice plus bas) — seuls binaire/niveau/
    // genre restent des cases prédéterminées montrées immédiatement,
    // comme avant.
    const estExercice = (def.type === 'qcm' || def.type === 'deduction' || def.type === 'prenom');
    exerciceRevele = false;

    navDialogue.style.display = (def.type === 'texte') ? 'flex' : 'none';
    elReponseBinaire.style.display = (def.type === 'binaire') ? 'flex' : 'none';
    elReponseNiveau.style.display = (def.type === 'niveau') ? 'flex' : 'none';
    elReponseGenre.style.display = (def.type === 'genre') ? 'flex' : 'none';
    // 🆕 (23-08-2026, correctif) Le rond pulsé générique s'efface au
    // profit de .main-geste quand l'étape en a un — les deux ne
    // portent jamais l'affordance "tapez ici" en même temps.
    // 🆕 (retour Raphaël) même règle étendue à .main-reflexion (def.
    // reflexion) : le rond pulsé générique, centré, tombait mal sur les
    // portraits pleine hauteur de l'étape 'prenom' (atterrissait entre
    // les jambes du personnage — voir capture fournie).
    elSceneTapIndicateur.style.display = (estExercice && !def.geste && !def.reflexion) ? 'block' : 'none';
    if (def.geste) {
      elImageMainGeste.innerHTML = '';
      elImageMainGeste.appendChild(creerImage(def.geste.img));
      // 🐛 CORRIGÉ (retour Raphaël) : la traduction (def.geste.trad,
      // "No!") s'affichait ICI, sous le mot français, AVANT même que
      // l'élève ait répondu au QCM "Que veut dire ce mot ?" — l'exercice
      // qui suit devenait donc vide de sens, la réponse étant déjà
      // donnée gratuitement dans la bulle du geste. Seul le mot FR est
      // affiché tant que l'exercice n'est pas résolu ; la traduction
      // n'apparaît qu'APRÈS une bonne réponse, comme confirmation — voir
      // reveleerTraductionGeste() dans repondreQcm().
      elMainGesteBulle.innerHTML = '';
      elMainGesteBulle.textContent = def.geste.mot;
      elMainGeste.classList.add('visible');
    } else {
      elMainGeste.classList.remove('visible');
    }
    // 🆕 (retour Raphaël) Nuage de réflexion — voir .main-reflexion en
    // CSS. Un seul visuel générique (pas un par personnage, contrairement
    // à .main-geste) : image posée une seule fois suffit, jamais besoin
    // de la reconstruire à chaque étape puisqu'elle ne change jamais.
    if (def.reflexion) {
      if (!elImageMainReflexion.firstChild) {
        elImageMainReflexion.appendChild(creerImage(NUAGE_REFLEXION_FICHIER));
      }
      elMainReflexion.classList.add('visible');
    } else {
      elMainReflexion.classList.remove('visible');
    }
    elExercicePanneau.style.display = 'none';
    elExercicePanneau.classList.remove('in');
    elEtapePrenom.style.display = 'none';
    elReponseQcm.style.display = 'none';
    elReponseLibre.style.display = 'none';

    if (def.type === 'texte') {
      elBulle.classList.remove('in');
      elBulle.className = 'bulle-dialogue cote-' + def.speaker;
      window.KebBekMotTooltip.fermer();
      elBulle.innerHTML = '';
      const texteActuel = texteEtape(def);
      const elFr = document.createElement('div');
      elFr.className = 'bulle-dialogue-fr' + tailleBulleSelonLongueur(texteActuel);
      elFr.appendChild(window.KebBekMotTooltip.creerMotCliquable(texteActuel, CHAPITRE_ID));
      accentuerPonctuation(elFr);
      elBulle.appendChild(elFr);
      // 🆕 (Raphaël, 22-08-2026, retour) Traduction de LA RÉPLIQUE
      // AFFICHÉE — voir .bulle-trad en CSS (survol sur ordinateur,
      // réglage global sur mobile/tactile, ou tap direct sur la
      // traduction/le repère pulsé).
      const tradActuelle = traductionPhrase(def);
      if (tradActuelle) {
        const elBulleTrad = document.createElement('div');
        elBulleTrad.className = 'bulle-trad';
        elBulleTrad.textContent = tradActuelle;
        if (traductionsVisiblesParDefaut) elBulleTrad.classList.add('visible');
        elBulleTrad.addEventListener('click', function (e) {
          e.stopPropagation();
          elBulleTrad.classList.toggle('visible');
        });
        elBulle.appendChild(elBulleTrad);
        const elPuce = document.createElement('div');
        elPuce.className = 'bulle-dialogue-puce' + (traductionsVisiblesParDefaut ? ' cachee' : '');
        elBulle.appendChild(elPuce);
      }
      // 🆕 (Raphaël, reprise de la demande d'origine) Reconstruction de
      // l'historique (reprise de session) : la bulle doit refléter l'état
      // final tout de suite, jamais rejouer ce petit délai d'entrée à
      // chaque page qui se recharge — seule une VRAIE nouvelle réplique,
      // vue pour la première fois dans cette session d'affichage, mérite
      // d'attendre que le personnage soit vu avant le texte.
      clearTimeout(minuteurBulle);
      if (reconstructionEnCours) {
        elBulle.classList.add('in');
      } else {
        minuteurBulle = setTimeout(function () { elBulle.classList.add('in'); }, DELAI_BULLE_APRES_IMAGE);
      }
      if (!reconstructionEnCours) {
        ajouterLigneDialogue(def);
        ajouterNoteGrammaire(def);
      }
    } else if (estExercice) {
      // 🆕 (23-08-2026) Correctif du bug central signalé : la bulle
      // reste totalement vide et invisible pour ces trois types — le
      // mot testé/la consigne ne sont JAMAIS écrits ici (donc jamais
      // "collés sur la tête du personnage"). La scène ne montre que le
      // geste (def.img) + l'indicateur de tap ; le contenu réel de
      // l'exercice vit dans #exercicePanneau, révélé par revelerExercice()
      // seulement au clic — voir le gestionnaire sur .cadre-scene plus
      // bas.
      clearTimeout(minuteurBulle);
      elBulle.classList.remove('in');
      elBulle.innerHTML = '';
    } else if (def.type === 'genre') {
      rendreEtapeGenre(def);
    }
  }

  // 🆕 (23-08-2026) Révèle le panneau d'exercice de l'étape courante —
  // seul point d'entrée qui peuple #exerciceMot/#exerciceConsigne et
  // affiche la bonne zone de réponse À L'INTÉRIEUR du panneau (jamais
  // sur l'image). Appelée UNE fois par étape (voir exerciceRevele) —
  // retaper la scène ensuite ne fait plus rien, le panneau reste ouvert.
  function revelerExercice() {
    if (exerciceRevele) return;
    const def = ETAPES[etape];
    if (def.type !== 'qcm' && def.type !== 'deduction' && def.type !== 'prenom') return;
    exerciceRevele = true;

    elSceneTapIndicateur.style.display = 'none';
    elExercicePanneau.style.display = 'flex';
    requestAnimationFrame(() => requestAnimationFrame(() => elExercicePanneau.classList.add('in')));
    elExerciceEtiquette.textContent = texteInterface('exercice');
    elExerciceConsigne.textContent = (def.consigne[langueActuelle()] || def.consigne.en);

    if (def.type === 'qcm') {
      elExerciceMot.style.display = 'block';
      elExerciceMot.textContent = def.mot_cible;
      elReponseQcm.style.display = 'flex';
      construireQcm(def);
    } else if (def.type === 'deduction') {
      elExerciceMot.style.display = 'none';
      elReponseLibre.style.display = 'flex';
      def.etatExercice = { tentatives: 0, resolu: false };
      elChampReponseLibre.value = '';
      elChampReponseLibre.classList.remove('qcm-mauvais');
      document.getElementById('btnValiderReponseLibre').disabled = false;
      setTimeout(function () { elChampReponseLibre.focus(); }, 50);
    } else if (def.type === 'prenom') {
      elExerciceMot.style.display = 'none';
      elEtapePrenom.style.display = 'flex';
      def.etatExercice = { tentatives: 0, resolu: false };
      const champPrenomEl = document.getElementById('champPrenom');
      champPrenomEl.value = '';
      champPrenomEl.classList.remove('qcm-mauvais');
      champPrenomEl.placeholder = texteInterface('placeholderPrenom');
      document.getElementById('btnValiderPrenom').disabled = false;
      setTimeout(function () { champPrenomEl.focus(); }, 50);
    }
  }

  // 🆕 (retour Raphaël, 21-08-2026 ; adaptée 22-08-2026 pour sauter les
  // étapes dont `condition(reponses)` est fausse — ex. la question du
  // niveau si l'élève a répondu "non" à "Tu parles français ?") —
  // fonctions nommées pour rester réutilisables par TROIS déclencheurs
  // équivalents : les boutons, les flèches clavier gauche/droite, et le
  // tap direct sur la scène. `navigationActive` coupe les trois à la
  // toute fin du dialogue — au-delà, ‹/› et le tap sur l'écran n'ont
  // plus de sens.
  let navigationActive = true;

  // 🆕 (Raphaël, 22-08-2026) Reprise exacte de la leçon — sauvegarde
  // best-effort à chaque changement d'étape (voir suivant()/precedent()
  // plus bas), jamais bloquante : un échec réseau ne doit jamais gêner
  // la leçon en cours, seulement priver un futur retour de la reprise
  // exacte (repli sur le début, comme aujourd'hui). Volontairement
  // "fire-and-forget" (pas de await à l'appel) — attendre ici retarderait
  // la navigation pour une écriture qui n'a pas besoin d'être synchrone.
  function sauvegarderPosition() {
    if (!window.KebBekProgression) return;
    window.KebBekProgression.enregistrerPositionLecon(CHAPITRE_ID, etape, reponses)
      .catch(function (e) { console.warn('lecon-01-rencontre.html : échec de la sauvegarde de position.', e); });
  }

  function precedent() {
    if (!navigationActive) return;
    let i = etape - 1;
    while (i >= 0 && !etapeApplicable(ETAPES[i])) i -= 1;
    if (i < 0) return;
    etape = i;
    elPileDialogue.innerHTML = '';
    elPileGrammaire.innerHTML = '';
    blocGrammaire.style.display = 'none';
    reconstructionEnCours = true;
    for (let j = 0; j <= etape; j++) {
      if (ETAPES[j].type === 'texte' && etapeApplicable(ETAPES[j])) {
        ajouterLigneDialogue(ETAPES[j]);
        ajouterNoteGrammaire(ETAPES[j]);
      }
    }
    elPileDialogue.querySelectorAll('.pile-item').forEach(el => el.classList.add('in'));
    elPileGrammaire.querySelectorAll('.grammaire-item').forEach(el => el.classList.add('in'));
    rendreEtape();
    reconstructionEnCours = false;
    sauvegarderPosition();
  }

  function suivant() {
    if (!navigationActive) return;
    let i = etape + 1;
    while (i < ETAPES.length && !etapeApplicable(ETAPES[i])) i += 1;
    if (i < ETAPES.length) {
      etape = i;
      rendreEtape();
      sauvegarderPosition();
      return;
    }
    terminerConversation();
  }

  // Fin du dialogue (dernière étape 'texte' passée) — plus d'écran
  // final séparé à part #etapeFin : le prénom, lui, a déjà été capturé
  // EN COURS de conversation (étape 'prenom'), pas ici.
  function terminerConversation() {
    window.KebBekMotTooltip.fermer();
    navigationActive = false;
    navDialogue.style.display = 'none';
    elReponseLibre.style.display = 'none';
    elReponseBinaire.style.display = 'none';
    elReponseNiveau.style.display = 'none';
    elReponseQcm.style.display = 'none';
    elReponseGenre.style.display = 'none';
    elEtapeFin.style.display = 'flex';
    document.getElementById('messageFin').textContent = texteInterface('messageFin').replace('{prenom}', reponses.prenom || '');
    document.getElementById('btnTerminerLecon').textContent = texteInterface('terminer');
  }

  btnPrecedent.addEventListener('click', precedent);
  btnSuivant.addEventListener('click', suivant);

  // 🆕 (retour Raphaël, 22-08-2026) Exercice QCM — un bouton "blague" (ex.
  // "Le Père Noël") ne compte JAMAIS comme un essai, juste un clin d'œil ;
  // 2 P$ si la bonne réponse est trouvée du premier VRAI essai, 1 P$
  // ensuite. La récompense passe par attribuer_recompense_premiere_fois
  // (déjà existante côté Supabase, voir progression.js) avec un
  // identifiant PROPRE À CET EXERCICE (def.recompense_id) : rejouer la
  // leçon ne permet donc jamais de la retoucher une deuxième fois.
  function construireQcm(def) {
    elQcmChoix.innerHTML = '';
    def.etatExercice = { tentatives: 0, resolu: false };
    def.choix.forEach(function (c) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'bouton-choix';
      btn.textContent = c[langueActuelle()] || c.en || c.fr;
      btn.addEventListener('click', function () { repondreQcm(def, c, btn); });
      elQcmChoix.appendChild(btn);
    });
  }

  function accorderRecompenseExercice(def, piasses) {
    if (window.KebBekProgression && def.recompense_id) {
      window.KebBekProgression.attribuerRecompensePremiereFois(def.recompense_id, piasses, 0)
        .catch(function (e) { console.warn('lecon-01-rencontre.html : récompense d\u2019exercice a échoué.', e); });
    }
  }

  // 🆕 (retour Raphaël) Révèle la traduction du mot du geste (ex. "No!"
  // sous "Non !") seulement une fois l'exercice résolu — jamais avant,
  // voir le correctif dans rendreEtape(). Confirmation, pas indice :
  // l'élève vient de prouver qu'il connaît déjà le mot, la traduction
  // ne fait que le récompenser/le rassurer, elle n'aide plus personne à
  // deviner à ce stade. Best-effort silencieux si l'étape n'a pas de
  // geste (ex. une déduction) ou pas de traduction définie.
  function reveleerTraductionGeste(def) {
    if (!def.geste || !def.geste.trad || !elMainGesteBulle) return;
    const elTrad = document.createElement('span');
    elTrad.className = 'main-geste-bulle-trad';
    elTrad.textContent = def.geste.trad;
    elMainGesteBulle.appendChild(elTrad);
  }

  function repondreQcm(def, choix, btn) {
    if (def.etatExercice.resolu) return;
    if (choix.blague) {
      btn.classList.add('qcm-mauvais');
      setTimeout(function () { btn.classList.remove('qcm-mauvais'); }, 500);
      return; // ne compte pas comme un essai
    }
    if (choix.correcte) {
      def.etatExercice.resolu = true;
      btn.classList.add('qcm-correct');
      elQcmChoix.querySelectorAll('.bouton-choix').forEach(function (b) { b.disabled = true; });
      accorderRecompenseExercice(def, def.etatExercice.tentatives === 0 ? 2 : 1);
      reveleerTraductionGeste(def);
      setTimeout(suivant, 650);
    } else {
      def.etatExercice.tentatives += 1;
      btn.classList.add('qcm-mauvais');
      setTimeout(function () { btn.classList.remove('qcm-mauvais'); }, 500);
      if (def.etatExercice.tentatives >= 3) {
        elQcmChoix.querySelectorAll('.bouton-choix').forEach(function (b) { b.disabled = true; });
        setTimeout(suivant, 900); // verrouillé, aucune récompense
      }
    }
  }

  // 🆕 Exercice de déduction (le/la) — réutilise le champ texte de
  // #reponseLibre (devenu générique) plutôt qu'un panneau dédié, avec la
  // même mécanique de tentatives/récompense que le QCM ci-dessus, mais en
  // saisie libre plutôt qu'à choix multiples.
  function validerReponseLibre() {
    const def = ETAPES[etape];
    if (def.type !== 'deduction' || (def.etatExercice && def.etatExercice.resolu)) return;
    const valeur = elChampReponseLibre.value.trim();
    if (!valeur) { elChampReponseLibre.focus(); return; }
    reponses[def.cle_reponse] = valeur;

    if (normaliserTexte(valeur) === normaliserTexte(def.reponse_attendue)) {
      def.etatExercice.resolu = true;
      elChampReponseLibre.classList.remove('qcm-mauvais');
      document.getElementById('btnValiderReponseLibre').disabled = true;
      accorderRecompenseExercice(def, def.etatExercice.tentatives === 0 ? 2 : 1);
      setTimeout(suivant, 500);
    } else {
      def.etatExercice.tentatives += 1;
      elChampReponseLibre.classList.add('qcm-mauvais');
      if (def.etatExercice.tentatives >= 3) {
        document.getElementById('btnValiderReponseLibre').disabled = true;
        elChampReponseLibre.disabled = true;
        setTimeout(suivant, 900); // verrouillé, aucune récompense
      }
    }
  }
  document.getElementById('btnValiderReponseLibre').addEventListener('click', validerReponseLibre);
  elChampReponseLibre.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); validerReponseLibre(); }
  });

  // 🆕 (retour Raphaël, 22-08-2026) Étape 'genre' — "Et toi, tu es... ?".
  // AVANT d'afficher les deux boutons, on vérifie si l'identité de
  // l'élève (genre) est déjà connue ailleurs sur le site (voir
  // identite-eleve.js, mécanisme distinct et plus riche, typiquement
  // rempli à la création du compte) via lireIdentite() — pour ne
  // JAMAIS reposer la question à quelqu'un qui a déjà répondu. Si connu :
  // le bouton correspondant est simplement mis en évidence (.pre-rempli),
  // aucune écriture ; ça devient une pratique de vocabulaire, pas une
  // collecte. Si inconnu : cliquer écrit réellement le genre via
  // enregistrerIdentite(), exactement comme identite-eleve.js le ferait.
  function rendreEtapeGenre(def) {
    document.getElementById('btnGenreGarcon').classList.remove('pre-rempli');
    document.getElementById('btnGenreFille').classList.remove('pre-rempli');
    const promesse = window.KebBekProgression ? window.KebBekProgression.lireIdentite() : Promise.resolve({ genre: null });
    promesse.then(function (identite) {
      if (identite && identite.genre) {
        reponses[def.cle_reponse] = identite.genre;
        document.getElementById(identite.genre === 'f' ? 'btnGenreFille' : 'btnGenreGarcon').classList.add('pre-rempli');
      }
    });
  }
  document.querySelectorAll('#reponseGenre .bouton-choix').forEach(function (btn) {
    btn.addEventListener('click', function () {
      const def = ETAPES[etape];
      const genre = btn.dataset.valeur;
      reponses[def.cle_reponse] = genre;
      document.querySelectorAll('#reponseGenre .bouton-choix').forEach(function (b) { b.classList.remove('pre-rempli'); });
      btn.classList.add('pre-rempli');
      if (window.KebBekProgression) {
        window.KebBekProgression.enregistrerIdentite(genre, undefined, undefined, undefined)
          .catch(function (e) { console.warn('lecon-01-rencontre.html : échec de l\u2019enregistrement du genre.', e); });
      }
      setTimeout(suivant, 400);
    });
  });

  // 🆕 Oui/Non — répondre fait directement avancer, pas de bouton
  // "Continuer" séparé en plus (cohérent avec niveau/qcm/déduction).
  elReponseBinaire.querySelectorAll('.bouton-choix').forEach(function (btn) {
    btn.addEventListener('click', function () {
      const def = ETAPES[etape];
      reponses[def.cle_reponse] = btn.dataset.valeur;
      suivant();
    });
  });

  // 🆕 Les boutons de niveau sont construits une seule fois (la langue ne
  // change pas en cours de leçon), pas régénérés à chaque rendu.
  function construireBoutonsNiveau() {
    elReponseNiveau.innerHTML = '';
    NIVEAUX.forEach(function (niv) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'bouton-choix';
      btn.textContent = niv[langueActuelle()] || niv.fr;
      btn.addEventListener('click', function () {
        const def = ETAPES[etape];
        reponses[def.cle_reponse] = niv.id;
        suivant();
      });
      elReponseNiveau.appendChild(btn);
    });
  }

  document.querySelectorAll('#reponseBinaire .bouton-choix').forEach(function (btn, i) {
    btn.textContent = (OUI_NON[langueActuelle()] || OUI_NON.en)[i];
  });

  // 🆕 Navigation clavier (flèches gauche/droite) — ignorée si le focus
  // est dans un champ de saisie (le champ prénom ou la réponse libre,
  // qui gèrent déjà leurs propres touches) pour ne jamais voler une
  // frappe de texte.
  // 🆕 (Raphaël, 22-08-2026, retour — 5ème demande) Ne gérait QUE le
  // vrai dialogue (precedent()/suivant(), navigationActive) — les
  // flèches ne faisaient donc rien pendant la désorientation (juste
  // après le choix de la carte), d'où le "seulement possible de
  // déplacer la page de haut en bas" : rien ne consommait la touche à
  // ce moment-là. `beatsControleur` (voir plus haut) est maintenant
  // vérifié EN PREMIER pour couvrir aussi cette phase.
  document.addEventListener('keydown', function (e) {
    const cible = e.target;
    const dansChampSaisie = cible && (cible.tagName === 'INPUT' || cible.tagName === 'TEXTAREA' || cible.isContentEditable);
    if (dansChampSaisie) return;
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    e.preventDefault();
    if (beatsControleur) {
      if (e.key === 'ArrowLeft') reculerBeat(); else avancerBeat();
      return;
    }
    if (e.key === 'ArrowLeft') precedent(); else suivant();
  });

  // 🆕 Tap/clic direct sur la scène (le personnage) — demande de
  // Raphaël, mêmes règles que dans dialogue-d1.html à l'origine : la
  // moitié GAUCHE de l'image fait reculer, la moitié DROITE fait
  // avancer, pour que le geste imite naturellement un livre qu'on
  // feuillette. Un clic sur un MOT de la bulle (traduction, voir
  // mot-tooltip.js) ne doit JAMAIS déclencher cette navigation — d'où
  // l'exclusion .closest('.bulle-dialogue') tout en haut. Sans effet
  // pendant une étape de réponse (saisie_libre/binaire/niveau/prénom) :
  // répondre EST déjà le geste qui fait avancer, un tap sur l'image à
  // côté ne doit pas resauter une étape par-dessus.
  const elCadreScene = document.querySelector('.cadre-scene');
  elCadreScene.addEventListener('click', function (e) {
    if (e.target.closest('.bulle-dialogue')) return;
    if (!navigationActive) return;
    const etapeActuelle = ETAPES[etape];
    if (etapeActuelle && (etapeActuelle.type === 'qcm' || etapeActuelle.type === 'deduction' || etapeActuelle.type === 'prenom')) {
      revelerExercice();
      return;
    }
    if (etapeActuelle && etapeActuelle.type !== 'texte') return;
    const rect = elCadreScene.getBoundingClientRect();
    const x = e.clientX - rect.left;
    if (x < rect.width / 2) precedent();
    else suivant();
  });

  // 🆕 (Raphaël, 22-08-2026) Glisser horizontalement sur la scène —
  // même sémantique que le tap-moitié/les flèches : glisser vers la
  // GAUCHE fait avancer (comme on feuillette une page vers la gauche),
  // glisser vers la DROITE fait reculer. Seuil de 50px pour ignorer un
  // simple tap (déjà géré par l'écouteur 'click' ci-dessus, qui se
  // déclenche de toute façon aussi sur mobile) et pour ne jamais voler
  // un petit tremblement de doigt ; on exige en plus que le mouvement
  // soit surtout horizontal (|deltaX| > |deltaY|) pour ne jamais gêner
  // un scroll vertical de la page. Mêmes gardes-fous que le tap
  // (navigationActive, étape 'texte' uniquement — pendant une étape de
  // réponse, glisser ne doit pas sauter une étape).
  let swipeDepartX = null;
  let swipeDepartY = null;
  elCadreScene.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1) { swipeDepartX = null; return; }
    swipeDepartX = e.touches[0].clientX;
    swipeDepartY = e.touches[0].clientY;
  }, { passive: true });
  elCadreScene.addEventListener('touchend', function (e) {
    if (swipeDepartX === null) return;
    const arrivee = e.changedTouches[0];
    const deltaX = arrivee.clientX - swipeDepartX;
    const deltaY = arrivee.clientY - swipeDepartY;
    swipeDepartX = null;
    swipeDepartY = null;
    const SEUIL_GLISSEMENT = 50;
    if (Math.abs(deltaX) < SEUIL_GLISSEMENT || Math.abs(deltaX) < Math.abs(deltaY)) return;
    if (!navigationActive) return;
    if (ETAPES[etape] && ETAPES[etape].type !== 'texte') return;
    if (deltaX < 0) suivant(); else precedent();
  }, { passive: true });

  // 🆕 (Raphaël, 22-08-2026, retour — 5ème demande) Même patron tap
  // gauche/droite + glissement que .cadre-scene ci-dessus, mais pour la
  // séquence de désorientation (#introPleinEcran) — jusqu'ici un simple
  // clic n'importe où ne faisait qu'avancer, sans équivalent "reculer".
  // Sans effet une fois beatsControleur à null (pendant la genèse
  // muette, gérée par passerGenese() ; ou après, pendant la main qui
  // salue, qui a son propre bouton).
  elIntroPleinEcran.addEventListener('click', function (e) {
    if (!beatsControleur) return;
    const rect = elIntroPleinEcran.getBoundingClientRect();
    const x = e.clientX - rect.left;
    if (x < rect.width / 2) reculerBeat(); else avancerBeat();
  });
  let swipeIntroDepartX = null;
  let swipeIntroDepartY = null;
  elIntroPleinEcran.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1) { swipeIntroDepartX = null; return; }
    swipeIntroDepartX = e.touches[0].clientX;
    swipeIntroDepartY = e.touches[0].clientY;
  }, { passive: true });
  elIntroPleinEcran.addEventListener('touchend', function (e) {
    if (swipeIntroDepartX === null) return;
    const arrivee = e.changedTouches[0];
    const deltaX = arrivee.clientX - swipeIntroDepartX;
    const deltaY = arrivee.clientY - swipeIntroDepartY;
    swipeIntroDepartX = null;
    swipeIntroDepartY = null;
    const SEUIL_GLISSEMENT = 50;
    if (Math.abs(deltaX) < SEUIL_GLISSEMENT || Math.abs(deltaX) < Math.abs(deltaY)) return;
    if (!beatsControleur) return;
    if (deltaX < 0) avancerBeat(); else reculerBeat();
  }, { passive: true });

  document.getElementById('titrePileDialogue').textContent = texteInterface('ceQuiAEteDit');
  document.getElementById('titrePileGrammaire').textContent = texteInterface('aRetenir');
  txtToggleTraductions.textContent = texteInterface('afficherTrad');

  // 🆕 (retour Raphaël, 22-08-2026) Ne saute plus vers #etapeFin
  // directement : le prénom est désormais capturé EN COURS de
  // conversation (voir etapesDialogue(), type 'prenom'), donc valider
  // le prénom fait juste avancer d'une étape comme n'importe quelle
  // autre réponse — c'est suivant() qui décide s'il reste des étapes ou
  // s'il faut terminerConversation().
  // 🆕 (session 22-08-2026, suite) Exercice de traduction longue,
  // même économie de récompense que le QCM/la déduction (2 P$ du
  // premier essai, 1 P$ ensuite — voir accorderRecompenseExercice() /
  // def.recompense_id = 'r1_ex_prenom'), mais SANS plafond de
  // tentatives (contrairement au QCM et à sa règle "3 échecs" : rien
  // dans la demande de Raphaël ne prévoit de bloquer cet exercice-ci,
  // et bloquer la toute première capture réelle du prénom serait
  // particulièrement mal venu). Une réponse qui ne suit aucun des
  // patrons acceptés (voir extrairePrenomDeTraduction()) est traitée
  // comme une erreur ordinaire — champ en rouge, on peut recommencer.
  function soumettrePrenom() {
    const def = ETAPES[etape];
    if (def.etatExercice && def.etatExercice.resolu) return;
    const champ = document.getElementById('champPrenom');
    const valeur = champ.value.trim();
    if (!valeur) { champ.focus(); return; }

    const prenomExtrait = extrairePrenomDeTraduction(valeur);
    if (!prenomExtrait) {
      def.etatExercice.tentatives += 1;
      champ.classList.add('qcm-mauvais');
      champ.focus();
      return;
    }

    def.etatExercice.resolu = true;
    champ.classList.remove('qcm-mauvais');
    document.getElementById('btnValiderPrenom').disabled = true;
    reponses.prenom = prenomExtrait;
    accorderRecompenseExercice(def, def.etatExercice.tentatives === 0 ? 2 : 1);

    if (window.KebBekProgression) {
      window.KebBekProgression
        .enregistrerIdentite(undefined, undefined, prenomExtrait, undefined)
        .catch(function (e) { console.warn('lecon-01-rencontre.html : échec de l\u2019enregistrement du prénom.', e); });
    } else {
      console.warn('KebBekProgression indisponible — prénom non enregistré.', prenomExtrait);
    }

    setTimeout(suivant, 500);
  }

  document.getElementById('btnValiderPrenom').addEventListener('click', soumettrePrenom);
  document.getElementById('champPrenom').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); soumettrePrenom(); }
  });

  document.getElementById('btnTerminerLecon').addEventListener('click', async function (e) {
    e.target.disabled = true;
    if (window.KebBekProgression) {
      try { await window.KebBekProgression.marquerChapitreComplete(CHAPITRE_ID); }
      catch (err) { console.warn('lecon-01-rencontre.html : échec de marquerChapitreComplete.', err); }
      // 🆕 La leçon est terminée : la position en cours n'a plus de sens
      // (jamais réutilisée pour un rejeu volontaire depuis le début).
      try { await window.KebBekProgression.effacerPositionLecon(CHAPITRE_ID); }
      catch (err) { console.warn('lecon-01-rencontre.html : échec de effacerPositionLecon.', err); }
    }
    window.location.href = '../parcours.html';
  });

  btnPrecedent.textContent = '‹ ' + texteInterface('precedent');

  // ---------- Démarrage ----------
  // 🆕 (retour Raphaël, 22-08-2026) Restructuré autour du choix du
  // personnage : SI l'élève a déjà fait ce choix par le passé (rejeu de
  // la leçon — voir lirePersonnageChoisi()), on saute directement toute
  // la genèse ET l'écran d'achat, jamais réaffiché une seconde fois à
  // qui a déjà un personnage. Sinon, déroulement complet : titre + noir
  // (jouerGenese) → écran de choix (ecranChoixPersonnage, "achat" à
  // 0 P$/0 PB) → réveil + désorientation du personnage choisi
  // (reveilPersonnage, qui enchaîne lui-même sur jouerBeats) → main qui
  // salue (attendreSalutMain) → dialogue (rendreEtape, construit par
  // etapesDialogue() maintenant que personnageChoisi est connu).
  async function demarrerLecon() {
    // 🆕 (23-08-2026, correctif) MANQUAIT ENTIÈREMENT sur cette page :
    // aucune fonction de progression.js ne crée le client Supabase tant
    // que restaurerSessionEtProfil()/initSession() n'a pas été appelée
    // au moins une fois (voir clientOuAutoCree() dans progression.js) —
    // et lirePersonnageChoisi() ci-dessous, en mode invité, retombe
    // directement sur le localStorage SANS jamais déclencher cette
    // création. Résultat en cascade, silencieux de bout en bout :
    // window.KebBekProgression.client restait null même une fois le
    // SDK Supabase chargé (voir le <script> ajouté en tête de page),
    // et mot-tooltip.js échouait donc à chaque clic sur un mot. Cet
    // appel est exactement celui documenté en tête de progression.js
    // comme requis pour "toute future leçon" — oublié à la création de
    // cette page. Best-effort (jamais d'exception qui bloque la leçon,
    // voir le try/catch interne de restaurerSessionEtProfil()) : un
    // élève resté invité continue de fonctionner normalement, avec un
    // client Supabase anonyme quand même disponible pour les lectures
    // publiques (dictionnaire de mots).
    if (window.KebBekProgression) {
      await window.KebBekProgression.restaurerSessionEtProfil().catch(function (e) {
        console.warn('lecon-01-rencontre.html : échec de restaurerSessionEtProfil.', e);
      });
    }

    const dejaChoisi = window.KebBekProgression
      ? await window.KebBekProgression.lirePersonnageChoisi().catch(function () { return null; })
      : null;

    if (dejaChoisi) {
      personnageChoisi = dejaChoisi;

      // 🆕 (Raphaël, 22-08-2026, session de reprise) Le choix du
      // personnage ne se rejoue jamais (achat unique), mais TOUT ce
      // qui suit doit reprendre exactement où l'élève l'avait laissé,
      // pas être sauté en bloc au premier retour comme avant ce
      // correctif. Priorité : si le VRAI dialogue (ETAPES, position
      // 'r1') a déjà commencé, on saute directement dedans (c'était
      // déjà le seul cas géré) ; SINON, on regarde s'il existe une
      // position dans la séquence d'intro elle-même ('r1_intro') pour
      // reprendre le réveil/désorientation/salut au bon endroit plutôt
      // que de les sauter entièrement.
      const positionDialogueExistante = window.KebBekProgression
        ? await window.KebBekProgression.lirePositionLecon(CHAPITRE_ID).catch(function () { return null; })
        : null;

      if (!positionDialogueExistante) {
        const positionIntro = window.KebBekProgression
          ? await window.KebBekProgression.lirePositionLecon(CHAPITRE_ID + '_intro').catch(function () { return null; })
          : null;
        const indexDepart = (positionIntro && Number.isInteger(positionIntro.etape) &&
          positionIntro.etape >= 0 && positionIntro.etape <= BEATS_DESORIENTATION.length)
          ? positionIntro.etape
          : 0;
        await reveilPersonnageResume(indexDepart);
        await attendreSalutMain();
      }
    } else {
      await jouerGenese(GENESE_AVANT);
      if (!genesePassee) {
        await ecranChoixPersonnage();
        await reveilPersonnage();
        await attendreSalutMain();
      } else {
        // Genèse sautée en cours de route (tap précoce) — pas de choix
        // fait, pas de personnage révélé : on ne peut pas improviser un
        // choix à la place de l'élève, donc on le pose quand même, sans
        // l'animation, plutôt que de planter sur personnageChoisi vide.
        await ecranChoixPersonnage();
        elIntroPleinEcran.classList.remove('intro-noir');
        elIntroImage.classList.add('intro-image-personnage');
        elIntroImage.innerHTML = '';
        elIntroImage.appendChild(creerImage(imagePersonnageActuel()));
        elIntroImage.style.opacity = '1';
      }
    }

    // 🆕 (Raphaël, 22-08-2026, session de reprise) La position d'intro
    // n'a plus de sens une fois qu'on s'apprête à entrer dans le VRAI
    // dialogue (ETAPES, sauvegardé sous 'r1' à partir d'ici) — même
    // logique qu'effacerPositionLecon() pour un chapitre terminé.
    // Idempotent/best-effort : ne fait rien si 'r1_intro' n'existait
    // pas (ex. la position 'r1' existait déjà et toute cette phase a
    // été sautée plus haut).
    if (window.KebBekProgression) {
      window.KebBekProgression.effacerPositionLecon(CHAPITRE_ID + '_intro')
        .catch(function (e) { console.warn('lecon-01-rencontre.html : échec de effacerPositionLecon (intro).', e); });
    }

    ETAPES = etapesDialogue();
    construireBoutonsNiveau();

    // 🆕 (Raphaël, 22-08-2026) Reprise exacte — si une position a déjà
    // été sauvegardée pour cette leçon (voir sauvegarderPosition()), on
    // repart de là plutôt que du début. `reponses` est MUTÉ (pas
    // réassigné : c'est un `const` fermé par toutes les fonctions du
    // dialogue) pour que les répliques qui en dépendent (prénom, etc.)
    // restent correctes dès le premier rendu. Une position invalide ou
    // hors bornes (ex. contenu du dialogue modifié depuis) retombe
    // silencieusement sur le début plutôt que de planter.
    const positionSauvegardee = window.KebBekProgression
      ? await window.KebBekProgression.lirePositionLecon(CHAPITRE_ID).catch(function () { return null; })
      : null;

    etape = 0;
    if (positionSauvegardee && Number.isInteger(positionSauvegardee.etape) &&
        positionSauvegardee.etape >= 0 && positionSauvegardee.etape < ETAPES.length) {
      Object.assign(reponses, positionSauvegardee.reponses || {});
      etape = positionSauvegardee.etape;
    }
    while (etape < ETAPES.length && !etapeApplicable(ETAPES[etape])) etape += 1;

    // Reconstruit la pile "Ce qui a été dit" + notes grammaticales pour
    // toutes les répliques déjà passées, même patron que precedent() —
    // sans ça, une reprise en cours de route afficherait la bonne étape
    // mais un historique vide, comme si le dialogue venait de commencer.
    if (etape > 0) {
      reconstructionEnCours = true;
      for (let j = 0; j < etape; j++) {
        if (ETAPES[j].type === 'texte' && etapeApplicable(ETAPES[j])) {
          ajouterLigneDialogue(ETAPES[j]);
          ajouterNoteGrammaire(ETAPES[j]);
        }
      }
      elPileDialogue.querySelectorAll('.pile-item').forEach(el => el.classList.add('in'));
      elPileGrammaire.querySelectorAll('.grammaire-item').forEach(el => el.classList.add('in'));
      reconstructionEnCours = false;
    }

    elIntroPleinEcran.classList.add('intro-cachee');
    rendreEtape();
    // 🆕 (Raphaël, 22-08-2026, session de reprise) Sans cet appel, une
    // sortie AVANT le tout premier clic sur "Suivant" (suivant() est le
    // seul autre appelant jusqu'ici) ne laissait aucune position 'r1'
    // — et comme 'r1_intro' vient tout juste d'être effacée ci-dessus,
    // un retour dans cet état précis aurait fait rejouer toute la
    // désorientation depuis le début plutôt que de rouvrir sur "Bonjour... ?"
    // (etape 0) où l'élève l'avait pourtant bel et bien laissée.
    sauvegarderPosition();
    elSceneLecon.classList.add('revele');
    navDialogue.classList.add('genese-terminee');
    elBulleOverlay.classList.add('genese-terminee');
    document.getElementById('pilesConteneur').classList.add('genese-terminee');
  }
  demarrerLecon();

})();
</script>
