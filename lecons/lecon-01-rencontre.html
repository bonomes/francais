<!-- Page à part entière, même situation que dialogues/d1/ et parcours.html :
     chargée directement par le navigateur (via le bouton "Première leçon"
     de index.html, ou depuis parcours.html une fois débloquée/verrouillée

     NIVEAUX). Vit À LA RACINE de lecons/ (un seul niveau sous la racine du
     site, PAS deux comme dialogues/d1/) — donc chemins relatifs en ../
     partout ci-dessous, jamais ../../. -->
<!-- ==================================================================

     pour quiconque reprend CE fichier comme point de départ de
     lecon-02-*.html, lecon-03-*.html, etc. Trois catégories ci-dessous.

     ✅ RÉUTILISABLE TEL QUEL (copier sans réfléchir) :

       - Le bouton .retour (coin supérieur gauche, mène à ../parcours.html).
       - Le patron .cadre-scene / .scene-image / .zone-bulle-overlay /
         .bulle-dialogue — bulle EN SUPERPOSITION sur l'image (jamais
         poussée), voir commentaire détaillé plus bas sur .cadre-scene.
       - Le patron .nav-bas / .nav-bouton (Précédent/Suivant + compteur).
       - langueActuelle() et la fonction creerImage() (repli gracieux
         "image pas encore prête" — le repli reste TOUJOURS silencieux/

       - L'intégration mot-tooltip : window.KebBekMotTooltip.creerMotCliquable(texte, CHAPITRE_ID)
         pour chaque bulle de dialogue.
       - La convention de dossier images/lecons/ (UN SEUL dossier
         partagé pour toutes les leçons, PAS un sous-dossier par leçon —

       - #sceneLecon cité (visibility:hidden) tant qu'une intro n'est pas

       - 🆕 (retour Raphaël, 21-08-2026 ; complété 22-08-2026) Navigation
         clavier (flèches gauche/droite) + tap direct sur la scène
         (moitié gauche = précédent, moitié droite = suivant) + glisser
         horizontalement (gauche = suivant, droite = précédent) — voir
         precedent()/suivant() et les écouteurs sur .cadre-scene
         (click + touchstart/touchend) — quatre déclencheurs équivalents
         aux boutons, coupés ensemble via `navigationActive` une fois le
         dialogue terminé.
       - 🆕 (Raphaël, 22-08-2026) .scene-image img EN object-fit: contain,
         JAMAIS cover — les portraits de personnages sont hauts/étroits
         et un cadre de scène large en `cover` rogne une hauteur
         différente selon l'image, ce qui fait "sauter" le niveau
         apparent du personnage (donc de la bulle) d'une image à
         l'autre. Voir le commentaire détaillé sur `.scene-image img`.
       - 🆕 (retour Raphaël, 21-08-2026) La pile "Ce qui a été dit" +
         notes grammaticales (#pilesConteneur, .pile-avatar, etc.) —
         repris de dialogues/d1/index.html, adapté au style de cette
         page. ajouterLigneDialogue()/ajouterNoteGrammaire() attendent
         un objet ETAPES[i] avec {speaker, texte, trad, grammaire?} —
         même format que d1. Pour une future leçon : copier NOMS/
         INITIALES (ajuster les couleurs --keb-couleur/--bek-couleur si
         de nouveaux personnages apparaissent) et les 4 clés INTERFACE
         (ceQuiAEteDit/aRetenir/afficherTrad/cacherTrad, déjà traduites
         dans les 20 langues du site). GRAMMAIRE reste à définir par
         leçon (voir plus bas, ETAPES/GRAMMAIRE) — vide pour l'instant
         dans r1.

     🔁 RÉUTILISABLE COMME PATRON, MAIS À RÉÉCRIRE LE CONTENU :
       - CHAPITRE_ID (ici 'r1') — un identifiant unique par leçon,
         doit correspondre à l'entrée du chapitre dans parcours.html.
       - ETAPES / INTERFACE — structure de données réutilisable (tableau
         d'étapes avec speaker/texte/img/trad, dictionnaire de textes
         d'interface par langue), mais CONTENU entièrement propre à
         chaque leçon.
       - La carte titre plein écran EN GÉNÉRAL (voir catégorie suivante
         pour le choix du mécanisme).

     🚫 SPÉCIFIQUE À CETTE LEÇON (r1), NE PAS COPIER TEL QUEL :
       - #introPleinEcran / GENESE / jouerGenese() — la séquence
         MUETTE, plein écran (titre sur fond beige → bref noir/vide →
         beige à nouveau pour l'illumination → Keb seul → Bek apparaît
         → ils se remarquent, voir le champ `fond` par étape dans
         GENESE) est la genèse DE L'UNIVERS DES BONOMES lui-même,
         propre à la toute première rencontre de Keb et Bek. Aucune
         autre leçon n'a de raison de la rejouer.
         → Pour une future leçon qui a simplement besoin d'une carte
         titre (SANS narration muette avant), utiliser plutôt le module
         partagé window.KebBekLeconIntro (voir ../lecon-intro.js/.css,

         noir — la version noire pleine écran ci-dessus reste propre à
         r1 tant qu'aucune autre leçon n'a besoin du même traitement.
       - Si une future leçon a SA PROPRE narration spéciale (différente
         de la genèse), le patron #introPleinEcran ci-dessous peut
         servir de modèle technique (calque fixed/inset:0/fond noir,
         tableau d'étapes avec durées, tap-pour-passer) — mais son
         CONTENU (le tableau GENESE) doit être entièrement réécrit, ce
         n'est jamais un simple copier-coller.
       - #etapePrenom / soumettrePrenom() — capture du PRÉNOM
         uniquement, spécifique à cette toute première leçon (le reste
         de l'identité — genre, âge, nationalité — est capté plus tard

     ================================================================== -->

<!-- 🆕 lecon-intro.css / .js volontairement NON chargés ici — cette

<style>
  :root {
    --fond: #F2EDE3;
    --brun: #665045;
    --brun-fonce: #4A3B33;
    --brun-clair: #8A7364;
    --peche: #F0A98B;
    --peche-fonce: #E08867;
    --peche-pale: rgba(240, 169, 139, 0.16);
    --peche-pale-vif: rgba(240, 169, 139, 0.30);
    --vert-clair: #EAF3DE;
    --ombre: rgba(102, 80, 69, 0.16);
    /* 🆕 (retour Raphaël, 21-08-2026) Couleurs Keb/Bek — mêmes valeurs
       que dialogues/d1/index.html (seule source jusqu'ici), reprises
       ici pour les avatars-cercles de la pile "Ce qui a été dit"
       (voir .pile-avatar plus bas). N'affectent PAS .bulle-dialogue :
       demande de Raphaël = adapter le mécanisme au style de CETTE
       page, pas importer tel quel la bulle bordée-colorée de d1. */
    --keb-couleur: #5B7FA6;
    --bek-couleur: #C97B3D;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--fond);
    font-family: 'Baloo 2', sans-serif;
    color: var(--brun-fonce);
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .retour {
    position: fixed;
    top: 14px;
    left: 14px;
    z-index: 300;
    width: 38px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: #FFFFFF;
    border: 1.5px solid var(--peche);
    color: var(--peche-fonce);
    font-size: 1.3rem;
    text-decoration: none;
    box-shadow: 2px 2px 8px var(--ombre);
  }

  /* ==================================================================
     Scène — contenu masqué (visibility:hidden, pas display:none : garde
     sa place dans la mise en page pour que rien ne saute une fois révélé)
     tant que la séquence plein écran (#introPleinEcran, carte titre +
     genèse) n'est pas terminée — voir demarrerLecon() en JS.
     ================================================================== */
  #sceneLecon {
    visibility: hidden;
    /* 🆕 (retour Raphaël, 21-08-2026) 640px → 1100px : le cadre restait
       petit même sur un grand écran d'ordinateur, où il y avait
       largement la place d'en profiter. 94vw inchangé pour le mobile
       (déjà fluide, pas concerné par ce plafond). */
    width: min(94vw, 1100px);
    margin: 64px auto 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }
  #sceneLecon.revele { visibility: visible; }

  /* ==================================================================
     🆕 Bulle EN SUPERPOSITION sur l'image (demande de Raphaël, session du
     20-08-2026) : contrairement à dialogue-d1.html (bulle avant l'image
     dans le flux normal, donc pousse l'image quand le texte passe à 2
     lignes), ici .zone-bulle-overlay est en position absolute PAR-DESSUS
     .scene-image — un cadre à hauteur fixe (aspect-ratio ci-dessous),
     jamais déplacé par la bulle, qui peut chevaucher son bas sans
     jamais rien pousser. Images aussi plus grandes qu'avant (voir
     largeur du conteneur, min(94vw, 640px) contre ~500px sur d1). */
  /* ==================================================================
     🆕 (retour Raphaël, session du 21-08-2026) Intro PLEIN ÉCRAN — carte
     titre + genèse muette ne jouent PLUS dans .cadre-scene (le petit
     cadre boxé du dialogue, largeur min(94vw,640px)) : c'était le bug
     signalé — seul cet encadré passait au noir, jamais l'écran entier,
     et ça restait visuellement "encastré" dans la structure habituelle
     d'une leçon (boutons, compteur...) au lieu d'être une séquence à
     part. #introPleinEcran est un calque fixed, inset:0, indépendant de
     tout le reste de la page (#sceneLecon reste caché — visibility:
     hidden, voir plus haut — tant que cette séquence n'est pas
     terminée). z-index sous .retour (300) : la flèche de sortie reste
     cliquable même pendant la genèse, un enfant doit toujours pouvoir
     quitter. object-fit: contain (pas cover) : les scènes de la genèse
     ne sont pas forcément pensées pour un cadrage bord-à-bord sur
     n'importe quel écran ; le "letterboxing" naturel (sur le fond de
     l'étape en cours — beige la plupart du temps, noir seulement pour
     le vide juste après la carte titre, voir .intro-noir plus bas)
     évite tout rognage imprévisible des personnages. */
  .intro-plein-ecran {
    position: fixed;
    inset: 0;
    z-index: 200;
    /* 🆕 (retour Raphaël, 21-08-2026) Fond beige (var(--fond), le fond
       habituel du site) par défaut, PAS noir : la carte titre
       (l1_titre_01.webp) a été extraite avec Gimp et ses bords
       ressortent pixelisés/frangés sur un fond noir. Le noir n'arrive
       qu'ENSUITE, une seule étape (le "vide" juste après la carte
       titre, voir GENESE plus bas, pas: null), via .intro-noir —
       ajoutée/retirée dynamiquement par jouerGenese() selon le champ
       `fond` de chaque étape. Le retour au beige à ce moment-là (juste
       avant l'illumination) EST l'effet recherché : le fond "apparaît"
       pour simuler la genèse du monde, puis reste beige pour de bon
       (illumination, Keb, Bek, et ensuite tout le dialogue habituel —
       jamais de retour au noir après ce point). background-color
       transitionne comme opacity pour que ce passage noir → beige soit
       un fondu, pas un saut brusque. */
    background: var(--fond);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: opacity 0.6s ease, background-color 1s ease;
  }
  .intro-plein-ecran.intro-noir { background: #000000; }
  .intro-plein-ecran.intro-cachee {
    opacity: 0;
    pointer-events: none;
  }
  .intro-image {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 0;
    min-height: 0;
    transition: opacity 0.6s ease;
  }
  .intro-image img { width: 100%; height: 100%; max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
  /* Même intention que l'ancien .scene-image-genese : une image pas
     encore prête doit rester un noir sobre, jamais un message d'erreur
     qui casserait l'ambiance de la genèse. */
  .intro-image .scene-image-repli { display: none; }

  /* ==================================================================
     🆕 (retour Raphaël, 22-08-2026) Écran de choix du personnage —
     "achat" à 0 P$/0 PB, à usage unique (voir choisir_personnage_initial
     côté Supabase et ecranChoixPersonnage() en JS). Demande explicite :
     disposition "digne des meilleurs sites du monde", pas d'impression
     d'amateurisme — cartes surélevées, ombre profonde, dégradé subtil,
     jamais un simple bouton texte.
     ================================================================== */
  .ecran-choix-personnage {
    position: absolute;
    inset: 0;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(24px, 5vh, 44px);
    padding: 24px;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.6s ease, transform 0.6s ease;
    pointer-events: none;
  }
  .ecran-choix-personnage.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }
  .choix-titre {
    font-family: 'Baloo 2', sans-serif;
    font-size: clamp(1.05rem, 2.6vw, 1.55rem);
    font-weight: 700;
    color: #FDFBF7;
    text-align: center;
    letter-spacing: 0.01em;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
  }
  .choix-cartes {
    display: flex;
    gap: clamp(20px, 4vw, 52px);
    flex-wrap: wrap;
    justify-content: center;
  }
  .choix-carte {
    all: unset;
    box-sizing: border-box;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    width: min(40vw, 210px);
    padding: 22px 16px 18px;
    background: linear-gradient(180deg, #FFFFFF 0%, var(--fond) 100%);
    border-radius: 26px;
    border: 2.5px solid transparent;
    box-shadow: 0 16px 36px rgba(0, 0, 0, 0.38), 0 2px 0 rgba(255, 255, 255, 0.5) inset;
    transition: transform 0.22s cubic-bezier(.2,.8,.3,1.2), box-shadow 0.22s ease, border-color 0.22s ease;
  }
  .choix-carte:hover, .choix-carte:focus-visible {
    transform: translateY(-6px) scale(1.035);
    border-color: var(--peche-fonce);
    box-shadow: 0 22px 46px rgba(0, 0, 0, 0.42), 0 2px 0 rgba(255, 255, 255, 0.5) inset;
  }
  .choix-carte:active { transform: translateY(-2px) scale(1.01); }
  /* Carte non retenue pendant l'appel réseau (voir ecranChoixPersonnage()
     en JS) — jamais un simple disabled visuel plat : on baisse
     l'opacité pour signaler "en cours", sans faire disparaître la carte. */
  .choix-carte.choix-en-cours { opacity: 0.5; pointer-events: none; }
  /* 🆕 (Raphaël, 22-08-2026, corrigé en profondeur) LA VRAIE CAUSE du
     décalage "Keb plus haut que Bek" n'était PAS l'ancrage (object-
     position) — déjà tenté ci-dessous avant et insuffisant — mais le
     fait que .choix-carte-image n'avait JAMAIS de hauteur réellement
     fixe : `aspect-ratio: 3/4` ne s'applique que si rien d'autre ne
     force la boîte plus haute, or l'image (dans le <div> ajouté par
     creerImage()) reste un enfant EN FLUX NORMAL avec `height:100%` —
     et comme la hauteur du parent est elle-même "auto" au moment du
     calcul, ce 100% ne veut rien dire : le navigateur retombe sur la
     taille intrinsèque de l'image, qui FORCE la boîte à s'agrandir
     pour l'accueillir (vérifié en isolant le rendu : la carte Keb
     mesurait 360px de haut, celle de Bek 323px, au lieu des 320px
     attendus des deux côtés — l'écart correspond exactement à la
     différence de format entre keb_neutre_01.webp 848×1264 et
     bek_neutre_03.webp 758×1012). Corrigé en sortant l'image du flux
     (position: absolute + inset: 0) : n'étant plus "du contenu" pour
     .choix-carte-image, elle ne peut plus l'agrandir, et aspect-ratio
     s'applique enfin pour de vrai — vérifié : les deux cartes font
     maintenant exactement 320px, nom et prix parfaitement alignés. */
  .choix-carte-image { width: 100%; aspect-ratio: 3 / 4; position: relative; overflow: hidden; }
  .choix-carte-image img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; object-position: center bottom; }
  .choix-carte-nom { font-size: 1.18rem; font-weight: 700; color: var(--brun-fonce); }
  .choix-carte-prix {
    font-size: 0.76rem;
    font-weight: 700;
    color: var(--peche-fonce);
    background: var(--peche-pale);
    border-radius: 999px;
    padding: 4px 14px;
  }

  /* Flash blanc bref au moment où le personnage choisi "apparaît" —
     rejoué à chaque fois via un retrait/ajout de .jouer (reflow forcé,
     voir reveilPersonnage() en JS), jamais une simple transition CSS
     qui ne se rejouerait pas d'une leçon à l'autre. */
  .flash-apparition {
    position: absolute;
    inset: 0;
    z-index: 3;
    background: #FFFFFF;
    opacity: 0;
    pointer-events: none;
  }
  .flash-apparition.jouer { animation: flashApparition 0.7s ease-out; }
  @keyframes flashApparition {
    0% { opacity: 0; }
    12% { opacity: 0.92; }
    100% { opacity: 0; }
  }
  /* 🆕 (Raphaël, 22-08-2026, retour) Variante pour le beat 'ebloui' de
     jouerBeats() — un éclat plus GRAND et plus tenu que celui de la
     naissance du personnage (.jouer ci-dessus) : monte à blanc plein,
     y reste un instant (c'est PENDANT ce plateau que l'image bascule
     en JS, invisible, voir jouerBeats()), puis ne s'efface que
     lentement — le personnage se révèle en sortant de la lumière, les
     mains sur les yeux, plutôt que de changer de pose à vue. */
  .flash-apparition.jouer-eblouissement { animation: flashEblouissement 0.9s ease-out; }
  @keyframes flashEblouissement {
    0% { opacity: 0; }
    15% { opacity: 1; }
    55% { opacity: 0.95; }
    100% { opacity: 0; }
  }
  /* Le personnage vient de naître, ne comprend pas encore où il est —
     un léger balancement, jamais une secousse comique. */
  .perso-deboussole { animation: persoDeboussole 2.6s ease-in-out infinite; }
  @keyframes persoDeboussole {
    0%, 100% { transform: rotate(0deg) translateY(0); }
    25% { transform: rotate(-1.4deg) translateY(-2px); }
    75% { transform: rotate(1.4deg) translateY(-2px); }
  }

  .main-salue {
    all: unset;
    box-sizing: border-box;
    position: absolute;
    z-index: 4;
    left: 50%;
    bottom: 12%;
    transform: translateX(-50%);
    width: min(24vw, 128px);
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease;
  }
  .main-salue.visible { opacity: 1; pointer-events: auto; }
  .main-salue-inner {
    display: block;
    animation: mainSalueOndulation 1.3s ease-in-out infinite;
    transition: transform 0.15s ease;
    transform-origin: 70% 85%;
  }
  .main-salue:hover .main-salue-inner,
  .main-salue:focus-visible .main-salue-inner { transform: scale(1.1); }
  .main-salue img { width: 100%; display: block; }
  @keyframes mainSalueOndulation {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(-14deg); }
  }

  /* 🆕 (retour Raphaël, 22-08-2026) "Bonjour !" affiché un instant au
     clic sur la main (voir attendreSalutMain() en JS, classe
     .visible ajoutée puis retirée) — notre salut lui-même porte le mot,
     avant même que le personnage ne nous remarque. */
  .main-salue-bonjour {
    position: absolute;
    left: 50%;
    bottom: 100%;
    transform: translateX(-50%) translateY(6px);
    margin-bottom: 8px;
    white-space: nowrap;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 1rem;
    color: var(--brun-fonce);
    background: #FFFFFF;
    border-radius: 999px;
    padding: 6px 16px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.22);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  .main-salue-bonjour.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
  /* 🆕 (Raphaël, 22-08-2026, session de reprise) Même hiérarchie
     visuelle que .intro-legende-trad : traduction en retrait, jamais
     aussi appuyée que le mot principal. */
  .main-salue-bonjour-trad {
    display: block;
    font-weight: 500;
    font-size: 0.75rem;
    color: var(--brun-clair);
    text-align: center;
  }

  /* 🆕 Légende sous l'image pendant la séquence de désorientation
     (voir jouerBeats() en JS) — français en avant, traduction en
     retrait, même hiérarchie visuelle que .pile-texte/.pile-trad. */
  .intro-legende {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 6%;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;

  .intro-legende-trad {

    font-weight: 600;
    /* 🆕 (Raphaël, 22-08-2026, retour) Était blanc translucide sur fond
       clair — quasi illisible (contraste signalé par Raphaël). La
       légende FR au-dessus reste blanche (elle a un text-shadow foncé
       qui la sauve), mais la traduction n'en avait pas : on passe donc
       à une couleur foncée, avec un léger halo clair pour rester
       lisible même si l'image derrière est sombre par endroits. */
    color: var(--brun-fonce);
    text-shadow: 0 1px 6px rgba(253, 251, 247, 0.9), 0 1px 6px rgba(253, 251, 247, 0.9);
    text-align: center;
  }
  /* Petit indicateur "touchez pour continuer" — les légendes avancent
     au tap (voir jouerBeats()), contrairement aux étapes chronométrées
     de GENESE_AVANT plus haut, parce qu'il y a ici du texte à lire. */
  .intro-legende::after {
    content: '';
    width: 8px;
    height: 8px;
    margin-top: 6px;
    border-radius: 50%;
    background: rgba(253, 251, 247, 0.6);
    animation: intoLegendePuce 1.4s ease-in-out infinite;
  }
  @keyframes intoLegendePuce {
    0%, 100% { opacity: 0.35; }
    50% { opacity: 1; }
  }

  /* 🆕 Corrige le bug "Keb apparaît en géant" : .intro-image est
     dimensionnée 100%/100% de #introPleinEcran (plein écran) — bon pour
     les scènes pleine page de la genèse (carte titre, illumination),
     bien trop grand pour un simple portrait de personnage debout. Cette
     classe modificatrice (ajoutée par reveilPersonnage()/jouerBeats(),
     jamais pour les étapes plein-cadre) plafonne sa taille et la
     centre, comme une vraie carte de personnage plutôt qu'un fond. */
  .intro-image.intro-image-personnage {
    width: min(52vw, 340px);
    height: min(62vh, 460px);
    margin: 0 auto;
    /* 🆕 (Raphaël, 22-08-2026) Devient le conteneur des DEUX calques
       empilés (généré + neutre, voir .intro-image-genere/-neutre-fondu
       juste en dessous et reveilPersonnage() en JS) le temps du
       fondu-enchaîné qui les relie. */
    position: relative;
  }

  /* ==================================================================
     🆕 (Raphaël, 22-08-2026) Matérialisation du personnage — demande
     explicite : la toute première image vue au clic doit être la
     version "généré" scintillante (keb_généré_01.webp / bek_générée_01.webp,
     déjà cataloguées dans IMAGES_PERSO.genere), avec une animation qui
     donne l'impression qu'elle vient d'apparaître spontanément — pas un
     simple fondu plat comme .flash-apparition seul le faisait jusqu'ici.
     Le calque "généré" se pose PAR-DESSUS le calque "neutre" (voir
     reveilPersonnage()), joue sa matérialisation, puis s'efface en
     fondu pour révéler la pose neutre déjà présente en dessous — un
     vrai fondu-enchaîné entre les deux images, jamais un saut de src.
     ================================================================== */
  .intro-image-genere,
  .intro-image-neutre-fondu {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .intro-image-genere img,
  .intro-image-neutre-fondu img { width: 100%; height: 100%; object-fit: contain; }

  /* Le calque neutre est déjà en place mais invisible : il n'a qu'à
     monter en opacité pendant que le calque généré redescend (voir
     .intro-image-stabilise plus bas) — les deux fondus se croisent. */
  .intro-image-neutre-fondu { opacity: 0; transition: opacity 0.9s ease; }
  .intro-image-neutre-fondu.visible { opacity: 1; }

  /* Matérialisation : part flou/surexposé/rétréci — comme un dessin qui
     prend forme dans un éclat de lumière — puis se stabilise net à sa
     taille réelle. `both` retient l'état final (net, échelle 1) tant
     qu'aucune autre classe ne prend le relais. */
  .intro-image-genere {
    animation: materialisationPersonnage 1.6s cubic-bezier(.16,.9,.28,1) both;
  }
  @keyframes materialisationPersonnage {
    0%   { opacity: 0;   transform: scale(0.78); filter: brightness(2.4) blur(9px) saturate(1.35); }
    45%  { opacity: 1;   transform: scale(1.06); filter: brightness(1.7) blur(1.5px) saturate(1.2); }
    75%  { opacity: 1;   transform: scale(0.99); filter: brightness(1.1) blur(0) saturate(1.05); }
    100% { opacity: 1;   transform: scale(1);    filter: brightness(1) blur(0) saturate(1); }
  }
  /* Une fois la matérialisation jouée, le fondu vers le neutre (piloté
     par reveilPersonnage()) reprend le contrôle de l'opacité via une
     transition ordinaire — `animation: none` rend la main pour que la
     transition ne soit pas écrasée par le fill-mode `both` ci-dessus. */
  .intro-image-genere.intro-image-stabilise {
    animation: none;
    opacity: 0;
    transition: opacity 0.9s ease;
  }
  @media (prefers-reduced-motion: reduce) {
    .intro-image-genere { animation: none; opacity: 1; filter: none; transform: none; }
    .intro-image-genere.intro-image-stabilise,
    .intro-image-neutre-fondu { transition: opacity 0.25s ease; }
  }

  .cadre-scene {
    position: relative;
    width: 100%;
    aspect-ratio: 1408 / 768;
    border-radius: 22px;
    overflow: hidden;
    background: #FFFFFF;
    box-shadow: 4px 4px 18px var(--ombre);
    /* 🆕 (retour Raphaël, 21-08-2026) Toute la scène est cliquable pour
       naviguer (moitié gauche = précédent, moitié droite = suivant —
       voir le JS plus bas) : le curseur le signale, même si le geste
       principal reste tactile sur mobile. */
    cursor: pointer;
  }

  .scene-image {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    /* 🆕 (Raphaël, 22-08-2026, retour) "Keb sort du cadre" — un flex
       item a par défaut min-height/min-width: auto, ce qui laisse son
       contenu (l'image) grandir jusqu'à SA taille intrinsèque et
       déborder le parent MALGRÉ width/height/object-fit ci-dessous.
       0 force le flex item à vraiment respecter les bornes de
       .cadre-scene (qui, lui, a overflow: hidden) plutôt que de
       compter uniquement sur object-fit. */
    min-width: 0;
    min-height: 0;
    /* 🆕 (retour Raphaël, 21-08-2026) Beige (var(--fond)), plus noir : le
       noir n'a plus lieu d'être ici — la genèse plein écran (seule
       séquence qui en avait besoin) joue désormais entièrement dans
       #introPleinEcran, plus haut. Un cadre de dialogue en attente
       d'image (ou son repli "Image not ready yet") doit rester dans le
       même univers visuel beige que le reste de la page, jamais un
       grand rectangle noir. */
    background: var(--fond);
    transition: opacity 0.6s ease;
  }
  /* 🆕 (Raphaël, 22-08-2026) contain plutôt que cover — c'est LA cause
     du "texte qui n'arrive pas au même niveau" : .cadre-scene est un
     cadre très large (aspect-ratio 1408/768 ≈ 1.83) alors que les
     portraits de personnages sont hauts et étroits (≈0.67–0.75, mesuré
     sur les derniers fichiers livrés : 758×1012, 848×1264, 896×1196).
     Avec `cover`, le navigateur met l'image à l'échelle sur sa LARGEUR
     puis rogne le surplus de hauteur centré à 50% — et comme ce surplus
     change d'une image à l'autre (poses/cadrages différents), la
     tranche visible du personnage (donc la hauteur de sa tête/bouche
     par rapport à la bulle, ancrée en bas) change elle aussi à chaque
     image. Avec `contain`, l'image est mise à l'échelle sur sa HAUTEUR
     (elle est toujours le facteur limitant ici, largeur ⇒ marge beige
     de chaque côté, jamais de rognage) — la tête, qui commence à peu
     près à la même fraction de hauteur sur tous ces portraits (~3–4 %
     depuis le haut, vérifié sur les 4 derniers fichiers), atterrit donc
     systématiquement au même niveau dans le cadre, quelle que soit
     l'image. */
  /* 🆕 (Raphaël, 22-08-2026, session du soir) Correctif du "Keb qui
     déborde/est rogné" signalé sur mobile : creerImage() (voir plus
     bas en JS) enveloppe TOUJOURS l'<img> dans un <div> intermédiaire
     sans classe. `.scene-image img` (règle ci-dessous) stylait bien
     l'image elle-même, mais PAS ce <div> — qui, comme enfant flex sans
     taille explicite, se dimensionne sur le contenu (shrink-to-fit).
     Résultat : le width:100%/height:100% de l'image n'avait aucune
     référence fiable (bloc englobant non déterminé ⇒ la spec CSS
     retombe sur la taille intrinsèque de l'image), donc l'image
     s'affichait à sa taille native (souvent bien plus grande que le
     cadre) et débordait, rognée par l'overflow:hidden de .cadre-scene
     — un cadrage différent à chaque image selon sa résolution/pose,
     exactement le symptôme rapporté. Cette règle force le <div>
     enveloppe (enfant direct de .scene-image) à occuper tout l'espace
     disponible, ce qui donne enfin à `object-fit: contain` une boîte
     réelle dans laquelle se caler. */
  .scene-image > div { width: 100%; height: 100%; min-width: 0; min-height: 0; display: flex; align-items: center; justify-content: center; }
  .scene-image img { width: 100%; height: 100%; max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
  .scene-image-repli {
    font-size: 0.85rem;
    color: var(--brun-clair);
    text-align: center;
    padding: 0 24px;
  }

  /* 🆕 (23-08-2026, correctif Raphaël) La refonte précédente retirait
     le fond de la bulle pour reprendre le geste graphique de
     .intro-legende (texte posé directement sur l'image). En test réel,
     ce texte sans support se superpose aux cheveux/au corps du
     personnage et devient illisible dès que la réplique dépasse
     quelques mots (ex. "Bek ? Papa ? Maman ?"). Fond restauré
     ci-dessous — mais PAS l'ancienne boîte blanche pleine-largeur
     ancrée en bas ("chat bubble d'appli" que Raphaël voulait quitter) :
     ici la bulle épouse la largeur du texte (width: fit-content, pas
     100%), reste ancrée en HAUT du cadre, et garde la hiérarchie
     typographique FR-en-avant déjà en place. Fond crème translucide +
     ombre douce, dans la palette du site plutôt qu'un blanc générique.
     Bug de positionnement corrigé au passage : .cote-keb/.cote-bek
     décalaient RÉELLEMENT la bulle à gauche/droite dès que le JS posait
     la classe (elBulle.className = 'bulle-dialogue cote-' + def.speaker,
     posée à CHAQUE étape 'texte') — pas "inertes" comme le commentaire
     précédent l'affirmait. Comme le personnage de cette leçon reste
     toujours centré, ce décalage plaçait la bulle à gauche ou à droite
     de l'image alors qu'elle devait rester au centre, aggravant le
     chevauchement. Les classes restent posées par le JS (utile le jour
     où une leçon positionne vraiment son personnage sur un côté) mais
     n'ont plus d'effet tant qu'un futur marqueur .perso-decale n'est
     pas ajouté explicitement. */
  .zone-bulle-overlay {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    bottom: auto;
    display: flex;
    padding: 7% 7% 0;
    pointer-events: none;
  }

  .bulle-dialogue {
    width: fit-content;
    max-width: 640px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    text-align: center;
    background: rgba(255, 253, 248, 0.94);

  }

  /* Ancres gauche/droite prêtes pour plus tard (voir note ci-dessus) —
     vraiment inertes maintenant tant que .perso-decale n'est pas posé. */
  .bulle-dialogue.perso-decale.cote-bek { text-align: right; align-items: flex-end; margin-left: auto; }
  .bulle-dialogue.perso-decale.cote-keb { text-align: left; align-items: flex-start; margin-right: auto; }

  .bulle-dialogue-fr {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: clamp(1.55rem, 6.5vw, 2.3rem);
    line-height: 1.08;
    color: var(--brun-fonce);
  }
  /* 🆕 (Raphaël, reprise de la demande d'origine) "Quand il y aura de
     plus longues répliques, il faudra penser à réduire la taille." —
     seuils appliqués par JS (voir tailleBulleSelonLongueur() dans
     rendreEtape()) sur le nombre de caractères de la réplique affichée,
     jamais sur le nombre de mots seul (un mot très long compte aussi).
     Paliers volontairement rapprochés du clamp de base — l'effet doit
     rester une nuance, pas un changement brutal de registre visuel. */
  .bulle-dialogue-fr.bulle-taille-moyenne { font-size: clamp(1.25rem, 5.2vw, 1.85rem); }
  .bulle-dialogue-fr.bulle-taille-longue { font-size: clamp(1.05rem, 4.3vw, 1.5rem); }
  /* Ponctuation expressive teintée pêche (…, ?, !) — voir
     accentuerPonctuation() en JS, appliquée juste après que
     mot-tooltip.js ait construit les mots cliquables. */
  .bulle-dialogue-fr .accent { color: var(--peche-fonce); }

  /* 🆕 Petit repère pulsé sous la légende, signalant qu'une traduction
     existe — même esprit que .intro-legende::after, mais posé UNE FOIS
     (pas ::after, puisqu'on doit pouvoir le masquer quand .bulle-trad
     est déjà ouverte) plutôt que de dupliquer le point sur chaque étape. */
  .bulle-dialogue-puce {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--peche-fonce);
    opacity: 0.4;
    animation: bulleDialoguePuce 1.4s ease-in-out infinite;
  }
  .bulle-trad.visible ~ .bulle-dialogue-puce,
  .bulle-dialogue-puce.cachee { display: none; }
  @keyframes bulleDialoguePuce {
    0%, 100% { opacity: 0.3; transform: scale(1); }
    50% { opacity: 0.9; transform: scale(1.25); }
  }

  /* 🆕 (Raphaël, 22-08-2026, retour) Raphaël aime la hiérarchie
     FR-en-avant / traduction-en-retrait de .intro-legende — reprise
     ici pour la RÉPLIQUE COURANTE de la bulle du dialogue (jamais vue
     auparavant : seule la pile "Ce qui a été dit" avait une
     traduction). Cachée par défaut (comme .pile-trad) : visible si le
     réglage global "Afficher la traduction" est actif (.visible,
     posée en JS dans rendreEtape()), ET en survol sur un appareil qui
     a une vraie souris (voir @media (hover: hover) plus bas) — sur
     mobile, seul le bouton global fait apparaître la traduction,
     puisqu'il n'y a pas de survol possible au doigt. */
  .bulle-trad {
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--brun-clair);
    max-height: 0;
    margin-top: 0;
    opacity: 0;
    overflow: hidden;
    cursor: pointer;
    text-align: center;
    transition: max-height 0.25s ease, opacity 0.2s ease, margin 0.25s ease;
  }
  .bulle-trad.visible { max-height: 60px; opacity: 1; margin-top: 4px; }
  @media (hover: hover) {
    .bulle-dialogue:hover .bulle-trad { max-height: 60px; opacity: 1; margin-top: 4px; }
  }

  /* Le mot testé — SEULEMENT pour le QCM (def.mot_cible), affiché ICI,
     dans le panneau, jamais sur l'image. Cadre neutre, pas un style de
     réplique : c'est un objet d'exercice, pas du récit. */
  .exercice-mot {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: 1.4rem;
    color: var(--brun-fonce);
    background: var(--fond);
    border-radius: 12px;
    padding: 6px 22px;
  }

  .exercice-consigne {
    font-size: 1rem;
    font-weight: 600;
    color: var(--brun);
    text-align: center;
  }

  /* 🆕 Indicateur "quelque chose à effleurer ici" — anneaux pulsés
     concentriques, jamais de texte (la scène reste propre). Centré par
     défaut ; positionnement fin possible plus tard par étape si un
     geste précis (ex. la main) doit être visé plus précisément. */
  .scene-tap-indicateur {
    position: absolute;
    left: 50%;
    bottom: 10%;
    transform: translateX(-50%);
    width: 46px;
    height: 46px;
    pointer-events: none;
  }
  .scene-tap-indicateur::before,
  .scene-tap-indicateur::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px solid var(--peche-fonce);
    animation: sceneTapAnneau 1.8s ease-out infinite;
  }
  .scene-tap-indicateur::after { animation-delay: 0.9s; }
  @keyframes sceneTapAnneau {
    0% { transform: scale(0.5); opacity: 0.9; }
    100% { transform: scale(1.6); opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .scene-tap-indicateur::before, .scene-tap-indicateur::after,
    .bulle-dialogue-puce { animation: none; opacity: 0.6; }
  }

  /* 🆕 (Raphaël, 23-08-2026, correctif) Geste de personnage pour un
     exercice QCM précis (ex. "Non.") — même esprit que .main-salue
     (main cliquable + petite bulle de mot), mais VISIBLE À L'INTÉRIEUR
     de .cadre-scene (pas en plein écran comme l'intro) : posée dans la
     marge beige à côté du personnage (object-fit: contain laisse
     toujours ~30% de marge de chaque côté d'un portrait haut/étroit —
     voir le commentaire détaillé sur .scene-image img plus haut),
     JAMAIS sur son visage. Remplace .scene-tap-indicateur pour CETTE
     étape précise (voir rendreEtape()/revelerExercice() en JS : les
     deux ne s'affichent jamais ensemble) — la main porte elle-même
     l'affordance "il y a quelque chose à toucher ici", l'ancien rond
     pulsé générique n'a plus de raison d'être en double. Positionnée à
     DROITE par convention (le personnage de cette leçon reste toujours
     centré, donc aucun risque de chevaucher une bulle-dialogue décalée
     .perso-decale). */
  .main-geste {
    all: unset;
    box-sizing: border-box;
    position: absolute;
    z-index: 4;
    right: 4%;
    bottom: 10%;
    width: min(19vw, 92px);
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
  }
  .main-geste.visible { opacity: 1; pointer-events: auto; }
  .main-geste-inner {
    display: block;
    animation: mainGesteSecoue 1s ease-in-out infinite;
    transform-origin: 50% 85%;
  }
  .main-geste img { width: 100%; display: block; filter: drop-shadow(2px 4px 8px var(--ombre)); }
  @keyframes mainGesteSecoue {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(-12deg); }
    75% { transform: rotate(12deg); }
  }
  /* Même hiérarchie que .main-salue-bonjour (mot posé au-dessus de la
     main, fond blanc, ombre marquée) — placée ici au-dessus, jamais en
     dessous, pour ne jamais finir masquée par #exercicePanneau qui
     apparaît sous .cadre-scene une fois révélé. */
  .main-geste-bulle {
    position: absolute;
    left: 50%;
    bottom: 100%;
    transform: translateX(-50%) translateY(6px);
    margin-bottom: 8px;
    white-space: nowrap;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 0.95rem;
    color: var(--brun-fonce);
    background: #FFFFFF;
    border-radius: 999px;
    padding: 5px 14px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.22);
  }
  .main-geste-bulle-trad {
    display: block;
    font-weight: 500;
    font-size: 0.72rem;
    color: var(--brun-clair);
    text-align: center;
  }
  @media (prefers-reduced-motion: reduce) {
    .main-geste-inner { animation: none; }
  }
  @media (max-width: 460px) {
    .main-geste { right: 3%; bottom: 8%; }
  }

  /* 🆕 (retour Raphaël, 23-08-2026, correctif position) Nuage de
     réflexion — remplace .scene-tap-indicateur pour l'étape 'prenom'
     (voir def.reflexion dans rendreEtape()). Repositionné en BAS, au
     MÊME endroit que .main-geste (voir son commentaire détaillé plus
     haut) — plus haut, dans la marge du haut, la bulle flottait sans
     aucun ancrage visuel évident ("on ne sait pas pourquoi elle se
     trouve là", retour Raphaël). En bas, dans la même zone que la main
     "Non", l'élève associe déjà cet endroit à "il y a quelque chose
     d'interactif ici" — cohérence entre les deux exercices plutôt
     qu'une nouvelle zone à apprendre. Le "?" dans le nuage a aussi été
     retiré : l'image elle-même (nuage de pensée) porte déjà tout le
     sens, le "?" surimposé était redondant. Flotte doucement plutôt que
     de trembler (secousse déjà prise par la main "Non") — un nuage de
     pensée qui s'agite nerveusement serait un contresens. */
  .main-reflexion {
    all: unset;
    box-sizing: border-box;
    position: absolute;
    z-index: 4;
    right: 4%;
    bottom: 10%;
    width: min(23vw, 110px);
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
  }
  .main-reflexion.visible { opacity: 1; pointer-events: auto; }
  .main-reflexion-inner {
    display: block;
    position: relative;
    animation: reflexionFlotte 2.6s ease-in-out infinite;
  }
  .main-reflexion-inner img { width: 100%; display: block; filter: drop-shadow(2px 4px 8px var(--ombre)); }
  @keyframes reflexionFlotte {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-7px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .main-reflexion-inner { animation: none; }
  }
  @media (max-width: 460px) {
    .main-reflexion { right: 3%; bottom: 8%; width: min(25vw, 96px); }
  }

  @media (max-width: 460px) {
    .exercice-mot { font-size: 1.2rem; padding: 5px 18px; }
    .exercice-consigne { font-size: 0.92rem; }
  }

  /* ---------- Étape finale ---------- */
  #etapeFin {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    width: 100%;
    text-align: center;
  }
  .message-fin { font-size: 1.15rem; font-weight: 700; }

  /* ==================================================================
     🆕 (retour Raphaël, 21-08-2026) Pile "Ce qui a été dit" + notes
     grammaticales — repris de dialogues/d1/index.html (seul endroit du
     site où ce mécanisme existait), demande explicite de Raphaël de ne
     PAS l'enlever, adapté au langage visuel de CETTE page (cadre plus
     large, palette identique, pas de bordure colorée sur les bulles —
     seuls les avatars-cercles portent la couleur du personnage).
     Même stratégie de reconstruction que d1 : à chaque Précédent, les
     deux piles sont vidées et reconstruites de 0 à l'étape courante
     plutôt que de retirer seulement le dernier élément (voir
     precedent() en JS) — plus simple, jamais de désynchronisation
     entre les deux piles.
     ================================================================== */
  .piles-conteneur {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .pile-entete {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin: 0 0 2px 4px;
  }
  .pile-section-titre {
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--brun-clair);
    margin: 0;
  }
  .btn-toggle-trad {
    flex-shrink: 0;
    border: 1.5px solid var(--peche);
    background: #FFFFFF;
    color: var(--brun-clair);
    border-radius: 999px;
    padding: 4px 12px;
    font-family: inherit;
    font-size: 0.7rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .btn-toggle-trad:hover { background: var(--peche-pale); }
  .btn-toggle-trad.actif { background: var(--peche-fonce); border-color: var(--peche-fonce); color: #FFFFFF; }

  .pile-dialogue { display: flex; flex-direction: column; }
  .pile-item {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    max-height: 0;
    opacity: 0;
    overflow: hidden;
    transition: max-height 0.3s ease, opacity 0.3s ease, margin 0.3s ease;
  }
  .pile-item.in { opacity: 1; max-height: 220px; margin: 7px 0; overflow: visible; }

  /* 🆕 C'est CE cercle — initiale du personnage qui parle (K/B), fond
     coloré selon --keb-couleur/--bek-couleur — que Raphaël appelle le
     "mécanisme de cercles avec l'acronyme du prénom". Cliquable : bascule
     la traduction de CETTE réplique seule, en plus du bouton global. */
  .pile-avatar {
    flex-shrink: 0;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.72rem;
    font-weight: 700;
    color: #FFFFFF;
    background: var(--c, var(--brun));
    cursor: pointer;
    border: none;
    padding: 0;
    font-family: inherit;
    transition: transform 0.15s ease;
  }
  .pile-avatar:hover { transform: scale(1.08); }
  .pile-item.keb { --c: var(--keb-couleur); }
  .pile-item.bek { --c: var(--bek-couleur); }
  /* La dernière étape de la démo ('Et toi, comment tu t'appelles\u00A0?')
     s'adresse directement à l'élève, ni Keb ni Bek — cercle neutre. */
  .pile-item.question { --c: var(--brun-clair); }

  .pile-corps { flex: 1; min-width: 0; }
  .pile-qui { display: block; font-size: 0.68rem; font-weight: 700; color: var(--c, var(--brun)); margin-bottom: 1px; }
  .pile-texte { font-size: 0.92rem; line-height: 1.35; cursor: pointer; }
  .pile-trad {
    font-size: 0.82rem;
    line-height: 1.3;
    color: var(--peche-fonce);
    font-style: italic;
    max-height: 0;
    opacity: 0;
    overflow: hidden;
    transition: max-height 0.25s ease, opacity 0.25s ease, margin 0.25s ease;
  }
  .pile-trad.visible { max-height: 80px; opacity: 1; margin-top: 3px; }

  /* Notes grammaticales — même langage visuel qu'un contenu d'aide
     ponctuel ailleurs sur le site (fond pêche-pâle) : jamais confondu
     avec une réplique du dialogue. Caché par défaut (#blocGrammaire),
     révélé seulement si l'étape courante porte un champ `grammaire`
     (voir ajouterNoteGrammaire() en JS) — aucune étape de CETTE leçon
     n'en a pour l'instant, le mécanisme reste prêt pour le jour où
     Raphaël en ajoutera (ex. « je m'appelle », « comment »...). */
  #blocGrammaire { display: none; }
  .pile-grammaire { display: flex; flex-direction: column; gap: 8px; }
  .grammaire-item {
    max-height: 0;
    opacity: 0;
    overflow: hidden;
    padding: 0 14px;
    background: var(--peche-pale);
    border-radius: 12px;
    font-size: 0.84rem;
    line-height: 1.45;
    color: var(--brun-fonce);
    transition: max-height 0.3s ease, opacity 0.3s ease, padding 0.3s ease;
  }
  .grammaire-item.in { opacity: 1; max-height: 160px; padding: 10px 14px; overflow: visible; }

  @media (max-width: 460px) {
    .bulle-dialogue { padding: 11px 18px; }
    .bulle-dialogue-fr { font-size: clamp(1.3rem, 7vw, 1.9rem); }
    .bulle-dialogue-fr.bulle-taille-moyenne { font-size: clamp(1.1rem, 5.8vw, 1.55rem); }
    .bulle-dialogue-fr.bulle-taille-longue { font-size: clamp(0.95rem, 4.8vw, 1.3rem); }
    .nav-bouton { padding: 9px 16px; font-size: 0.88rem; }
  }
</style>
</head>
<body>

<a class="retour" href="../parcours.html" aria-label="Retour au parcours">‹</a>

<!-- 🆕 Séquence d'ouverture (carte titre + genèse muette) — plein écran,
     complètement hors de la structure habituelle d'une leçon (voir
     commentaire CSS de .intro-plein-ecran ci-dessus). #sceneLecon reste
     caché derrière tant que cette séquence n'est pas terminée. -->
<div class="intro-plein-ecran" id="introPleinEcran">
  <div class="intro-image" id="introImage"></div>
  <div class="flash-apparition" id="flashApparition"></div>

  <!-- 🆕 (retour Raphaël, 22-08-2026) Légende de la séquence de
       désorientation (voir jouerBeats() en JS) — "Je suis où ?",
       "Où est [ami] ?", l'appel resté sans réponse. Sous l'image,
       jamais dans une bulle façon dialogue : ce ne sont pas encore de
       vraies répliques adressées à l'élève, juste le personnage qui
       pense/parle tout seul, avant même de nous remarquer. -->
  <div class="intro-legende" id="introLegende"></div>

  <!-- 🆕 (retour Raphaël, 22-08-2026) Écran de choix du personnage —
       "achat" à 0 P$/0 PB, à usage unique (voir choisir_personnage_initial
       côté Supabase). Superposé à #introImage, sur le fond noir du
       "vide" qui précède la genèse (voir GENESE_AVANT/CSS) : l'élève
       choisit QUI faire apparaître avant que quiconque existe. -->
  <div class="ecran-choix-personnage" id="ecranChoixPersonnage">
    <div class="choix-titre" id="choixPersonnageTitre">Qui veux-tu faire apparaître en premier ?</div>
    <div class="choix-cartes">
      <button type="button" class="choix-carte" data-personnage="Keb">
        <span class="choix-carte-image" id="choixImageKeb"></span>
        <span class="choix-carte-nom">Keb</span>
        <span class="choix-carte-prix">0 P$ / 0 PB</span>
      </button>
      <button type="button" class="choix-carte" data-personnage="Bek">
        <span class="choix-carte-image" id="choixImageBek"></span>
        <span class="choix-carte-nom">Bek</span>
        <span class="choix-carte-prix">0 P$ / 0 PB</span>
      </button>
    </div>
  </div>

  <!-- 🆕 Main qui salue — apparaît une fois la séquence de désorientation
       terminée ; cliquer dessus mime notre salut ("Bonjour !", affiché
       un instant près de la main — voir attendreSalutMain() en JS), ce
       qui fait que le personnage nous remarque enfin. -->
  <button type="button" class="main-salue" id="btnMainSalue" aria-label="Saluer">
    <span class="main-salue-inner" id="imageMainSalue"></span>
    <!-- 🆕 (Raphaël, 22-08-2026, session de reprise) Traduction ajoutée
         — c'était la seule réplique de personnage de toute la première
         partie (genèse/désorientation/salut) sans aucune traduction
         disponible, contrairement aux beats de désorientation
         (.intro-legende-trad) qui en ont depuis le début. Même patron
         visuel (petit texte en retrait sous la réplique principale). -->
    <span class="main-salue-bonjour" id="mainSalueBonjour">Bonjour !<span class="main-salue-bonjour-trad">Hello!</span></span>
  </button>
</div>

<div id="sceneLecon">

  <div class="cadre-scene">
    <div class="scene-image" id="sceneImage"></div>
    <div class="zone-bulle-overlay">
      <div class="bulle-dialogue" id="bulleDialogue"></div>
    </div>
    <!-- 🆕 (Raphaël, 23-08-2026, correctif) Geste de personnage — voir le
         commentaire CSS détaillé sur .main-geste. Peuplé/affiché
         seulement quand ETAPES[etape].geste existe (voir rendreEtape()
         en JS) ; un simple <span> (pas <button>) volontairement : le
         clic doit rester géré par l'écouteur unique sur .cadre-scene
         (même comportement "taper n'importe où sur la scène" que pour
         .scene-tap-indicateur), pas un second gestionnaire redondant. -->
    <div class="main-geste" id="mainGeste" aria-hidden="true">
      <span class="main-geste-bulle" id="mainGesteBulle"></span>
      <span class="main-geste-inner" id="imageMainGeste"></span>
    </div>
    <!-- 🆕 (retour Raphaël) Même esprit que .main-geste ci-dessus, mais
         pour un tout autre besoin : signaler "le personnage attend ta
         réponse" (étape 'prenom') plutôt que "voici un mot à tester".
         Un nuage de réflexion vaut mieux ici qu'une main pointée — il
         n'y a pas UN mot précis à désigner, juste une question en
         suspens. Voir .main-reflexion en CSS/le commentaire détaillé
         dans rendreEtape() pour pourquoi ceci remplace aussi
         .scene-tap-indicateur pour cette étape précise (le rond pulsé
         générique, centré, tombait mal sur ces portraits pleine
         hauteur — voir capture fournie par Raphaël, cercle atterrissant
         entre les jambes du personnage). -->
    <div class="main-reflexion" id="mainReflexion" aria-hidden="true">
      <span class="main-reflexion-inner" id="imageMainReflexion"></span>
    </div>
    <!-- 🆕 (Raphaël, 22-08-2026, soir) Indicateur "il y a quelque chose à
         effleurer ici" — affiché UNIQUEMENT le temps qu'un exercice
         (qcm/deduction/prenom) n'a pas encore été déclenché par
         l'élève (voir revelerExercice()/le gestionnaire de clic sur
         .cadre-scene plus bas). Jamais de texte dessus : un simple
         repère visuel, la scène reste propre.
         🆕 (23-08-2026) N'apparaît plus pour une étape qui a son propre
         .main-geste (voir rendreEtape()) — la main porte alors elle-même
         l'affordance, doubler avec le rond pulsé générique serait
         redondant. -->
    <div class="scene-tap-indicateur" id="sceneTapIndicateur" aria-hidden="true" style="display: none;"></div>
  </div>

  <div class="nav-bas" id="navDialogue">
    <button type="button" class="nav-bouton" id="btnPrecedent">‹</button>
    <span id="compteur"></span>
    <button type="button" class="nav-bouton nav-bouton-suivant" id="btnSuivant">Suivant</button>
  </div>

  <!-- 🆕 (retour Raphaël, 22-08-2026) Trois panneaux de réponse — un
       seul visible à la fois (voir rendreEtape() en JS selon def.type),
       remplacent #navDialogue le temps d'une étape qui attend une vraie
       réponse de l'élève plutôt qu'un simple "Suivant". Répondre fait
       AVANCER directement (voir validerReponseLibre()/les gestionnaires
       de clic plus bas) — pas de bouton "Suivant" séparé à cliquer en
       plus. -->
  <div class="zone-reponse" id="reponseBinaire" style="display: none;">
    <button type="button" class="bouton-choix" data-valeur="oui" id="btnOui">Oui</button>
    <button type="button" class="bouton-choix" data-valeur="non" id="btnNon">Non</button>
  </div>
  <div class="zone-reponse zone-reponse-niveau" id="reponseNiveau" style="display: none;"></div>

  <!-- 🆕 (Raphaël, 22-08-2026, soir) Panneau EXERCICE — conteneur
       distinct du récit (jamais superposé à l'image, jamais confondu
       avec une réplique ou une traduction — c'est ce qui posait
       problème avant). Caché par défaut ; revelerExercice() (JS) le
       fait apparaître une fois que l'élève a tapé/effleuré la scène
       (voir #sceneTapIndicateur ci-dessus et le gestionnaire de clic
       sur .cadre-scene plus bas). N'héberge QUE les trois étapes qui
       sont de VRAIS exercices (qcm/deduction/prenom) — binaire/niveau/
       genre restent des cases prédéterminées hors de ce panneau, comme
       avant (pas des exercices au sens de Raphaël). -->
  <div class="exercice-panneau" id="exercicePanneau" style="display: none;">
    <div class="exercice-etiquette" id="exerciceEtiquette">Exercice</div>
    <div class="exercice-mot" id="exerciceMot" style="display: none;"></div>
    <div class="exercice-consigne" id="exerciceConsigne"></div>
    <div class="zone-reponse" id="reponseLibre" style="display: none;">
      <input type="text" class="champ-prenom" id="champReponseLibre" autocomplete="off">
      <button type="button" class="nav-bouton nav-bouton-suivant" id="btnValiderReponseLibre">Continuer</button>
    </div>
    <!-- 🆕 (retour Raphaël, 22-08-2026) Panneau QCM — exercice de
         reconnaissance simple (voir construireQcm()/repondreQcm() en
         JS). #qcmChoix est rempli dynamiquement (un bouton par choix,
         dont un "blague" qui ne compte jamais comme un essai). -->
    <div class="zone-reponse" id="reponseQcm" style="display: none;">
      <div class="qcm-choix" id="qcmChoix"></div>
    </div>
    <!-- 🆕 Saisie du prénom — vraie capture (contrairement à l'ancienne
         séquence identite-eleve.js pré-menu, retirée pour ce chemin) :
         enregistrée via KebBekProgression.enregistrerIdentite(undefined,
         undefined, prenom, undefined) — les autres champs (genre,
         nationalité, adulte) restent intacts, captés plus tard par
         d'autres leçons (exercices.js "choix_identite"). Déplacé DANS
         #exercicePanneau (22-08-2026, soir) : c'est un exercice comme
         les deux autres, doit suivre la même mécanique de révélation. -->
    <div id="etapePrenom" style="display: none;">
      <input type="text" class="champ-prenom" id="champPrenom" autocomplete="given-name" maxlength="30">
      <button type="button" class="nav-bouton nav-bouton-suivant" id="btnValiderPrenom">Continuer</button>
    </div>
  </div>

  <!-- 🆕 Panneau "genre" — confirmation/production de "je suis un
       garçon"/"une fille" (voir rendreEtapeGenre() en JS). Pré-rempli
       silencieusement si l'identité de l'élève est déjà connue (voir
       identite-eleve.js) ; sert alors de simple pratique de vocabulaire,
       jamais une redemande. -->
  <div class="zone-reponse" id="reponseGenre" style="display: none;">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../progression.js"></script>
<script src="../mot-tooltip.js"></script>
<script>
(function () {
  'use strict';

  const CHAPITRE_ID = 'r1';

  // Même clé que sac-a-dos.js/menu-principal.js/dialogue-d1.html — un
  // seul réglage de langue pour tout le site.
  function langueActuelle() {
    try { return localStorage.getItem('kebbek_langue') || 'en'; } catch (e) { return 'en'; }
  }

  // 🆕 (demande de Raphaël, 20-08-2026 ; restructuré 21-08-2026 ; réduit
  // 22-08-2026) Carte titre puis noir complet — c'est tout ce que la
  // genèse fait maintenant de façon AUTOMATIQUE. Elle ne fait plus
  // naître Keb ET Bek ensemble : un seul personnage existe au sortir de
  // la Leçon 1, celui que l'élève choisit de faire apparaître (voir
  // #ecranChoixPersonnage, affiché juste après ce noir — ecranChoixPersonnage()
  // en JS). La suite de la genèse (flash + apparition + désorientation)
  // ne peut plus être une liste statique puisqu'elle dépend du choix :
  // voir reveilPersonnage(), qui la joue "à la main" une fois
  // personnageChoisi connu, avec les mêmes outils (creerImage(),
  // .intro-noir, attendre()).
  const GENESE_AVANT = [
    { img: 'l1_titre_01.webp', duree: 2200, fond: 'beige' },
    { img: null, duree: 900, fond: 'noir' }
  ];

  // 🆕 (retour Raphaël, 22-08-2026) Dialogue reconstruit en profondeur :
  // ce n'est plus une DÉMONSTRATION jouée entre Keb et Bek (l'ancienne
  // ETAPES, retirée), c'est une VRAIE conversation entre l'élève et le
  // seul personnage qu'il vient de faire apparaître (voir
  // #ecranChoixPersonnage/personnageChoisi). D'où ETAPES en `let`,
  // construite par etapesDialogue() une fois personnageChoisi connu
  // (le prénom du personnage doit apparaître dans son propre texte), et
  // non plus un tableau figé au chargement de la page.
  //
  // Chaque étape porte un `type` qui détermine à la fois ce qui
  // s'affiche dans la bulle ET quel panneau de réponse prend la place
  // de #navDialogue (voir rendreEtape()) :
  //   - 'texte'        : réplique du personnage, bulle + #navDialogue
  //                      habituel (Suivant), comme avant.
  //   - 'saisie_libre' : l'élève tape une réponse libre (#reponseLibre) ;
  //                      reconnue avec souplesse (accents/casse ignorés,
  //                      voir reponses_acceptees) mais JAMAIS bloquante —
  //                      répondre fait avancer, reconnue ou non.
  //   - 'prenom'       : réutilise #etapePrenom tel quel (balisage et
  //                      soumettrePrenom() déjà en place), simplement
  //                      intégré au fil des étapes plutôt que traité
  //                      comme un écran final séparé.
  //   - 'binaire'      : Oui/Non (#reponseBinaire).
  //   - 'niveau'       : les 6 boutons de niveau (#reponseNiveau,
  //                      construits une fois par construireBoutonsNiveau()).
  // `condition(reponses)` (optionnel) : étape sautée si elle renvoie
  // false — voir etapeApplicable()/precedent()/suivant(). Sert ici à
  // sauter la question du niveau si l'élève a répondu "non" à "Tu
  // parles français ?".
  let ETAPES = [];
  const reponses = { prenom: null, parleFrancais: null, niveau: null, quiParle: null, pronomDeduit: null, genreEleve: null };

  // 🆕 (retour Raphaël, 22-08-2026) Portée assumée pour tout le NOUVEAU
  // contenu ci-dessous (répliques, consignes d'exercice, choix) : FRANÇAIS
  // + ANGLAIS seulement, pas les 20 langues comme le reste du site.
  // Raison : ce n'est plus de la simple UI (boutons, titres d'écran) mais
  // du contenu narratif/pédagogique fin ("Bek ? Papa ? Maman ?", nuances
  // de niveau de langue) — le traduire correctement dans 19 langues
  // d'un coup, sans relecture humaine, risquait de livrer des
  // traductions de mauvaise qualité pour un public d'apprenants. Pour
  // toute langue autre que fr/en, l'anglais sert de repli (voir
  // texteEtape()/traductionPhrase() plus bas) — jamais un texte manquant,
  // mais pas encore une vraie traduction dans la langue de l'élève. Un
  // vrai chantier de traduction reste à faire avant mise en ligne.
  function normaliserTexte(s) {
    return (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
  }

  // 🆕 (session 22-08-2026, suite) Étape 'prenom' : contrairement à
  // deduction (une seule réponse_attendue figée), l'élève peut traduire
  // "My name is..." de PLUSIEURS façons correctes — "Je m'appelle X",
  // "Moi, c'est X", "Mon nom est X" (apostrophe droite ou courbe,
  // virgule ou non, casse libre — voir /i ci-dessous ; le reste de la
  // phrase, lui, N'EST PAS accent-insensible : seul le prénom capturé
  // est renvoyé tel que tapé, sans y toucher). Une réponse qui ne suit
  // AUCUN de ces trois patrons est jugée incorrecte, même si elle
  // contient un prénom plausible quelque part — l'exercice teste la
  // construction de la phrase, pas seulement le prénom (cohérent avec
  // "c'est un exercice de traduction long", pas une simple saisie).
  // Renvoie le prénom extrait (string) ou null si aucun patron ne colle.
  const PATRONS_PRENOM_TRADUIT = [
    /^(?:moi,?\s*)?je\s*m['\u2019]appelle\s+(.+)$/i,
    /^moi,?\s*c['\u2019]est\s+(.+)$/i,
    /^mon\s+nom\s+est\s+(.+)$/i
  ];
  function extrairePrenomDeTraduction(valeur) {
    const nettoye = (valeur || '').trim().replace(/[.!?]+$/g, '').trim();
    for (let i = 0; i < PATRONS_PRENOM_TRADUIT.length; i++) {
      const m = nettoye.match(PATRONS_PRENOM_TRADUIT[i]);
      if (m && m[1] && m[1].trim()) return m[1].trim();
    }
    return null;
  }

  // 🆕 Niveaux d'auto-évaluation (remplace l'ancienne liste à 6 paliers
  // "nul/mauvais/bon/..." — Raphaël a précisé la formulation exacte
  // attendue : cinq suites possibles à "Oui, je parle français...").
  const NIVEAUX = [
    { id: 'commence', fr: 'Mais je commence', en: 'But I\u2019m just starting' },
    { id: 'un_peu', fr: 'Juste un peu', en: 'Just a little' },
    { id: 'assez_bien', fr: 'Assez bien', en: 'Fairly well' },
    { id: 'tres_bien', fr: 'Très bien', en: 'Very well' },
    { id: 'presque_parfait', fr: 'Presque parfaitement', en: 'Almost perfectly' }
  ];

  function etapeApplicable(def) {
    return !def.condition || def.condition(reponses);
  }

  // Construit ETAPES une fois personnageChoisi connu — voir plus bas,
  // ecranChoixPersonnage(). 🆕 (retour Raphaël, 22-08-2026) Reconstruit
  // en profondeur autour du nouveau scénario : les Bonomes savaient déjà
  // parler français (ils ne l'apprennent pas de zéro), ils sont
  // seulement désorientés d'être désormais "numériques" et ne
  // comprennent pas ce qu'il leur est arrivé — c'est l'ÉLÈVE qui doit
  // les aider à comprendre, ce qui justifie pourquoi LUI doit d'abord
  // leur montrer qu'il/elle parle (un peu de) français. D'où
  // l'enchaînement : interpellé → "qui parle ?" (QCM) → présentations
  // (prénom, avec récompense) → "tu parles français ?" + niveau →
  // le personnage réalise qu'il EST vu, cherche son ami·e (déduction
  // le/la) → puis demande enfin qui est l'élève (genre).
  function etapesDialogue() {
    const perso = personnageChoisi === 'Bek' ? 'bek' : 'keb';
    const nomPerso = personnageChoisi || 'Keb';
    const nomAutre = personnageChoisi === 'Bek' ? 'Keb' : 'Bek';
    const imgInterpelle = imagePerso('interpelle');
    const imgBonjour = imagePerso('bonjour');
    const imgJeMappelle = imagePerso('je_mappelle');
    const imgMamanPapa = imagePerso('maman_papa');
    // 🆕 (23-08-2026) imgAttend — remplace l'ancienne main générique
    // '../images/lecons/main_non_01.webp' : pendant l'exercice QCM, on
    // reste sur LE PERSONNAGE (Keb ou Bek selon le choix), qui patiente
    // pendant que l'élève répond, plutôt que de couper brutalement sur
    // un gros plan de main sans lien avec la scène.
    const imgAttend = imagePerso('attend');
    // 🆕 (23-08-2026) imgAlorsTuEsQui — image dédiée fournie par Raphaël
    // pour le tout premier des deux beats désormais séparés ("Alors, tu
    // es qui ?"), distincte de imgJeMappelle qui reste utilisée pour le
    // second ("Hmm... moi, je m'appelle...").
    const imgAlorsTuEsQui = imagePerso('alors_tu_es_qui');
    return [
      { type: 'texte', speaker: perso, img: imgBonjour, texte: "Bonjour... ?", trad: { en: "Hello...?" } },
      { type: 'texte', speaker: perso, img: imgInterpelle, texte: "Qui... qui parle ?", trad: { en: "Who... who's there?" } },
      { type: 'texte', speaker: perso, img: imgMamanPapa, texte: nomAutre + " ? Papa ? Maman ?", trad: { en: nomAutre + "? Dad? Mom?" } },
      { type: 'qcm', cle_reponse: 'quiParle', img: imgAttend, recompense_id: 'r1_ex_qui_parle',
        mot_cible: 'Non.',
        // 🆕 (23-08-2026, correctif) Geste qui donne un CORPS au mot
        // testé — voir .main-geste en CSS/le commentaire dans
        // rendreEtape() : sans lui, l'élève ne voyait que le panneau
        // d'exercice, sans aucun lien visuel avec la scène ("on ne
        // comprend pas du tout où ce 'non' sort" — retour Raphaël).
        geste: { img: 'main_non_01.webp', mot: 'Non\u00a0!', trad: 'No!' },
        consigne: { fr: 'Que veut dire ce mot ?', en: 'What does this word mean?' },
        choix: [
          { id: 'oui', correcte: false, fr: 'Oui', en: 'Yes' },
          { id: 'non', correcte: true, fr: 'Non', en: 'No' },
          { id: 'aucun', correcte: false, fr: 'Aucun', en: 'None' },
          { id: 'pere_noel', correcte: false, blague: true, fr: 'Le Père Noël', en: 'Santa Claus' }
        ] },
      { type: 'texte', speaker: perso, img: imgAlorsTuEsQui, texte: "Alors, tu es qui ?",
        trad: { en: "So, who are you?" } },
      { type: 'texte', speaker: perso, img: imgJeMappelle, texte: "Hmm\u2026 moi, je m\u2019appelle " + nomPerso + ". Toi ?",
        trad: { en: "Hmm\u2026 my name is " + nomPerso + ". You?" } },
      // 🆕 (session 22-08-2026, suite) Exercice de traduction longue —
      // pas une simple saisie du prénom : l'élève traduit "My name
      // is..." en français, et c'est CE texte (analysé par
      // extrairePrenomDeTraduction()) qui fournit le prénom, jamais un
      // champ "prénom" nu. Voir rendreEtape()/soumettrePrenom() plus bas.
      { type: 'prenom', cle_reponse: 'prenom', recompense_id: 'r1_ex_prenom',
        img: imagePerso('alors_tu_es_qui_attente'), reflexion: true,
        // 🆕 (retour Raphaël, 23-08-2026) Consigne clarifiée : la formulation
        // précédente ("Écris la phrase complète") laissait croire qu'il
        // s'agissait d'un simple exercice de traduction — un·e élève
        // pouvait légitimement traduire mot à mot avec le prénom du
        // PERSONNAGE ("Je m'appelle Keb") sans comprendre qu'on attend
        // SON PROPRE prénom à lui/elle (voir extrairePrenomDeTraduction()
        // plus haut, qui accepte n'importe quel prénom dans le patron —
        // mécaniquement ça "marchait" déjà, mais le sens de l'exercice
        // n'était pas clair). Désormais explicite dans les deux langues.
        consigne: { fr: 'Comment dit-on « My name is\u2026 » en fran\u00e7ais\u00a0? \u00c9cris la phrase compl\u00e8te, avec TON vrai pr\u00e9nom \u00e0 toi\u00a0!', en: 'How do you say \u201cMy name is\u2026\u201d in French? Write the full sentence \u2014 using YOUR OWN real name!' } },
      { type: 'texte', speaker: perso, texte: function (r) { return (r.prenom || '') + ", " + (r.prenom || '') + ", tu parles fran\u00e7ais ?"; },
        trad: { en: function (r) { return (r.prenom || '') + ", " + (r.prenom || '') + ", do you speak French?"; } } },
      { type: 'binaire', cle_reponse: 'parleFrancais' },
      { type: 'niveau', cle_reponse: 'niveau', condition: function (r) { return r.parleFrancais === 'oui'; } },
      { type: 'texte', speaker: perso, texte: "Je vois...", trad: { en: "I see..." } },
      { type: 'texte', speaker: perso, texte: "Eh ! Tu me vois ? Moi, je ne te vois pas.", trad: { en: "Hey! You can see me? I can\u2019t see you." } },
      { type: 'texte', speaker: perso, texte: "Moi, je suis " + (perso === 'keb' ? "un gar\u00e7on." : "une fille."),
        trad: { en: "I\u2019m " + (perso === 'keb' ? "a boy." : "a girl.") } },
      { type: 'texte', speaker: perso, texte: "Je cherche mon ami" + (perso === 'keb' ? "e" : "") + ". C\u2019est " + (perso === 'keb' ? "une fille." : "un gar\u00e7on."),
        trad: { en: "I\u2019m looking for my friend. It\u2019s " + (perso === 'keb' ? "a girl." : "a boy.") } },
      { type: 'texte', speaker: perso, texte: (perso === 'keb' ? "Tu la vois ?" : "Tu le vois ?"),
        trad: { en: (perso === 'keb' ? "Can you see her?" : "Can you see him?") } },
      { type: 'deduction', cle_reponse: 'pronomDeduit', recompense_id: 'r1_ex_deduction',
        reponse_attendue: (perso === 'keb' ? 'la' : 'le'),
        consigne: { fr: 'Dans la phrase précédente, quel mot veut dire "her" (ou "him") ?', en: 'Which word in the previous sentence means "her" (or "him")?' } },
      { type: 'texte', speaker: perso, texte: "Ah, zut.", trad: { en: "Ah, darn." } },
      { type: 'texte', speaker: perso, texte: "Et toi, tu es... ?", trad: { en: "And you, are you...?" } },
      { type: 'genre', cle_reponse: 'genreEleve' },
      { type: 'texte', speaker: perso, texte: "On va bien s\u2019amuser ensemble !", trad: { en: "We\u2019re going to have so much fun together!" } }
    ];
  }

  const INTERFACE = {
    fr: { precedent: "Précédent", continuer: "Continuer", terminer: "Terminer", placeholderPrenom: "Ton prénom", messageFin: "Enchanté, {prenom} !", ceQuiAEteDit: "Ce qui a été dit", aRetenir: "À retenir", afficherTrad: "Afficher la traduction", cacherTrad: "Cacher la traduction", choixPersonnage: "Qui veux-tu faire apparaître en premier ?", prixChoixInitial: "0 P$ / 0 PB", exercice: "Exercice" },
    en: { precedent: "Back", continuer: "Continue", terminer: "Finish", placeholderPrenom: "Your first name", messageFin: "Nice to meet you, {prenom}!", ceQuiAEteDit: "What was said", aRetenir: "Good to know", afficherTrad: "Show translation", cacherTrad: "Hide translation", choixPersonnage: "Who do you want to bring to life first?", prixChoixInitial: "0 P$ / 0 PB", exercice: "Exercise" },
    es: { precedent: "Atrás", continuer: "Continuar", terminer: "Terminar", placeholderPrenom: "Tu nombre", messageFin: "¡Encantados, {prenom}!", ceQuiAEteDit: "Lo que se dijo", aRetenir: "Para recordar", afficherTrad: "Mostrar traducción", cacherTrad: "Ocultar traducción", choixPersonnage: "¿A quién quieres dar vida primero?", prixChoixInitial: "0 P$ / 0 PB", exercice: "Ejercicio" },

  // (connu seulement une fois l'étape 'prenom' passée, donc impossible à

  function texteEtape(def) {

  let traductionsVisiblesParDefaut = false;

  function ajouterLigneDialogue(def) {
    const div = document.createElement('div');
    div.className = 'pile-item ' + def.speaker;
    const trad = traductionPhrase(def);
    const avatar = document.createElement('button');

    avatar.textContent = INITIALES[def.speaker] || '?';
    const corps = document.createElement('div');
    corps.className = 'pile-corps';
    if (NOMS[def.speaker]) {
      const qui = document.createElement('span');
      qui.className = 'pile-qui';
      qui.textContent = NOMS[def.speaker];

    texte.className = 'pile-texte';

    if (trad) {

      if (traductionsVisiblesParDefaut) elTrad.classList.add('visible');

    div.appendChild(avatar);
    div.appendChild(corps);

      const bascule = () => elTrad.classList.toggle('visible');

      texte.addEventListener('click', bascule);

  // construit derrière lui.
  let genesePassee = false;
  function passerGenese() { genesePassee = true; }

  async function jouerGenese(liste) {
    const reduireMouvement = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    elIntroPleinEcran.addEventListener('click', passerGenese);
    for (let i = 0; i < liste.length && !genesePassee; i++) {
      const pas = liste[i];
      // 🆕 Bascule le fond (beige/noir) AVANT le fondu de l'image, pour
      // que le passage noir → beige (l'"apparition" du monde) et
      // l'arrivée de l'image d'illumination se fondent ensemble plutôt
      // que de se suivre sèchement.
      elIntroPleinEcran.classList.toggle('intro-noir', pas.fond === 'noir');
      elIntroImage.style.opacity = '0';
      await attendre(reduireMouvement ? 20 : 250);
      elIntroImage.innerHTML = '';
      if (pas.img) elIntroImage.appendChild(creerImage(pas.img));
      elIntroImage.style.opacity = '1';
      await attendre(reduireMouvement ? 40 : pas.duree);
    }
    elIntroPleinEcran.removeEventListener('click', passerGenese);
  }
