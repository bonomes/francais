<!-- Page à part entière, même situation que dialogues/d1/ et parcours.html :
     chargée directement par le navigateur (via le bouton "Première leçon"
     de index.html, ou depuis parcours.html une fois débloquée/verrouillée

     NIVEAUX). Vit À LA RACINE de lecons/ (un seul niveau sous la racine du
     site, PAS deux comme dialogues/d1/) — donc chemins relatifs en ../
     partout ci-dessous, jamais ../../. -->
<!-- ==================================================================
     🆕 (retour Raphaël, 21-08-2026) GUIDE DE RÉUTILISATION — pense-bête
     pour quiconque reprend CE fichier comme point de départ de
     lecon-02-*.html, lecon-03-*.html, etc. Trois catégories ci-dessous.
     Rien de tout ça n'est appliqué automatiquement — c'est un guide,
     pas un mécanisme : à chaque nouvelle leçon, relire cette liste et
     ajuster/retirer à la main ce qui ne s'applique pas.

     ✅ RÉUTILISABLE TEL QUEL (copier sans réfléchir) :
       - Les deux <link> ci-dessous (sac-a-dos.css, mot-tooltip.css) et
         les <script> en bas de page (progression.js, mot-tooltip.js) —

       - Le bouton .retour (coin supérieur gauche, mène à ../parcours.html).
       - Le patron .cadre-scene / .scene-image / .zone-bulle-overlay /
         .bulle-dialogue — bulle EN SUPERPOSITION sur l'image (jamais
         poussée), voir commentaire détaillé plus bas sur .cadre-scene.
       - Le patron .nav-bas / .nav-bouton (Précédent/Suivant + compteur).
       - langueActuelle() et la fonction creerImage() (repli gracieux
         "image pas encore prête" — le repli reste TOUJOURS silencieux/
         invisible dans une séquence plein écran type genèse, voir plus
         bas, mais s'affiche normalement dans le dialogue courant).
       - L'intégration mot-tooltip : window.KebBekMotTooltip.creerMotCliquable(texte, CHAPITRE_ID)
         pour chaque bulle de dialogue.
       - La convention de dossier images/lecons/ (UN SEUL dossier
         partagé pour toutes les leçons, PAS un sous-dossier par leçon —
         les noms de fichiers se préfixent par identifiant de leçon pour
         éviter les collisions, ex. lecon-01-rencontre_e1.webp).
       - #sceneLecon cité (visibility:hidden) tant qu'une intro n'est pas
         terminée, révélé ensuite via .revele — évite tout saut de mise

       - 🆕 (retour Raphaël, 21-08-2026 ; complété 22-08-2026) Navigation
         clavier (flèches gauche/droite) + tap direct sur la scène
         (moitié gauche = précédent, moitié droite = suivant) + glisser
         horizontalement (gauche = suivant, droite = précédent) — voir
         precedent()/suivant() et les écouteurs sur .cadre-scene
         (click + touchstart/touchend) — quatre déclencheurs équivalents
         aux boutons, coupés ensemble via `navigationActive` une fois le
         dialogue terminé.
       - 🆕 (Raphaël, 22-08-2026) .scene-image img EN object-fit: contain,
         JAMAIS cover — les portraits de personnages sont hauts/étroits
         et un cadre de scène large en `cover` rogne une hauteur
         différente selon l'image, ce qui fait "sauter" le niveau
         apparent du personnage (donc de la bulle) d'une image à
         l'autre. Voir le commentaire détaillé sur `.scene-image img`.
       - 🆕 (retour Raphaël, 21-08-2026) La pile "Ce qui a été dit" +
         notes grammaticales (#pilesConteneur, .pile-avatar, etc.) —
         repris de dialogues/d1/index.html, adapté au style de cette
         page. ajouterLigneDialogue()/ajouterNoteGrammaire() attendent
         un objet ETAPES[i] avec {speaker, texte, trad, grammaire?} —
         même format que d1. Pour une future leçon : copier NOMS/
         INITIALES (ajuster les couleurs --keb-couleur/--bek-couleur si
         de nouveaux personnages apparaissent) et les 4 clés INTERFACE
         (ceQuiAEteDit/aRetenir/afficherTrad/cacherTrad, déjà traduites
         dans les 20 langues du site). GRAMMAIRE reste à définir par
         leçon (voir plus bas, ETAPES/GRAMMAIRE) — vide pour l'instant

     🔁 RÉUTILISABLE COMME PATRON, MAIS À RÉÉCRIRE LE CONTENU :
       - CHAPITRE_ID (ici 'r1') — un identifiant unique par leçon,
         doit correspondre à l'entrée du chapitre dans parcours.html.
       - ETAPES / INTERFACE — structure de données réutilisable (tableau

       - La carte titre plein écran EN GÉNÉRAL (voir catégorie suivante
         pour le choix du mécanisme).

     🚫 SPÉCIFIQUE À CETTE LEÇON (r1), NE PAS COPIER TEL QUEL :
       - #introPleinEcran / GENESE / jouerGenese() — la séquence
         MUETTE, plein écran (titre sur fond beige → bref noir/vide →
         beige à nouveau pour l'illumination → Keb seul → Bek apparaît
         → ils se remarquent, voir le champ `fond` par étape dans
         GENESE) est la genèse DE L'UNIVERS DES BONOMES lui-même,
         propre à la toute première rencontre de Keb et Bek. Aucune
         autre leçon n'a de raison de la rejouer.
         → Pour une future leçon qui a simplement besoin d'une carte
         titre (SANS narration muette avant), utiliser plutôt le module
         partagé window.KebBekLeconIntro (voir ../lecon-intro.js/.css,
         volontairement NON chargés ici — voir juste en dessous). Il

         noir — la version noire pleine écran ci-dessus reste propre à
         r1 tant qu'aucune autre leçon n'a besoin du même traitement.
       - Si une future leçon a SA PROPRE narration spéciale (différente
         de la genèse), le patron #introPleinEcran ci-dessous peut
         servir de modèle technique (calque fixed/inset:0/fond noir,
         tableau d'étapes avec durées, tap-pour-passer) — mais son
         CONTENU (le tableau GENESE) doit être entièrement réécrit, ce
         n'est jamais un simple copier-coller.
       - #etapePrenom / soumettrePrenom() — capture du PRÉNOM
         uniquement, spécifique à cette toute première leçon (le reste
         de l'identité — genre, âge, nationalité — est capté plus tard
         par d'autres leçons via exercices.js "choix_identite", pas par
         ce mécanisme ad hoc).
     ================================================================== -->

<!-- 🆕 lecon-intro.css / .js volontairement NON chargés ici — cette

<style>
  :root {
    --fond: #F2EDE3;
    --brun: #665045;
    --brun-fonce: #4A3B33;
    --brun-clair: #8A7364;
    --peche: #F0A98B;
    --peche-fonce: #E08867;
    --peche-pale: rgba(240, 169, 139, 0.16);
    --peche-pale-vif: rgba(240, 169, 139, 0.30);
    --vert-clair: #EAF3DE;
    --ombre: rgba(102, 80, 69, 0.16);
    /* 🆕 (retour Raphaël, 21-08-2026) Couleurs Keb/Bek — mêmes valeurs
       que dialogues/d1/index.html (seule source jusqu'ici), reprises
       ici pour les avatars-cercles de la pile "Ce qui a été dit"
       (voir .pile-avatar plus bas). N'affectent PAS .bulle-dialogue :
       demande de Raphaël = adapter le mécanisme au style de CETTE
       page, pas importer tel quel la bulle bordée-colorée de d1. */
    --keb-couleur: #5B7FA6;
    --bek-couleur: #C97B3D;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--fond);
    font-family: 'Baloo 2', sans-serif;
    color: var(--brun-fonce);
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .retour {
    position: fixed;
    top: 14px;
    left: 14px;
    z-index: 300;
    width: 38px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: #FFFFFF;
    border: 1.5px solid var(--peche);
    color: var(--peche-fonce);
    font-size: 1.3rem;
    text-decoration: none;
    box-shadow: 2px 2px 8px var(--ombre);
  }

  /* ==================================================================
     Scène — contenu masqué (visibility:hidden, pas display:none : garde
     sa place dans la mise en page pour que rien ne saute une fois révélé)
     tant que la séquence plein écran (#introPleinEcran, carte titre +
     genèse) n'est pas terminée — voir demarrerLecon() en JS.
     ================================================================== */
  #sceneLecon {
    visibility: hidden;
    /* 🆕 (retour Raphaël, 21-08-2026) 640px → 1100px : le cadre restait
       petit même sur un grand écran d'ordinateur, où il y avait
       largement la place d'en profiter. 94vw inchangé pour le mobile
       (déjà fluide, pas concerné par ce plafond). */
    width: min(94vw, 1100px);
    margin: 64px auto 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }
  #sceneLecon.revele { visibility: visible; }

  /* ==================================================================
     🆕 Bulle EN SUPERPOSITION sur l'image (demande de Raphaël, session du
     20-08-2026) : contrairement à dialogue-d1.html (bulle avant l'image
     dans le flux normal, donc pousse l'image quand le texte passe à 2
     lignes), ici .zone-bulle-overlay est en position absolute PAR-DESSUS
     .scene-image — un cadre à hauteur fixe (aspect-ratio ci-dessous),
     jamais déplacé par la bulle, qui peut chevaucher son bas sans
     jamais rien pousser. Images aussi plus grandes qu'avant (voir
     largeur du conteneur, min(94vw, 640px) contre ~500px sur d1). */
  /* ==================================================================
     🆕 (retour Raphaël, session du 21-08-2026) Intro PLEIN ÉCRAN — carte
     titre + genèse muette ne jouent PLUS dans .cadre-scene (le petit
     cadre boxé du dialogue, largeur min(94vw,640px)) : c'était le bug
     signalé — seul cet encadré passait au noir, jamais l'écran entier,
     et ça restait visuellement "encastré" dans la structure habituelle
     d'une leçon (boutons, compteur...) au lieu d'être une séquence à
     part. #introPleinEcran est un calque fixed, inset:0, indépendant de
     tout le reste de la page (#sceneLecon reste caché — visibility:
     hidden, voir plus haut — tant que cette séquence n'est pas
     terminée). z-index sous .retour (300) : la flèche de sortie reste
     cliquable même pendant la genèse, un enfant doit toujours pouvoir
     quitter. object-fit: contain (pas cover) : les scènes de la genèse
     ne sont pas forcément pensées pour un cadrage bord-à-bord sur
     n'importe quel écran ; le "letterboxing" naturel (sur le fond de
     l'étape en cours — beige la plupart du temps, noir seulement pour
     le vide juste après la carte titre, voir .intro-noir plus bas)
     évite tout rognage imprévisible des personnages. */
  .intro-plein-ecran {
    position: fixed;
    inset: 0;
    z-index: 200;
    /* 🆕 (retour Raphaël, 21-08-2026) Fond beige (var(--fond), le fond
       habituel du site) par défaut, PAS noir : la carte titre
       (l1_titre_01.webp) a été extraite avec Gimp et ses bords
       ressortent pixelisés/frangés sur un fond noir. Le noir n'arrive
       qu'ENSUITE, une seule étape (le "vide" juste après la carte
       titre, voir GENESE plus bas, pas: null), via .intro-noir —
       ajoutée/retirée dynamiquement par jouerGenese() selon le champ
       `fond` de chaque étape. Le retour au beige à ce moment-là (juste
       avant l'illumination) EST l'effet recherché : le fond "apparaît"
       pour simuler la genèse du monde, puis reste beige pour de bon
       (illumination, Keb, Bek, et ensuite tout le dialogue habituel —
       jamais de retour au noir après ce point). background-color
       transitionne comme opacity pour que ce passage noir → beige soit
       un fondu, pas un saut brusque. */
    background: var(--fond);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: opacity 0.6s ease, background-color 1s ease;
  }
  .intro-plein-ecran.intro-noir { background: #000000; }
  .intro-plein-ecran.intro-cachee {
    opacity: 0;
    pointer-events: none;
  }
  .intro-image {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.6s ease;
  }
  .intro-image img { width: 100%; height: 100%; object-fit: contain; }
  /* Même intention que l'ancien .scene-image-genese : une image pas
     encore prête doit rester un noir sobre, jamais un message d'erreur
     qui casserait l'ambiance de la genèse. */
  .intro-image .scene-image-repli { display: none; }

  /* ==================================================================
     🆕 (retour Raphaël, 22-08-2026) Écran de choix du personnage —
     "achat" à 0 P$/0 PB, à usage unique (voir choisir_personnage_initial
     côté Supabase et ecranChoixPersonnage() en JS). Demande explicite :
     disposition "digne des meilleurs sites du monde", pas d'impression
     d'amateurisme — cartes surélevées, ombre profonde, dégradé subtil,
     jamais un simple bouton texte.
     ================================================================== */
  .ecran-choix-personnage {
    position: absolute;
    inset: 0;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(24px, 5vh, 44px);
    padding: 24px;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.6s ease, transform 0.6s ease;
    pointer-events: none;
  }
  .ecran-choix-personnage.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }
  .choix-titre {
    font-family: 'Baloo 2', sans-serif;
    font-size: clamp(1.05rem, 2.6vw, 1.55rem);
    font-weight: 700;
    color: #FDFBF7;
    text-align: center;
    letter-spacing: 0.01em;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
  }
  .choix-cartes {
    display: flex;
    gap: clamp(20px, 4vw, 52px);
    flex-wrap: wrap;
    justify-content: center;
  }
  .choix-carte {
    all: unset;
    box-sizing: border-box;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    width: min(40vw, 210px);
    padding: 22px 16px 18px;
    background: linear-gradient(180deg, #FFFFFF 0%, var(--fond) 100%);
    border-radius: 26px;
    border: 2.5px solid transparent;
    box-shadow: 0 16px 36px rgba(0, 0, 0, 0.38), 0 2px 0 rgba(255, 255, 255, 0.5) inset;
    transition: transform 0.22s cubic-bezier(.2,.8,.3,1.2), box-shadow 0.22s ease, border-color 0.22s ease;
  }
  .choix-carte:hover, .choix-carte:focus-visible {
    transform: translateY(-6px) scale(1.035);
    border-color: var(--peche-fonce);
    box-shadow: 0 22px 46px rgba(0, 0, 0, 0.42), 0 2px 0 rgba(255, 255, 255, 0.5) inset;
  }
  .choix-carte:active { transform: translateY(-2px) scale(1.01); }
  /* Carte non retenue pendant l'appel réseau (voir ecranChoixPersonnage()
     en JS) — jamais un simple disabled visuel plat : on baisse
     l'opacité pour signaler "en cours", sans faire disparaître la carte. */
  .choix-carte.choix-en-cours { opacity: 0.5; pointer-events: none; }
  /* 🆕 (Raphaël, 22-08-2026, corrigé en profondeur) LA VRAIE CAUSE du
     décalage "Keb plus haut que Bek" n'était PAS l'ancrage (object-
     position) — déjà tenté ci-dessous avant et insuffisant — mais le
     fait que .choix-carte-image n'avait JAMAIS de hauteur réellement
     fixe : `aspect-ratio: 3/4` ne s'applique que si rien d'autre ne
     force la boîte plus haute, or l'image (dans le <div> ajouté par
     creerImage()) reste un enfant EN FLUX NORMAL avec `height:100%` —
     et comme la hauteur du parent est elle-même "auto" au moment du
     calcul, ce 100% ne veut rien dire : le navigateur retombe sur la
     taille intrinsèque de l'image, qui FORCE la boîte à s'agrandir
     pour l'accueillir (vérifié en isolant le rendu : la carte Keb
     mesurait 360px de haut, celle de Bek 323px, au lieu des 320px
     attendus des deux côtés — l'écart correspond exactement à la
     différence de format entre keb_neutre_01.webp 848×1264 et
     bek_neutre_03.webp 758×1012). Corrigé en sortant l'image du flux
     (position: absolute + inset: 0) : n'étant plus "du contenu" pour
     .choix-carte-image, elle ne peut plus l'agrandir, et aspect-ratio
     s'applique enfin pour de vrai — vérifié : les deux cartes font
     maintenant exactement 320px, nom et prix parfaitement alignés. */
  .choix-carte-image { width: 100%; aspect-ratio: 3 / 4; position: relative; overflow: hidden; }
  .choix-carte-image img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; object-position: center bottom; }
  .choix-carte-nom { font-size: 1.18rem; font-weight: 700; color: var(--brun-fonce); }
  .choix-carte-prix {
    font-size: 0.76rem;
    font-weight: 700;
    color: var(--peche-fonce);
    background: var(--peche-pale);
    border-radius: 999px;
    padding: 4px 14px;
  }

  /* Flash blanc bref au moment où le personnage choisi "apparaît" —
     rejoué à chaque fois via un retrait/ajout de .jouer (reflow forcé,
     voir reveilPersonnage() en JS), jamais une simple transition CSS
     qui ne se rejouerait pas d'une leçon à l'autre. */
  .flash-apparition {
    position: absolute;
    inset: 0;
    z-index: 3;
    background: #FFFFFF;
    opacity: 0;
    pointer-events: none;
  }
  .flash-apparition.jouer { animation: flashApparition 0.7s ease-out; }
  @keyframes flashApparition {
    0% { opacity: 0; }
    12% { opacity: 0.92; }
    100% { opacity: 0; }
  }
  /* Le personnage vient de naître, ne comprend pas encore où il est —
     un léger balancement, jamais une secousse comique. */
  .perso-deboussole { animation: persoDeboussole 2.6s ease-in-out infinite; }
  @keyframes persoDeboussole {
    0%, 100% { transform: rotate(0deg) translateY(0); }
    25% { transform: rotate(-1.4deg) translateY(-2px); }
    75% { transform: rotate(1.4deg) translateY(-2px); }
  }

  .main-salue {
    all: unset;
    box-sizing: border-box;
    position: absolute;
    z-index: 4;
    left: 50%;
    bottom: 12%;
    transform: translateX(-50%);
    width: min(24vw, 128px);
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease;
  }
  .main-salue.visible { opacity: 1; pointer-events: auto; }
  .main-salue-inner {
    display: block;
    animation: mainSalueOndulation 1.3s ease-in-out infinite;
    transition: transform 0.15s ease;
    transform-origin: 70% 85%;
  }
  .main-salue:hover .main-salue-inner,
  .main-salue:focus-visible .main-salue-inner { transform: scale(1.1); }
  .main-salue img { width: 100%; display: block; }
  @keyframes mainSalueOndulation {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(-14deg); }
  }

  /* 🆕 (retour Raphaël, 22-08-2026) "Bonjour !" affiché un instant au
     clic sur la main (voir attendreSalutMain() en JS, classe
     .visible ajoutée puis retirée) — notre salut lui-même porte le mot,
     avant même que le personnage ne nous remarque. */
  .main-salue-bonjour {
    position: absolute;
    left: 50%;
    bottom: 100%;
    transform: translateX(-50%) translateY(6px);
    margin-bottom: 8px;
    white-space: nowrap;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 1rem;
    color: var(--brun-fonce);
    background: #FFFFFF;
    border-radius: 999px;
    padding: 6px 16px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.22);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  .main-salue-bonjour.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
  /* 🆕 (Raphaël, 22-08-2026, session de reprise) Même hiérarchie
     visuelle que .intro-legende-trad : traduction en retrait, jamais
     aussi appuyée que le mot principal. */
  .main-salue-bonjour-trad {
    display: block;
    font-weight: 500;
    font-size: 0.75rem;
    color: var(--brun-clair);
    text-align: center;
  }

  /* 🆕 Légende sous l'image pendant la séquence de désorientation
     (voir jouerBeats() en JS) — français en avant, traduction en
     retrait, même hiérarchie visuelle que .pile-texte/.pile-trad. */
  .intro-legende {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 6%;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 0 24px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease;
  }
  .intro-legende.visible { opacity: 1; }
  .intro-legende-fr {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: clamp(1.1rem, 3vw, 1.5rem);
    color: #FDFBF7;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
    text-align: center;
  }
  .intro-legende-trad {
    font-size: 0.85rem;
    color: rgba(253, 251, 247, 0.78);
    text-align: center;
  }
  /* Petit indicateur "touchez pour continuer" — les légendes avancent
     au tap (voir jouerBeats()), contrairement aux étapes chronométrées
     de GENESE_AVANT plus haut, parce qu'il y a ici du texte à lire. */
  .intro-legende::after {
    content: '';
    width: 8px;
    height: 8px;
    margin-top: 6px;
    border-radius: 50%;
    background: rgba(253, 251, 247, 0.6);
    animation: intoLegendePuce 1.4s ease-in-out infinite;
  }
  @keyframes intoLegendePuce {
    0%, 100% { opacity: 0.35; }
    50% { opacity: 1; }
  }

  /* 🆕 Corrige le bug "Keb apparaît en géant" : .intro-image est
     dimensionnée 100%/100% de #introPleinEcran (plein écran) — bon pour
     les scènes pleine page de la genèse (carte titre, illumination),
     bien trop grand pour un simple portrait de personnage debout. Cette
     classe modificatrice (ajoutée par reveilPersonnage()/jouerBeats(),
     jamais pour les étapes plein-cadre) plafonne sa taille et la
     centre, comme une vraie carte de personnage plutôt qu'un fond. */
  .intro-image.intro-image-personnage {
    width: min(52vw, 340px);
    height: min(62vh, 460px);
    margin: 0 auto;
    /* 🆕 (Raphaël, 22-08-2026) Devient le conteneur des DEUX calques
       empilés (généré + neutre, voir .intro-image-genere/-neutre-fondu
       juste en dessous et reveilPersonnage() en JS) le temps du
       fondu-enchaîné qui les relie. */
    position: relative;
  }

  /* ==================================================================
     🆕 (Raphaël, 22-08-2026) Matérialisation du personnage — demande
     explicite : la toute première image vue au clic doit être la
     version "généré" scintillante (keb_généré_01.webp / bek_générée_01.webp,
     déjà cataloguées dans IMAGES_PERSO.genere), avec une animation qui
     donne l'impression qu'elle vient d'apparaître spontanément — pas un
     simple fondu plat comme .flash-apparition seul le faisait jusqu'ici.
     Le calque "généré" se pose PAR-DESSUS le calque "neutre" (voir
     reveilPersonnage()), joue sa matérialisation, puis s'efface en
     fondu pour révéler la pose neutre déjà présente en dessous — un
     vrai fondu-enchaîné entre les deux images, jamais un saut de src.
     ================================================================== */
  .intro-image-genere,
  .intro-image-neutre-fondu {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .intro-image-genere img,
  .intro-image-neutre-fondu img { width: 100%; height: 100%; object-fit: contain; }

  /* Le calque neutre est déjà en place mais invisible : il n'a qu'à
     monter en opacité pendant que le calque généré redescend (voir
     .intro-image-stabilise plus bas) — les deux fondus se croisent. */
  .intro-image-neutre-fondu { opacity: 0; transition: opacity 0.9s ease; }
  .intro-image-neutre-fondu.visible { opacity: 1; }

  /* Matérialisation : part flou/surexposé/rétréci — comme un dessin qui
     prend forme dans un éclat de lumière — puis se stabilise net à sa
     taille réelle. `both` retient l'état final (net, échelle 1) tant
     qu'aucune autre classe ne prend le relais. */
  .intro-image-genere {
    animation: materialisationPersonnage 1.6s cubic-bezier(.16,.9,.28,1) both;
  }
  @keyframes materialisationPersonnage {
    0%   { opacity: 0;   transform: scale(0.78); filter: brightness(2.4) blur(9px) saturate(1.35); }
    45%  { opacity: 1;   transform: scale(1.06); filter: brightness(1.7) blur(1.5px) saturate(1.2); }
    75%  { opacity: 1;   transform: scale(0.99); filter: brightness(1.1) blur(0) saturate(1.05); }
    100% { opacity: 1;   transform: scale(1);    filter: brightness(1) blur(0) saturate(1); }
  }
  /* Une fois la matérialisation jouée, le fondu vers le neutre (piloté
     par reveilPersonnage()) reprend le contrôle de l'opacité via une
     transition ordinaire — `animation: none` rend la main pour que la
     transition ne soit pas écrasée par le fill-mode `both` ci-dessus. */
  .intro-image-genere.intro-image-stabilise {
    animation: none;
    opacity: 0;
    transition: opacity 0.9s ease;
  }
  @media (prefers-reduced-motion: reduce) {
    .intro-image-genere { animation: none; opacity: 1; filter: none; transform: none; }
    .intro-image-genere.intro-image-stabilise,
    .intro-image-neutre-fondu { transition: opacity 0.25s ease; }
  }

  .cadre-scene {
    position: relative;
    width: 100%;
    aspect-ratio: 1408 / 768;
    border-radius: 22px;
    overflow: hidden;
    background: #FFFFFF;
    box-shadow: 4px 4px 18px var(--ombre);
    /* 🆕 (retour Raphaël, 21-08-2026) Toute la scène est cliquable pour
       naviguer (moitié gauche = précédent, moitié droite = suivant —
       voir le JS plus bas) : le curseur le signale, même si le geste
       principal reste tactile sur mobile. */
    cursor: pointer;
  }

  .scene-image {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    /* 🆕 (retour Raphaël, 21-08-2026) Beige (var(--fond)), plus noir : le
       noir n'a plus lieu d'être ici — la genèse plein écran (seule
       séquence qui en avait besoin) joue désormais entièrement dans
       #introPleinEcran, plus haut. Un cadre de dialogue en attente
       d'image (ou son repli "Image not ready yet") doit rester dans le
       même univers visuel beige que le reste de la page, jamais un
       grand rectangle noir. */
    background: var(--fond);
    transition: opacity 0.6s ease;
  }
  /* 🆕 (Raphaël, 22-08-2026) contain plutôt que cover — c'est LA cause
     du "texte qui n'arrive pas au même niveau" : .cadre-scene est un
     cadre très large (aspect-ratio 1408/768 ≈ 1.83) alors que les
     portraits de personnages sont hauts et étroits (≈0.67–0.75, mesuré
     sur les derniers fichiers livrés : 758×1012, 848×1264, 896×1196).
     Avec `cover`, le navigateur met l'image à l'échelle sur sa LARGEUR
     puis rogne le surplus de hauteur centré à 50% — et comme ce surplus
     change d'une image à l'autre (poses/cadrages différents), la
     tranche visible du personnage (donc la hauteur de sa tête/bouche
     par rapport à la bulle, ancrée en bas) change elle aussi à chaque
     image. Avec `contain`, l'image est mise à l'échelle sur sa HAUTEUR
     (elle est toujours le facteur limitant ici, largeur ⇒ marge beige
     de chaque côté, jamais de rognage) — la tête, qui commence à peu
     près à la même fraction de hauteur sur tous ces portraits (~3–4 %
     depuis le haut, vérifié sur les 4 derniers fichiers), atterrit donc
     systématiquement au même niveau dans le cadre, quelle que soit
     l'image. */
  .scene-image img { width: 100%; height: 100%; object-fit: contain; }
  .scene-image-repli {
    font-size: 0.85rem;
    color: var(--brun-clair);
    text-align: center;
    padding: 0 24px;
  }

  #navDialogue,
  .zone-bulle-overlay,
  .piles-conteneur {
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease;
  }
  #navDialogue.genese-terminee,
  .zone-bulle-overlay.genese-terminee,
  .piles-conteneur.genese-terminee { opacity: 1; pointer-events: auto; }
  .zone-bulle-overlay.genese-terminee .bulle-dialogue { pointer-events: auto; }

  .zone-bulle-overlay {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    padding: 0 16px 16px;
    pointer-events: none; /* laisse les clics traverser vers l'image en dehors de la bulle elle-même */
  }
  .zone-bulle-overlay .bulle-dialogue { pointer-events: auto; }

  .bulle-dialogue {
    max-width: 88%;
    background: rgba(255, 255, 255, 0.94);
    backdrop-filter: blur(2px);
    border-radius: 18px;
    padding: 12px 18px;
    font-size: 1.05rem;
    line-height: 1.4;
    box-shadow: 0 6px 20px rgba(74, 59, 51, 0.18);
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.25s ease, transform 0.25s cubic-bezier(.2,.8,.3,1.2);
  }
  .bulle-dialogue.in { opacity: 1; transform: translateY(0); }
  .bulle-dialogue.cote-bek { margin-left: auto; }
  .bulle-dialogue.cote-question { margin: 0 auto; text-align: center; font-weight: 700; }

  .nav-bas {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    gap: 12px;
  }
  .nav-bouton {
    font-family: inherit;
    font-weight: 700;
    font-size: 0.95rem;
    padding: 10px 22px;
    border-radius: 999px;
    border: 1.5px solid var(--peche);
    background: #FFFFFF;
    color: var(--brun-fonce);
    cursor: pointer;
    box-shadow: 0 3px 0 0 var(--peche), 2px 3px 8px var(--ombre);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .nav-bouton:hover { transform: translateY(-1px); }
  .nav-bouton:active { transform: translateY(3px); box-shadow: 0 0 0 0 var(--peche), 1px 1px 4px var(--ombre); }
  .nav-bouton:disabled { opacity: 0.4; cursor: default; box-shadow: none; transform: none; }
  .nav-bouton-suivant { background: var(--peche-fonce); border-color: var(--peche-fonce); color: #FFFFFF; box-shadow: 0 3px 0 0 var(--brun-fonce), 2px 3px 8px var(--ombre); }
  .nav-bouton-suivant:active { box-shadow: 0 0 0 0 var(--brun-fonce), 1px 1px 4px var(--ombre); }
  #compteur { font-size: 0.85rem; color: var(--brun-clair); font-weight: 700; }

  /* ---------- Étape prénom ---------- */
  #etapePrenom {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    width: 100%;
  }
  .champ-prenom {
    font-family: inherit;
    font-size: 1.1rem;
    text-align: center;
    padding: 12px 20px;
    border-radius: 999px;
    border: 1.5px solid var(--peche);
    width: min(80%, 320px);
  }
  .champ-prenom:focus { outline: 2px solid var(--peche-fonce); outline-offset: 2px; }

  /* ---------- Panneaux de réponse (saisie libre / oui-non / niveau) ----------
     🆕 (retour Raphaël, 22-08-2026) Remplacent #navDialogue le temps
     d'une étape qui attend une vraie réponse plutôt qu'un "Suivant" —
     voir rendreEtape() en JS. Cachés par défaut (display:none inline,
     posé directement dans le HTML) : c'est rendreEtape() qui bascule
     entre les quatre panneaux (#navDialogue, #reponseLibre,
     #reponseBinaire, #reponseNiveau) selon le type de l'étape courante. */
  .zone-reponse {
    display: flex;
    gap: 12px;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    width: 100%;
  }
  .zone-reponse-niveau { gap: 10px; }
  .bouton-choix {
    font-family: inherit;
    font-size: 0.92rem;
    font-weight: 700;
    color: var(--brun-fonce);
    background: #FFFFFF;
    border: 1.5px solid var(--peche);
    border-radius: 999px;
    padding: 10px 20px;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease, color 0.15s ease;
  }
  .bouton-choix:hover { background: var(--peche-pale); }
  .bouton-choix:active { background: var(--peche-fonce); border-color: var(--peche-fonce); color: #FFFFFF; transform: translateY(1px); }

  /* 🆕 (retour Raphaël, 22-08-2026) États de rétroaction des exercices
     (QCM et déduction) — voir repondreQcm()/validerReponseLibre() en
     JS. Rouge bref (pas permanent : l'élève doit pouvoir réessayer sans
     qu'un bouton reste marqué comme "cassé"), vert au moment précis de
     la bonne réponse avant l'avancée automatique. */
  .bouton-choix.qcm-mauvais { background: #F6D8D2; border-color: #D97862; color: #8C4636; animation: qcmSecousse 0.3s ease; }
  .bouton-choix.qcm-correct { background: #DCEFC9; border-color: #7FAE4B; color: #3E5A24; }
  .bouton-choix:disabled { opacity: 0.5; cursor: default; }
  @keyframes qcmSecousse {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
  }
  /* Pré-sélection silencieuse (identité déjà connue, voir rendreEtapeGenre())
     — distincte de .qcm-correct : ici on ne "félicite" pas, on reflète
     juste ce que l'élève a déjà dit à propos de lui-même ailleurs. */
  .bouton-choix.pre-rempli { background: var(--peche-pale); border-color: var(--peche); }

  .qcm-choix {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }

  /* ---------- Étape finale ---------- */
  #etapeFin {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    width: 100%;
    text-align: center;
  }
  .message-fin { font-size: 1.15rem; font-weight: 700; }

  /* ==================================================================
     🆕 (retour Raphaël, 21-08-2026) Pile "Ce qui a été dit" + notes
     grammaticales — repris de dialogues/d1/index.html (seul endroit du
     site où ce mécanisme existait), demande explicite de Raphaël de ne
     PAS l'enlever, adapté au langage visuel de CETTE page (cadre plus
     large, palette identique, pas de bordure colorée sur les bulles —
     seuls les avatars-cercles portent la couleur du personnage).
     Même stratégie de reconstruction que d1 : à chaque Précédent, les
     deux piles sont vidées et reconstruites de 0 à l'étape courante
     plutôt que de retirer seulement le dernier élément (voir
     precedent() en JS) — plus simple, jamais de désynchronisation
     entre les deux piles.
     ================================================================== */
  .piles-conteneur {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .pile-entete {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin: 0 0 2px 4px;
  }
  .pile-section-titre {
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--brun-clair);
    margin: 0;
  }
  .btn-toggle-trad {
    flex-shrink: 0;
    border: 1.5px solid var(--peche);
    background: #FFFFFF;
    color: var(--brun-clair);
    border-radius: 999px;
    padding: 4px 12px;
    font-family: inherit;
    font-size: 0.7rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .btn-toggle-trad:hover { background: var(--peche-pale); }
  .btn-toggle-trad.actif { background: var(--peche-fonce); border-color: var(--peche-fonce); color: #FFFFFF; }

  .pile-dialogue { display: flex; flex-direction: column; }
  .pile-item {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    max-height: 0;
    opacity: 0;
    overflow: hidden;
    transition: max-height 0.3s ease, opacity 0.3s ease, margin 0.3s ease;
  }
  .pile-item.in { opacity: 1; max-height: 220px; margin: 7px 0; overflow: visible; }

  /* 🆕 C'est CE cercle — initiale du personnage qui parle (K/B), fond
     coloré selon --keb-couleur/--bek-couleur — que Raphaël appelle le
     "mécanisme de cercles avec l'acronyme du prénom". Cliquable : bascule
     la traduction de CETTE réplique seule, en plus du bouton global. */
  .pile-avatar {
    flex-shrink: 0;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.72rem;
    font-weight: 700;
    color: #FFFFFF;
    background: var(--c, var(--brun));
    cursor: pointer;
    border: none;
    padding: 0;
    font-family: inherit;
    transition: transform 0.15s ease;
  }
  .pile-avatar:hover { transform: scale(1.08); }
  .pile-item.keb { --c: var(--keb-couleur); }
  .pile-item.bek { --c: var(--bek-couleur); }
  /* La dernière étape de la démo ('Et toi, comment tu t'appelles\u00A0?')
     s'adresse directement à l'élève, ni Keb ni Bek — cercle neutre. */
  .pile-item.question { --c: var(--brun-clair); }

  .pile-corps { flex: 1; min-width: 0; }
  .pile-qui { display: block; font-size: 0.68rem; font-weight: 700; color: var(--c, var(--brun)); margin-bottom: 1px; }
  .pile-texte { font-size: 0.92rem; line-height: 1.35; cursor: pointer; }
  .pile-trad {
    font-size: 0.82rem;
    line-height: 1.3;
    color: var(--peche-fonce);
    font-style: italic;
    max-height: 0;
    opacity: 0;
    overflow: hidden;
    transition: max-height 0.25s ease, opacity 0.25s ease, margin 0.25s ease;
  }
  .pile-trad.visible { max-height: 80px; opacity: 1; margin-top: 3px; }

  /* Notes grammaticales — même langage visuel qu'un contenu d'aide
     ponctuel ailleurs sur le site (fond pêche-pâle) : jamais confondu
     avec une réplique du dialogue. Caché par défaut (#blocGrammaire),
     révélé seulement si l'étape courante porte un champ `grammaire`
     (voir ajouterNoteGrammaire() en JS) — aucune étape de CETTE leçon
     n'en a pour l'instant, le mécanisme reste prêt pour le jour où
     Raphaël en ajoutera (ex. « je m'appelle », « comment »...). */
  #blocGrammaire { display: none; }
  .pile-grammaire { display: flex; flex-direction: column; gap: 8px; }
  .grammaire-item {
    max-height: 0;
    opacity: 0;
    overflow: hidden;
    padding: 0 14px;
    background: var(--peche-pale);
    border-radius: 12px;
    font-size: 0.84rem;
    line-height: 1.45;
    color: var(--brun-fonce);
    transition: max-height 0.3s ease, opacity 0.3s ease, padding 0.3s ease;
  }
  .grammaire-item.in { opacity: 1; max-height: 160px; padding: 10px 14px; overflow: visible; }

  @media (max-width: 460px) {
    .bulle-dialogue { font-size: 0.95rem; padding: 10px 14px; }
    .nav-bouton { padding: 9px 16px; font-size: 0.88rem; }
  }
</style>
</head>
<body>

<a class="retour" href="../parcours.html" aria-label="Retour au parcours">‹</a>

<!-- 🆕 Séquence d'ouverture (carte titre + genèse muette) — plein écran,
     complètement hors de la structure habituelle d'une leçon (voir
     commentaire CSS de .intro-plein-ecran ci-dessus). #sceneLecon reste
     caché derrière tant que cette séquence n'est pas terminée. -->
<div class="intro-plein-ecran" id="introPleinEcran">
  <div class="intro-image" id="introImage"></div>
  <div class="flash-apparition" id="flashApparition"></div>

  <!-- 🆕 (retour Raphaël, 22-08-2026) Légende de la séquence de
       désorientation (voir jouerBeats() en JS) — "Je suis où ?",
       "Où est [ami] ?", l'appel resté sans réponse. Sous l'image,
       jamais dans une bulle façon dialogue : ce ne sont pas encore de
       vraies répliques adressées à l'élève, juste le personnage qui
       pense/parle tout seul, avant même de nous remarquer. -->
  <div class="intro-legende" id="introLegende"></div>

  <!-- 🆕 (retour Raphaël, 22-08-2026) Écran de choix du personnage —
       "achat" à 0 P$/0 PB, à usage unique (voir choisir_personnage_initial
       côté Supabase). Superposé à #introImage, sur le fond noir du
       "vide" qui précède la genèse (voir GENESE_AVANT/CSS) : l'élève
       choisit QUI faire apparaître avant que quiconque existe. -->
  <div class="ecran-choix-personnage" id="ecranChoixPersonnage">
    <div class="choix-titre" id="choixPersonnageTitre">Qui veux-tu faire apparaître en premier ?</div>
    <div class="choix-cartes">
      <button type="button" class="choix-carte" data-personnage="Keb">
        <span class="choix-carte-image" id="choixImageKeb"></span>
        <span class="choix-carte-nom">Keb</span>
        <span class="choix-carte-prix">0 P$ / 0 PB</span>
      </button>
      <button type="button" class="choix-carte" data-personnage="Bek">
        <span class="choix-carte-image" id="choixImageBek"></span>
        <span class="choix-carte-nom">Bek</span>
        <span class="choix-carte-prix">0 P$ / 0 PB</span>
      </button>
    </div>
  </div>

  <!-- 🆕 Main qui salue — apparaît une fois la séquence de désorientation
       terminée ; cliquer dessus mime notre salut ("Bonjour !", affiché
       un instant près de la main — voir attendreSalutMain() en JS), ce
       qui fait que le personnage nous remarque enfin. -->
  <button type="button" class="main-salue" id="btnMainSalue" aria-label="Saluer">
    <span class="main-salue-inner" id="imageMainSalue"></span>
    <!-- 🆕 (Raphaël, 22-08-2026, session de reprise) Traduction ajoutée
         — c'était la seule réplique de personnage de toute la première
         partie (genèse/désorientation/salut) sans aucune traduction
         disponible, contrairement aux beats de désorientation
         (.intro-legende-trad) qui en ont depuis le début. Même patron
         visuel (petit texte en retrait sous la réplique principale). -->
    <span class="main-salue-bonjour" id="mainSalueBonjour">Bonjour !<span class="main-salue-bonjour-trad">Hello!</span></span>
  </button>
</div>

<div id="sceneLecon">

  <div class="cadre-scene">
    <div class="scene-image" id="sceneImage"></div>
    <div class="zone-bulle-overlay">
      <div class="bulle-dialogue" id="bulleDialogue"></div>
    </div>
  </div>

  <div class="nav-bas" id="navDialogue">
    <button type="button" class="nav-bouton" id="btnPrecedent">‹</button>
    <span id="compteur"></span>
    <button type="button" class="nav-bouton nav-bouton-suivant" id="btnSuivant">Suivant</button>
  </div>

  <!-- 🆕 (retour Raphaël, 22-08-2026) Trois panneaux de réponse — un
       seul visible à la fois (voir rendreEtape() en JS selon def.type),
       remplacent #navDialogue le temps d'une étape qui attend une vraie
       réponse de l'élève plutôt qu'un simple "Suivant". Répondre fait
       AVANCER directement (voir validerReponseLibre()/les gestionnaires
       de clic plus bas) — pas de bouton "Suivant" séparé à cliquer en
       plus. #etapePrenom (plus bas) suit le même principe mais réutilise
       son propre balisage existant, inchangé. -->
  <div class="zone-reponse" id="reponseLibre" style="display: none;">

<script>

  let ETAPES = [];

  // 🆕 (retour Raphaël, 22-08-2026) Portée assumée pour tout le NOUVEAU

  // Raison : ce n'est plus de la simple UI (boutons, titres d'écran) mais
  // du contenu narratif/pédagogique fin ("Bek ? Papa ? Maman ?", nuances

  // traductions de mauvaise qualité pour un public d'apprenants. Pour
  // toute langue autre que fr/en, l'anglais sert de repli (voir
  // texteEtape()/traductionPhrase() plus bas) — jamais un texte manquant,
  // mais pas encore une vraie traduction dans la langue de l'élève. Un
  // vrai chantier de traduction reste à faire avant mise en ligne.
  function normaliserTexte(s) {
    return (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
  }

  // 🆕 (session 22-08-2026, suite) Étape 'prenom' : contrairement à

  // Renvoie le prénom extrait (string) ou null si aucun patron ne colle.
  const PATRONS_PRENOM_TRADUIT = [
    /^(?:moi,?\s*)?je\s*m['\u2019]appelle\s+(.+)$/i,
    /^moi,?\s*c['\u2019]est\s+(.+)$/i,
    /^mon\s+nom\s+est\s+(.+)$/i
  ];
  function extrairePrenomDeTraduction(valeur) {
    const nettoye = (valeur || '').trim().replace(/[.!?]+$/g, '').trim();
    for (let i = 0; i < PATRONS_PRENOM_TRADUIT.length; i++) {
      const m = nettoye.match(PATRONS_PRENOM_TRADUIT[i]);
      if (m && m[1] && m[1].trim()) return m[1].trim();
    }
    return null;
  }

      { type: 'texte', speaker: perso, img: imgMamanPapa, texte: nomAutre + " ? Papa ? Maman ?", trad: { en: nomAutre + "? Dad? Mom?" } },

          { id: 'non', correcte: true, fr: 'Non', en: 'No' },

        trad: { en: "Who are you? My name is " + nomPerso + ", and you?" } },
      // 🆕 (session 22-08-2026, suite) Exercice de traduction longue —

  // 22-08-2026) La clé 'question' (ancien narrateur neutre de la démo
  // Keb/Bek, retirée) n'a plus d'utilité : un seul personnage parle
  // désormais dans tout le dialogue (voir etapesDialogue()), jamais

  const NOMS = { keb: 'Keb', bek: 'Bek', question: '' };
  const INITIALES = { keb: 'K', bek: 'B', question: '?' };

  // Même logique que dialogues/d1/index.html : dict.trad n'a pas de clé
  // 'fr' (le français est la langue source du dialogue lui-même) — repli
  // sur l'anglais si la langue d'interface n'a pas d'entrée dédiée.
  // 🆕 (retour Raphaël, 22-08-2026) texteEtape()/traductionPhrase()
  // acceptent maintenant soit une chaîne, soit une fonction(reponses) —
  // nécessaire pour les répliques qui insèrent le prénom de l'élève
  // (connu seulement une fois l'étape 'prenom' passée, donc impossible à
  // figer au moment où etapesDialogue() construit le tableau).
  function texteEtape(def) {
    return typeof def.texte === 'function' ? def.texte(reponses) : def.texte;
  }
  function traductionPhrase(def) {
    if (!def.trad) return '';
    const brut = def.trad[langueActuelle()] || def.trad.en || '';
    return typeof brut === 'function' ? brut(reponses) : brut;
  }

  // 🆕 État global d'affichage des traductions de phrase — appliqué par
  // défaut à chaque nouvelle réplique ajoutée à la pile ; un clic sur
  // l'avatar ou le texte d'UNE réplique bascule seulement celle-là, sans

  let traductionsVisiblesParDefaut = false;

  function ajouterLigneDialogue(def) {
    const div = document.createElement('div');
    div.className = 'pile-item ' + def.speaker;
    const trad = traductionPhrase(def);
    const avatar = document.createElement('button');
    avatar.type = 'button';
    avatar.className = 'pile-avatar';
    avatar.setAttribute('aria-label', texteInterface('afficherTrad'));
    avatar.textContent = INITIALES[def.speaker] || '?';
    const corps = document.createElement('div');
    corps.className = 'pile-corps';
    if (NOMS[def.speaker]) {
      const qui = document.createElement('span');
      qui.className = 'pile-qui';
      qui.textContent = NOMS[def.speaker];
      corps.appendChild(qui);
    }
    const texte = document.createElement('div');
    texte.className = 'pile-texte';
    texte.textContent = texteEtape(def);
    corps.appendChild(texte);
    let elTrad = null;
    if (trad) {
      elTrad = document.createElement('div');
      elTrad.className = 'pile-trad';
      elTrad.textContent = trad;
      if (traductionsVisiblesParDefaut) elTrad.classList.add('visible');
      corps.appendChild(elTrad);
    }
    div.appendChild(avatar);
    div.appendChild(corps);
    if (elTrad) {
      const bascule = () => elTrad.classList.toggle('visible');
      avatar.addEventListener('click', bascule);
      texte.addEventListener('click', bascule);
    }
    elPileDialogue.appendChild(div);
    requestAnimationFrame(() => requestAnimationFrame(() => div.classList.add('in')));
  }

  // réutiliser ETAPES[i].grammaire = 'uneCle' sans rien changer ici.
  function ajouterNoteGrammaire(def) {
    if (!def.grammaire) return;
    blocGrammaire.style.display = 'block';
    const cles = Array.isArray(def.grammaire) ? def.grammaire : [def.grammaire];
    cles.forEach(function (cle) {
      const texteBrut = (typeof GRAMMAIRE !== 'undefined' && GRAMMAIRE[cle])
        ? (GRAMMAIRE[cle][langueActuelle()] || GRAMMAIRE[cle].fr)
        : null;
      if (!texteBrut) return;
      const div = document.createElement('div');
      div.className = 'grammaire-item';
      div.textContent = texteBrut;
      elPileGrammaire.appendChild(div);
      requestAnimationFrame(() => requestAnimationFrame(() => div.classList.add('in')));
    });
  }

  function attendre(ms) {
    return new Promise(function (resolve) { setTimeout(resolve, ms); });
  }

  // Tap n'importe où sur l'écran pendant la genèse = passer directement
  // à la rencontre — un élève qui revoit la leçon n'a pas à revivre
  // toute la genèse (carte titre incluse) à chaque fois. 🆕 (retour

  // choix ou le réveil du personnage sont en cours, ils écoutent
