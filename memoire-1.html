<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Première mémoire — Le français avec Keb &amp; Bek</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<!-- Même ordre que index.html : le réveil de Bek (scène, poses), le Lecteur, puis la mémoire -->
<link rel="stylesheet" href="sequence-reveil-bek.css">
<link rel="stylesheet" href="sequence-lecteur.css">
<link rel="stylesheet" href="sequence-m1.css">
<style>
  :root { --peche: #F0A98B; --peche-fonce: #E08867; --peche-pale: rgba(240, 169, 139, 0.16); --brun-fonce: #4A3B33; --brun-clair: #8A7364; --ombre: rgba(102, 80, 69, 0.18); }
  html, body { height: 100%; margin: 0; background: #FCF5EA; font-family: 'Baloo 2', sans-serif; }
  #memoire { position: fixed; inset: 0; }
</style>
</head>
<body>
<div id="memoire"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="progression.js"></script>
<script src="mots.js"></script>
<script src="sequence-lecteur.js"></script>
<script src="sequence-m1.js"></script>
<script>
(function () {
  'use strict';
  // Progression : progression.js (compte ou invité). Les drapeaux locaux restent en filet de sécurité :
  // memoires.html et sequence-menu.js les lisent aussi, au cas où l'écriture dans le compte échouerait
  // (vérifié côté Supabase le 03-11-2026 : chapitre_id et condition_id sont du texte libre, 'm1' et 'm1_f1'…'m1_f5' sont acceptés (m1_f5 = la réparation) ; 'm1_f6' (l'épreuve) suit le même principe : à confirmer).
  const CLE_M1_LOCAL = 'kebbek_m1_terminee';       // la MÉMOIRE est terminée
  const CLE_F1_LOCAL = 'kebbek_m1_f1';             // fragment 1 récupéré
  const CLE_F2_LOCAL = 'kebbek_m1_f2';             // fragment 2 récupéré (un/une, le/la)
  const CLE_F3_LOCAL = 'kebbek_m1_f3';             // fragment 3 récupéré (regarder)
  const CLE_F4_LOCAL = 'kebbek_m1_f4';             // fragment 4 récupéré (j'aime)
  const CLE_F5_LOCAL = 'kebbek_m1_f5';             // la RÉPARATION (fragment 5) terminée
  const CLE_F6_LOCAL = 'kebbek_m1_f6';             // 🆕 l'ÉPREUVE (fragment 6) terminée : c'est elle qui termine la mémoire
  const CLE_EPREUVE_LOCALE = 'kebbek_m1_epreuve';  // 🆕 résultats de l'épreuve : { date, resultats, bilan } (la dernière passation, sur cet appareil)
  const CLE_POSITION_LOCALE = 'kebbek_m1_position';  // 🆕 { fragment, segment } : où l'élève s'est arrêté (quitter et continuer plus tard)
  const prog = window.KebBekProgression || null;
  const params = new URLSearchParams(window.location.search);
  // 🆕 (07-11-2026) ?f=n&seul=1 : on RÉPÈTE un seul fragment (bouton « Répéter » de memoires.html). À la fin ou en quittant : retour à memoires.html.
  // Rien n'est modifié : ni les fragments récupérés, ni la mémoire terminée, ni la position gardée (« Continuer » reprend où l'élève en était).
  const seul = params.get('seul') === '1' && /^[1-6]$/.test(params.get('f') || '');   // sans ?f= valide, « seul » est ignoré : la progression reste normale
  let instance = null;

  function marquer(cle) { try { localStorage.setItem(cle, '1'); } catch (e) {} }
  function lu(cle) { try { return localStorage.getItem(cle) === '1'; } catch (e) { return false; } }
  function versMemoires() { window.location.href = 'memoires.html'; }
  // Enregistre dans progression.js sans jamais bloquer ni faire échouer la mémoire.
  function enregistrer(fonction, id) {
    try {
      if (prog && typeof prog[fonction] === 'function') return Promise.resolve(prog[fonction](id)).catch(function (e) { console.warn('Progression non enregistrée (' + id + ').', e); return false; });
    } catch (e) { console.warn('Progression non enregistrée (' + id + ').', e); }
    return Promise.resolve(false);
  }

  // 🆕 POSITION. Écrite à chaque segment (callbacks.onPosition) : toujours sur l'appareil, et dans progression.js
  // (invité : localStorage ; compte : fonctions enregistrer_position_lecon / lire_position_lecon / effacer_position_lecon,
  //  voir migration-position-lecon.sql — tant qu'elles n'existent pas côté Supabase, seule la copie locale sert).
  function ecrirePosition(p) {
    try { localStorage.setItem(CLE_POSITION_LOCALE, JSON.stringify(p)); } catch (e) {}
    try { if (prog && prog.enregistrerPositionLecon) Promise.resolve(prog.enregistrerPositionLecon('m1', 'f' + p.fragment + '-s' + p.segment, p)).catch(function () {}); } catch (e) {}
  }
  function effacerPosition() {
    try { localStorage.removeItem(CLE_POSITION_LOCALE); } catch (e) {}
    try { if (prog && prog.effacerPositionLecon) Promise.resolve(prog.effacerPositionLecon('m1')).catch(function () {}); } catch (e) {}
  }
  async function lirePosition() {
    try {
      if (prog && prog.lirePositionLecon) {
        const r = await prog.lirePositionLecon('m1');
        const p = r && r.reponses;
        if (p && p.fragment && p.segment) return { fragment: Number(p.fragment), segment: Number(p.segment) };
      }
    } catch (e) {}
    try { const p = JSON.parse(localStorage.getItem(CLE_POSITION_LOCALE) || 'null'); if (p && p.fragment && p.segment) return p; } catch (e) {}
    return null;
  }

  // La mémoire est faite de fragments. Fragment 1 (manger) → 2 (un/une, le/la) → 3 (regarder) → 4 (j'aime) → 5 (la RÉPARATION) → 6 (l'ÉPREUVE) → mémoire terminée.
  // 🆕 (08-11-2026) C'est la fin du dernier fragment (DERNIER = l'épreuve) qui termine la mémoire. Pour revenir à « la réparation termine la mémoire » : DERNIER = 5.
  // ?f=1 à ?f=5 force un fragment (test). Sans paramètre : on reprend au premier fragment non récupéré
  // (tant que la mémoire n'est pas terminée).
  // ⚠️ progression.js ne relit pas les conditions : la reprise lit les drapeaux LOCAUX (donc par appareil).
  const DERNIER = 6;
  const CLES_LOCALES = { 1: CLE_F1_LOCAL, 2: CLE_F2_LOCAL, 3: CLE_F3_LOCAL, 4: CLE_F4_LOCAL, 5: CLE_F5_LOCAL, 6: CLE_F6_LOCAL };
  // 🆕 L'ÉPREUVE (fragment 6). Le module ne stocke rien : il envoie chaque réponse (onResultat) puis { resultats, bilan } à la fin (onTermine).
  // La page les garde sur l'appareil (CLE_EPREUVE_LOCALE). L'épreuve n'a pas de reprise en cours de route (elle recommence au début : les résultats
  // seraient incomplets) et, en répétition (?seul=1), rien n'est gardé.
  let resultatsEpreuve = [];
  function gardeEpreuve(info) {
    // ⚠️ onTermine donne les résultats sous forme d'OBJET { cle: résultat } (dernière réponse par question, survit aux retours en arrière) ;
    // on les range en LISTE (l'ordre d'arrivée des questions), la forme attendue par enregistrer_epreuve et par l'écran professeur.
    const brut = (info && info.resultats) || resultatsEpreuve;
    const dossier = {
      date: new Date().toISOString(),
      resultats: Array.isArray(brut) ? brut : Object.keys(brut || {}).map(function (k) { return brut[k]; }),
      bilan: (info && info.bilan) || null
    };
    try { localStorage.setItem(CLE_EPREUVE_LOCALE, JSON.stringify(dossier)); } catch (e) {}
    // 🆕 (08-11-2026) Copie dans le compte (table resultats_epreuves, RPC enregistrer_epreuve) : l'enseignant lié la lit depuis l'écran Mode professeur.
    // Invité : localStorage, migré au compte à la création du profil. Dernière passation seulement. Best-effort : un échec ne bloque jamais la fin de la mémoire.
    let liste = dossier.resultats;
    try {
      if (JSON.stringify(liste).length > 50000) liste = liste.map(function (r) {   // la RPC refuse > 60 000 octets : on tronque le texte libre
        const c = Object.assign({}, r);
        if (typeof c.reponse === 'string' && c.reponse.length > 300) c.reponse = c.reponse.slice(0, 300) + '…';
        return c;
      });
    } catch (e) {}
    try { if (prog && prog.enregistrerEpreuve) return Promise.resolve(prog.enregistrerEpreuve('m1_epreuve', liste, dossier.bilan)).catch(function () { return false; }); } catch (e) {}
    return Promise.resolve(false);
  }
  function lancerFragment(n, reprendreA) {
    if (instance) { try { instance.arreter(); } catch (e) {} }
    if (n === 6) resultatsEpreuve = [];
    instance = window.KebBekM1.demarrer('memoire', { fragment: n, suite: n < DERNIER, reprendreA: reprendreA || 0 }, {
      onPosition: function (p) { if (!seul && p.fragment !== 6) ecrirePosition(p); },
      onResultat: function (r) { if (n === 6 && !seul) resultatsEpreuve.push(r); },
      onTermine: async function (info) {
        if (seul) { versMemoires(); return; }       // 🆕 répétition d'un seul fragment : on ne chaîne pas, on ne touche à rien
        effacerPosition();                        // le fragment est fini : le suivant recommence à son introduction
        const ecrireEpreuve = (n === 6) ? gardeEpreuve(info) : Promise.resolve(false);
        if (n < DERNIER) {
          marquer(CLES_LOCALES[n]);
          enregistrer('marquerConditionComplete', 'm1_f' + n);
          lancerFragment(n + 1);
          return;
        }
        marquer(CLES_LOCALES[n]);
        marquer(CLE_M1_LOCAL);
        // on laisse 3 s au plus à l'écriture (compte) avant de quitter la page
        await Promise.race([
          Promise.all([enregistrer('marquerConditionComplete', 'm1_f' + n), enregistrer('marquerChapitreComplete', 'm1'), ecrireEpreuve]),
          new Promise(function (resolve) { setTimeout(resolve, 3000); })
        ]);
        versMemoires();
      },
      onQuitter: versMemoires
    });
  }

  async function lancer() {
    try { if (prog && prog.restaurerSessionEtProfil) await prog.restaurerSessionEtProfil(); } catch (e) { console.warn('Session indisponible.', e); }
    // 🆕 Être arrivé ici prouve que la visite guidée du menu est faite : on le garde (appareil + compte), pour que sequence-menu.js ne la rejoue pas.
    try { if (localStorage.getItem('kebbek_menu_etape') !== 'complet') localStorage.setItem('kebbek_menu_etape', 'autorise'); } catch (e) {}
    enregistrer('marquerChapitreComplete', 'menu_autorise');
    const f = params.get('f');
    let debut = 1, reprendreA = 0;
    if (/^[1-6]$/.test(f || '')) {
      debut = Number(f);
      reprendreA = Math.max(0, Math.min(debut === 6 ? 10 : 5, Number(params.get('s')) || 0));      // test : ?f=3&s=4 reprend le fragment 3 au segment 4
    } else if (!lu(CLE_M1_LOCAL)) {
      while (debut < DERNIER && lu(CLES_LOCALES[debut])) debut++;                // premier fragment non récupéré
      const pos = await lirePosition();                                          // …et, s'il était entamé, le segment où l'élève s'est arrêté
      if (pos && pos.fragment === debut && debut !== 6 && pos.segment >= 1 && pos.segment <= 5) reprendreA = pos.segment;   // (l'épreuve recommence au début)
    } else {
      effacerPosition();                                                         // mémoire terminée : on la rejoue depuis le début
    }
    lancerFragment(debut, reprendreA);
  }
  lancer();
})();
</script>
</body>
</html>
